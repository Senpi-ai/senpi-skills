name: rhino-escalation-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Rhino v1.0" — lives in
# description + SKILL.md + _rhino_producer_version.
version: 1.0.0
description: >
  RHINO v1.0 (ESCALATION book) — stress-gated crisis convexity.

  One of two books. This book is DORMANT in calm and fires HARD only when
  Rhino's shared STRESS detector confirms a shock (oil breaking out + equities
  breaking down + gold bid + BTC rolling over + vol/range expansion clear a
  threshold). It then goes LONG the spiking crisis assets (gold / oil / metals /
  dollar / yen) and SHORT the cratering risk assets (crypto majors + growth
  indices) — the convex add. Pairs with the HEDGE book (runtime-hedge.yaml) on
  a separate wallet, which carries the always-on standing insurance. The edge
  is convexity: bleed nothing in calm (cash), pay big when stress confirms.

  Scoring (producer-side): STRESS gate, then 4h backbone + 1h confirm + 24h
  momentum + RSI room — LONG crisis assets, SHORT risk assets.

  Execution envelope:
    - slots 3, margin_pct 22 (LARGER — the convex add when stress fires)
    - strict 5x leverage clamp, then each asset's HL venue max
    - MODERATE-TIGHT DSL: crises reverse violently (a ceasefire dumps oil/gold),
      so bank the spike, time-cuts ON, 2d hard_timeout

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${RHINO_ESCALATION_WALLET}"
  # ── FUNDING SPLIT DEFAULT: HEDGE 50% / ESCALATION 50% of the combined pool ──
  # The escalation book sits mostly in CASH (dry powder) and deploys only under
  # stress — that idle capital IS the tail hedge. The other half carries the
  # always-on hedge book. This is a FUNDING guideline for the operator, NOT a
  # runtime-enforced field. Per-position sizing is governed by margin_pct + slots.
  slots: 3
  margin_pct: 22
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 96
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # base off perp value (=$0 for an idle leg) and cross-charges a sibling leg's PnL, so an
    # idle leg gets a "$0.00" limit and is permanently halted (Mongoose long book 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 8        # stress arrives in bursts → deploy fast when it does
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 5
    cooldown_minutes: 45
    drawdown_halt_pct: 22
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 120

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: rhino_escalation_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        own24h: { type: number, required: false }
        stress: { type: boolean, required: false }
        stressFired: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: rhino_escalation_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${RHINO_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [rhino_escalation_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: rhino_escalation_signals
    decision_prompt: |
      You are Rhino's ESCALATION-book pass-through gate. The producer ALREADY
      confirmed a STRESS regime before emitting (no signal is sent in calm),
      then scored either a crisis asset spiking (LONG: gold / oil / metals /
      dollar / yen) or a risk asset cratering (SHORT: crypto majors / growth
      indices). It applied the 5x leverage clamp and held-asset dedup. This book
      trades BOTH directions. Honor the signal unless it is malformed.

      SIGNAL:
      {{signal_rhino_escalation_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
      2. direction MUST be copied from signal.direction (LONG or SHORT).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction not in [LONG, SHORT]
      - signal.data.stress != true
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND stressFired strong AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:BRENTOIL LONG 5x, STRESS fired 3, 4h BULLISH — crisis spike' OR 'score 6 ETH SHORT 5x, STRESS fired 3, 4h BEARISH — risk cratering')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "RHINO_CRISIS_ESCALATION ${direction} — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — moderate-tight, bank the spike) ─────────────────────
#
# Crisis moves spike then reverse violently (a ceasefire dumps oil/gold, a
# relief bid squeezes shorts), so don't give the convex gain back: tighter
# phase1, early profit-lock ladder, stall-cuts ON, 2d hard_timeout.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 2880           # 2d
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 180            # 3h
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 360            # 6h
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 35 }
        - { trigger_pct: 18, lock_hw_pct: 60 }
        - { trigger_pct: 35, lock_hw_pct: 75 }
        - { trigger_pct: 60, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
