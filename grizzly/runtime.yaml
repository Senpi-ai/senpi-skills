name: grizzly-tracker
# Runtime SCHEMA version must be major=1 per the senpi-trading-runtime
# plugin. Strategy/skill is "Grizzly v6.0.0" — that lives in description +
# SKILL.md + _grizzly_producer_version. Do not set this to 6.x.x.
version: 1.0.0
description: >
  GRIZZLY v6.0.0 — BTC Alpha Hunter, v2-runtime-native rewrite.

  v5.x was a 1073-line full-agency Python scanner with a 3-mode state
  machine (HUNTING/RIDING/STALKING), Python-side cooldowns + dynamic
  daily caps, reload/scale-in evaluation, and direct create_position
  calls. Apr 30 BTC LONG ran +33% peak ROE through Tier 5 cleanly for
  +$76.36 / +29.9% realized — proves the scoring works. But the state
  machine drifts across runtime restarts and Python-side state files
  silently corrupted on a known schedule.

  v6.0 flips to producer + v2 runtime (Wolverine v4 / Cheetah v6 /
  Vulture v3 template):
    - Producer (grizzly-producer.py) emits BTC signals via
      `SenpiClient.push_signal()` (direct HTTP POST). NO execution code.
    - Runtime LLM gate is pass-through — producer has applied every
      filter; LLM only catches malformed signals.
    - risk.guard_rails ENFORCES daily caps, drawdown halt, consecutive-
      loss halt, per-asset cooldown — no Python state to drift.
    - DSL uses FEE_OPTIMIZED_LIMIT on entries AND exits — saves
      ~0.020-0.030% per maker-filled close vs v5.x MARKET orders.
    - Trade chain DB emits LIFECYCLE / DECISION_EXECUTED / ACTION_RESULT
      / DSL_CREATED / DSL_CLOSED for every trade — telemetry restored.

  WHAT'S PRESERVED FROM v5.8 (verbatim):
    - Single-asset BTC thesis (Kodiak/Wolverine/Polar family pattern)
    - Six-gate entry validation: 4h trend != NEUTRAL, 4h structural
      strength ≥ 0.75 (Kodiak v5.1 fix), 1h matches 4h, 15m momentum
      aligned, base-tech floor (strong_15m OR aligned_5m), v5.5 macro
      V-recovery gate (block fades within 1.25% of 24h extreme).
    - SM HARD BLOCK if direction opposes
    - RSI hard gates (70 LONG / 30 SHORT) — BTC-tuned
    - Multi-factor scoring (~17 max points)
    - MIN_SCORE = 12 (config-overridable; v5.8 "hit fewer, win bigger")
    - BTC-specific thresholds: 15m mom 0.05, RSI 70/30, vol_ratio 1.1,
      move_exhaustion 2.5%, move_tiring 1.5%
    - Conviction-scaled leverage: 10x apex/conviction, 7x default
    - DSL preset: time-cuts ALL DISABLED (single-asset family pattern),
      Phase 1 max_loss 20% / retrace 8, Phase 2 v5.9 ratchet ladder
      (T0 5%/35%, T1 8%/45%, T2 15%/65%, T3 20%/80%, T4 30%/90%, T5 50%/94%)

  FLEET PATCHES:
    - FP-001 quiet hours (00-04 UTC unless apex score 14+)
    - FP-002 hard rule in SKILL.md (user-conversation Claude sessions
      are read-only — only producer cron + DSL engine are write paths)
    - FP-003 requireAllConfirmations gate (default true) — every soft
      confirmation (4TF + SM + Funding + Volume + OI) must fire, not
      just summed score

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_pct: 50        # % of account budget per slot (scales with any budget)
  trading_risk: moderate
  default_leverage: 10                            # conviction-scaled in producer (10x apex/conviction, 7x default)
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 6                        # v5.8 dynamic cap upper bound (hot-hand ceiling 12 capped by runtime)
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 30
    drawdown_halt_pct: 25                         # v5.8 explicit -25% HARD STOP
    drawdown_reset_on_day_rollover: false         # avoid the next-day reset leak
    per_asset_cooldown_minutes: 60                # v5.8 ASSET_COOLDOWN_MINUTES preserved

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: grizzly_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        # Required identity
        score: { type: number, required: true }
        tier: { type: string, required: true }
        leverage: { type: number, required: true }
        reasons: { type: array, required: true }
        # SM signal
        smPct: { type: number, required: true }
        smTraders: { type: number, required: true }
        smCc15m: { type: number, required: false }
        # Structural
        trend4h: { type: string, required: true }
        trendStrength4h: { type: number, required: false }
        rsi: { type: number, required: false }
        # Funding
        funding: { type: number, required: false }
        fundingRegime: { type: string, required: false }
        fundingPersistenceHours: { type: number, required: false }
        # OI / volume
        oiChange1h: { type: number, required: false }
        vol1h: { type: number, required: false }
        # Multi-timeframe price
        priceChange5m: { type: number, required: false }
        priceChange15m: { type: number, required: false }
        priceChange1h: { type: number, required: false }
        priceChange4h: { type: number, required: false }
        # Dedup
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: grizzly_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${GRIZZLY_DECISION_MODEL}"  # REQUIRED. BARE model name only — NO provider prefix.
    scanners: [grizzly_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true            # entries: maker-first, taker-fallback after 60s
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: grizzly_signals
    decision_prompt: |
      You are Grizzly's pass-through gate. The producer has already
      applied EVERY gate (4h structural trend ≥0.75, 1h confirmation,
      15m momentum, base-tech floor, V-recovery distance check, SM
      direction match, RSI band 30-70, multi-factor scoring with
      MIN_SCORE 12, FP-001 quiet hours, FP-003 require-all-confirmations).
      Your job is to honor the signal unless something is structurally
      broken.

      SIGNAL:
      {{signal_grizzly_signals}}

      ## STRICT OUTPUT RULES

      1. The `asset` MUST be "BTC" (Grizzly is single-asset).
      2. The `direction` MUST match signal.direction exactly.
      3. The `leverage` MUST be copied from signal.data.leverage
         (10x apex/conviction / 7x default).
      4. Every claim in `reasoning` MUST cite values from the signal.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 12 (producer floor; defensive)
      - leverage <= 0 OR signal data missing
      - heldAssets contains "BTC" (duplicate)
      - reasons array empty
      - direction not in [LONG, SHORT]

      ## CONFIDENCE SCORING

      - 9-10: score >= 14 (apex tier) AND SM aligned AND OI accelerating
        AND funding pays
      - 7-8: score >= 12 (conviction tier) — producer has gated this.
        Honor it unless a hard-skip applies.
      - <7: producer floor not cleared.

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values",
        "payload": {
          "signals": [
            {
              "asset": "BTC",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "reason": "score N GRIZZLY_BTC DIR — top reason"
            }
          ]
        }
      }

# ─── EXIT (DSL) — preserved verbatim from v5.9 ──────────────
# Time cuts ALL DISABLED (single-asset family pattern; per memory
# reference_dsl_time_cuts_single_asset.md). Phase 1 + Phase 2 own
# all exits via price action.
#
# Phase 2 v5.9 ratchet ladder (validated end-to-end on Apr 30 BTC LONG
# +33% peak ROE → Tier 5 lock 90% HW → venue SL fired at $78,592
# = +29.9% ROE / +$76.36 realized — proves Senpi DSL ratchet works on
# BTC main-DEX end-to-end).
#
# v5.9 fleet-wide T0/T1 patch (2026-05-02):
#   T0 lock 25→35, T1 trigger 10→8 — closes T0→T1 dead zone.
#   T2+ unchanged (already aggressive on BTC).
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true                # exits: maker-first, taker-fallback as safety floor on Phase 1 stops
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: false                               # v5.6: DISABLED. v1 DSL fired this in Phase 2 incorrectly.
      interval_in_minutes: 1440
    weak_peak_cut:
      enabled: false                               # v5.7: DISABLED. Completes time-cuts sweep.
      interval_in_minutes: 180
      min_value: 2.0
    dead_weight_cut:
      enabled: false                               # v5.4: DISABLED. Single-asset agent has no rotation opportunity cost.
      interval_in_minutes: 120
    phase1:
      enabled: true
      max_loss_pct: 20.0                           # v5.1: more room for bull-rally drawdowns on BTC
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,   lock_hw_pct: 35 }    # v5.9: lock 25→35 (T0/T1 dead zone fix)
        - { trigger_pct: 8,   lock_hw_pct: 45 }    # v5.9: trigger 10→8
        - { trigger_pct: 15,  lock_hw_pct: 65 }
        - { trigger_pct: 20,  lock_hw_pct: 80 }
        - { trigger_pct: 30,  lock_hw_pct: 90 }    # apex lock — Apr 30 winner exited at this tier
        - { trigger_pct: 50,  lock_hw_pct: 94 }    # monster winner trail

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
