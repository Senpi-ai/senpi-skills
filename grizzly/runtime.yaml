name: grizzly-tracker
version: 5.7.0
description: >
  Grizzly v5.6 — disable hard_timeout (complete time-cuts removal).
  Pairs with v5.4's dead_weight_cut disable. v1 DSL fires hard_timeout
  in Phase 2 incorrectly (per v2 spec it's Phase-1-only) — observed
  on Polar v3.0.4 overnight 2026-04-23. Grizzly shares the same v1
  DSL bug. v5.6 removes the 24h ceiling on BTC trend holds so Phase 2
  trailing can run multi-day winners without clock interference.
  Phase 1 max_loss (20%) + retrace + weak_peak_cut + Phase 2 tiers
  own all exits. Scanner unchanged from v5.5 (V-recovery gate preserved).

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ─── EXIT (DSL) — v5.1 loosened for multi-day BTC trends ──────
# BTC trends span days, not hours. v5.0's 6h hard_timeout killed the
# +$53 winner on 2026-04-17 at exactly 360 min while BTC was rallying
# from $75.7k → $78k. Kodiak (Predators-green) uses 24h hard_timeout
# on SOL; BTC moves slower and should have AT LEAST as much runway.
#
# v5.1 changes:
#   hard_timeout   360 → 1440 min (24h)  match Kodiak family
#   weak_peak_cut  120 → 180 min         consistent with longer hold
#   dead_weight_cut 90 → 120 min         small loosen (BTC can sit 2h in trend)
#   phase1 max_loss 15% → 20%            more room for bull-rally drawdowns
#
# Phase 2 tiers unchanged — the escalating trailing-lock ladder
# (5/25, 10/45, 15/65, 20/80, 30/90, 50/94) is appropriate for BTC.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: false                  # v5.6: DISABLED. v1 DSL fires this in Phase 2 incorrectly. Phase 1 + Phase 2 own all exits.
      interval_in_minutes: 1440
    weak_peak_cut:
      enabled: false                   # v5.7: DISABLED. Completes the time-cuts sweep. Phase 1 + Phase 2 own all exits via price action.
      interval_in_minutes: 180
      min_value: 2.0
    dead_weight_cut:
      enabled: false                   # v5.4: DISABLED. Single-asset agent has no rotation opportunity cost.
      interval_in_minutes: 120
    phase1:
      enabled: true
      max_loss_pct: 20.0               # v5.1: 15.0 → 20.0
      retrace_threshold: 8
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,   lock_hw_pct: 25 }   # First profit lock
        - { trigger_pct: 10,  lock_hw_pct: 45 }
        - { trigger_pct: 15,  lock_hw_pct: 65 }
        - { trigger_pct: 20,  lock_hw_pct: 80 }
        - { trigger_pct: 30,  lock_hw_pct: 90 }   # Apex lock
        - { trigger_pct: 50,  lock_hw_pct: 94 }   # Monster winner trail

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
