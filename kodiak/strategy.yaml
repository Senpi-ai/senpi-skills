# Kodiak — strategy package deploy declaration (single source of truth).
schema_version: 1

id: kodiak
version: "7.0.0"

catalog:
  name: "Kodiak — SOL Alpha Hunter"
  emoji: "🐻"
  tagline: "Single-asset alpha hunter for SOL. Multi-factor scoring (SM consensus + trend structure + momentum + funding + OI + BTC correlation + RSI) with conviction-tiered leverage."
  group: single-asset-alpha-hunter
  risk_level: moderate
  min_budget: 100

requires:
  runtime: ">=1.1.0"

defaults:
  decision_model_env: KODIAK_DECISION_MODEL
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: runtime.yaml
    scanner:
      entrypoint: scanner.py
      name: kodiak_signals                 # == external_scanner.name in runtime.yaml
      signal_type: KODIAK_SOL_THESIS
    wallet_env: KODIAK_WALLET    # the var kodiak/scripts/scanner.py reads (anti-contamination: strategy-specific)
    env: {}
    tick_seconds: 300
    funding_share: 1.0
    params:                                # was hardcoded producer constants + kodiak-config.json
      asset: SOL
      minScore: 10
      minMom15mPct: 0.1
      minTrendStrength4h: 0.75
      rsiMaxLong: 72
      rsiMinShort: 28
      assetCooldownMinutes: 240
      marginPct: 0.20
      defaultLeverage: 5
      leverageTiers:
        - { min_score: 13, leverage: 7, label: apex }
        - { min_score: 11, leverage: 6, label: conviction }
        - { min_score: 10, leverage: 5, label: standard }
