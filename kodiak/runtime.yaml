name: kodiak-tracker
version: 5.5.0
description: >
  Kodiak v5.5 — fleet-wide DSL ratchet T0/T1 patch (2026-05-02).
  T0 lock 25→35, T1 trigger 15→12 — closes T0→T1 dead zone that
  was leaking ~50%+ of mid-range SOL winners. Inherits all prior:
  Kodiak v5.3 — disable hard_timeout (complete time-cuts removal on
  single-asset agent). Pairs with v5.2's dead_weight_cut disable.
  v1 DSL fires hard_timeout in Phase 2 incorrectly (per v2 spec
  hard_timeout is Phase-1-only) — observed on Polar v3.0.4 overnight
  2026-04-23, where a Phase-2 trailing ETH Short got clock-closed.
  Kodiak shares the same v1 DSL bug. v5.3 removes the last time cut:
  no more artificial 24h ceiling on SOL trend holds. Phase 1 max_loss
  (25%) + Phase 1 retrace (8%) + weak_peak_cut (25m @ 3%) + Phase 2
  trailing tiers handle all exits via price action. Scanner unchanged.

# ── STRATEGY ──
strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

# ── SCANNERS ──
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

# ── ACTIONS ──
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ── EXIT (DSL) ──
# Philosophy: DSL Phase 2 trailing stops + weak_peak_cut + dead_weight_cut
# do all the real exit work. hard_timeout is a 24h safety net that should
# almost never fire — it only catches positions that somehow escaped every
# other mechanism. We do NOT use hard_timeout to cap winning trends.
#
# Evidence: Kodiak's profitable SOL trades on 2026-04-14 held 19/26/50/228 min.
# The 228-min SHORT peaked at +21.6% ROE in Phase 2 Tier 3. A 45-min or even
# 360-min hard_timeout would have killed it well before peak, leaving 10-15%
# ROE on the table. Phase 2 trailing stops are what should exit winners.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: false                  # v5.3: DISABLED. v1 DSL fires this in Phase 2 incorrectly. Phase 1 max_loss + Phase 2 trailing own all exits.
      interval_in_minutes: 1440
    weak_peak_cut:
      enabled: false                  # v5.4: DISABLED. Completes the time-cuts architectural sweep. Exits now 100% price-action.
      interval_in_minutes: 25
      min_value: 3.0
    dead_weight_cut:
      enabled: false                  # v5.2: DISABLED. Single-asset agent has no rotation opportunity cost.
      interval_in_minutes: 18
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # v5.5 fleet-wide DSL ratchet patch (2026-05-02):
        # T0 lock 25→35, T1 trigger 15→12 — closes T0→T1 dead zone
        # (was leaking ~50%+ of mid-range SOL winners between +8% and
        # +15% margin ROE). Phase 2 tiers leverage-aware for SOL.
        - { trigger_pct: 8,  lock_hw_pct: 35 }
        - { trigger_pct: 12, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

# ── NOTIFICATIONS ──
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
