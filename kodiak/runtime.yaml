name: kodiak-tracker
version: 2.0.0
description: >
  SOL alpha hunter v2.0. Fleet audit: extended hard timeout 360min (was 45),
  15x conviction tier at score 12+, leverage-aware Phase 2 tiers for SOL,
  reduceOnly filter, move-exhaustion, same-dir cooldown, score tracking.

strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    # Kodiak's best winners hold 6-13 hours. Old 45-min timeout was killing them.
    hard_timeout:
      enabled: true
      interval_in_minutes: 360
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 120
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # Phase 2 tiers — leverage-aware for SOL (fleet audit April 2026)
        # At 10x on SOL, old Tier 1 (7%/40%) created a $0.34 lock — normal SOL wick is $0.42
        # 44.8% of Kodiak's winners were being clipped at old Tier 1
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
