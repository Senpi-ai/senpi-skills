name: tests

# Makes the "guarded by a checksum test / fails CI on drift" promise real: the min_budget vendor
# parity + golden-file locks now actually run on every PR and push, alongside the ops + discover
# suites. Without this workflow those guards only ran when someone remembered to.
on:
  pull_request:
  push:
    branches: [main]

# Supersede earlier runs of the same PR. Pushes to main key on the sha and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: pip install pyyaml pytest

      - name: min_budget — vendor parity (byte-identical across the two skills)
        run: python3 senpi-strategy-ops/tests/test_min_budget_vendor_parity.py

      - name: min_budget — golden minimums (a retune must update the golden in the same PR)
        run: python3 senpi-trading-runtime/tests/test_min_budget_golden.py

      # senpi-account-status gets its own invocation: its tests/test_status.py + test_skill_surface.py
      # share basenames with senpi-strategy-ops' tests (and both suites `import status` from their own
      # scripts/), so a shared rootdir-less run fails collection with "import file mismatch".
      - name: account-status suite (own invocation — `status` module name collides with ops)
        run: python3 -m pytest senpi-account-status/tests -q

      # pytest collects every test regardless of a __main__ runner — bare `python3 <file>` exits 0
      # without running anything on a runner-less file (test_default_catalog.py), a silent green.
      # `strategies/tests` holds catalog-wide contract guards (no null optional signal keys).
      # `senpi-strategy-author/tests` was never listed here, so its suite had never run in CI —
      # added 2026-09-08 along with the exit-preview guard that keeps SKILL.md's worked ladder
      # arithmetically true to dsl-presets.yaml.
      # Named explicitly rather than `strategies`: a module-level sys.exit() aborts pytest collection for
      # the whole tree. It is not chimp alone — 8 script-style files across 4 packages (chimp, gibbon,
      # gorilla, orangutan: test_engine.py + test_package_shape.py in each). The step above runs those
      # per file with python3, and every other strategies/<id>/tests directory with pytest.
      # Every strategies/<id>/tests suite, one process per directory. These never ran in CI: the line
      # below names strategies/tests only, because a module-level sys.exit() in the chimp family aborts
      # collection for the whole tree. The script runs pytest-style files per directory and the
      # script-style ones directly, gating on every exit code.
      - name: strategy package suites (every strategies/<id>/tests)
        run: bash .github/scripts/run_strategy_package_tests.sh

      # `senpi-smart-money/tests` added 2026-09-18: it owns the cohort engine senpi-signals vendors,
      # and its suite had never run in CI — so the engine half of a two-copy fix was ungated.
      # `senpi-deposit-withdraw-transfer/tests` added 2026-09-15: needle guards on the money-rails
      # rules (top-up precheck + Spot recovery, exact-figure withdrawals, fees before money moves).
      # `quant-desk/tests` joined this run 2026-10-19: it ran on its own while senpi-signals shipped a
      # second scripts/score.py (both importable as `score`); senpi-signals no longer has one.
      - name: full suites (ops + discover + author + trading-runtime + catalog guards)
        run: python3 -m pytest senpi-strategy-ops/tests senpi-strategy-discover/tests senpi-strategy-author/tests senpi-trading-runtime/tests senpi-trader-research/tests senpi-market-pulse/tests senpi-portfolio/tests senpi-trade/tests senpi-improve-trades/tests senpi-signals/tests senpi-smart-money/tests senpi-deposit-withdraw-transfer/tests strategies/tests quant-desk/tests -q

      # Repo-root `tests/` added 2026-10-21: the context-budget gate for the OpenClaw 10.x migration.
      # Every */SKILL.md ≤ 56,000 est chars (10.4 refuses an over-cap SKILL.md read whole), and the
      # skills catalog plus the OpenClaw-bundled entries ≤ 30,000 (prod maxSkillsPromptChars is 32,000;
      # over it every box drops all descriptions). Sizes are measured with ports of OpenClaw's own
      # code, pinned by goldens in the same directory. Over 16,000 is a warning, never a failure. Own
      # invocation so its warnings and failures read on their own, apart from the skill suites.
      # `.github/scripts/check_conservation.py` is a hand-run restructure tool, smoke-tested here.
      # Last, and run even when a suite above failed, so a budget failure never hides a suite result
      # (a SKILL.md trim regression shows in the suites) and a suite failure never hides the budget.
      - name: context budgets (SKILL.md ceiling + skills catalog, as OpenClaw measures them)
        if: ${{ !cancelled() }}
        run: python3 -m pytest tests -q
