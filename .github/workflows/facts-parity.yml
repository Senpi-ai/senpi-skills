name: facts-parity

# The catalog's instances[].facts come from a Python port of senpi-trading-runtime's
# strategyFacts() (senpi-trading-runtime/scripts/strategy_facts.py). This runs the runtime's own
# function on every instance and fails when the two disagree: on a change to the port or to a
# runtime.yaml, and daily against the latest runtime release, so a change on the runtime's side
# shows up here rather than as wrong rules on the strategy pages.
on:
  pull_request:
    paths:
      - "senpi-trading-runtime/scripts/strategy_facts.py"
      - "strategies/**/runtime.yaml"
      - "strategies/**/strategy.yaml"
      - ".github/scripts/check_facts_parity.mjs"
      - ".github/workflows/facts-parity.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install deps
        run: |
          pip install pyyaml
          mkdir -p "$RUNNER_TEMP/rt" && cd "$RUNNER_TEMP/rt"
          npm init -y > /dev/null
          npm install --no-audit --no-fund @senpi-ai/runtime@latest yaml
      - name: python port vs runtime strategyFacts()
        run: |
          python3 senpi-trading-runtime/scripts/strategy_facts.py "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/py_facts.json"
          cp .github/scripts/check_facts_parity.mjs "$RUNNER_TEMP/rt/"
          cd "$RUNNER_TEMP/rt" && node check_facts_parity.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/py_facts.json"
