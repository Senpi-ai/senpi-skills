name: roach-b-tracker
version: 1.1.0
description: >
  Striker-only scanner variant B v1.1. Fleet audit: MARKET→FEE_OPTIMIZED_LIMIT,
  per-asset stop-out cooldown, UTC midnight fix, move-exhaustion, same-dir cooldown,
  reduceOnly filter, blockchain win detection, Phase 2 tiers.

strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 25
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 12
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 8
    phase1:
      enabled: true
      max_loss_pct: 18.0
      retrace_threshold: 3
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # Phase 2 tiers — leverage-aware (fleet audit April 2026)
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
