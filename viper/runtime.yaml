name: viper-tracker
version: 2.2.0
description: >
  VIPER v2.2 — Range-Bound Liquidity Sniper (DSL loosen for winners).
  v2.1 shipped with 15/20 min dead_weight/weak_peak cuts and 4h
  hard_timeout. Result: 240 fills / -19.9% ROI. The "range trades
  resolve fast" assumption cut winners before they could develop. v2.2
  doubles the timing windows: 30/45/480. Phase 1 stays tight since
  range-fader stops should be close to entry. Phase 2 unchanged.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 300
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# DSL preset tuned for range thesis type.
# Adjust interval_in_minutes and phase 2 tiers based on specific asset behavior.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480     # v2.2: 240 → 480 (let range winners develop)
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 45       # v2.2: 20 → 45
      min_value: 1.5
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 30       # v2.2: 15 → 30
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 6
      consecutive_breaches_required: 2
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 4,  lock_hw_pct: 30 }    # earlier lock for range scalps
        - { trigger_pct: 8,  lock_hw_pct: 55 }
        - { trigger_pct: 12, lock_hw_pct: 70 }
        - { trigger_pct: 18, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
