name: camel-harvest-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Camel v1.0" — lives in
# description + SKILL.md + _camel_producer_version.
version: 1.0.0
description: >
  CAMEL v1.0 (HARVEST book) — funding carry, SHORT book.

  One of two single-direction carry books. This book ranks the liquid
  main-DEX crypto cross-section by funding DESC and SHORTS the most-positive
  funding names (longs pay shorts -> the short COLLECTS the funding), gated
  so it never shorts a fresh 4h uptrend — it prefers crowded longs that are
  rolling over (4h bearish/neutral, RSI overbought). Pairs with the PAYOUT
  book (runtime-payout.yaml) on a separate wallet. The edge is CARRY (a
  recurring funding inefficiency) with trend/RSI as exhaustion confirmation.

  Scoring (producer-side): funding magnitude (annualized), 4h trend
  confirmation, RSI overbought, 24h roll-over. SHORT only.

  Execution envelope:
    - slots 4, margin_pct 18
    - strict 5x leverage clamp, then each asset's HL venue max
    - tighter DSL than a momentum leg: carry P&L is small per period, so
      cut price losses fast; lock funding gains; stall-cuts ON; 3d timeout

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${CAMEL_HARVEST_WALLET}"
  # ── FUNDING SPLIT DEFAULT: HARVEST 50% / PAYOUT 50% of the combined pool ──
  # Fund the two carry books ~equally. This is a FUNDING guideline for the
  # operator, NOT a runtime-enforced field. Per-position sizing is governed by
  # margin_pct + slots below.
  slots: 4
  margin_pct: 18
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 96
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 60
    drawdown_halt_pct: 18
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 180

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: camel_harvest_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        fundingAnnPct: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: camel_harvest_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${CAMEL_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [camel_harvest_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: camel_harvest_signals
    decision_prompt: |
      You are Camel's HARVEST-book pass-through gate. The producer ranks the
      liquid crypto cross-section by funding and SHORTS the most-positive
      funding names to COLLECT funding, but only when the crowded long is
      exhausting (never a fresh 4h uptrend). The fund is carry-driven: a
      PAYOUT book longs the most-negative-funding names on a separate wallet.
      The producer already applied the funding rank, 4h/RSI confirmation, the
      5x leverage clamp, and held-asset dedup. Honor the signal unless malformed.

      SIGNAL:
      {{signal_camel_harvest_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY.
      2. direction MUST be "SHORT" (this is the harvest/short book).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 4 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction != "SHORT"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 6 AND no malformed fields
      - 7-8:  score 4.5-5.9
      - 7:    score 4-4.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 6 ASSET SHORT 5x, funding +88%/yr, 4h BEARISH, RSI 73 — collect carry on an exhausting crowd')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "SHORT",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "CAMEL_CARRY_HARVEST — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — carry management, tighter than a momentum leg) ──────────
#
# Carry P&L per period is small, so a price loss must be cut before it dwarfs
# the funding collected. Tight phase1; lock gains as the fade works; stall-cuts
# ON (a carry position that's gone flat is recycled into a fresher extreme).
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 4320           # 3d — funding regimes decay
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 240            # 4h
      min_value: 1.5
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 480            # 8h — recycle a flat carry position
    phase1:
      enabled: true
      max_loss_pct: 10.0
      retrace_threshold: 6
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 6, lock_hw_pct: 0 }
        - { trigger_pct: 14, lock_hw_pct: 45 }
        - { trigger_pct: 28, lock_hw_pct: 65 }
        - { trigger_pct: 50, lock_hw_pct: 80 }
        - { trigger_pct: 90, lock_hw_pct: 90 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
