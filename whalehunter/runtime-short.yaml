name: whalehunter-short-tracker
# Top-level `version` is the SCHEMA version (major=1). Skill version "WhaleHunterHedge
# v2.0" lives in description + SKILL.md + _whalehunter_producer_version.
version: 1.0.0
description: >
  WHALEHUNTERHEDGE v2.0 (SHORT sleeve) — smart-money-vs-crowd cohort divergence.

  The producer segments Hyperliquid traders into cohorts by LIFETIME REALIZED gains
  (smart money = >$1M, crowd = $10k-$100k), aggregates each cohort's NET positioning
  per asset, and tracks whether the smart cohort is ADDING daily. It emits a SHORT when
  the smartest-money cohort is heavily net-short an asset and growing the position while
  the crowd is on the other side (e.g. crowd piling into a rally the winners are selling)
  — position WITH the smart money, not the crowd. This runtime honors it and rides it on
  a WIDE DSL. Pairs with the LONG sleeve on a SEPARATE wallet so conflicting same-asset
  positions can coexist. Funding 50/50.

  Execution envelope: up to 6 slots, score-scaled margin (producer sets marginUsd),
  5x clamp then venue max. Taker-fallback entries (a confirmed divergence must fill).
  WIDE ride-the-conviction DSL — wide disaster stop, weak_peak OFF, time-cuts OFF,
  Phase 2 does nothing until a big run.

strategy:
  wallet: "${WHALEHUNTER_SHORT_WALLET}"
  # Producer sets per-signal marginUsd (conviction-scaled); margin_pct is advisory.
  slots: 6
  margin_pct: 12
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # limit off the perpDay base, which reads ~$0 for these wallets -> a "$0.00" limit that
    # ANY real loss trips, permanently halting the book (Wolf/Hydra/Mongoose 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 6          # patient whales strike rarely; this is a generous ceiling
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 5
    cooldown_minutes: 60
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 360

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s
  - name: whalehunter_short_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        heldAssets: { type: array, required: false }
        # v2.0 cohort-divergence fields
        signalKind: { type: string, required: false }
        smartBias: { type: number, required: false }
        crowdBias: { type: number, required: false }
        smartGrowth: { type: number, required: false }
        smartMembers: { type: number, required: false }
        # v1.x per-whale copy fields (only present if enableIndividualCopy)
        sourceTrader: { type: string, required: false }
        sourceUsername: { type: string, required: false }
        convictionPct: { type: number, required: false }
        consensus: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: whalehunter_short_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${WHALEHUNTER_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [whalehunter_short_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true       # copying a conviction strike MUST fill — taker fallback
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: whalehunter_short_signals
    decision_prompt: |
      You are WhaleHunterHedge's SHORT-sleeve pass-through gate — a smart-money-vs-crowd
      positioning engine. The producer measured the NET positioning of the smartest-money
      cohort (>$1M lifetime realized gains) and the crowd ($10k-$100k) across Hyperliquid,
      and fired because the smart cohort is heavily net-SHORT this asset AND adding to it
      (smartGrowth in our favor), while the crowd is long it (e.g. the crowd is buying a
      rally the winners are selling). Position WITH the smart money unless malformed.

      SIGNAL:
      {{signal_whalehunter_short_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE
      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
      2. direction MUST be "SHORT".
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values (smartBias, crowdBias, smartGrowth, smartMembers).

      ## HARD SKIP CONDITIONS (output execute: false)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction != "SHORT"
      - signal.data.smartBias present AND > -0.5 (smart cohort not net-short enough — should never reach you)
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING (smart-money conviction)
      - 9-10: smartBias <= -0.7 AND smartMembers >= 5 AND crowdBias > 0 (crowd diverging long)
      - 7-8:  smartBias <= -0.5 with smartGrowth < 0 (cohort still adding to the short)
      - 7:    smartBias ~-0.5 (producer floor) — the divergence IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT
      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'short HYPE 3x: smart-money cohort net -0.85 and adding (Δ-$2.1M) every day this week, crowd net +0.65 buying the rally — selling it with 8 of the >$1M winners')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "SHORT",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "SMART_MONEY_DIVERGENCE — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — WIDE "ride the conviction": wide disaster stop, let it run) ──
# v2.0 ships the wide DSL as the sole exit. The planned producer-emitted invalidation
# exit: close when the smart cohort FLIPS or unwinds this position (smartBias crosses
# zero / smartGrowth reverses) — the mirror image of the entry signal.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: false
      interval_in_minutes: 43200
    weak_peak_cut:
      enabled: false              # ride the conviction — don't cut a slow grind
      interval_in_minutes: 1440
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 2880
    phase1:
      enabled: true
      max_loss_pct: 30.0          # wide disaster stop
      retrace_threshold: 18       # wide — normal volatility doesn't trail us out
      consecutive_breaches_required: 2
    phase2:
      enabled: true
      tiers:                      # do nothing until a real run, then bank only a fraction
        - { trigger_pct: 60, lock_hw_pct: 0 }
        - { trigger_pct: 120, lock_hw_pct: 45 }
        - { trigger_pct: 220, lock_hw_pct: 65 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
