name: jackal-tracker
# Note: the top-level `version` is the SCHEMA version the
# senpi-trading-runtime plugin expects (must be major=1). The
# STRATEGY/skill is "Jackal v2.0" — that lives in description + SKILL.md
# + _jackal_producer_version. Using version: 2.x at runtime level is
# rejected by the plugin as "Unsupported version: 2.x (major: 2).
# Supported major versions: 1." Keep this at 1.x.x forever.
version: 1.0.6
description: >
  JACKAL v2.0.6 — Quality-score formula rewrite + maker-exit timeout fix.
  2026-04-24 diagnostic: under v2.0.5, LLM gate rejected 50/50 signals
  (0% approval) because every source trader computed to exactly 60.0
  quality score while threshold was 65. Root cause: `win_rate * 100`
  in `_compute_quality_score` treated MCP's winRate (already a 0-100
  percentage) as a 0-1 fraction, pegging every non-zero winrate at
  the 60 cap. Worse, the weighting rewarded high winrate — but
  Jackal's alpha source is tail-winner trend-followers (low winrate,
  huge winners). Formula philosophically inverted the pool's edge.
  v2.0.6 rewrites the formula: ROI 35% / gain-to-pain 25% / age 15% /
  winrate 10%. Also bumps execution_timeout_seconds 15 → 60 to match
  Scorpion v4.0.2 maker-exit fix.

  JACKAL v2.0 — The Smart Stalker (v2-runtime-native rewrite).
  First fleet agent built on the senpi-trading-runtime architecture:
  pure producer + external_scanner + LLM-gated OPEN_POSITION action +
  declarative risk guardrails + runtime-managed DSL.

  Thesis unchanged from v1: observe other Senpi users' trades, maintain
  a quality-scored trader pool, copy filtered high-conviction entries
  with our own DSL. v2 changes are purely architectural:
    - jackal-producer.py detects pool-member entries and pushes signals
    - Runtime LLM (configured via actions.decision_model) evaluates
      each signal with market + source-trader context, executes at
      confidence >= 7
    - Risk guardrails enforced by runtime, not scanner code
    - DSL lifecycle fully auto-managed (no ratchet_stop_add bookkeeping)
  Replaces v1.1 (commit 55a418f) which had zero live trades despite
  threshold loosening, making it the ideal v2 migration candidate.

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 2
  margin_pct: 30        # % of account budget per slot (scales with any budget)
  trading_risk: moderate
  default_leverage: 5
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 5
    max_entries_per_day: 4
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 120
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: jackal_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        sourceTraderAddress: { type: string, required: true }
        sourceTraderUserId: { type: string, required: false }
        sourceTraderUsername: { type: string, required: false }
        sourceQualityScore: { type: number, required: true }
        sourceWinRate: { type: number, required: false }
        sourceRoi30d: { type: number, required: false }
        sourceConsecutiveWins: { type: number, required: false }
        entryTimestamp: { type: number, required: true }
        leverage: { type: number, required: true }
        sizeUsd: { type: number, required: true }
        entryPrice: { type: number, required: true }
        poolConsensusCount: { type: number, required: true }
        poolConsensusAssetCount: { type: number, required: true }
        trend4h: { type: string, required: false }
        trend1h: { type: string, required: false }
        trend15m: { type: string, required: false }
        priceChange4hPct: { type: number, required: false }
        fundingRegime: { type: string, required: false }
        fundingAnnualizedPct: { type: number, required: false }
        btcMacroDirection: { type: string, required: false }
        btcMacro24hPct: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: jackal_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${JACKAL_DECISION_MODEL}"  # REQUIRED. Bare model name only — NO provider prefix. INVALID: "<provider>/<model>" (e.g. "google/...", "anthropic/...", "openai/...") — OpenClaw double-prefixes → 500 Unknown model. The LLM gate is a pass-through rubber-stamp (producer already applied every filter); any reliable structured-JSON model works. No default by design — operators pick their own.
    scanners: [jackal_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60      # v2.0.6: 15 → 60 (Scorpion test 2026-04-24 showed 60s lands maker fill; 15/30 fall to taker)
    context:
      - type: signal
        scanner: jackal_signals
    decision_prompt: |
      You are Jackal's trade-decisioning evaluator. A member of Jackal's
      trader pool just opened a position on Hyperliquid perps. Decide
      whether to mirror the trade with independent sizing, our own DSL,
      and our own risk envelope.

      SIGNAL:
      {{signal_jackal_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. The `asset` field in your output payload MUST be the exact value
         from the signal's `asset` field. Do NOT substitute a different
         asset. Do NOT abbreviate or expand (e.g. if signal says "xyz:TSLA"
         output exactly "xyz:TSLA", not "TSLA" and not "SOL").
      2. The `direction` in your output MUST match the signal's `direction`
         field exactly (LONG or SHORT).
      3. Every claim in your `reasoning` MUST reference values that appear
         literally in the SIGNAL payload above. Do NOT fabricate numbers,
         trader counts, or TA states. If a field is missing from the
         signal, say so in reasoning — do not invent values.
      4. If `poolConsensusCount` is 0, you MUST NOT write phrases like
         "strong consensus" or "exceptional consensus" — there is zero
         consensus by definition. Report it as "solo signal, no pool
         consensus" in reasoning.
      5. If any of `trend4h`, `trend1h`, `trend15m` is "UNKNOWN", treat
         that as NEGATIVE evidence (we have no independent confirmation),
         not neutral.

      ## HARD SKIP CONDITIONS (output execute: false)

      - If `sourceQualityScore` < 55 — source not trustworthy enough.
        (v2.0.6 rescale: formula now rewards ROI + gain-to-pain over
        winrate. A score of 55 means at least one of the following:
        >=135% ROI, or g/p >=4 with 60d age, or equivalently strong
        composite. Good tail-winner traders land 65-85.)
      - If `poolConsensusCount` == 0 AND no TA fields confirm direction
        (all UNKNOWN or contradict) — no independent confirmation at all
      - If `trend4h`, `trend1h`, `trend15m` all UNKNOWN — we don't have
        the data to make an informed call
      - If `fundingRegime` actively fights the direction (e.g. SHORT into
        SHORT_CROWDED, LONG into LONG_CROWDED)
      - If `recentEntryCountThisAsset` >= 3 within 24h — over-traded

      ## JACKAL'S THESIS

      High-quality traders telegraph alpha, but naïve copy-trading fails
      because (a) winners regress, (b) signals lag, (c) style mismatches
      amplify risk. Jackal copies only when:
      - source trader's quality + recent consistency is high
      - pool consensus exists (other tracked traders aligned)
      - independent TA on the asset agrees with source direction
      - market regime supports the thesis

      ## OUTPUT FORMAT

      Return a JSON object with this exact shape. Field values should be
      your decision, NOT template placeholders:

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": an integer 1-10,
        "reasoning": "a concrete sentence that quotes specific numbers
                      from the signal — e.g. 'copying 0x06ce...164b
                      (qscore 60, roi30d 677%), 14-consensus SHORT, 4h
                      bullish against us but 1h+15m bearish confirm,
                      BTC macro DOWN -0.82%'",
        "payload": {
          "signals": [
            {
              "asset": "copy the signal's asset field EXACTLY",
              "direction": "copy the signal's direction field EXACTLY",
              "reason": "human-readable one-liner citing actual values"
            }
          ]
        }
      }

      ## CONFIDENCE SCORING

      - 9-10: quality>=80 AND consensus>=3 AND TA fully aligned AND BTC macro supports
      - 7-8: quality>=55 AND consensus>=1 AND TA majority aligned
      - 4-6: quality>=55 but consensus 0 or TA mixed — SKIP (execute: false)
      - 1-3: any hard-skip condition above — SKIP (execute: false)

      The minimum to execute is confidence 7. If you cannot honestly
      justify >=7 citing values from the signal, output execute: false.

exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60                 # v2.0.6: 15 → 60 — same rationale as Scorpion v4.0.2
  # Jackal's thesis is patience — consensus signals take time to develop.
  # Wide Phase 1 (22% max_loss), loose early Phase 2 locks (preserve
  # the gold-signal case: newly-promoted source + 2+ existing consensus).
  # Hard timeout 72h lets multi-day holds breathe. No dead_weight_cut
  # (v1 had it; runtime disables time cuts once Phase 2 reached
  # automatically — preserving the patience philosophy).
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 4320        # 72h
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 240          # 4h of stale peak before cut
      min_value: 3.0
    dead_weight_cut:
      enabled: false                    # Jackal is patient; no time-based loss cuts
      interval_in_minutes: 240
    phase1:
      enabled: true
      max_loss_pct: 22.0
      retrace_threshold: 10
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        # trigger_pct is capped at 100% by runtime validation. A tier with
        # trigger_pct above 100 rejects the whole config. Beyond the top
        # tier's trigger_pct, the runtime uses the highest tier's
        # lock_hw_pct for any further high-water growth.
        - { trigger_pct: 6,   lock_hw_pct: 20 }
        - { trigger_pct: 14,  lock_hw_pct: 40 }
        - { trigger_pct: 28,  lock_hw_pct: 62 }
        - { trigger_pct: 50,  lock_hw_pct: 80 }
        - { trigger_pct: 100, lock_hw_pct: 94 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
