name: jackal-tracker
version: 1.1.0
description: >
  JACKAL v1.1 — The Smart Stalker (promotion loosen). v1.0 was dormant
  (0 trades) because PROMOTE_SCORE_THRESHOLD=70 + 6h sustain rejected
  every candidate. v1.1 loosens to 65 + 3h to let the active pool fill.
  Active-pool size cap unchanged — over-promotion still self-corrects.
  No scanner logic, signal scoring, or DSL changes.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 3
  margin_per_slot: 250
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ─── EXIT (DSL) — Consensus-aware patience profile ───────────
# Jackal inherits Python's patience DSL but with TWO adjustments:
#
#   1. Wider Phase-1 floor (22%): consensus signals take time to
#      develop; we don't want to stop out on the first shakeout.
#   2. Looser early Phase-2: even consensus signals need runway.
#
# The GOLD SIGNAL case (newly-promoted source + 2+ existing consensus)
# is where the fat-tail lives. Tight early locks kill those.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 4320        # 72h = 3 days
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 480          # 8h — consensus consolidations
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 240          # 4h no movement
    phase1:
      enabled: true
      max_loss_pct: 22.0                # Wider than Python (20%) — consensus signals deserve breathing room
      retrace_threshold: 10
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 6,   lock_hw_pct: 20 }   # Loose first lock
        - { trigger_pct: 14,  lock_hw_pct: 40 }
        - { trigger_pct: 28,  lock_hw_pct: 62 }
        - { trigger_pct: 50,  lock_hw_pct: 80 }
        - { trigger_pct: 100, lock_hw_pct: 90 }
        - { trigger_pct: 200, lock_hw_pct: 94 }   # Monster winner trail

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
