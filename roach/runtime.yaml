name: roach-tracker
version: 1.1.0
description: >
  Roach v1.1 — KILL-CANDIDATE LOCKDOWN. v1.0 shipped with 8/12/25 min
  DSL timing (dead_weight/weak_peak/hard_timeout) which is mathematically
  incompatible with any striker-class hold: fees at 10x round-trip =
  0.85% per trade, 506 fills = 430% gross fee burn. v1.1 widens DSL so
  winners have room to develop AND tightens MIN_SCORE + MAX_POSITIONS
  to reduce churn. If this doesn't turn the corner in 20 trades,
  recommend full kill (pause the strategy from UI and recycle capital).

# ── STRATEGY ──
strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

# ── SCANNERS ──
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

# ── ACTIONS ──
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ── EXIT (DSL) ──
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 120      # v1.1: 25 → 120 (strikers need runway to develop)
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 45       # v1.1: 12 → 45
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 25       # v1.1: 8 → 25
    phase1:
      enabled: true
      max_loss_pct: 18.0
      retrace_threshold: 3
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 7, lock_hw_pct: 40 }
        - { trigger_pct: 12, lock_hw_pct: 55 }
        - { trigger_pct: 15, lock_hw_pct: 75 }
        - { trigger_pct: 20, lock_hw_pct: 85 }

# ── NOTIFICATIONS ──
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
