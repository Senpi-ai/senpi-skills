name: roach-tracker
version: 1.2.0
description: >
  Roach v1.2 — signal+DSL overhaul for positive expectancy. v1.0 had
  DSL timing (8/12/25 min) too tight for striker-class holds AND
  signal gates (cc_15m > 0) too permissive, giving 506 fills / -28%
  ROI. v1.1 widened DSL (120/45/25). v1.2 now also strengthens signal
  quality: cc_15m floor 0 → 0.5 (reject noise-grade velocity), and
  require 1h price confirmation of 4h direction (rejects SM-velocity
  spikes unconfirmed by price). Combined effect: fewer fires, each
  with real macro + SM backing.

# ── STRATEGY ──
strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

# ── SCANNERS ──
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

# ── ACTIONS ──
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ── EXIT (DSL) ──
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 120      # v1.1: 25 → 120 (strikers need runway to develop)
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 45       # v1.1: 12 → 45
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 25       # v1.1: 8 → 25
    phase1:
      enabled: true
      max_loss_pct: 18.0
      retrace_threshold: 3
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 7, lock_hw_pct: 40 }
        - { trigger_pct: 12, lock_hw_pct: 55 }
        - { trigger_pct: 15, lock_hw_pct: 75 }
        - { trigger_pct: 20, lock_hw_pct: 85 }

# ── NOTIFICATIONS ──
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
