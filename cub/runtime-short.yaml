name: cub-short-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Cub v1.0" — lives in
# description + SKILL.md + _cub_producer_version.
version: 1.0.0
description: >
  CUB v1.0 (SHORT "have-nots" book) — two-speed-market (K-shaped) cross-asset
  long/short fund.

  One of two single-direction books. This book SHORTS the laggards of a K-shaped
  world: the broad U.S. market via the SP500 index product (the "economy
  suffers" core) PLUS a curated, gated basket of laggard crypto majors/alts (the
  "rest of crypto struggles" bet) — but only when ABSOLUTE trend confirms (4h
  structure bearish + negative momentum), with a CAPITULATION guard so it never
  shorts an exhausted bottom. Cross-sectional relative weakness tilts
  size/ranking. Per-name size scales with account value and a conviction weight
  (SP500 1.2x core, alts 0.7x — alts squeeze). Pairs with the LONG "haves" book
  (runtime-long.yaml) on a separate wallet. Longing AI names while shorting
  SP500 (which contains them) isolates the AI-vs-broad-market spread by design.

  Scoring (producer-side): curated thematic universe, 4h + 1h absolute-trend
  confirmation (hard gate), own-momentum sign, relative-weakness tiebreaker,
  RSI capitulation guard. SHORT only.

  Execution envelope:
    - slots 4, margin_pct 15 (× conviction weight) — smaller than the long book
    - strict 4x leverage clamp (short squeezes are violent), then venue max
    - tighter DSL than the long book: faster stall-cuts, quicker profit lock —
      a short thesis decays faster than a long winner runs

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${CUB_SHORT_WALLET}"
  # ── NET-EXPOSURE DEFAULT: modest NET-LONG tilt (~60/40) ──
  # Net exposure is an OPERATOR decision (see config _net_exposure_note), set by
  # the long/short wallet funding split + per-leg knobs — NOT a runtime-enforced
  # field. This book defaults smaller (slots 4, margin_pct 15, 4x cap) than the
  # long book to express the directional AI/HYPE conviction and to respect that
  # short squeezes are violent.
  slots: 4
  margin_pct: 15
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # base off perp value (=$0 for an idle leg) and cross-charges a sibling leg's PnL, so an
    # idle leg gets a "$0.00" limit and is permanently halted (Mongoose long book 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 5
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 90
    drawdown_halt_pct: 18
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 300

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: cub_short_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        excess: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: cub_short_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${CUB_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [cub_short_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: cub_short_signals
    decision_prompt: |
      You are Cub's SHORT "have-nots" book pass-through gate. The producer shorts
      the laggards of a two-speed market — the broad U.S. market (SP500) plus a
      gated basket of laggard crypto alts — trend-confirmed (a LONG "haves" book
      runs the winners on a separate wallet). The producer already applied the
      thematic universe, the 4h/1h absolute-downtrend gate, the capitulation
      guard, the relative-weakness tiebreaker, the conviction-weighted size, the
      4x leverage clamp, and held-asset dedup. Honor the signal unless malformed.

      SIGNAL:
      {{signal_cub_short_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix
         on the index; crypto names like ETH/XRP have NO prefix).
      2. direction MUST be "SHORT" (this is the short book).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 4 (clamp breach) OR marginUsd <= 0
      - direction != "SHORT"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:SP500 SHORT 4x, 4h BEARISH, abs -2.1% — broad-market laggard')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "SHORT",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "CUB_HAVENOTS_SHORT — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — tighter; short theses decay faster, squeezes are violent) ──
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 7200           # 5d — shorter than the long book
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 360            # 6h — cut a short that bottomed then stalled
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 720            # 12h — recycle a short going nowhere
    phase1:
      enabled: true
      max_loss_pct: 12.0                  # tighter than long book — squeeze protection
      retrace_threshold: 7
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 0 }
        - { trigger_pct: 18, lock_hw_pct: 45 }
        - { trigger_pct: 35, lock_hw_pct: 65 }
        - { trigger_pct: 60, lock_hw_pct: 80 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
