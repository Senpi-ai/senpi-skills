name: cub-preipo-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Cub v1.0" — lives in
# description + SKILL.md + _cub_producer_version.
version: 1.0.0
description: >
  CUB v1.0 (PREIPO satellite) — the 10% pre-IPO ramp sleeve of the Cub
  combined fund (90% Lion two-speed AI long/short + 10% pre-IPO).

  This book auto-DISCOVERS pre-IPO perpetuals (IPOPs) on Hyperliquid XYZ by their
  structural funding signature (|funding| <= ipopFundingMaxAbs AND venue
  max_leverage <= ipopMaxLeverageCap — the throttled pre-listing state) and LONGS
  the ones with a confirming absolute 4h/1h uptrend, riding the pre-listing ramp
  (the SpaceX / Cerebras pattern). No static universe — discovered every tick, so
  the next IPOP auto-joins on listing. SM is a bonus, not a gate (pre-IPO SM data
  is sparse). LONG only. Episodic by design — most ticks may find 0-2 IPOPs.

  Runs on its OWN wallet, funded with ~10% of Cub's combined pool (the allocation
  is the operator's funding split across the three book wallets, not a runtime
  field). Pairs with the LONG "haves" + SHORT "have-nots" books (runtime-long.yaml
  / runtime-short.yaml) that carry the 90% Lion engine.

  Execution envelope:
    - slots 3, margin_pct 15 — small, concentrated satellite
    - strict 5x leverage clamp (IPOPs are venue-capped at 5x anyway)
    - moderate let-it-ramp DSL, slightly tighter max-loss than the haves book
      (pre-IPO names gap on news); IPOP Discovery Bounds (±30%/day with resets)
      naturally throttle velocity

  Producer scores its discovered universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${CUB_PREIPO_WALLET}"
  # ── ALLOCATION: ~10% of Cub's combined pool ──
  # Cub allocates ~90% to the Lion two-speed engine (haves+havenots wallets) and
  # ~10% to this pre-IPO wallet. The split is set by the operator's FUNDING across
  # the three book wallets — NOT a runtime-enforced field.
  slots: 3
  margin_pct: 15
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    daily_loss_limit_pct: 12
    max_entries_per_day: 4
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 90
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: cub_preipo_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        excess: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: cub_preipo_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${CUB_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [cub_preipo_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: cub_preipo_signals
    decision_prompt: |
      You are Cub's PREIPO satellite pass-through gate. The producer auto-discovers
      pre-IPO perpetuals (IPOPs) by their funding signature and LONGS the ones in a
      confirming uptrend (riding the pre-listing ramp). The producer already applied
      the IPOP discovery, the 4h/1h absolute-trend gate, the budget-relative
      liquidity floor, the 5x leverage clamp, and held-asset dedup. Honor the signal
      unless it is malformed.

      SIGNAL:
      {{signal_cub_preipo_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix).
      2. direction MUST be "LONG" (this is a long-only ramp book).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 4 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction != "LONG"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 6 AND no malformed fields
      - 7-8:  score 4.5-5.9
      - 7:    score 4-4.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 6 xyz:SPCX LONG 5x, 4h BULLISH, abs +4.2% — pre-IPO ramp')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "LONG",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "CUB_PREIPO_LONG — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — let the ramp run; slightly tighter max-loss than haves) ──────
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 7200           # 5d — ride the ramp, but pre-IPO theses are time-boxed to the listing
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 480            # 8h — cut a ramp that peaked then stalled
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 960            # 16h
    phase1:
      enabled: true
      max_loss_pct: 14.0                  # tighter than haves (16) — pre-IPO gaps on news
      retrace_threshold: 10
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10, lock_hw_pct: 0 }
        - { trigger_pct: 20, lock_hw_pct: 40 }
        - { trigger_pct: 35, lock_hw_pct: 60 }
        - { trigger_pct: 60, lock_hw_pct: 78 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
