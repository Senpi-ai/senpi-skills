name: ox-core-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Ox v1.0" — lives in
# description + SKILL.md + _ox_producer_version.
version: 1.0.0
description: >
  OX v1.0 (CORE book) — all-weather risk-parity core.

  One of two books. This is the fund line's CORE holding: a vol-balanced LONG
  basket across asset-class sleeves (crypto majors + equity indices + metals +
  energy + FX), sized by INVERSE realized volatility so no single sleeve
  dominates portfolio risk — true risk parity. Always invested, low leverage,
  low turnover; only declines to ADD a sleeve that is in a hard downtrend (knife
  guard), and the DSL holds existing sleeves through normal drawdowns. Pairs
  with the BALLAST book (runtime-ballast.yaml) on a separate wallet. The edge is
  RISK BALANCING + diversification, not a directional bet.

  Sizing (producer-side): each sleeve's marginUsd = portfolio_budget *
  (1/vol_i)/sum(1/vol_j), capped per sleeve. This per-sleeve marginUsd MUST be
  honored — it is the risk-parity weight, not a flat size.

  Execution envelope:
    - slots 10 (holds the whole sleeve basket), LONG only
    - LOW leverage clamp (3x), then each asset's HL venue max
    - WIDE let-it-hold DSL: a core is held through drawdowns + rebalanced, all
      time-cuts OFF, 14d hard_timeout staleness backstop

  Producer sizes its basket and pushes signals via SenpiClient.push_signal();
  runtime LLM gate is pass-through; runtime owns execution + DSL.

strategy:
  wallet: "${OX_CORE_WALLET}"
  # ── FUNDING SPLIT DEFAULT: CORE 70% / BALLAST 30% of the combined pool ──
  # The core IS the all-weather holding and carries the larger share; the ballast
  # is the smaller defensive overlay. This is a FUNDING guideline for the operator,
  # NOT a runtime-enforced field. Per-position sizing is governed by the producer's
  # per-sleeve marginUsd (inverse-vol); margin_pct below is only a fallback cap.
  slots: 10
  margin_pct: 6
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # base off perp value (=$0 for an idle leg) and cross-charges a sibling leg's PnL, so an
    # idle leg gets a "$0.00" limit and is permanently halted (Mongoose long book 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 12       # builds the basket on deploy, then rebalances slowly
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 5
    cooldown_minutes: 60
    drawdown_halt_pct: 18
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 360   # don't re-add the same sleeve within 6h

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: ox_core_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        weightPct: { type: number, required: false }
        vol: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: ox_core_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${OX_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [ox_core_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: ox_core_signals
    decision_prompt: |
      You are Ox's CORE-book pass-through gate. The producer sized one sleeve of
      a vol-balanced all-weather basket: its marginUsd is the INVERSE-VOLATILITY
      weight (low-vol sleeves get more, high-vol less) — this is the risk-parity
      mechanic, so copy marginUsd EXACTLY; do NOT normalize, average, or
      override it. This book is LONG only. It applied the 3x leverage clamp and
      held-asset dedup. Honor the signal unless it is malformed.

      SIGNAL:
      {{signal_ox_core_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
      2. direction MUST be LONG (this book is long-only). If signal.direction is not LONG, execute: false.
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd EXACTLY (it is the per-sleeve risk-parity weight).
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 3 (clamp breach) OR marginUsd <= 0
      - direction != LONG
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 (sleeve trending + sized) AND no malformed fields
      - 7-8:  score 5-6 (sleeve eligible, inverse-vol sized) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:GOLD LONG 3x, risk-parity weight 18%, low vol — all-weather core sleeve')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "LONG",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "OX_ALLWEATHER_CORE LONG — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — wide, hold the core) ────────────────────────────────
#
# A risk-parity core is held through drawdowns and rebalanced, not stopped out
# on noise: wide phase1, ALL time cuts OFF, and only a 14d hard_timeout
# staleness backstop. Position sizing (inverse-vol, low leverage) is the primary
# risk control; the DSL is the backstop.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 20160          # 14d staleness cap
    weak_peak_cut:
      enabled: false
      interval_in_minutes: 720
      min_value: 3.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 1440
    phase1:
      enabled: true
      max_loss_pct: 16.0
      retrace_threshold: 10
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 12, lock_hw_pct: 0 }
        - { trigger_pct: 25, lock_hw_pct: 45 }
        - { trigger_pct: 50, lock_hw_pct: 65 }
        - { trigger_pct: 90, lock_hw_pct: 80 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
