name: cougar-short-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Cougar v1.0" — lives in
# description + SKILL.md + _cougar_producer_version.
version: 1.0.0
description: >
  COUGAR v1.0 (SHORT book) — U.S. equity long/short, market-neutral fund.

  One of two single-direction books. This book ranks the tokenized U.S. equity
  universe on Hyperliquid XYZ by 24h RELATIVE STRENGTH and SHORTS the weakest
  names (largest negative excess return) — but only when absolute trend confirms
  (4h structure bearish + negative own momentum), with a capitulation guard so
  it never shorts an oversold bottom. Pairs with the LONG book
  (runtime-long.yaml) on a separate wallet; the two net to ~beta-neutral. The
  edge is EQUITY DISPERSION (leaders minus laggards), not market direction.

  Scoring (producer-side): cross-sectional relative-strength rank (laggards),
  4h + 1h absolute-trend confirmation, own-momentum sign, RSI capitulation
  guard. SHORT only.

  Execution envelope:
    - slots 4 (a basket of laggards), margin_pct 20
    - strict 5x leverage clamp, then each asset's HL venue max
    - moderate DSL: cut reversers, lock profit on extension, stall-cuts ON,
      7d hard_timeout

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${COUGAR_SHORT_WALLET}"
  # ── FUNDING SPLIT DEFAULT: LONG 50% / SHORT 50% of the combined pool ──
  # The two books must be funded ~equally so their notional exposure offsets and
  # the fund stays beta-neutral. FUNDING guideline for the operator, NOT a
  # runtime-enforced field. Per-position sizing is governed by margin_pct + slots.
  slots: 4
  margin_pct: 20
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # limit off the perpDay base, which reads ~$0 for these wallets -> a "$0.00" limit that
    # ANY real loss trips, permanently halting the book (Wolf/Hydra/Mongoose 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 60
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: cougar_short_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        excess: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: cougar_short_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${COUGAR_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [cougar_short_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: cougar_short_signals
    decision_prompt: |
      You are Cougar's SHORT-book pass-through gate. The producer ranks the
      tokenized U.S. equity cross-section by relative strength and SHORTS the
      weakest, trend-confirmed laggards (the fund is market-neutral: a LONG book
      runs the strongest equities on a separate wallet). The producer already
      applied the RS rank, 4h/1h trend confirmation, the 5x leverage clamp, the
      capitulation guard, and held-asset dedup. Honor the signal unless malformed.

      SIGNAL:
      {{signal_cougar_short_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix).
      2. direction MUST be "SHORT" (this is the short book).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction != "SHORT"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:INTC SHORT 5x, RS lag -5.8% vs equity cross-section, 4h BEARISH — dispersion laggard')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "SHORT",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "COUGAR_EQUITY_SHORT — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — moderate dispersion management, equity rhythm) ────────
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080          # 7d
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 480            # 8h
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 960            # 16h
    phase1:
      enabled: true
      max_loss_pct: 14.0
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 0 }
        - { trigger_pct: 18, lock_hw_pct: 40 }
        - { trigger_pct: 35, lock_hw_pct: 60 }
        - { trigger_pct: 60, lock_hw_pct: 78 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
