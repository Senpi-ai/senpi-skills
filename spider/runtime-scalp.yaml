name: spider-scalp-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Spider v5.0" — lives in
# description + SKILL.md + _spider_producer_version.
version: 1.0.0
description: >
  SPIDER v5.0 (SCALP leg) — Macro commodities & majors fast mean-reversion.

  One of two autonomous style legs. This leg scores a Macro & Majors
  universe: top-liquidity crypto majors (BTC, ETH, SOL, HYPE) and
  energy/commodities on XYZ (BRENTOIL, CL). It fades short-timeframe
  stretch and rides the snap-back — BOTH directions (long-biased but
  actively shorts ETH/SOL/oil when overbought), strict 5x leverage cap,
  fast in-and-out (5-45 min holds, high win rate, small per-trade size).
  NOT a copy-trader — it hunts the STYLE.

  Scoring (producer-side): short-TF (5m/15m) stretch from a fast MA,
  RSI extreme (oversold -> LONG, overbought -> SHORT), 1h trend filter
  to avoid fading a strong trend, funding-crowding tiebreak. BOTH
  directions, strict 5x.

  Execution envelope tuned to that style:
    - slots 4 (holds several quick scalps at once)
    - small size per slot (margin_pct 15) — scalper scrapes small moves
    - STRICT 5x leverage clamp (the style's defining discipline)
    - TIGHT fast-capture DSL: dead_weight + weak_peak cuts ON, 2h
      hard_timeout, early profit-lock ladder
    - HIGH turnover (max 30 entries/day) — FEE-SENSITIVE, see note below
    - taker-fast entries (20s window) — 5-45 min moves need immediate fill

  *** FEE NOTE: 30 entries/day is faithful to the scalp cadence,
  but turnover is the single biggest cost driver. FEE_OPTIMIZED_LIMIT keeps
  entries/exits maker-first, but at this frequency fee drag is material.
  Lower max_entries_per_day if net-of-fees underperforms. ***

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime
  owns execution + DSL. Paired with the SWING leg (runtime-swing.yaml)
  on a separate wallet.

strategy:
  wallet: "${SPIDER_SCALP_WALLET}"
  # ── FUNDING SPLIT DEFAULT: SWING 60% / SCALP 40% of the combined pool ──
  # Scalp takes the SMALLER 40% share: it is FEE-SENSITIVE (30 entries/day) and
  # unproven net-of-fees, so it is funded small to validate before scaling. Raise
  # its share only after net-of-fees proves out over several weeks. Swing carries
  # the larger 60% (see runtime-swing.yaml). This is a FUNDING guideline for the
  # operator (how to split capital across the two wallets), NOT a runtime-enforced
  # field. Per-position sizing is governed by margin_pct + slots below.
  slots: 4
  margin_pct: 15          # 4 x 15 = 60% max committed; small scalp size
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # base off perp value (=$0 for an idle leg) and cross-charges a sibling leg's PnL, so an
    # idle leg gets a "$0.00" limit and is permanently halted (Mongoose long book 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 18       # FEE-SENSITIVE + net-negative — trimmed from 30 to lose less: fewer trades = less fee drag + fewer marginal fades.
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 5     # scalpers run loss streaks (small losses)
    cooldown_minutes: 30
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 10   # scalper re-trades BTC/ETH repeatedly

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: spider_scalp_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend1h: { type: string, required: false }
        rsi: { type: number, required: false }
        stretchPct: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: spider_scalp_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${SPIDER_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [spider_scalp_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true     # scalp moves are minutes — fill fast
        execution_timeout_seconds: 20
    context:
      - type: signal
        scanner: spider_scalp_signals
    decision_prompt: |
      You are Spider's SCALP-leg pass-through gate. The producer scores a
      macro & majors mean-reversion universe: crypto majors (BTC/ETH/SOL/HYPE)
      and energy/commodities (XYZ), BOTH directions, strict 5x, fast in-and-out.
      It already applied stretch/RSI scoring, the 5x clamp, and held-asset
      dedup. Honor the signal unless it is malformed. Speed matters — do not
      over-think.

      SIGNAL:
      {{signal_spider_scalp_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve case / any xyz: prefix).
      2. direction MUST be copied from signal.direction (LONG or SHORT).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 4 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 6
      - 7-8:  score 5
      - 7:    score 4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 5 ETH SHORT 5x, RSI 74 overbought, +1.8% stretch — macro mean-reversion')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "SPIDER_SCALP_REVERSION ${direction} — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — tight fast-capture; the source flips in minutes) ──────
#
# The style scrapes small % moves and jumps back to cash (5-45 min). So: tight
# phase1 max_loss, early profit-lock ladder, dead_weight + weak_peak cuts ON,
# and a 2h hard_timeout (anything held longer has stopped being a scalp).
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 20
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 120            # 2h — a scalp that lingers is dead
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 30             # if it hasn't moved in 30m, cut
      min_value: 1.5
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 25             # at/below break-even after 25m → cut
    phase1:
      enabled: true
      max_loss_pct: 5.0                    # tightened 7->5 to LOSE LESS: losers were running to ~2x winner size (winners bank fast at +3%, losers ran to -$14). Cap the downside tighter so per-trade R/R is closer to symmetric.
      retrace_threshold: 3
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 3, lock_hw_pct: 35 }    # lock profit early
        - { trigger_pct: 6, lock_hw_pct: 55 }
        - { trigger_pct: 12, lock_hw_pct: 70 }
        - { trigger_pct: 25, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
