name: spider-swing-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Spider v5.2" — lives in
# description + SKILL.md + _spider_producer_version.
version: 1.0.0
description: >
  SPIDER v5.2 (SWING leg) — Tech & AI multi-day momentum.

  v5.2: an adaptive producer-side risk governor + a market-regime gate own the
  risk envelope (see spider-swing-config.json governor block + the guard_rails
  note below). The governor green-scales the entry budget, stops the day on an
  adaptive red band, halts on a trailing multi-day drawdown, and cools off
  losing names by outcome; the regime gate stands the leg down in a risk-off tape.

  One of two autonomous style legs. This leg scores a Tech & AI momentum
  universe: semiconductor/AI equities on XYZ (NVDA, AMD, INTC, MRVL, MU,
  TSM) and high-beta crypto momentum alts (SUI, ONDO, HYPE, NIL, GRASS,
  ZEC). LONG-only, multi-day horizon, tolerant of drawdown while the
  multi-timeframe trend holds. NOT a copy-trader — it hunts the STYLE.

  Scoring (producer-side): 4h + 1h trend-structure alignment, 24h
  momentum (relative-strength proxy), SM-consensus LONG bonus, RSI-room
  penalty when overbought, funding-crowding penalty. LONG only.

  Execution envelope tuned to that style:
    - slots 3 (holds a small basket of concurrent momentum names)
    - conviction leverage clamped 10x, then to each asset's HL max
    - WIDE let-winners-run DSL, ALL time-cuts OFF, 7d hard_timeout
      staleness cap (matches the multi-day horizon)
    - low turnover (max 4 entries/day) — patience + maker-first entries

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime
  owns execution + DSL. Paired with the SCALP leg (runtime-scalp.yaml)
  on a separate wallet.

strategy:
  wallet: "${SPIDER_SWING_WALLET}"
  # ── FUNDING SPLIT DEFAULT: SWING 60% / SCALP 40% of the combined pool ──
  # Swing carries the LARGER 60% share: it is the fee-efficient, asymmetric-
  # upside leg (low turnover, let-winners-run DSL, plus the dynamic-universe
  # edge that auto-catches fresh AI IPOs). Scalp takes 40% — it is fee-sensitive
  # and funded small to validate net-of-fees first (see runtime-scalp.yaml).
  # This is a FUNDING guideline for the operator (how to split capital across the
  # two wallets), NOT a runtime-enforced field. Per-position sizing is governed
  # by margin_pct + slots below.
  slots: 3
  margin_pct: 28          # 3 x 28 = 84% max committed; leaves headroom
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168       # 7d — match the max hold horizon
  # NOTE: as of v5.2 the producer-side ADAPTIVE GOVERNOR (adaptive_governor.py,
  # configured in spider-swing-config.json) is the PRIMARY risk brake — it owns
  # the per-day entry budget (green-scaled, red-stopped on an adaptive band), the
  # trailing multi-day drawdown halt, and per-asset cooldown by trade OUTCOME.
  # The guard_rails below are now a WIDE HARD BACKSTOP that should rarely fire —
  # they only catch a governor failure. Don't tighten them to do the governor's
  # job; tune the governor block in the config instead.
  guard_rails:
    daily_loss_limit_pct: 25      # backstop only — governor's adaptive red-stop band (5-12%) is primary
    max_entries_per_day: 20       # backstop only — governor caps the real budget (baseEntries 3 → maxEntriesCap 8)
    bypass_max_entries_per_day_on_profit: false   # governor now owns green-day scaling (capped); no unlimited bypass
    max_consecutive_losses: 6     # backstop — governor's win-rate band handles streaks
    cooldown_minutes: 90
    drawdown_halt_pct: 30         # hard backstop — governor's trailing-DD halt (20% off rolling peak) is primary
    drawdown_reset_on_day_rollover: true    # backstop resets daily; the governor's trailing-DD is the NON-resetting multi-day brake that prevents day-over-day compounding
    per_asset_cooldown_minutes: 60           # low dumb floor — governor's OUTCOME-based cooldown (gain→0, loss→2h doubling) is primary

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: spider_swing_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        rs: { type: number, required: false }
        smPct: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: spider_swing_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${SPIDER_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [spider_swing_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true     # mirror live exposure, but 60s maker-first window first
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: spider_swing_signals
    decision_prompt: |
      You are Spider's SWING-leg pass-through gate. The producer scores a
      Tech & AI multi-day momentum universe: semiconductor/AI equities (XYZ)
      and high-beta crypto momentum alts, LONG only, multi-day horizon. It
      already applied multi-timeframe trend scoring, the 10x leverage clamp,
      and held-asset dedup. Honor the signal unless it is malformed.

      SIGNAL:
      {{signal_spider_swing_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve case / any xyz: prefix).
      2. direction MUST be copied from signal.direction (LONG or SHORT).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 10 (clamp breach) OR marginUsd <= 0
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 8 AND notionalUsd large AND no malformed fields
      - 7-8:  score 6-7.9
      - 7:    score 5-5.9 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 8.2 MRVL LONG 6x, 4h+1h BULLISH, RS +4.1%, 27h horizon — tech/AI momentum')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "SPIDER_SWING_MOMENTUM ${direction} — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — wide let-winners-run; the style rides multi-day) ──────
#
# The style holds winners for days (multi-day momentum) and sits through
# drawdowns on conviction. So: wide phase1 max_loss, ALL time cuts OFF, and
# only a 7d hard_timeout staleness backstop — the producer emits entries,
# not exits, so the timeout prevents a stale position lingering forever.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080          # 7d — matches source max hold
    weak_peak_cut:
      enabled: false                       # patience leg
      interval_in_minutes: 720
      min_value: 3.0
    dead_weight_cut:
      enabled: false                       # patience leg
      interval_in_minutes: 1440
    phase1:
      enabled: true
      max_loss_pct: 22.0                   # source tolerates deep drawdowns
      retrace_threshold: 12
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 15, lock_hw_pct: 0 }    # let it breathe before locking
        - { trigger_pct: 30, lock_hw_pct: 45 }
        - { trigger_pct: 60, lock_hw_pct: 68 }
        - { trigger_pct: 100, lock_hw_pct: 80 }
        - { trigger_pct: 150, lock_hw_pct: 90 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
