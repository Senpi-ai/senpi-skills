name: spider-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (must be major=1). The strategy/skill is "Spider v3.0" —
# that lives in description + SKILL.md + _spider_producer_version.
# v2.0 incorrectly set version: 2.0.0 here, which the runtime ignored
# silently (along with all the custom scanner/action types). v3.0 fixes
# the schema and uses only types the runtime actually implements.
version: 1.0.0
description: >
  SPIDER v3.0 — Single-leg patient anchor sniper, v2-runtime-native.

  v2.0 was an elaborate 2-leg portfolio operator (anchor + basket) with
  custom runtime types (composite_score, portfolio_snapshot,
  predators_position_aggregator, LLM_PORTFOLIO_DECISION) that
  THE RUNTIME DID NOT IMPLEMENT. The operator agent was simulating
  the runtime in cron text prompts; never traded.

  v3.0 redesign trade-off:

    PRESERVE — patience thesis (long horizon, low turnover, fee-aware)
    PRESERVE — anchor-selection signal logic (arena leaders + SM
               consensus + funding favorability + relative strength)
    PRESERVE — 7-day minimum hold per anchor
    PRESERVE — single high-conviction long position
    PRESERVE — score-scaled leverage (1x/2x/3x cap)

    DROP    — basket leg (no native portfolio runtime support;
               revisit when dsl_portfolio ships)
    DROP    — risk-parity multi-leg sizing
    DROP    — funding harvest from coordinated shorts
    DROP    — 7-day paper warmup (gate-paused indefinitely; v3.0 trades
               immediately)
    DROP    — pilot protocol staged entry
    DROP    — fleet concentration overlay (revisit later)

  WHAT v3.0 ENABLES:
    - Producer (spider-producer.py) emits anchor signals via
      `SenpiClient.push_signal()` (direct HTTP POST). NO execution code.
    - Runtime LLM gate (decision_mode: llm) evaluates regime
      (BTC drawdown, funding regime, vol expansion) and either
      honors or rejects. Acts as the "agentic" layer the original
      v2.0 design wanted.
    - risk.guard_rails ENFORCES daily caps, drawdown halt,
      consecutive-loss halt, per-asset cooldown.
    - DSL uses FEE_OPTIMIZED_LIMIT on entries AND exits.
    - 7-day min hold enforced producer-side (no re-emission while
      held < 7d) plus DSL-side (Phase 1 max_loss is the only early
      exit; weak_peak / dead_weight time cuts DISABLED for patience).
    - Trade chain DB emits LIFECYCLE / DECISION / ACTION_RESULT /
      DSL_CREATED / DSL_CLOSED — telemetry restored.

  Cadence: hourly cron acceptable; producer skips when position open
  with held_days < 7. Daily 13:00 UTC tick is sufficient for a
  patience agent — but hourly catches faster regime shifts at no
  cost (the producer no-ops cleanly when riding).

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 1
  margin_per_slot: 1000        # 100% on single anchor (operator-tunable)
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168     # 7 days — match min-hold horizon
  guard_rails:
    daily_loss_limit_pct: 12    # 12% weekly drawdown cap from v2.0
    max_entries_per_day: 2      # rare anchor entries; cap at 2/day
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 60
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false  # Roach Sat-Sun bleed lesson
    per_asset_cooldown_minutes: 10080      # 7d (matches min-hold)

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 30s

  - name: spider_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        reasons: { type: string, required: false }
        smPct: { type: number, required: true }
        smTraders: { type: number, required: true }
        rank: { type: number, required: false }
        arenaScore: { type: number, required: false }
        smScore: { type: number, required: false }
        fundingScore: { type: number, required: false }
        relstrScore: { type: number, required: false }
        fundingRate: { type: number, required: false }
        priceChg30d: { type: number, required: false }
        priceChg7d: { type: number, required: false }
        priceChg24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: spider_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${SPIDER_DECISION_MODEL}"  # REQUIRED. BARE model name only — NO provider prefix.
    scanners: [spider_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: spider_signals
    decision_prompt: |
      You are Spider's regime-aware gate. The producer has applied
      every quantitative filter (top-15 SM universe, hard SM + trader
      count gates, 4-factor composite scoring with MIN_SCORE 5.5,
      LONG-only, XYZ banned, held-asset dedup, post-close cooldown,
      leverage clamped to HL asset max).

      Your job is to evaluate REGIME conditions the producer doesn't
      see, and either honor the signal or veto it. Spider is a
      7-day-minimum-hold anchor agent — be conservative. Better to
      miss a setup than ride into a regime collapse.

      SIGNAL:
      {{signal_spider_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. The `asset` MUST be copied EXACTLY from the signal's `asset` field.
      2. The `direction` MUST be LONG (Spider is long-only on anchor).
      3. The `leverage` MUST be copied from signal.data.leverage (clamped
         by producer to HL asset max).
      4. Every claim in `reasoning` MUST cite values from the signal.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5.5 (producer floor; defensive only)
      - direction != "LONG" (producer should never emit non-LONG)
      - leverage <= 0 OR marginUsd <= 0 (malformed signal)
      - heldAssets non-empty (already holding an anchor — never add)
      - reasons string empty (malformed signal)

      ## REGIME VETOES (use general macro knowledge + signal data)

      Veto with execute: false if any of these apply:
        - BTC has dropped >10% in the last 48h (catastrophic regime)
        - Volatility regime is in expansion-spike mode (markets uniformly
          breaking, not Spider's setup)
        - Funding regime is "flipping" — broad funding direction reversal
          across the alt book (signals about to invalidate)
        - The signal's asset price is down >15% in 7d AND >20% in 24h
          (caught a reversal, not a continuation)

      Otherwise honor the signal.

      ## SPIDER'S THESIS

      Spider holds one high-conviction long anchor for at least 7 days.
      Goal: capture multi-day trend AND positive carry from favorable
      funding while peers churn in noise. The signal scoring already
      requires arena alignment + SM consensus + favorable funding +
      30d relative strength. Your job is to reject only when the
      MACRO regime makes the bet unwise — not to second-guess the
      asset selection.

      ## CONFIDENCE SCORING

      - 9-10: score >= 8.0 AND arenaScore >= 2 AND fundingScore >= 1.0
              AND no regime concerns
      - 7-8: score 6.5-7.9 AND no regime veto
      - 7: score 5.5-6.4 (entry-level tier, MIN_SCORE floor) AND
           SM_score >= 2.0 AND no regime concerns. Producer has
           gated this — be permissive unless regime veto applies.
      - <7: regime veto applies (output execute: false)

      Minimum confidence to execute is 7. Be conservative — Spider's
      edge comes from holding 7+ days, not from frequency.

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing score breakdown — e.g. 'score 8.4 LONG SOL — arena 2.4 (3 leaders LONG), SM 2.1 (12.4%/85t), funding 1.2 (-0.04%), relstr 0.8 (+12%/30d), regime stable'",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "LONG",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "score N.N SPIDER_ANCHOR ASSET — top reason"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 60
  # v3.0: maker-preferred exits via FEE_OPTIMIZED_LIMIT.
  # 7-day-hold anchors with 1-3x leverage have small per-trade fee
  # impact, but the principle stands — exit costs accrue over many
  # months of operation.
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  # DSL preset — Spider is patience agent. Time cuts DISABLED (matches
  # Polar / Wolverine / Pangolin patience-agent pattern). Phase 1
  # max_loss is the only early-exit path. Phase 2 ladder uses fleet-
  # standard T0/T1 patch but tier triggers WIDER than active rotation
  # agents — small price moves on 1-3x leverage shouldn't lock profit
  # too early on a 7-day-hold thesis.
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 43200          # 30 days — ultimate fail-safe
    weak_peak_cut:
      enabled: false                       # patience agent
      interval_in_minutes: 360
      min_value: 3.0
    dead_weight_cut:
      enabled: false                       # patience agent
      interval_in_minutes: 1440
    phase1:
      enabled: true
      max_loss_pct: 12.0                   # weekly drawdown cap
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        # Wider than active agents — Spider holds long, doesn't lock
        # at small wiggle. T0 trigger only fires on real winners.
        - { trigger_pct: 10, lock_hw_pct: 35 }
        - { trigger_pct: 20, lock_hw_pct: 55 }
        - { trigger_pct: 35, lock_hw_pct: 70 }
        - { trigger_pct: 60, lock_hw_pct: 85 }
        - { trigger_pct: 100, lock_hw_pct: 92 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
