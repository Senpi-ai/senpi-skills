# Wild Condor — Condor at a higher score floor and a higher margin.
#
# Two settings differ from condor, meant to move together: minScore 15 instead of 12 (condor's own
# top scoring tier), and a flat 90% margin instead of 20/28/32% by tier. The DSL ladder is
# penguin's, which transfers directly because both packages run 10x. Everything else is condor's.
#
# The floor is derived from the score scale: condor's maximum is 19, its shipped floor of 12 is 63%
# of that, penguin's 9 of 12 is 75%, and 75% of 19 rounds to 15.
#
# catalog.status: blocked — not offered in the catalog or discover. Deploy by explicit path:
#   python3 senpi-strategy-ops/scripts/deploy.py create strategies/wild-condor --budget <amount>
schema_version: 1

id: wild-condor
version: "1.1.0"

catalog:
  name: "Wild Condor — Condor at conviction size (experiment)"
  emoji: "🪶"
  tagline: "Condor's detector at a higher score floor and a higher margin: it fires only on a score of 15 out of 19 — condor's own top scoring tier — instead of 12, sizes one position at a flat 90% of the book instead of 20-32% by tier, and drops condor's one-trade-per-day cap so the experiment can build a sample. The two settings move together; everything else is Condor's."
  belief_plain: "Condor with a higher bar and a larger size. Condor waits, doing nothing until one setup has trend, momentum and the traders winning the last four hours all pointing the same way, then takes a single position. This version raises the score it demands before acting, and puts most of the account behind the trade rather than a fifth of it. Nothing else changes: the same universe, the same gates, the same one-position-at-a-time, the same exits. Know the sizing before funding it — 90% margin at 10x is nine times the account in one position, one stop-out is about 10.8% of equity, and there is no second position to offset it. The safety rails stop it opening new trades; they do not close the one that is open."
  thesis: "Three settings differ from Condor. The first two are meant to move together: the score floor goes 12 to 15, and margin goes 20/28/32% by tier to a flat 90%. The third is the one-entry-per-day cap, removed so the experiment can accumulate a sample — at one trade a day a few dozen results take a couple of months, long enough that the config would change underneath the data. Entries are still bounded, just by the loss budget rather than a count: the 15% daily loss limit halts them for the day, and at 90% margin on 10x one stop-out costs 10.8% of equity, so two losing trades trip it. The consecutive-loss freeze, the 25% drawdown halt and the two-hour per-asset cooldown are unchanged. Raising size without raising the floor puts more money behind the same signal distribution; raising the floor without the size pays a rarer signal what a common one earned. The floor is derived from the score scale rather than chosen: condor's maximum is 19, its shipped floor of 12 is 63% of that, penguin's 9 of 12 is 75%, and 75% of 19 rounds to 15 — which is also condor's own top tier, the score at which it already sized largest. The DSL ladder is penguin's; both packages run 10x, so each ROE trigger is the same price move in both and the ladder transfers without rescaling. Condor's detector, universe, clock, score components, guard rails and time cuts are unchanged. The frequency of a score of 15 or better has not been measured; if it is too low to keep one slot occupied, the next step down is 13."
  group: momentum
  archetype: breakout_momentum
  sub_style: trend_continuation
  asset_classes: [universe_crypto]
  asset_scope: universe
  direction: long_short
  risk_level: aggressive
  status: blocked           # experiment — deliberately kept out of the catalog and discover
  tier: advanced
  leverage_max: 10
  max_slots: 1
  assets: []
  tags: [momentum, trend-continuation, universe, leader-momentum, apex-sniper, one-trade-per-day, conviction-sizing, experiment, not-for-users, dsl-only]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: WILD_CONDOR_WALLET
    funding_share: 1.0
