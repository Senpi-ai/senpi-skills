# Gorilla — strategy package deploy manifest (single source of truth for deploy + attribution).
# The SELF-DIRECTED thesis hedge fund: where thesis-fund asks the user to bring a macro view,
# Gorilla DERIVES its own at deploy — the first scan after install forms a standing thesis
# (universe DERIVED from the live instrument list; STANCE from the market-pulse day
# classification — cross-asset groups + GOLD/DXY/VIX checklist, engine math ported verbatim;
# BUCKETS from the smart-money engine's proven-vs-crowd cohort divergence, 24h-change RS as the
# flagged fallback; a narrative on every signal) and
# builds long + short baskets on two wallets from that first read. It then holds with patience:
# the thesis is RE-EVALUATED every 48h (names that leave a bucket are closed — thesis_shift)
# and the book is REBALANCED every 7d (holdings re-scoring below exitScore are recycled —
# weekly_rebalance), both via the CLOSE_POSITION action (cuttlefish pattern, second use in the
# fleet). Nothing re-decides between boundaries; the DSL owns all price exits.
# Install/teardown via senpi-strategy-ops (deploy.py / close.py).
schema_version: 1

id: gorilla
version: "1.0.0"

catalog:
  name: "Gorilla — Self-Directed Thesis Hedge Fund"
  emoji: "🦍"
  tagline: "Forms its own market thesis the moment you deploy it — a cross-asset pulse (crypto, semis, megacap tech, indices, gold, the dollar, VIX) sets the stance, and smart-money divergence picks the names: what the lifetime-proven wallets hold that the crowd hasn't followed goes long, what they're shorting goes short, on two wallets — then it trades that view with silverback patience: rethinks every 48 hours, rebalances every 7 days, protected stops in between."
  belief_plain: "It reads the whole market like a strategist: stocks, indices, gold, the dollar and fear gauges say whether it's a risk-on or risk-off world, and the wallets with the best lifetime track records say which coins to trust — especially where they disagree with the crowd. It buys what the proven money holds early, shorts what the proven money is against, then mostly sits on its hands: every two days it re-checks its view and closes what no longer fits; once a week it prunes stragglers. Ratchet stops protect every position in between."
  thesis: "Most adaptive strategies over-trade the noise; most patient strategies never update at all. Gorilla does both on purpose, with the real machinery of the composed skills: the market-pulse day classification (cross-asset groups + the GOLD/DXY/VIX checklist) sets the stance, and the smart-money engine's proven-vs-crowd cohort divergence (lifetime realized >= $1M vs $10k-100k, net-positioning bias per coin) picks the names — updated on a deliberate clock: 48-hour rethinks, weekly rebalances, protective stops between. No view required from you; the fund derives its own and says it in plain English on every signal."
  group: multi-asset-whitelist
  archetype: macro_thesis
  sub_style: adaptive
  asset_classes: [universe_crypto]
  asset_scope: universe
  direction: long_short
  risk_level: moderate
  tier: advanced
  time_horizon: position
  leverage_max: 6
  max_slots: 10             # 5 per book, stance-capped in practice (5/2, 3/3, 2/5)
  min_budget: 200           # two wallets, $100 floor each
  assets: []               # DERIVED live each thesis refresh (volume floor + top-N)
  tags: [thesis, hedge-fund, self-directed, regime, long-short, universe, rebalance, low-turnover, close-position]

requires:
  runtime: ">=3.0.0"        # CLOSE_POSITION action + v2 supervised external scanners

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: long
    runtime: long/runtime.yaml         # → runtime name gorilla-long, group gorilla
    wallet_env: GORILLA_LONG_WALLET
    funding_share: 0.5
  - name: short
    runtime: short/runtime.yaml        # → runtime name gorilla-short, group gorilla
    wallet_env: GORILLA_SHORT_WALLET
    funding_share: 0.5
