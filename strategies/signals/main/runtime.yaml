# ── SIGNALS · single instance — the senpi-signals sweep host. TRADES NOTHING. ─────────
# The external scanner runs senpi-signals/scripts/sweep.py through ctx.senpi_mcp every 45
# minutes and ALWAYS returns [] — no signal is ever emitted, so the OPEN_POSITION action
# below never fires and `slots: 0` leaves nothing to fill even if it did. The sizing, exit
# and risk blocks exist because the runtime and the author lint require them of every
# package; they are inert here. What this buys: the sweep on the runtime's clock at zero
# model cost, with the durable state ring under $SENPI_STATE_DIR/signals/.
name: signals-main
group: signals
version: 1.0.0
description: >
  SIGNALS — the senpi-signals market sweep on the runtime's clock. Not a trading strategy:
  every 45 minutes the scanner reads the whole Hyperliquid universe (market_list_instruments),
  the proven cohort's books (discovery_get_top_traders + discovery_get_trader_state), the 4h
  board (leaderboard_get_markets), momentum events and cross-asset flows, writes
  $SENPI_STATE_DIR/signals/current.json + signals.md, advances the snapshot ring score.py diffs
  against, and returns an EMPTY signal list. It opens no positions, ever (slots 0); the $10
  wallet is the runtime's formality. The content automation reads signals.md; it never gathers.

strategy:
  wallet: "${SIGNALS_WALLET}"
  slots: 0                            # nothing to fill — the scanner never emits
  margin_pct: 100                     # inert (no signal ever sizes); keeps the computed minimum at the $10 floor
  default_leverage: 2                 # inert, same reason
  trading_risk: conservative
  enabled: true

scanners:
  - name: position_tracker            # required alongside the (inert) DSL block below
    type: position_tracker
    interval_seconds: 10
  - name: signals_sweep
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 2700            # 45 min — matches score.py's FRESH_WINDOW_MIN so the social feed rotates
    timeout_seconds: 1500             # ~8 reads; the cohort fan-out is the slow one. Must stay < interval
    default_signal_validity_seconds: 60
    state_history_max_count: 50
    inputs:
      consumer: social                # score.py freshness namespace for the content feed
      universeTopN: 120               # top-N instruments by day notional volume
    signal_data_schema:               # never used — the scanner returns []; the schema must be non-empty
      note: { type: string }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: signals_never_fires         # lists the scanner so the runtime wires it; it never receives a signal
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [signals_sweep]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: signals_sweep

# ── EXIT (inert — there is never a position; the runtime requires the block) ──────────
exit:
  engine: dsl
  interval_seconds: 300
  dsl_preset:
    hard_timeout:
      enabled: false
    weak_peak_cut:
      enabled: false
    phase1:
      enabled: false
      max_loss_pct: 5.0
      retrace_threshold: 5
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10, lock_hw_pct: 50 }

# ── RISK guard rails (belt over the empty signal list) ────────────────────────────────
risk:
  data_retention_seconds: 86400
  guard_rails:
    daily_loss_limit_pct: 1
    max_entries_per_day: 2
    max_consecutive_losses: 1
    cooldown_seconds: 86400
    drawdown_halt_pct: 1
    per_asset_cooldown_seconds: 86400

notifications:
  dsl_lifecycle: false
  dsl_notify_sl_updates: false
