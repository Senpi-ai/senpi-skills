# ── SHADOW · multi-trader fresh-entry mirror (single wallet) ──
name: shadow-main
group: shadow
version: 3.0.0
description: >
  SHADOW — mirrors ONLY the freshly-opened positions of a small cohort of vetted
  Hyperliquid traders (explicit traderAddresses, else auto-selected top-N by all-time
  realized PnL). Diffs each trader's live book against a seeded snapshot so an existing
  book is NEVER inherited; rejects any entry whose price has already run past the slippage
  cap; sizes budget-relative with a min-notional floor. Manages its own DSL exit — it
  follows opens, not the trader's close. ~1 tick warmup per trader (first sight seeds the book).

strategy:
  wallet: "${SHADOW_WALLET}"
  slots: 5
  default_leverage: 5
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: shadow_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 120                   # tight enough to catch fresh opens near the trader's fill
    timeout_seconds: 90
    default_signal_validity_seconds: 600
    state_history_max_count: 12             # seeded per-trader book + cohort cache + dedup
    inputs:
      traderAddresses: []                   # name your traders here; empty -> auto-select vetted top-N
      # ── WHO WE WATCH — proven AND still at the desk (rewritten 2026-10-09) ──────────
      # Measured that day: the top five by ALL-TIME realized PnL had last traded 45.8, 50.1,
      # 7.4, 190.7 and 47.4 days ago, four of five unscored for activity. Mirroring opens
      # younger than 240s from that list fires never. The same call over the WEEKLY window
      # returned five traders last active 22h, 47m, 17h, 1.7h and 28m ago, all scored.
      cohortTimeFrame: WEEKLY               # DAILY | WEEKLY | MONTHLY | ALL_TIME
      autoSelectMinRealizedUsd: 100000      # +$100k THIS WEEK. A lifetime ranking is a hall of
                                            # fame: its top two had last traded 46 and 50 days
                                            # ago. A weekly one is who is at the desk now.
      maxLastTradeAgeHours: 48              # must have ACTUALLY traded; no timestamp = dormant
      # Market makers, cut from fields already in the trader row — no second service to depend on.
      # The live weekly cohort carried traders at 736, 515 and 488 trades/day (and the all-time
      # list one at 2,655). We could never mirror a quote machine inside the slippage cap.
      # Measured over 200 live rows: a flat 200/day cut removed six real discretionary traders
      # (one at 736/day holding 32h, $1.13M realized) and still let through a scalper at 178/day
      # with a ZERO-second hold. Hold time is the discriminator; frequency is only a backstop.
      minTraderHoldSeconds: 600             # a KNOWN hold under 10 min disqualifies at any rate
      maxTradesPerDayUnknownHold: 200       # no hold reported? then frequency has to carry it
      maxTraderTradesPerDay: 1000           # extreme backstop, regardless of hold
      screenMarketMakers: true              # screen the cohort against Senpi's market-maker
                                            # blacklist (GetDiscoveryBlacklist) once per
                                            # cohort refresh. Fails OPEN and the tick line
                                            # then reads UNSCREENED — never silently clean.
      excludeTraderAddresses: []            # pin extra wallets out by hand; the
                                            # heuristic cuts below still apply when the
                                            # blacklist itself is unreachable
      # A weekly ranking selects hot hands — that live sample ran three DEGEN labels, all
      # AGGRESSIVE, drawdowns to -78%. These floors are what make that tolerable.
      minTraderWinRatePct: 50
      minTraderGainToPain: 1.5
      minCohortSize: 4                      # a mirror watching 1-2 traders is silent by
                                            # construction, and silence reads as breakage
      cohortMaxAgeHours: 72                 # refuse to OPEN on a cohort resolved days ago
      autoSelectPool: 200                   # DEEP ENOUGH TO HAVE A COHORT. The old 50 with
                                            # maxWatched 3 took the three biggest winners and
                                            # nothing else; the cohort is the ranks below them,
                                            # and the filters below remove most of a page.
      cohortRefreshHours: 24
      maxWatched: 10                        # was 3 — a cohort of three cannot confirm anything
      minConfirm: 1                         # 1 = mirror any watched trader's fresh open; 2 = require confirmation
      maxEntrySlippagePct: 1.5             # skip when price is more than 1.5% from their entry, EITHER way
      maxEntryAgeSeconds: 240               # 2 ticks: mirror an open the trader just made, not one hours old
      marginPct: 15                         # PERCENT of withdrawable (0,100]
      minMarginPct: 8                       # min-notional floor — never 'too small to enter'
      maxMarginPct: 18                      # 5 slots x 18% = 90% of the sleeve at full
                                            # commitment. Was 30, i.e. 150% committable across
                                            # five slots. This is puffin's maxTotalMarginPct
                                            # discipline expressed in the input this scanner
                                            # actually READS — an unread cap is a dead cap.
      convictionStepPct: 0.5                # +50% of base per extra confirming trader
      stdLeverage: 5
      maxLeverage: 10                       # caps a trader's 40x book to something survivable
      recentSignalTtlSeconds: 3600
    signal_data_schema:
      score: { type: number }
      direction: { type: string }
      signalKind: { type: string, required: false }
      confirmCount: { type: number, required: false }
      entrySlippagePct: { type: number, required: false }
      traderEntry: { type: number, required: false }
      traders: { type: array, required: false }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: shadow_entry
    action_type: OPEN_POSITION
    decision_mode: rule                     # the scan already applied every filter
    scanners: [shadow_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true     # a fresh mirror must fill near the trader's price
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: shadow_signals

# EXIT — Shadow follows opens, not the trader's close, so it runs its OWN exit: a moderate
# disaster stop, a ratchet that locks gains as they build, and a hard cap so a mirrored
# position never bag-holds after the trader has likely moved on.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    # DISABLED 2026-10-09. Standing preference: the ladder and the floor decide every exit,
    # at any horizon — of 142 hard_timeout closes in one 7-day sample, 110 were in PROFIT.
    # A clock reads nothing about the trade, and on a mirror it closes a position the trader
    # being mirrored is still holding, which is the one thing this strategy exists not to do.
    hard_timeout: { enabled: false, interval_in_minutes: 2880 }
    # Declared explicitly rather than omitted. 111 of the 128 packages that declare hard_timeout
    # also declare this one; shadow was among the 17 that left it out, so whether a clock was
    # running here depended on a runtime-side default this repo cannot see. "Off by omission" is
    # not a property you can read, and on a mirror a dead-weight cut closes a position the trader
    # being mirrored is still holding.
    dead_weight_cut: { enabled: false }
    # DISABLED - this cut closes at MARKET at whatever price is there, with no floor, so on a
    # longer-hold book it realises a small LOSS on a position that simply hadn't moved yet
    # (observed live on xyz:PLTR in cougar). Same defect we removed from phase1. weak_peak is
    # a CHOP tool only: it belongs where the strategy already intends to be out within hours.
    weak_peak_cut: { enabled: false, interval_in_minutes: 720, min_value: 2.0 }
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss — churning fees.
      # The ratchet must only ever lock a GAIN, or the position rides to the stop.
      # max_loss_pct := the old retrace (8.0% ROE), which is what the trail was already
      # enforcing, so the per-trade risk cap is UNCHANGED. retrace_threshold is now inert.
      enabled: false
      max_loss_pct: 8.0   # was 20.0 — set to the old retrace so the risk cap is unchanged
      retrace_threshold: 8
      consecutive_breaches_required: 2
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8,  lock_hw_pct: 30 }    #  1.6% of price at 5x — arms early
        - { trigger_pct: 18, lock_hw_pct: 50 }    #  3.6%
        - { trigger_pct: 30, lock_hw_pct: 60 }    #  6.0% — ADDED: the 18 -> 40 gap left a
        - { trigger_pct: 40, lock_hw_pct: 68 }    #  8.0%   fifth of the peak unlocked
        - { trigger_pct: 60, lock_hw_pct: 75 }    # 12.0% — ADDED
        - { trigger_pct: 90, lock_hw_pct: 82 }    # 18.0%

risk:
  guard_rails:
    daily_loss_limit_pct: 12
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
    max_consecutive_losses: 4
    cooldown_seconds: 1800
    per_asset_cooldown_seconds: 10800
    max_entries_per_day: 8
    bypass_max_entries_per_day_on_profit: false
