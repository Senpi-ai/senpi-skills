# ── ATHENA · aegis leg — the hedge sleeve ───────────────────────────────────
# Aegis, verbatim: regime-adaptive dynamic hedge (funding regime, gold/yen
# haven flows, OI velocity, trend structure; cash in neutral; tighter DSL).
# Only the identity lines differ from strategies/aegis (name, group, wallet,
# the description's first line); tests/test_legs_verbatim.py pins that.
# The sleeve weighting lives in ../strategy.yaml (funding_share).
name: athena-concentrated-aegis
group: athena-concentrated
version: 3.0.0
description: >
  ATHENA · Aegis leg (the hedge sleeve) — regime-adaptive dynamic hedge. Reads market structure (market-wide
  funding crowding, haven-asset trends in gold and the yen, per-asset OI
  velocity and trend) to compute a graduated regime score from -2.0 (severe
  risk-off) to +2.0 (strong risk-on). In risk-off: shorts risk assets
  (BTC/ETH/SOL/HYPE/SP500/XYZ100), buys the yen (short USD/JPY) and longs
  defensives (GOLD/BRENTOIL/NATGAS). In risk-on: the mirror. In neutral
  (|score| < 0.5): opens nothing new and leaves the DSL to manage whatever is
  already on. 3x leverage with 10% margin stops and early profit locks (first
  at +12% ROE), because regime calls reverse. Built as
  Phalanx's companion: Aegis reads the tape, Phalanx reads the crowd.

strategy:
  wallet: "${ATHENA_AEGIS_WALLET}"
  slots: 2
  # 20% PER POSITION — flat. Jason, 2026-10-07 and again 2026-10-09: "The current strategy
  # is using only about 20% of margin. It should use 20% per position."
  #
  # The first attempt set marginPctBase: 20 and did NOT deliver that, which is why the same
  # instruction came back. `scoring.margin_pct_for` scales the base by a REGIME-INTENSITY
  # factor, ri = clamp(|regime_score| / 2.0, 0.25, 1.0), then by conviction (x1.0/1.25/1.5).
  # Base 20 sized a position at 20% only with the regime pinned at its extreme (|2.0|); in a
  # mild regime ri floors at 0.25 and a position took 20 x 0.25 = 5%. Four slots x 5% = 20%
  # of the sleeve — exactly the under-deployment that was reported.
  #
  # The scanners are byte-identical to standalone aegis and pinned that way, so this is solved
  # in CONFIG: base 80 x 1.00 x 0.25 (mildest regime, lowest conviction) = 20.0% is the floor,
  # and every stronger regime or conviction clamps to marginPctMax 20. Every position is 20.0%
  # in every regime, not only in a crisis.
  #
  # What that deploys, measured live 2026-10-09 on a relaunch at regime -0.60: marginPct is a
  # percent of WITHDRAWABLE AT OPEN, and the runtime opens sequentially, so each position takes
  # a fifth of what is left rather than a fifth of the original sleeve. Observed 104.13 / 83.87
  # / 66.97 against a 523.80 start — 19.9%, 20.0%, 19.9% of the balance available each time.
  # So N positions deploy 1 - 0.8^N: 20% / 36% / 48.8% / 59.0%. NOT 4 x 20% = 80%, which is
  # what an earlier version of this comment claimed. 20% PER POSITION is the instruction and is
  # delivered exactly; 80% of the sleeve would need ~33% per position.
  # tests/test_aegis_sizes_flat.py asserts that over the full conviction x regime range, because
  # the floor depends on the 0.25 clamp in the shared scorer. Only the aegis leg of THIS package
  # changes — standalone aegis and athena are untouched.
  margin_pct: 35
  default_leverage: 5
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: aegis_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300
    timeout_seconds: 180
    default_signal_validity_seconds: 600
    state_history_max_count: 200
    inputs:
      marginPctBase: 100
      marginPctMax: 45
      leverageDefault: 5
      maxSlots: 2
      minScore: 25
      recentSignalTtlSeconds: 300
      neutralThreshold: 0.5
    signal_data_schema:
      score: { type: number }
      direction: { type: string }
      regimeScore: { type: number, required: false }
      regimeLabel: { type: string, required: false }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: aegis_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [aegis_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: aegis_main_signals

# ── EXIT (DSL — tighter than Phalanx, banks regime gains before reversal) ────
# Hard stop at 10% margin loss (3.33% price on 3x) — tighter than Phalanx's
# 15% because a hedge that gives back gains defeats its purpose. First profit
# lock at +12% ROE (4.0% price on 3x) — banks early since regime calls can
# reverse violently (a ceasefire dumps oil/gold, a headline flips risk-on).
# Weak-peak cut at 8h: only fires if peak ROE never cleared +4% AND price is
# fading — a dead-position detector for hedge positions that aren't working.
# No hard_timeout: it counts from entry and fires in either phase, so any fixed
# deadline closes a ratchet-armed winner mid-run. The weak-peak cut retires
# positions that never developed; the ladder manages the ones that did.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: false
    weak_peak_cut:
      # OFF since 1.3.0. The 8h cut closed 61 hedges, 16 of them re-entered on the same asset within
      # 30 minutes despite the 2h per-asset cooldown, and Aegis's fees ran past its gross profit. A
      # hedge that is still the right hedge is not a dead position. Phalanx dropped its time cuts for
      # the same reason (#609). The lines below are inert while enabled is false.
      enabled: false
      interval_in_minutes: 480
      min_value: 4.0
    phase1:
      enabled: false                  # trailing OFF — a floor below entry can ratchet a winner into a loss
      max_loss_pct: 16.7              # 3.33% of price at 5x — the measured adverse p90 (3.41%)
      retrace_threshold: 16.7         # INERT while phase1.enabled is false
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                          # banks early — regime calls reverse fast
        - { trigger_pct: 10, lock_hw_pct: 35 }   #  2.00% of price at 5x — arms on 41% of trades
        - { trigger_pct: 20, lock_hw_pct: 45 }   #  4.00% of price — arms on 29%
        - { trigger_pct: 40, lock_hw_pct: 60 }   #  8.00% of price
        - { trigger_pct: 83.3, lock_hw_pct: 85 } # 16.67% of price — above the 9.84% max peak

# ── RISK guard rails ──────────────────────────────────────────────────────────
risk:
  data_retention_seconds: 259200      # 72h
  guard_rails:
    # NO daily_loss_limit_pct. A DAILY halt is a day-trading construct and this is a
    # conviction hold: its premise is staying positioned while the cohort is, including
    # through a day that goes against it. Every gate in this block halts ENTRIES and none
    # of them closes a position, so what the 5% limit actually did was stop the strategy
    # ADDING once it was underwater — the cohort still short, the book down, and the gate
    # CLOSED until UTC midnight. That is the failure that forced a manual close-and-
    # redeploy to clear it. The overall budget is drawdown_halt_pct below.
    max_entries_per_day: 8
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 14400            # 4h regime pause after 3 consecutive losses
    drawdown_halt_pct: 25                   # THE overall risk budget: 25% of PnL from peak,
                                            # carried across days (reset flag below is false).
                                            # At this sizing that is a ~7% adverse market move
                                            # before the strategy stops ADDING — it never
                                            # flattens the book; open positions run to their
                                            # own DSL stop.
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 7200   # 2h per-asset re-entry cooldown

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
