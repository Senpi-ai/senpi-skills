# Athena Concentrated — athena with the phalanx arm at 2 slots x 22.5% instead of 3 x 15%.
#
# Same 45% of the phalanx sleeve at risk, carried by two larger bets. Total exposure is held
# CONSTANT on purpose: if size moved with count, a result could not be attributed to
# concentration. The aegis arm and the 65/35 split are untouched.
# Listed in the catalog and in discover. Compare it against the parent it varies, not on its
# own P&L — see senpi-strategy-discover/references/variant-families.md.
schema_version: 1
id: athena-concentrated
version: "2.0.0"
catalog:
  varies: athena          # a VARIANT of this template — never outrank it
  name: Athena Concentrated — two large phalanx bets
  emoji: 🏛️
  tagline: Athena with the phalanx arm concentrated into two larger positions instead of three smaller ones — the same capital at risk, carried by fewer, bigger bets. The aegis hedge and the 65/35 split are unchanged.
  belief_plain: 'This is Athena with one change on its attacking side. Athena runs two arms: phalanx, which follows what proven smart-money traders are buying, and aegis, which hedges. Normally phalanx spreads its share across three positions. This version holds two instead, each half again as large, with exactly the same total amount of money at work. The hedge is untouched. The question is whether the phalanx signal is strong enough that backing fewer names harder beats spreading across more — concentration pays when the top signal is genuinely better than the third, and costs when it is not.'
  thesis: 'Two inputs differ from athena, both on the phalanx arm: slots 3 -> 2 and margin_pct / marginPctBase 15 -> 22.5. Total phalanx exposure is unchanged at 45% of the sleeve — that is the point, because moving size and count together would make any difference unattributable. The aegis arm, the 65/35 funding split, both detectors, the exits and the hedge logic are athena''s, verbatim. Concentration pays only if phalanx''s ranking is informative — if its 1st and 2nd picks genuinely beat its 3rd. If the ranking is noise, this arm just raises variance for nothing, and that is exactly what running it against athena over the same window measures.'
  group: smart-money
  archetype: copy_trading
  sub_style: sm_hedge_fund
  asset_classes:
    - universe_crypto
    - btc_eth
    - major_alts
    - xyz_equities
    - commodities
    - indices
    - fx
  asset_scope: follows_traders
  direction: long_short
  risk_level: moderate
  tier: advanced
  time_horizon: swing
  leverage_max: 5
  max_slots: 6
  assets: []
  tags:
    - aegis
    - alpha-plus-hedge
    - concentration
    - cross-asset
    - dynamic-hedge
    - experiment
    - hedge-fund
    - long-short
    - phalanx
    - proven-cohort
    - regime-hedge
    - rotation
    - smart-money
    - smart-money-hedge-fund
requires:
  runtime: '>=3.0.0'
defaults:
  auth_token_env: SENPI_AUTH_TOKEN
instances:
  - name: phalanx
    runtime: phalanx/runtime.yaml
    wallet_env: ATHENA_PHALANX_WALLET
    funding_share: 0.65
  - name: aegis
    runtime: aegis/runtime.yaml
    wallet_env: ATHENA_AEGIS_WALLET
    funding_share: 0.35
