# Gannet Crypto — Gannet's daily dip cascade on the crypto majors. A single-instance PACKAGE: this
# manifest + one self-contained runtime.yaml + scanners/ byte-identical to strategies/gannet
# (tests/test_engine_parity.py pins them). BTC, then ETH, then SOL, then HYPE; the first whose 10-day
# RSI closed under 30 at the UTC-midnight daily close is bought at 1x. One position, long only,
# DSL-only exits with a wider stop and ladder than Gannet's. Install/teardown via senpi-strategy-ops.
schema_version: 1

id: gannet-crypto
version: "1.0.0"

catalog:
  name: "Gannet Crypto — Crypto Dip Cascade"
  emoji: "🐦"
  varies: gannet
  tagline: "Gannet's dip cascade on the crypto majors: at each daily close it checks BTC, then ETH, then SOL, then HYPE, and buys the first whose 10-day RSI closed under 30, at 1x. One position at a time, flat in USDC between signals, a 30% stop and a wide trailing ladder that only moves in your favour."
  belief_plain: "When a major coin has fallen unusually hard over two weeks it tends to rebound, but slowly and unevenly. Once a day, after the daily close, it checks Bitcoin first, then Ether, Solana and Hype, and buys the first one that is washed out, without leverage. It holds one coin at a time and sits in cash between signals, so it trades only a few times a year. Positions can stay open for weeks: the stop is wide, and the ratchet starts locking the gain only after a 15% rise."
  thesis: "You want to buy crypto crashes by rule, with no leverage and nothing else running in between: only after a real two-week washout, only in the biggest coins, one at a time. It is slow and idle most of the year, and its past record is thinner than the stock-index version's, so it suits a small allocation you are happy to leave alone."
  group: multi-asset-whitelist
  archetype: contrarian_fade
  sub_style: mean_reversion
  asset_classes: [btc_eth, major_alts]
  asset_scope: basket
  direction: long_only
  risk_level: moderate
  tier: advanced
  time_horizon: swing
  leverage_max: 1
  max_slots: 1
  assets: ["BTC", "ETH", "SOL", "HYPE"]
  tags: [dip-buy, buy-the-dip, oversold, rsi, mean-reversion, crash, washout, capitulation, rebound,
         cascade, btc, eth, sol, hype, crypto, majors, no-leverage, 1x, long-only, one-position,
         cash-between-signals, daily-close, slow, low-turnover, dsl-only]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: GANNET_CRYPTO_WALLET
    funding_share: 1.0
