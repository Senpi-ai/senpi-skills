# ── THESIS FUND · single instance — macro-view long/short basket (Runtime 3.0 port of v2 Thesis Fund v1.0.0) ──
name: thesis-fund-main
group: thesis-fund
version: 3.0.0
description: >
  THESIS FUND — one wallet expresses a chosen macro VIEW as a long/short basket, but
  PRESSES a name only when the market is CONFIRMING the thesis direction for that name
  (4h structure aligned, 1h confirmation, 24h momentum aligned, RSI room). A long-basket
  name in a confirmed downtrend is skipped; a short-basket name in a confirmed uptrend
  is skipped — the fund waits for the view to start working rather than fighting the tape.
  Strict 5x clamp (then each asset's HL venue max). Balanced let-it-work DSL with stall
  recycling; the drawdown gate halts the whole fund if the thesis is broadly failing.
  Faithful port of the v2 producer scoring (score_thesis). The active preset's baskets
  live in inputs.longBasket / inputs.shortBasket — default = risk_off. Swap them to
  express a different view (see presets.md).

strategy:
  wallet: "${THESIS_WALLET}"
  slots: 6                                # the basket (up to ~6 names across both legs)
  default_leverage: 5                     # fallback; scan emits flat 5x per signal (venue-clamped)
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: thesis_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300                  # v2 producer cadence (tickSeconds 300 = 5 min)
    timeout_seconds: 180                   # basket of up to ~6 names, 2 candle reads each + universe meta
    default_signal_validity_seconds: 1800
    state_history_max_count: 100           # dedup map + per-tick scan-results history
    inputs:
      # ── ACTIVE PRESET = risk_off (the v2 default THESIS). Each entry is
      #    {asset, direction}; direction is FIXED by the preset (the thesis's
      #    directional bias for that name). Swap these two lists to express a
      #    different view — see presets.md for every preset. ──
      thesis: "risk_off"
      longBasket: ["xyz:GOLD", "xyz:SILVER"]
      shortBasket: ["xyz:SP500", "xyz:XYZ100", "BTC"]
      minScore: 4
      marginPct: 12                        # PERCENT of withdrawable (0,100] — runtime sizes (marginPct/100)*withdrawable. v2 marginPct 0.12 fraction -> 12 percent.
      maxLeverage: 5                        # strict 5x clamp, then each asset's HL venue max
      maxSlots: 6
      minNotionalPctOfEquity: 0.01          # scales the per-name notional floor with budget
      venueMinNotionalUsd: 10               # ~$10 HL minimum order value (floor)
      momThresholdPct: 1.0
      rsiOverbought: 78
      rsiOversold: 22
      recentSignalTtlSeconds: 180           # 3x typical ALO fill window — race-dedup (v2 RECENT_SIGNAL_TTL_SEC)
    signal_data_schema:
      score: { type: number }
      leverage: { type: number }
      direction: { type: string }
      thesis: { type: string, required: false }
      trend4h: { type: string, required: false }
      own24h: { type: number, required: false }
      rsi: { type: number, required: false }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: thesis_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied every confirmation filter + clamp
    scanners: [thesis_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: thesis_main_signals

# ── EXIT (DSL — balanced let-the-thesis-work, cut when it doesn't) — ported VERBATIM from v2 ──
# A thesis name rides the view while it confirms; if it stalls or reverses it is recycled
# (stall-cuts ON), and the drawdown gate halts the whole fund if the thesis is broadly
# failing. 5d hard_timeout — macro theses play out over days/weeks but a position shouldn't
# linger forever. First phase2 lock tier triggers at +10% (reachable), not +60-80%.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 7200           # 5d
    weak_peak_cut:
      # DISABLED - this cut closes at MARKET at whatever price is there, with no floor, so on a
      # longer-hold book it realises a small LOSS on a position that simply hadn't moved yet
      # (Ignas, M408027, xyz:PLTR on cougar). Same defect we removed from phase1. weak_peak is
      # a CHOP tool only: it belongs where the strategy already intends to be out within hours.
      enabled: false
      interval_in_minutes: 480            # 8h — recycle a name that stops confirming
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 960            # 16h
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a favourable move it
      # could sit BELOW entry and close a winner at a loss. max_loss_pct is set to the old
      # retrace (9% ROE) so the per-trade risk cap is UNCHANGED — only the ratchet-into-
      # a-loss behaviour is removed. retrace_threshold below is inert while enabled: false.
      enabled: false
      max_loss_pct: 9
      retrace_threshold: 9
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 22, lock_hw_pct: 45 }
        - { trigger_pct: 40, lock_hw_pct: 65 }
        - { trigger_pct: 70, lock_hw_pct: 80 }
        - { trigger_pct: 120, lock_hw_pct: 90 }

# ── RISK (per instance) — ported from v2 risk.guard_rails ──
risk:
  data_retention_seconds: 604800       # 168h (was data_retention_hours: 168)
  guard_rails:
    daily_loss_limit_pct: 12
    max_entries_per_day: 8
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 5
    cooldown_seconds: 3600                 # v2 cooldown_minutes 60
    drawdown_halt_pct: 20                  # halts the whole fund if the thesis is broadly failing
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_seconds: 10800      # v2 per_asset_cooldown_minutes 180
