# ── STARLING · Smart-Money Rotation Follower ─────────────────────────────────
# Follows a cohort of proven-profitable Hyperliquid wallets and opens WITH them
# only when SEVERAL are FRESHLY piling into the same name in the same direction at
# the same time (consensus forming = a rotation) — not a name that has stood at
# consensus for a while. It reads the cohort's live books every 10 minutes, diffs
# this snapshot against the last, and sizes each entry by how many wallets agree.
# NEVER closes — a rotation change only changes what it opens next; prior positions
# retire on their own DSL trailing stops (rotate-by-attrition, exactly like gibbon).
name: starling-main
group: starling
version: 1.0.0
description: >
  STARLING — Smart-Money Rotation Follower. Tracks a cohort of the most
  profitable Hyperliquid wallets (all-time realized) and opens with them the
  moment several are FRESHLY buying/shorting the same name together — the
  snapshot-to-snapshot diff catches consensus FORMING, not a stale standing
  crowd. Conviction/size scales with how many wallets agree (base/good/apex).
  Opens only on the cohort's DOMINANT side while its net margin widens. One wallet,
  up to 6 positions, leverage clamped to venue max. DSL is the ONLY exit: a FIXED 15% max-loss
  floor plus a gains-only profit ratchet (no trailing stop, no breakeven exits), 48h weak-peak.

strategy:
  wallet: "${STARLING_WALLET}"
  slots: 6
  margin_pct: 10
  default_leverage: 3
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10

  - name: starling_scanner
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 600             # wake every 10m — consensus forms over minutes/hours
    timeout_seconds: 300
    default_signal_validity_seconds: 3600
    state_history_max_count: 200
    inputs:
      # ── cohort derivation (SLOW clock) ──
      cohortRefreshHours: 12          # re-derive the smart cohort twice a day
      smartMinRealizedUsd: 1000000    # proven = >= $1M all-time realized PnL
      cohortCap: 120                  # cap the cohort size
      pageSize: 1000
      maxPages: 6
      stateBatch: 50                  # discovery_get_trader_state addresses per call
      # ── consensus bands (of a cohort capped at 120) ──
      # Picks are taken ONLY on the cohort's dominant side, and only while its NET margin
      # over the other side is widening — see scoring.fresh_picks.
      minConsensus: 6                 # >= this many wallets on the DOMINANT side to open (3 was 2.5% of
                                      # the cohort — inside the noise floor, which is how a 13-vs-29
                                      # minority long kept firing while the cohort was net short)
      minMargin: 4                    # dominant must lead the other side by >= this many wallets
      goodConsensus: 10               # bands rescaled with the floor — at the old 4/6 every pick would
      apexConsensus: 15               # have banded apex (5x, 14% margin) the moment minConsensus hit 6
      # ── slots + sizing ──
      maxSlots: 6
      recentSignalTtlSeconds: 21600   # 6h per-name signal debounce
      leverageTiers: { apex: 5, good: 4, base: 3 }
      marginPctTiers: { apex: 14, good: 10, base: 7 }
      maxLeverage: 5
      maxMarginPct: 25
    signal_data_schema:
      consensusCount: { type: number }
      band: { type: string, required: false }
      direction: { type: string }
      reasons: { type: array, required: false }
      leverage: { type: number }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: starling_open
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [starling_scanner]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: starling_scanner
  # NO CLOSE_POSITION action — DSL is the only exit (rotate-by-attrition).

# EXIT — DSL only. Granular breakeven-first ladder (raven's): locks early and ramps
# smoothly so a modest winner isn't given all the way back. A follower holds longer
# than a momentum book, so the weak-peak cut is 48h (not 24h).
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    weak_peak_cut:
      # THE stall-cutter, and the only time-based exit. The 48h clock RESETS whenever ROE >= min_value
      # (runtime: weakPeakCutStartedAt "resets when currentROE >= minValue"), so min_value is the bar a
      # follow must clear to prove it is still working. At 2.5 (= 0.5% of price at 5x) any wiggle reset
      # the clock and this fired ONCE in 179 closes. At 10 (= 2% of price at 5x) a position that never
      # gets 2% our way in two days is correctly declared dead and frees its slot.
      # DISABLED - this cut closes at MARKET at whatever price is there, with no floor, so on a
      # longer-hold book it realises a small LOSS on a position that simply hadn't moved yet
      # (Ignas, M408027, xyz:PLTR on cougar). Same defect we removed from phase1. weak_peak is
      # a CHOP tool only: it belongs where the strategy already intends to be out within hours.
      enabled: false
      interval_in_minutes: 2880        # 48h
      min_value: 10
    phase1:
      # TRAILING DISABLED — this is the fix for "the ratchet locked a LOSS".
      # The phase-1 trail is measured from HIGH-WATER, so once a position moved our way it
      # followed the move down and could cut BELOW entry. Live example: a ZEC short reached
      # +8.5% ROE (813.18 -> ~799.33), bounced 2.8% off its low, and the trail closed it at
      # -5.9%. That is not a ratchet; a ratchet only moves one way and only locks gains.
      # With enabled:false the ONLY floor beneath entry is the FIXED max-loss, and gains are
      # protected exclusively by the phase-2 tiers — which can never lock a negative.
      # (runtime: phase1BaseFloor() returns absoluteFloor verbatim when enabled === false.)
      enabled: false
      max_loss_pct: 15.0            # the real risk budget: 15% ROE = 3.0% of PRICE at 5x, fixed from ENTRY
      retrace_threshold: 14         # INERT while enabled:false (parser forces it to 1) — kept for schema + easy revert
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        # EVERY rung locks a POSITIVE ROE — never breakeven. A 0% lock exits flat and still pays
        # fees, which is a loss dressed as a scratch. Below the first rung the position simply
        # rides on the fixed max-loss floor; we only start protecting once there is a real gain.
        # The first rung does not engage until +25% ROE (= 5% of PRICE at 5x) and then locks +10%.
        # Anything earlier just re-creates the churn: a floor at +3% ROE is ~$8 on a $260 margin
        # against ~$2 of fees — a scratch, not a win. Below +25% the position rides on the fixed
        # max-loss and, if it stalls, weak_peak retires it at 48h.
        - { trigger_pct: 25,  lock_hw_pct: 40 }   # peak +25% ROE -> floor +10.0%
        - { trigger_pct: 40,  lock_hw_pct: 55 }   # -> +22.0%
        - { trigger_pct: 60,  lock_hw_pct: 68 }   # -> +40.8%
        - { trigger_pct: 90,  lock_hw_pct: 78 }   # -> +70.2%
        - { trigger_pct: 130, lock_hw_pct: 85 }   # -> +110.5%

risk:
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_seconds: 900
    per_asset_cooldown_seconds: 21600
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
