# Cuttlefish — strategy package deploy manifest (single source of truth for deploy + attribution).
# A regime-ADAPTIVE long/short divergence basket: two books on separate wallets, each running
# TWO supervised scanners — `entries` (market-pulse context x smart-money divergence, conviction-
# banded sizing) and `rebalance` (the auto-adjust re-read). rebalance feeds the fleet's FIRST
# CLOSE_POSITION action: a confirmed BTC-tide flip closes the book, a smart-money reversal closes
# the name, and every regimeRefreshHours (default 4h) a basket refresh recycles stale-thesis
# names. Unlike every prior basket package, the book adjusts to re-reads of the market — it does
# not rely on DSL attrition alone. DSL still owns all price-action exits.
# Install/teardown via senpi-strategy-ops (deploy.py / close.py).
schema_version: 1

id: cuttlefish
version: "1.0.0"

catalog:
  name: "Cuttlefish — Regime-Adaptive Divergence Baskets"
  emoji: "🦑"
  tagline: "Reads the whole market every 15 minutes with the real engines — the cross-asset pulse (crypto, semis, megacap tech, indices, gold, the dollar) classifies the day, and the smart-money cohorts (wallets with $1M+ lifetime realized vs the retail crowd) pick the names where proven money diverges from the herd — then builds a LONG and a SHORT basket on separate wallets, sizes by conviction, and closes positions itself the moment the day flips or the proven cohort walks away."
  belief_plain: "Follow the wallets with the best lifetime track records into positions the crowd hasn't found yet, on days the whole market allows it — and when the day turns or the proven money leaves, change your book like a cuttlefish changes color: immediately, automatically, without waiting to be stopped out."
  thesis: "Smart-money divergence — the proven cohort (lifetime realized >= $1M) positioned opposite the crowd — is the entry edge; regime adaptation is the exit edge. Every other basket strategy scores the market once at entry and lets stops do the thinking. Cuttlefish re-reads the cross-asset pulse every 15 minutes and the cohorts every 4 hours, and actively closes what no longer belongs: the whole book on a confirmed day flip, a single name the moment the proven cohort reverses, and the stale tail at every refresh. Both engine reads are the REAL skill engines (market-pulse day classification; smart-money cohort bias), constants verbatim."
  group: smart-money
  archetype: trend_following
  sub_style: adaptive
  asset_classes: [universe_crypto]
  asset_scope: universe
  direction: long_short
  risk_level: moderate
  tier: advanced
  time_horizon: swing
  leverage_max: 6
  max_slots: 8              # 4 per book
  min_budget: 200           # two wallets, $100 floor each
  assets: []               # DERIVED live every tick (volume floor + top-N)
  tags: [smart-money, divergence, cohorts, pulse, regime, adaptive, long-short, universe, rebalance, close-position]

requires:
  runtime: ">=3.0.0"        # CLOSE_POSITION action + v2 supervised external scanners

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: long
    runtime: long/runtime.yaml         # → runtime name cuttlefish-long, group cuttlefish
    wallet_env: CUTTLEFISH_LONG_WALLET
    funding_share: 0.5
  - name: short
    runtime: short/runtime.yaml        # → runtime name cuttlefish-short, group cuttlefish
    wallet_env: CUTTLEFISH_SHORT_WALLET
    funding_share: 0.5
