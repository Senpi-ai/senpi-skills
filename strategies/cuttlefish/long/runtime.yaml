# ── CUTTLEFISH · LONG book — regime-adaptive smart-money divergence basket ──
# Two supervised scanners on one wallet: `entries` builds the basket (market-pulse
# context x smart-money divergence, conviction-banded sizing); `rebalance` is the
# AUTO-ADJUST half — it re-reads the market and feeds the fleet's first
# CLOSE_POSITION action (pulse flip / proven-cohort reversal / 4h basket refresh). The DSL
# still owns every price-action exit; rebalance owns REGIME exits.
name: cuttlefish-long
group: cuttlefish
version: 1.0.0
description: >
  CUTTLEFISH LONG — regime-adaptive divergence basket, LONG book. Scores a LIVE-derived liquid-crypto
  universe (volume floor + top-N) where the PROVEN cohort (lifetime realized >= $1M) leans LONG
  against the crowd (smart-money engine divergence), confirmed by
  4h/1h trend + volume; builds up to 4 conviction-banded positions (6x/5x/4x)
  while the cross-asset pulse day is not risk_off. Auto-adjusts on re-reads: a confirmed tide
  flip closes the book, a proven-cohort reversal closes the name, and every 4h
  a basket refresh recycles stale-thesis names — via CLOSE_POSITION signals,
  not just DSL attrition. DSL owns all price exits.

strategy:
  wallet: "${CUTTLEFISH_LONG_WALLET}"
  slots: 4
  default_leverage: 4                   # fallback; entries emit banded 4/5/6
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10

  - name: cuttlefish_long_entries      # builds the basket
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 900
    timeout_seconds: 300                # 2 instruments + regime + board + <=16 asset reads (+cohorts on the 4h tick)
    default_signal_validity_seconds: 1800
    state_history_max_count: 200
    inputs: &cuttlefish_inputs
      side: "LONG"
      # ── universe: DERIVED from the live instrument list every tick —
      #    every main-dex perp over the volume floor, top-N by 24h notional ──
      universeVolFloorUsd: 25000000
      universeMaxNames: 16
      excludeAssets: []
      universeOverride: []              # non-empty pins the universe (testing/escape hatch)
      maxSlots: 4
      # ── composite weights (real-engine cores are the thesis — heaviest) ──
      weights:
        smartLean: 2.5                  # proven-cohort bias in the book's direction
        divergence: 3.0                 # smart-vs-crowd divergence (the entry edge)
        nearTerm: 1.0                   # 4h leaderboard confirm (its actual role)
        trend4h: 1.5
        align1h: 1.0
        mom24h: 1.0
        volRatio: 0.5
        regimeBonus: 0.5
      # ── gates + conviction bands ──
      minScore: 5.5
      goodScore: 6.5
      apexScore: 8.0
      exitScore: 3.5                    # basket-refresh recycle threshold (rebalance)
      leverageTiers: { apex: 6, good: 5, base: 4 }   # clamped to venue max per asset
      marginPctTiers: { apex: 22, good: 17, base: 12 }  # PERCENT of withdrawable
      # ── the real engines (constants verbatim from the skills) ──
      # senpi-market-pulse cross-asset groups (crypto group = the derived universe):
      pulseGroups:
        semis: ["NVDA", "AMD", "AVGO", "MU", "TSM", "ASML", "MRVL", "ARM"]
        megacap_software: ["AMZN", "MSFT", "META", "GOOGL", "AAPL", "ORCL", "PLTR"]
        crypto_proxy: ["MSTR", "COIN", "HOOD"]
        indices: ["SP500", "XYZ100", "JP225", "KR200"]
        commodities: ["GOLD", "SILVER", "COPPER", "BRENTOIL", "NATGAS"]
        macro_fx: ["DXY", "JPY", "EUR", "GBP"]
      # senpi-smart-money cohort/divergence engine (heavy reads — 4h cache, never per tick):
      cohorts:
        smartMinRealizedUsd: 1000000    # proven cohort: lifetime realized >= $1M
        crowdMinRealizedUsd: 10000
        crowdMaxRealizedUsd: 100000
        sampleCap: 150
        pageSize: 1000
        maxPages: 6
        stateBatch: 50
        minMembers: 5
        leanThreshold: 0.40
        divergenceMinGap: 0.50
      cohortRefreshHours: 4             # cohort cache clock (discovery paging is heavy)
      # ── auto-adjust cadence ──
      regimeRefreshHours: 4             # X — full basket re-rank cadence (default 4h)
      pulseFlipConfirmTicks: 2          # 2 x 900s against-ticks before the book flips out
      recentSignalTtlSeconds: 3600
    signal_data_schema:
      score: { type: number }
      leverage: { type: number }
      direction: { type: string }
      band: { type: string, required: false }
      pulseDay: { type: string, required: false }
      dispersionRead: { type: string, required: false }
      regime: { type: string, required: false }
      smartBias: { type: number, required: false }
      divergent: { type: boolean, required: false }
      cohortsAvailable: { type: boolean, required: false }
      nearTermPct: { type: number, required: false }
      mom24h: { type: number, required: false }
      components: { type: object, required: false }
      reasons: { type: array, required: false }

  - name: cuttlefish_long_rebalance    # the auto-adjust re-read → CLOSE_POSITION
    type: external_scanner
    path: ./scanners
    entrypoint: rebalance.py
    interval_seconds: 900
    timeout_seconds: 300                # pulse reads + held re-scores (+cohorts on the 4h tick)
    default_signal_validity_seconds: 1200
    state_history_max_count: 200
    inputs: *cuttlefish_inputs
    signal_data_schema:
      trigger: { type: string }
      reason: { type: string }
      pulseDay: { type: string, required: false }
      score: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: cuttlefish_long_entry
    action_type: OPEN_POSITION
    decision_mode: rule                 # the composite already applied every filter
    scanners: [cuttlefish_long_entries]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: cuttlefish_long_entries

  - name: cuttlefish_long_adjust       # FLEET-FIRST: scanner-driven CLOSE_POSITION
    action_type: CLOSE_POSITION
    decision_mode: rule                 # rebalance signals pass through; closes are
    scanners: [cuttlefish_long_rebalance]   # idempotent (no_open_position -> skip)
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60

# EXIT — DSL owns every price-action exit (rebalance owns regime exits).
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 360
      min_value: 2.5
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 6
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 0 }
        - { trigger_pct: 20, lock_hw_pct: 35 }
        - { trigger_pct: 45, lock_hw_pct: 60 }
        - { trigger_pct: 80, lock_hw_pct: 78 }

risk:
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 8
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 900
    per_asset_cooldown_seconds: 14400   # 4h — also blocks instant re-entry after a rebalance close
    drawdown_halt_pct: 15
    drawdown_reset_on_day_rollover: true
