# ── HYDRA · CORE sleeve — the LONG-TERM THESIS of a single-coin conviction fund ──
# Runtime 3.0 port of v2 runtime-core.yaml (origin/main, Hydra v2.1). 1.3.0: LONG-only by
# default — the card's "never bets against the thesis coin" is now what the code does (a
# bearish 4h stands down unless allowShort is true); one 40% slot at 3x; a wide stop (15%
# ROE = 5.0% of price at 3x); weak_peak OFF, time-cuts OFF; a Phase 2 whose FIRST lock is
# reachable (+12% ROE → lock 40% of high-water — NOT the old +80% that never armed). You
# ride normal volatility; the cross-asset HEDGE sleeve (separate wallet) cushions the
# interim drawdown. Structure and RSI are read off CLOSED candles only — the bar in
# progress never moves a read.
name: hydra-core
group: hydra
version: 3.0.0
description: >
  HYDRA CORE — single-coin trend-momentum on the thesis coin (inputs.coin; default ETH,
  set per deployment). LONG when the 4h structure is bullish and the 1d confirms it (v2.1
  chop filter — don't buy the range-top); a bearish 4h stands down (LONG-only by default;
  allowShort: true also shorts a confirmed 4h+1d downtrend); sit out a neutral tape. One
  position, 40% of the wallet at 3x, on a wide stop (15% ROE = 5.0% of price) and a profit
  ratchet from +12% ROE — no clock cuts. Pairs with the DIP (tactical add) and HEDGE
  (cross-asset cushion) sleeves on separate wallets.

strategy:
  wallet: "${HYDRA_CORE_WALLET}"
  slots: 1                                 # single asset, single position
  margin_pct: 40                           # per-slot margin %; 1 x 40% of the wallet (= inputs.marginPct)
  default_leverage: 3                      # fallback; the scan emits 3 per signal (= inputs.leverage = catalog leverage_max)
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: hydra_core_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300                   # v2 producer cadence (tickSeconds 300)
    timeout_seconds: 150                    # 1 asset read/tick (1h/4h/1d + funding)
    default_signal_validity_seconds: 1800
    state_history_max_count: 100            # dedup map + per-tick scan-results history
    inputs:
      # ── PER-COIN PARAMETERIZATION: set `coin` per deployment (mirrors v2 HYDRA_COIN). ──
      coin: "ETH"                           # thesis asset; SOL / HYPE for the other variants
      dex: ""                               # "" main DEX; "xyz" for an xyz: thesis coin
      leg: "core"
      minScore: 5                           # the composite tops out at 6 (4h+1d 3, 1h 2, funding 1)
      marginPct: 40                         # PERCENT of withdrawable (0,100] — runtime sizes (marginPct/100)*withdrawable
      leverage: 3                           # one leverage for every signal (= strategy.default_leverage = catalog leverage_max)
      allowShort: false                     # LONG-only: a bearish 4h stands down. true = also short a confirmed 4h+1d downtrend
      rsiOverbought: 80
      rsiOversold: 20
      requireDailyAlign: true               # v2.1: only enter when the 1d trend confirms the 4h (chop filter)
      recentSignalTtlSeconds: 240           # 4m signal-dedup debounce (v2 RECENT_SIGNAL_TTL ~180-240s)
    signal_data_schema:
      score: { type: number }
      leverage: { type: number }
      direction: { type: string }
      reasons: { type: array, required: false }
      trend4h: { type: string, required: false }
      trend1h: { type: string, required: false }
      rsi: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: hydra_core_entry
    action_type: OPEN_POSITION
    decision_mode: rule                     # the scan already applied every gate (pass-through in v2)
    scanners: [hydra_core_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: hydra_core_signals

# ── EXIT (DSL — the stop and the ratchet decide every exit; no clock cuts) ──
# A long-term thesis HOLD: a wide stop only (15% ROE = 5.0% of price at 3x), weak_peak OFF
# (hold through consolidation), time-cuts OFF, Phase 2 does nothing until a real run — but
# the FIRST lock is REACHABLE (+12% ROE → lock 40% of high-water). Do NOT regress to +60-80%.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: false
      interval_in_minutes: 43200
    weak_peak_cut:
      enabled: false                        # HOLD through flat periods — a long-term thesis consolidates
      interval_in_minutes: 1440
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 2880
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a favourable move it
      # could sit BELOW entry and close a winner at a loss. max_loss_pct IS the stop (ROE %);
      # retrace_threshold below is inert while enabled: false.
      enabled: false
      max_loss_pct: 15.0   # 15% ROE = 5.0% of price at 3x (was 10 = 3.3% of price)
      retrace_threshold: 10                  # inert while enabled: false
      consecutive_breaches_required: 2
    phase2:
      enabled: true
      tiers:                                 # lock medium winners early, still ride a real moonshot
        - { trigger_pct: 12, lock_hw_pct: 40 }   # first lock REACHABLE (+12% ROE = 4% of price at 3x); locks 40% of high-water
        - { trigger_pct: 25, lock_hw_pct: 55 }
        - { trigger_pct: 50, lock_hw_pct: 68 }
        - { trigger_pct: 120, lock_hw_pct: 80 }
        - { trigger_pct: 250, lock_hw_pct: 88 }

risk:
  guard_rails:
    daily_loss_limit_pct: 12
    max_entries_per_day: 3                   # above strategy.slots (1)
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_seconds: 7200                   # v2 cooldown_minutes 120
    drawdown_halt_pct: 22
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 14400        # v2 per_asset_cooldown_minutes 240
