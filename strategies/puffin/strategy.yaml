# Puffin — the Senpi Signals feed, concentrated. A single-instance PACKAGE: this manifest + one
# self-contained runtime.yaml + scanners/. Puffin takes SIGNALS-HUNTER's engine verbatim — the same
# vendored sweep.py / score.py / smartmoney.py, drift-tested against senpi-signals/scripts — and
# changes only what happens after a signal is scored: one position instead of five, a score floor
# of 85 instead of 65, 75-90% of the wallet at 10x instead of 20-25% at 5x, and a 15-minute clock
# instead of an hour.
#
# That is a sizing-and-selectivity thesis, not a signal one. The feed produces thousands of signals
# a day; an 85 floor takes roughly three. The binding constraint was never finding setups.
#
# The faster clock is NOT free and is not cosmetic: score.py picks both of its diff baselines by
# wall-clock age, so shortening the tick without changing the ring would have silently halved the
# trend arm's lookback. See _stratify_ring in main/scanners/scan.py.
# Install/teardown via senpi-strategy-ops.
schema_version: 1

id: puffin
version: "1.0.0"

catalog:
  name: "Puffin — One Signal, All In"
  emoji: "🎯"
  tagline: "Signals Hunter's detector library with the aperture closed: a score floor of 85 instead of 65, one position instead of five, three quarters to nine tenths of the wallet behind it at 10x, and a 15-minute clock so the entry lands near the signal rather than up to an hour after it. One name at a time, chosen from the whole universe, and nothing beside it to average against."
  belief_plain: "Senpi Signals already tells you where the proven cohort is positioned, where funding is dislocated and where open interest is surging. Signals Hunter trades that feed across five names at a fifth of the wallet each. Puffin runs the identical engine and asks a harder question: out of everything scored in the last quarter hour, is there ONE name good enough to put the whole book behind? Most ticks the answer is no and it holds cash. That floor is set from measurement, not taste — over 14 days of feed output, 82 of 116 scored observations clear Signals Hunter's 65 but only 39 clear 85, and since 21 of them sit at exactly 100 the score saturates, so 85 is close to the last level that still separates one signal from another. Know what the concentration costs before funding. There is no portfolio effect to soften anything: one stop-out takes about 19-23% of the account, and because the position is 10x, a single round trip pays roughly 0.8-0.9% of the wallet in fees every time it trades — at one completed trade a day that is about 27% a month before direction earns anything. It trades both directions, because the cohort is short about as often as it is long. When the cohort read fails it opens nothing and says so, rather than quietly scoring on price and funding alone and calling that a smart-money read."
  thesis: "The detector library is the edge, so it is vendored rather than reimplemented: sweep.py, score.py and smartmoney.py are byte-identical to the skill's and a drift test enforces it, which means a detector fixed in the feed is fixed here. What this package changes is everything downstream of the score. One slot at 75% margin, 90% above a score of 93, at 10x — up to 9x gross exposure on a single name. The scan clock drops from an hour to fifteen minutes, which buys entry timing rather than more trades: with one slot, turnover is set by the exit ladder and the cooldowns, not by how often the scanner looks. That faster clock forced a real fix rather than a config edit. score.py chooses both diff baselines by wall-clock age — a roughly 60-minute fast arm and a roughly 12-hour trend arm that refuses below six — so the inherited 24-deep ring, which spans a day at hourly ticks, spans only six hours at fifteen-minute ones and would have handed the trend arm a six-hour baseline while still printing it as twelve. The ring is kept stratified instead: dense inside two hours, then about one snapshot per two hours out to a day, which covers a longer span in fewer snapshots and gives both arms a properly aged partner. Exits were rebuilt from the price move upward and then multiplied by leverage, so the 25% ROE stop is a 2.5% move in price and each ladder tier means at 10x what Signals Hunter's means at 5x — carrying its ROE numbers across unchanged would have halved every exit. One detector is still not traded: whale_open rests on a third-party startTime caught resetting on an unchanged position, which is a discountable sentence in a feed and the entire book here."
  group: smart-money
  archetype: copy_trading
  sub_style: signal_feed
  asset_classes: [universe_crypto, btc_eth, major_alts]
  asset_scope: universe
  direction: long_short
  risk_level: aggressive
  tier: advanced
  time_horizon: intraday
  leverage_max: 10
  max_slots: 1
  assets: []                # derived universe — the gather ranks the top 120 by notional each tick
  # The mechanical minimum is tiny here (one slot at 75% x 10x clears the $10 venue floor on a
  # handful of dollars), so this floor is not about order size. It is about leaving the DSL's
  # ladder room to exit in slices that stay above that venue floor, on a book where every round
  # trip already costs ~0.85% of the wallet in fees.
  min_budget_floor: 50
  tags: [signals, senpi-signals, detector-library, whale, whale-moves, proven-cohort, cohort, smart-money, copy-trading, follows-traders, funding, open-interest, long-short, concentrated, single-slot, high-leverage, high-conviction, selective, always-on]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

# One instance. The lens is the whole universe, so a second sleeve would trade the same signals —
# and with one slot each they would be two books fighting over the same top-ranked name.
instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: PUFFIN_WALLET
    funding_share: 1.0
