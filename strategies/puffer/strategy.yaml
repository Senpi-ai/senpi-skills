# Puffer — Volatility Squeeze. Single-wallet PACKAGE: this manifest + one
# self-contained runtime.yaml + scanners/ (scan.py does the MCP orchestration;
# scoring.py is the pure engine — the fee gate plus the squeeze/release math).
# NEVER closes — the DSL owns every exit.
# 1.2.0 (2026-10-27): the fee gate prices a round trip at the venue's base rates.
# 1.1.0 (2026-10-12): four slots at 20% and 4x, a 12% ROE stop (3% of price), the first ratchet
# rung locking 40% of high-water.
schema_version: 1

id: puffer
version: "1.2.0"
catalog:
  name: "Puffer — Volatility Squeeze"
  emoji: "🐡"
  tagline: "Waits for a market to go quiet — unusually quiet for that particular coin — and then trades the move when it finally breaks out. Quiet stretches tend to end in a big move; the trick is being positioned for the break rather than getting chopped up inside the calm. It sits on its hands until the release, then gives the winner a long leash: four positions at 20% of the wallet each at 4x, a stop about 3% of price away, and a profit ratchet that only ever locks gains."
  belief_plain: "When a coin's price action tightens up far more than is normal for it, pressure is building and the next move is usually a big one. Puffer measures how compressed each market is against its own history, ignores the quiet itself, and enters only when price finally breaks out with volume behind it. Then it holds on: a profit ratchet locks gains as they build, and a fixed stop about 3% of price away (12% of margin at 4x) caps the downside if the break fails. Expect more stops than winners — in a 208-day replay on four majors with the earlier, tighter stop (1.6–2% of price) it traded about seven times per coin per month with 28% winners, and 88% of its live closes were the exchange stop. The winners have to run for the ratchet to pay for the stops."
  thesis: "Volatility is mean-reverting: compression precedes expansion. The edge is in the reference frame — compression is measured against each asset's OWN trailing median, so a coil is detected on a sleepy index and a violent alt alike, which an absolute threshold can never do. Trades the release, never the coil, and runs a wide, gains-only exit — a 3%-of-price stop and a ratchet that locks 40% of the gain from +20% ROE — because cutting an expansion short forfeits the entire reason for taking it. The earlier stop, 1.6–2% of price, sat inside the release candle's own range and ended 88% of live trades; that is corrected here."
  group: multi-asset-universe
  archetype: breakout_momentum
  sub_style: volatility_squeeze
  asset_classes: [btc_eth, major_alts, universe_crypto]
  asset_scope: universe
  direction: long_short
  risk_level: moderate
  tier: advanced
  time_horizon: swing
  leverage_max: 4
  max_slots: 4
  assets: []                 # DERIVED live from market_list_instruments (vol floor + top-N)
  tags: [volatility, squeeze, compression, expansion, breakout, bollinger, coil, universe, long-short, dsl-only, no-close]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml         # → runtime name puffer-main, group puffer
    wallet_env: PUFFER_WALLET
    funding_share: 1.0
