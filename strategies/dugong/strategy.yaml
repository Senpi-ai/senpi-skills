# Dugong — Cross-Asset Mean-Reversion Inventory at 3x. Manatee's engine at three times the leverage,
# with the stop re-derived to sit inside the venue's liquidation distance. Single-wallet PACKAGE: this
# manifest + one runtime.yaml + scanners/ (scan.py does the read-only MCP orchestration; scoring.py is
# the pure engine, byte for byte manatee's). Two-sided inventory of the venue's liquid names on BOTH
# boards, judged once per daily close: long a name 5% below its 7-day mean, short one 5% above it, one
# add while the close keeps moving against the position, a 1.4% reversion banked by the DSL. NEVER
# closes from the scanner — the DSL owns every exit.
schema_version: 1

id: dugong
version: "1.0.0"
catalog:
  name: "Dugong — Cross-Asset Mean-Reversion at 3x"
  emoji: "🐋"
  varies: manatee          # a VARIANT of this template — never outrank it
  tagline: "Manatee's two-sided mean reversion at 3x: buys a liquid name that closed well below its one-week average and shorts one that closed well above it, across perpetuals and the xyz board's equities, indices and commodities, with a profit lock that arms at +1.4% of price. Up to 10 positions at 3x, each with a stop at 20% of price, inside the venue's liquidation distance, on names the venue allows at 10x or more."
  belief_plain: "Liquid markets overshoot in both directions and come back toward their recent average. Dugong is Manatee's engine with the leverage raised to 3x: the same signal, the same 1.4% profit lock in price, one add instead of two, and a stop at 20% of price instead of 30%. The stop moves in because it has to: at 3x the venue would liquidate a position before a 30% stop could fire. Each clip is half again Manatee's size, so every move counts half again as much, in both directions; a clip that reaches its stop costs the same dollars as one of Manatee's, and a full name at most 1.8% of the account against Manatee's 2.7%. It trades only names the venue allows at 10x or more, so a stop has room to fill before liquidation. The risk is a one-way market that keeps stretching through the stops, and at 3x positions stop out sooner than Manatee's."
  thesis: "Manatee's engine at 3x, backtested side by side with Manatee minute by minute over 27 April to 22 October 2026: every qualifying daily close in the derived top 24, one position per name, positions still open at 45 days marked to market. In that backtest Manatee (2x, 30% stop) closed 96.6% of its 1,009 positions at the profit lock and Dugong (3x, 20% stop, names allowed 10x or more) 94.5% of 920. Per position, after all fees at the starting builder-fee tier, Dugong averaged about 0.70 ROE against Manatee's 0.42, and about 1.0 against 0.62 with no builder fee, with fewer losing months in both cases. Two findings in the backtest set its shape. The stop sits at 20% of price: of the 55 positions that fell that far against Manatee, 14 came back to the profit lock. And it trades only names the venue allows at 10x or more, because at 3x a short on a name capped lower would liquidate barely past that stop. A backtest describes one past window under stated assumptions; it is not a forecast and not a promise of returns. Adds, the 10-slot limit and stop slippage were not modelled."
  group: multi-asset-whitelist
  archetype: contrarian_fade
  sub_style: mean_reversion
  asset_classes: [btc_eth, major_alts, xyz_equities, indices, commodities, pre_ipo]
  asset_scope: universe
  direction: long_short
  risk_level: aggressive
  tier: advanced
  time_horizon: swing
  leverage_max: 3
  max_slots: 10
  # The computed minimum is where ONE clip clears the venue's $12 order minimum on NOTIONAL: at 3x a
  # clip is 4.5% of withdrawable, so about $270. Within a tick every clip is sized off the one balance
  # read the scanner opens with, so one clip fills the opening book; across ticks the clip shrinks with
  # withdrawable, and the floor keeps the one add round above the minimum with room.
  min_budget_floor: 500
  assets: []                      # DERIVED each tick: both boards, $50M open-interest floor, max leverage 10x+
  tags: [mean-reversion, cross-asset, xyz-equities, derived-universe, long-short, harvester, always-on, dsl-only, no-close, inventory, two-sided, daily-close, buy-the-dip, short-the-rip, liquid-perps, majors, 3x]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml         # → runtime name dugong-main, group dugong
    wallet_env: DUGONG_WALLET
    funding_share: 1.0
