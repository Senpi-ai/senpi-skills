# Kinkajou — leveraged big tech when the Nasdaq is healthy, the index after a washout, cash otherwise.
# A single-instance PACKAGE: this manifest + one self-contained runtime.yaml + scanners/. Long only.
# ADVANCED tier, aggressive: uneven legs across the five stocks, and the single names are hindsight picks.
# Install/teardown via senpi-strategy-ops.
schema_version: 1

id: kinkajou
version: "1.0.0"

catalog:
  name: "Kinkajou — Big-Tech Momentum, Nasdaq-Gated"
  emoji: "🐒"
  tagline: "Reads the Nasdaq 100 once a day and acts on three conditions: washed out (10-day RSI under 30) — buy the Nasdaq 100 (xyz:XYZ100) at 3x; healthy (above its 40-week average, RSI under 79) — buy the strongest of Apple, Nvidia, Tesla, Meta and Amazon on the xyz board, the one that rose most over 13 weeks while above its own long-term average, at 2x (Tesla 1x); anything else — sit in USDC. Long only, one position, a wide trailing stop."
  belief_plain: "When the tech market is healthy, the single big-tech stock with the strongest momentum tends to keep leading; when tech has just crashed, the index itself is the cleanest rebound; and when tech is overheated or in a downtrend, cash is the safest place. Once a day it checks which of the three it is and acts accordingly, one position at a time, never shorting, with a stop on every trade and a ratchet that locks in gains."
  thesis: "You want aggressive, leveraged exposure to the strongest big-tech name, but only when the whole tech market is healthy, and a rule that steps aside when it is not. Its record is uneven across the five stocks, so treat it as an aggressive satellite position, not a core holding."
  group: multi-asset-whitelist
  archetype: trend_following
  sub_style: big_tech
  asset_classes: [xyz_equities, indices]
  asset_scope: basket
  direction: long_only
  risk_level: aggressive
  tier: advanced
  time_horizon: position
  leverage_max: 3
  max_slots: 1
  assets: ["xyz:XYZ100", "xyz:AAPL", "xyz:NVDA", "xyz:TSLA", "xyz:META", "xyz:AMZN"]
  tags: [big-tech, momentum, single-stocks, aapl, nvda, tsla, meta, amzn, nasdaq, xyz100, regime,
         risk-on-risk-off, rsi, 200-day, buy-the-crash, leveraged, aggressive, long-only, one-position,
         cash-when-weak, xyz, dsl-only]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: KINKAJOU_WALLET
    funding_share: 1.0
