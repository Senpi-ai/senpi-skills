# ── KINKAJOU · single instance — leveraged big tech when the Nasdaq is healthy, the index after a washout ──
# At each UTC-midnight daily close, with nothing held, the Nasdaq 100 (xyz:XYZ100) is read three ways:
#   10-day RSI under 30 (washout)                        -> buy the Nasdaq 100 at 3x, for the rebound
#   above its 40-week average and RSI under 79 (healthy) -> buy the strongest single name — xyz:AAPL,
#     xyz:NVDA, xyz:TSLA, xyz:META, xyz:AMZN — the one with the largest 13-week rise among those above
#     their own 40-week average (2x; TSLA 1x)
#   anything else (overheated, or under its trend)       -> USDC
# The DSL is the ONLY exit: a 30% ROE stop and a wide ladder. No clocks, no shorts.
#
# Replayed on US daily bars Jan 2010 - Nov 2026 (QQQ and the five stocks), entry at the signal close,
# the stop on the wick, rungs arming on the close, each market charged its own Hyperliquid cost (taker
# fee both sides — about 0.018% a round trip on these xyz markets, all in growth mode — plus its
# measured bid-ask spread, 0.003-0.011%): 84 trades, 79% winners, profit factor 2.56 (3.06 arming on
# the bar extreme); every four-year block positive (2.93 / 5.60 / 3.31 / 1.49); worst drawdown 27% at
# 20% margin. All 1,458 neighbouring settings (average 30/40/50 weeks, momentum 42/63/84 days,
# overheat 75/79/83, washout 28/30/32, stop 21/30/40, three ladders, both arming bounds) cleared fees,
# the worst at 1.73; over Jun 2021 - Nov 2026 alone all 1,458 cleared too, the worst exactly at 1.00.
# READ THIS TOO: the legs are uneven on close-arming (washout 7.67, META 8.40, TSLA 3.99, AMZN 3.39,
# but AAPL 0.55 and NVDA 0.79), and adding Bitcoin to the candidates (as the original rule does)
# failed the gate there (7 of 1,458 cells lost, worst 0.83), so Bitcoin is not in it. The single names
# are today's famous ones: hindsight.
name: kinkajou-main
group: kinkajou
version: 1.0.0
description: >
  KINKAJOU — leveraged big tech when the Nasdaq is healthy, long only. At each UTC-midnight daily
  close, with nothing held: if the Nasdaq 100's 10-day RSI closed under 30 it buys xyz:XYZ100 at 3x;
  if the Nasdaq 100 is above its 40-week average and that RSI is under 79 it buys the strongest of
  xyz:AAPL, NVDA, TSLA, META and AMZN — the largest 13-week rise among those above their own 40-week
  average — at 2x (TSLA 1x); otherwise it waits in USDC. One position at 20% of withdrawable. The DSL
  is the only exit — a 30% ROE stop and a wide ladder; no clock closes anything.

strategy:
  wallet: "${KINKAJOU_WALLET}"
  slots: 1                                # one position at a time
  margin_pct: 20                          # baseline %; scan emits marginPct per signal (same number)
  default_leverage: 1                     # fallback only — every signal carries its market's leverage; 1 is
                                          # the LOWEST the recipe uses (TSLA), which is what min_budget must size
  trading_risk: aggressive
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: kinkajou_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300                  # the daily close is the only decision point; 5 min bounds the delay
    timeout_seconds: 200                   # one account read + at most six candle reads
    default_signal_validity_seconds: 600   # 2x tick; rule action, a fresh re-score never re-emits a bar
    state_history_max_count: 50            # (market, bar) dedup map + per-tick result
    inputs:
      allowedAssets: ["xyz:XYZ100", "xyz:AAPL", "xyz:NVDA", "xyz:TSLA", "xyz:META", "xyz:AMZN"]   # every market traded
      indexAsset: "xyz:XYZ100"             # its RSI and 40-week average read the market; bought after a washout
      singleNames: ["xyz:AAPL", "xyz:NVDA", "xyz:TSLA", "xyz:META", "xyz:AMZN"]
      rsiPeriod: 10                        # Wilder RSI on CLOSED daily candles
      washoutRsi: 30
      overheatRsi: 79
      trendWeeks: 40                       # index and names: above the average of the last 40 CLOSED weekly closes
      momentumWeeks: 13                    # names: above, and ranked by, the close 13 weeks back
      entryWindowSeconds: 3600             # buy within the hour after the UTC-midnight close, or wait a day
      leverageByAsset: {"xyz:XYZ100": 3, "xyz:AAPL": 2, "xyz:NVDA": 2, "xyz:TSLA": 1, "xyz:META": 2, "xyz:AMZN": 2}
      leverageDefault: 1
      leverageMax: 3
      stopRoePct: 30                       # MUST equal exit.dsl_preset.phase1.max_loss_pct (tests pin it)
      marginPct: 20                        # PERCENT of withdrawable (0,100]; one slot
      maxSlots: 1
      minNotionalUsd: 12                   # the venue's bumped minimum; the free-margin gate stops emitting below it
    signal_data_schema:
      state: { type: string }
      direction: { type: string }
      nasdaqRsi: { type: number }
      momentumPct: { type: number, required: false }
      signalBarTime: { type: number }
      leverage: { type: number }
      stopPricePct: { type: number }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: kinkajou_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied the whole rule
    scanners: [kinkajou_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # the buy is AT the close — maker window first, taker fallback
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: kinkajou_main_signals

# ── EXIT (DSL only) ───────────────────────────────────────────────────────────────────────
# Every threshold is ROE (% of margin); at 3x its distance in PRICE is ROE / 3. Stop 10% of price;
# rungs arm at +5% / +8.3% / +13.3% / +20% / +33% and lock 30 / 45 / 60 / 75 / 85% of the best gain.
# On a single name at 2x every price distance is half again the index's; TSLA at 1x is the price move itself.
# Clock cuts are OFF: of 142 clock-driven closes measured in one fleet week, 110 were in profit.
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true        # closes MUST happen — taker fallback safety floor
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout: { enabled: false, interval_in_minutes: 4320 }
    weak_peak_cut: { enabled: false, interval_in_minutes: 360, min_value: 3.0 }
    dead_weight_cut: { enabled: false, interval_in_minutes: 60 }
    phase1:
      # Trailing DISABLED fleet-wide: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss. max_loss_pct is the hard
      # stop; retrace_threshold is inert while enabled is false.
      enabled: false
      max_loss_pct: 30.0   # 10% of price on the index at 3x, 15% on a name at 2x, 30% on TSLA at 1x — mirrored by inputs.stopRoePct
      retrace_threshold: 30
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                               # trigger / lock, ROE; price at 3x in the comment
        - { trigger_pct: 15, lock_hw_pct: 30 }   # +5% of price    -> floor +1.5%
        - { trigger_pct: 25, lock_hw_pct: 45 }   # +8.3%           -> floor +3.75%
        - { trigger_pct: 40, lock_hw_pct: 60 }   # +13.3%          -> floor +8%
        - { trigger_pct: 60, lock_hw_pct: 75 }   # +20%            -> floor +15%
        - { trigger_pct: 100, lock_hw_pct: 85 }  # +33%            -> floor +28.3%

# ── RISK guard rails (one slow book: rare entries, a wide stop, no self-resetting breaker) ──
risk:
  data_retention_seconds: 604800           # 7d — a position can live for months
  guard_rails:
    daily_loss_limit_pct: 10               # one stop-out is 30% x 20% = 6% of the account
    max_entries_per_day: 2                 # one per daily close; the second covers a re-entry the next close
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 86400                # a day after three losses in a row
    drawdown_halt_pct: 35                  # the wallet-wide hard stop; above the replay's 27% worst drawdown
    drawdown_reset_on_day_rollover: false  # clearing it is a deliberate act (redeploy), not midnight
    per_asset_cooldown_seconds: 300        # the scanner already allows one entry per daily close

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
