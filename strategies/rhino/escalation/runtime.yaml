# ── RHINO · ESCALATION book — stress-gated crisis convexity (LONG crisis + SHORT risk) ──
name: rhino-escalation
group: rhino
version: 3.0.0
description: >
  RHINO ESCALATION — the convex add. One of two books. DORMANT in calm (cash = dry powder);
  fires HARD only when Rhino's shared STRESS detector confirms a shock (oil breaking out +
  equities breaking down + gold bid + BTC rolling over + BTC vol/range expansion clear a
  threshold). It then goes LONG the spiking crisis complex (gold / silver / oil / CL /
  natgas / dollar / yen) and SHORT the cratering risk complex (BTC / ETH / SOL / HYPE / SUI
  + growth indices), each scored in its mandated direction. Paired with the HEDGE book on a
  separate wallet, which carries the always-on standing insurance. LARGER size — this is the
  payoff leg. The DSL is MODERATE-TIGHT: crises reverse violently (a ceasefire dumps oil/gold),
  so bank the spike. Trades BOTH directions.

strategy:
  wallet: "${RHINO_ESCALATION_WALLET}"
  slots: 3
  default_leverage: 5                     # fallback; scan emits a flat per-signal 5x clamped to venue max
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: rhino_escalation_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300                 # v2 tickSeconds 300
    timeout_seconds: 180
    default_signal_validity_seconds: 600
    state_history_max_count: 100          # dedup map + per-tick result history
    inputs:
      book: "escalation"                  # selects the stress-gated, LONG-crisis + SHORT-risk path
      defensives: []
      crisisLongs: ["xyz:GOLD", "xyz:SILVER", "xyz:BRENTOIL", "xyz:CL", "xyz:NATGAS", "xyz:DXY", "xyz:JPY"]
      riskAssets: ["BTC", "ETH", "SOL", "HYPE", "SUI", "xyz:XYZ100", "xyz:SP500"]
      minScore: 5
      marginPct: 22                       # LARGER — percent of withdrawable (runtime sizes (marginPct/100)*withdrawable)
      maxLeverage: 5                      # flat clamp (v2 strict 5x), then each asset's HL venue max
      maxSlots: 3
      momThresholdPct: 1.0
      rsiOverbought: 80
      rsiOversold: 20
      # stress gate params (v2): net cross-asset probes that must fire to DEPLOY
      stressThreshold: 2
      breakoutBars: 20
      baseBars: 30
      recentBars: 10
      surgeMod: 1.3
      volSurge: 1.5
      recentSignalTtlSeconds: 180
    signal_data_schema:
      score: { type: number }
      direction: { type: string }
      reasons: { type: array, required: false }
      trend4h: { type: string, required: false }
      own24h: { type: number, required: false }
      rsi: { type: number, required: false }
      stress: { type: boolean, required: false }
      stressFired: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: rhino_escalation_entry
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [rhino_escalation_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: rhino_escalation_signals

# EXIT — MODERATE-TIGHT, bank the spike (v2 runtime-escalation dsl_preset, verbatim).
# Crisis moves spike then reverse violently, so don't give the convex gain back: tighter
# phase1, early profit-lock ladder, stall-cuts ON, 2d hard_timeout. First phase2 lock tier
# 8% -> 35 (early and reachable; never +60-80%).
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 2880           # 2d
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 180            # 3h
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 360            # 6h
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8,  lock_hw_pct: 35 }
        - { trigger_pct: 18, lock_hw_pct: 60 }
        - { trigger_pct: 35, lock_hw_pct: 75 }
        - { trigger_pct: 60, lock_hw_pct: 88 }

risk:
  data_retention_seconds: 345600       # 96h (was data_retention_hours: 96)
  guard_rails:
    daily_loss_limit_pct: 14
    max_entries_per_day: 8                # stress arrives in bursts -> deploy fast when it does
    max_consecutive_losses: 5
    cooldown_seconds: 2700               # 45m
    drawdown_halt_pct: 22
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_seconds: 7200     # 120m
