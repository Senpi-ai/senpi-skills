# Lemur — Pre-IPO Perpetual (IPOP) trend follower. A single-instance PACKAGE: this
# manifest + one self-contained runtime.yaml + scanners/. A faithful Runtime 3.0 port
# of the v2 Lemur (SKILL.md v1.0.0): auto-discovers IPOPs on Hyperliquid XYZ via the
# trade.xyz funding signature (~100x smaller funding) + a <=5x pre-listing leverage cap
# + a $100k liquidity floor, then trades 4h trend structure; the 4h leaders' lean is a
# veto (and points) only on the days their board carries the name. One position at a
# time, 40% of the wallet at 3x, a 12% ROE stop (4.0% of price); DSL-only exits.
# Today's universe is [xyz:SPCX]; long OR short. Install/teardown via senpi-strategy-ops.
schema_version: 1

id: lemur
version: "1.2.0"
catalog:
  name: "Lemur — Pre-IPO Perpetual Trend Follower"
  emoji: "🦤"
  tagline: "Trades pre-IPO companies as perpetuals on Hyperliquid XYZ — today just SpaceX (xyz:SPCX). Auto-discovers IPOPs via the trade.xyz funding signature (~100x smaller funding) plus a <=5x pre-listing leverage cap and a $100k liquidity floor, then goes long or short with the 4h trend structure. The 4h leaders' lean is consulted only when their board carries the name — it usually has no row for a pre-IPO perp: a present lean must agree and adds to the score; with no row, the 1h trend has to confirm the 4h. One position at a time, 40% of the wallet at 3x, a 12% ROE stop (4% of price) and a ratchet that locks gains from +20% ROE; no clock cuts, so multi-day theses ride."
  belief_plain: "Hyperliquid XYZ is one of the only places retail can trade private companies (like SpaceX) as perpetuals before they IPO. Lemur watches those pre-IPO names and follows the 4-hour trend. When the traders winning the last four hours hold the name, their side has to agree; most days they do not, and then the 4-hour and 1-hour trends have to point the same way. It takes a single directional position — 40% of the wallet at 3x — behind a stop 4% from entry (12% of margin); once the trade is up 20% on margin, a ratchet starts locking gains. When a company actually goes public it stops qualifying and Lemur drops it automatically."
  thesis: "Pre-IPO perpetuals (IPOPs) are a structurally distinct product — a 0.005 funding multiplier (vs 0.5 for standard XYZ perps) and Discovery Bounds that throttle price velocity. That structural funding signature reliably identifies them with no hardcoded ticker list, so the universe future-proofs itself as trade.xyz lists new names and de-qualifies any that IPO. On those slow-moving names, a clean 4h trend — with the 4h leaders' side as a veto and a bonus on the days their board carries the name — is enough edge to hold a directional swing at 3x and let a wide DSL ratchet (a 12% ROE stop, gains locked from +20% ROE) capture the multi-day move."
  group: momentum
  archetype: single_market
  sub_style: pre_ipo
  asset_classes: [pre_ipo]
  asset_scope: single
  direction: long_short
  risk_level: moderate
  tier: starter
  leverage_max: 3
  max_slots: 1
  assets: ["xyz:SPCX"]
  tags: [pre-ipo, ipop, spacex, xyz, equities, trend-following, leader-momentum, auto-discovery, hyperliquid]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: LEMUR_WALLET
    funding_share: 1.0
