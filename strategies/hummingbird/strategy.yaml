# Hummingbird — HYPE onboarding-tier trend follower. A single-instance PACKAGE:
# this manifest + one self-contained runtime.yaml + scanners/. A faithful Runtime
# 3.0 port of the v2 Hummingbird (SKILL.md v1.0.0): 4h trend structure + Senpi
# 4h-leader direction gate on one asset (HYPE), flat 5x leverage, DSL-only exits
# with a Bison-pattern wide ladder. Install/teardown via senpi-strategy-ops.
schema_version: 1

id: hummingbird
version: "1.1.1"
catalog:
  name: "Hummingbird — HYPE Trend Follower"
  emoji: "🪶"
  tagline: "An onboarding-tier single-asset HYPE specialist: enters only when the 4h trend structure is directional AND the 4h leaderboard's winners sit on that side (tilt >= 60%) — then holds one flat-5x position and lets a wide DSL ladder ride the trend."
  belief_plain: "Trades only HYPE. It asks two simple questions — is HYPE trending on the 4-hour chart, and are the traders who won the last four hours on that side? If both are yes, it opens one position and trails a wide stop instead of guessing the exit, so winning trends can run for days."
  thesis: "New users want one clean decision, not a scattergun across the market. HYPE has the liquidity and the moves, and a one-asset, one-direction strategy with a 4h-leader confirmation gate is the simplest honest answer to 'I'm new to Senpi, where do I start?'"
  group: single-asset
  archetype: single_market
  sub_style: basket
  asset_classes: [major_alts]
  asset_scope: single
  direction: long_short
  risk_level: moderate
  tier: starter
  leverage_max: 5
  max_slots: 1
  assets: ["HYPE"]
  tags: [hype, single-asset, trend-follower, leader-momentum, onboarding, beginner]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: HUMMINGBIRD_WALLET
    funding_share: 1.0
