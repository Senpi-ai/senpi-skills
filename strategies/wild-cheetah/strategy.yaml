# Wild Cheetah — CHEETAH at higher conviction and higher size. AN EXPERIMENT.
#
# TWO differences from cheetah, and they are ONE idea: score floor 10 -> 12, margin 30% -> 80/90%.
# Conviction and size move together or the change is pointless in both directions.
#
# The floor is DERIVED: cheetah maxes at 15 and ships a floor of 10 (67%); penguin's 9-of-12 is
# 75%, the selectivity a one-slot whole-book position is built around; 75% of 15 is 11.25, and 12
# is cheetah's own second tier boundary.
#
# Leverage stays FLAT at 5x — every DSL threshold is ROE, so exit distance in price is
# (ROE / leverage), and a book spreading leverage cannot carry one ladder. Size scales, not leverage.
#
# catalog.status: blocked — never reaches a user. Deploy by explicit path:
#   python3 senpi-strategy-ops/scripts/deploy.py create strategies/wild-cheetah --budget <small>
schema_version: 1

id: wild-cheetah
version: "1.0.0"

catalog:
  name: "Wild Cheetah — Confluence Sniper at score 12 (experiment)"
  emoji: "🌶️"
  tagline: "Cheetah's confluence detector with the bar raised and the size raised to match: it only fires on a score of 12 out of a possible 15 instead of 10, and puts 80-90% of the book behind that one position instead of 18-48%. Conviction and size move together — the whole point is not to trade bigger, it is to trade bigger ONLY on what already cleared a higher bar."
  belief_plain: "This is Cheetah, made pickier and paid more when it is right. Cheetah already does nothing most of the time, waiting for a setup where the traders winning the last four hours, the velocity, the acceleration and the price on two timeframes all line up at once. Wild Cheetah demands more of that agreement before it acts — a score of 12 out of 15 rather than 10 — and in exchange puts most of the account behind the trade rather than a fifth of it. The reasoning is simply that a rare, strong signal is worth more than a common, adequate one, and that sizing them the same wastes the difference. Leverage does not change: it stays at 5x, because every exit threshold is measured as a percentage of your margin, so changing leverage silently moves every stop and profit floor. Size changes instead. Know the cost before funding it: one stop-out takes about 9% of the account, there is no second position to soften it, and nobody has yet measured how often a score of 12 actually appears."
  thesis: "Two changes to Cheetah, and they are one idea: minScore 10 -> 12, and margin 30% -> 80/90% by tier. Raising size without raising the bar is leverage with extra steps; raising the bar without the size leaves a rarer signal paid the same as a common one. The floor is derived rather than chosen — cheetah's scale maxes at 15 (SM 4 + velocity 2 + acceleration 2 + dual-price 2 + volume 1 + quality-align 3 + rank-climb 1), its shipped floor of 10 is 67% of that, and penguin's 9-of-12 is 75%, which is the selectivity a one-slot whole-book position is built around; 75% of 15 is 11.25, and 12 is both the next integer and cheetah's own second tier boundary. Leverage stays flat at 5x deliberately: every DSL threshold is ROE, so an exit's distance in price is ROE divided by leverage, and a book that spreads leverage across tiers cannot carry a single coherent ladder. Everything else is Cheetah's — the detector, the universe, the 4h cooldowns, the exits, and the ladder whose first rung arms at 0.6% of price. The open question is frequency: cheetah already refuses most ticks and a 4h emit cooldown sits on top, so if a score of 12 proves too rare to keep one slot busy the fallback is 11, not a return to 10."
  group: momentum
  archetype: breakout_momentum
  sub_style: confluence_sniper
  asset_classes: [universe_crypto]
  asset_scope: universe
  direction: long_short
  risk_level: aggressive
  status: blocked           # experiment — deliberately kept out of the catalog and discover
  tier: advanced
  time_horizon: swing
  leverage_max: 5
  max_slots: 1
  assets: []                # derived universe — coins come from the top-100 4h leader board each tick, not a fixed list
  tags: [leader-momentum, momentum, confluence, universe-scanner, sniper, conviction-leverage, single-slot, experiment, not-for-users, high-conviction]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: WILD_CHEETAH_WALLET
    funding_share: 1.0
