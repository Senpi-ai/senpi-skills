# ── MANATEE · Large-cap Mean-Reversion Inventory ──────────────────────────────────
# Two-sided inventory across BOTH venue boards, direction from the signal: at the DAILY close, LONG
# a name 5% or more below its 7-day mean, SHORT one 5% or more above it. Up to two adds, one per
# further 3% the next daily close moves against an under-water position. Exit by the DSL only, around
# the clock: a lock that arms at +1.4% over the (merged) average entry and keeps 95% of it — the
# vault's fixed-size harvest as a ratchet, tightened — and a 30% max-loss floor. No clocks. An add
# re-anchors the DSL on the new average entry. The engine reads CLOSED daily bars: market_get_asset_data serves 90 days of them
# with the in-progress bar last, and the scanner drops that bar and acts once per closed bar.
name: manatee-main
group: manatee
version: 1.0.0
description: >
  MANATEE — Mean-Reversion Inventory. Keeps up to 19 small positions, one per liquid asset on
  either venue board, long when the asset's daily close is at least 5% below its one-week average
  and short when it is at least 5% above it; the sign of the stretch is the direction, there is no bias. When a
  later daily close is a further 3% against a position that is under water it adds one more clip,
  up to two, so the average entry follows the move. The DSL alone closes a position, at any hour: a lock that arms
  at +1.4% over the average entry and keeps 95% of it, and a 30% max-loss floor that only a sustained
  one-way move reaches. Modelled on a public mean-reversion vault's observed engine (inventory that
  scales as the move deepens, fixed-size harvests over average cost), replayed minute by minute over
  19 June to 16 October 2026 with exits filled at the DSL floor.
strategy:
  wallet: "${MANATEE_WALLET}"
  slots: 10
  margin_pct: 1.5                    # baseline clip = the scanner's marginPct (PERCENT of withdrawable)
  default_leverage: 2                    # ROE = 2x the price move, so every DSL number below is DOUBLE its
                                         #   1.x value and the PRICE ladder is unchanged
  trading_risk: moderate
  enabled: true
scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: manatee_scanner
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300               # ticks every 5 minutes; acts on a name once per CLOSED daily bar
    timeout_seconds: 240
    default_signal_validity_seconds: 1800
    state_history_max_count: 200
    inputs:
      # ── universe: DERIVED from BOTH venue boards each tick, not hand-listed. The modelled vault's
      #    19 names are its liquidity constraint at $13.8M, not a thesis, and measured venue-wide the
      #    reversion this harvests is not a large-cap property at all. Replayed 2026-06-19..10-16 the
      #    two boards split hard — perp +0.02% net per clip, xyz +1.005% — so perp-only, which is what
      #    1.0.0 shipped, does not pay for its own fees. See derive_universe() in scan.py for the
      #    numbers and the caveats. A held name stays in scope below the floor.
      oiFloorUsd: 50000000              # open interest, read from market_list_instruments context
      maxNames: 24                      # ~20 clear the floor today; the cap bounds a liquidity surge
      minHistoryBars: 60                # closed daily bars before a name is judged — a fresh listing
                                        #   is unmeasured, and late listings underperformed by ~17%
      maxSlots: 10
      # ── the stretch (both sides), measured on CLOSED daily bars ──
      candleInterval: "1d"
      maBars: 7                         # the one-week mean
      retBars: 1                        # the one-day return, for the card only
      devPct: 5.0                       # at least 5% away from the 7-day mean at the close: below = LONG, above = SHORT
      deepDevPct: 7.0                   # depth bands, for the signal's band label only; every clip is the same size
      extremeDevPct: 10.0
      # ── fee gate: a SANITY CEILING, not a quote of your fees ──────────────────────────────
      #    Used for one purpose: refusing a harvest target too small to clear a round trip. The
      #    venue's BASE rates (your HL volume tier only lowers them); Senpi adds no fee on a paid
      #    plan, so none is assumed. The gate is inert at the shipped 1.4% harvest and only bites if
      #    someone tunes it down.
      takerFeeBps: 4.5
      makerFeeBps: 1.5
      feeCoverMultiple: 3.0             # the harvest must cover a round trip 3x over
      expectedCapturePct: 2.8           # = the DSL's first trigger, in ROE (2.8 ROE = 1.4% of price at 2x)
      # ── sizing (marginPct is a PERCENT of withdrawable): every entry and every add is one clip ──
      marginPct: 1.5                    # unchanged from 1.x — the clip floor in min_budget/validate rejects
      addMarginPct: 1.5                 #   any marginPct <= 1 as a pasted fraction, so the "same notional on
      leverage: 2                       #   half the margin" version (0.75 at 2x) is not shippable. SLOTS carry
                                        #   the adjustment instead: 10 x 3% notional = 30% gross, against 19 x
                                        #   1.5% = 28.5% at 1x. Same book size, half the margin behind it.
      # ── inventory scaling: one more clip per further addStepPct against an under-water position
      #    (the runtime merges the add; the DSL re-anchors on the new average entry) ──
      maxAddsPerAsset: 2
      addStepPct: 3.0
      # % of ACCOUNT VALUE per name, checked against the LIVE position's marginUsed, not against a
      # tally of what this scanner emitted: an emit tally cannot see a fill that did not happen, nor
      # one that happened twice (FEE_OPTIMIZED_LIMIT can double-fill), and this book adds into losers.
      maxMarginPctPerAsset: 4.5         # 4.5% margin at 2x = 9% NOTIONAL per name; 10 names caps the book at
                                        #   90% gross, against 85.5% at 1x with 19. A name on its stop costs
                                        #   4.5% x 60 ROE = 2.7% of the account; all ten = 27%.
      # ── free-margin gate ──
      venueMinNotionalUsd: 12.0         # the engine's bumped minimum order
      freeMarginHeadroom: 0.9           # commit at most 90% of free margin in one tick
    signal_data_schema:
      score: { type: number }
      direction: { type: string }
      leverage: { type: number }
      band: { type: string, required: false }
      kind: { type: string, required: false }
      addIndex: { type: number, required: false }
      devPct: { type: number, required: false }
      retPct: { type: number, required: false }
      reasons: { type: array, required: false }
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: manatee_open
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [manatee_scanner]
    params:
      order_type: FEE_OPTIMIZED_LIMIT   # a daily stretch persists for minutes; rest first, cross only if it runs
      fee_optimized_limit_options: { ensure_execution_as_taker: true, execution_timeout_seconds: 60 }
    context:
      - { type: signal, scanner: manatee_scanner }
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT       # the profit lock is a pullback exit, not a stop: it can rest
  fee_optimized_limit_options: { ensure_execution_as_taker: true, execution_timeout_seconds: 45 }
  dsl_preset:
    # No hard_timeout / weak_peak_cut / dead_weight_cut: the DSL decides every exit.
    phase1:
      enabled: false
      max_loss_pct: 60.0                # 60 ROE at 2x = the SAME 30% price floor as 1.x; still stops with phase1 disabled
      retrace_threshold: 30
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                            # trigger_pct is ROE, so at 2x each number is twice the price move and
                                        #   every threshold here is exactly double its 1.x value — the PRICE ladder
                                        #   does not move. Tier 0 is the harvest: 2.8 ROE = +1.4% of price over
                                        #   average entry, 95% of it kept. 1.4% of price beat the vault's 3.0% not
                                        #   on size but on turnover and tail: a median 8h to resolution instead of
                                        #   30h, and 15 stop-outs on the perp board instead of 33, at the same net.
        - { trigger_pct: 2.8, lock_hw_pct: 95 }
        - { trigger_pct: 12, lock_hw_pct: 90 }
        - { trigger_pct: 24, lock_hw_pct: 90 }
risk:
  data_retention_seconds: 604800
  guard_rails:
    daily_loss_limit_pct: 8     # above the replay's worst day (-6%), so a crash day's adds are not halted
    max_entries_per_day: 20             # 10 names, at most one entry or add each per daily bar
    bypass_max_entries_per_day_on_profit: true
    max_consecutive_losses: 6
    cooldown_seconds: 300
    # BEYOND the replay's worst drawdown, which was -26.1% (Jul 2024 - Jun 2025, 4h-close arming).
    # It must be: this halt is LATCHED (drawdown_reset_on_day_rollover defaults false), so a halt
    # inside the replayed range does not shade the result, it ends the run and waits for a human.
    # At 25 that window's reported +2.4% was unreachable — the strategy would have stopped at -25%.
    drawdown_halt_pct: 30
    per_asset_cooldown_seconds: 1800
notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
