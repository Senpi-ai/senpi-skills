# Hornet Concentrated — hornet's supply-chain momentum taken as TWO positions at 10x
# instead of three at 4x. A single-instance PACKAGE: this manifest + one self-contained
# runtime.yaml + scanners/ (byte-identical to hornet's — only the config differs).
#
# Listed in the catalog and in discover. Compare it against the parent it varies, not on its
# own: see senpi-strategy-discover/references/variant-families.md.
#
# Two things move on purpose, and they move together: CONCENTRATION (45% margin per position
# instead of 18%) and SIZE (10x instead of 4x). The guard rails widen with them: one stop costs
# 1.44% of a 3-slot hornet but 5.40% concentrated, so hornet's 15% daily limit would halt the
# book after a single loss.
#
# 1.1.0 — THE EXITS ARE THE LIVE FORK'S, AND 1.0.0'S WERE WRONG. This package was derived from
# a live 45%/10x fork (Hornet v1.1.2 base, DSL from Camel Concentrated) that already carried
# its own measured ladder. 1.0.0 re-derived every rung to preserve the PARENT hornet's price
# distances instead — a rule that is right for a concentrated variant in general, but anchored
# on the wrong parent here, and it discarded the fork's geometry. The package shipped the
# fork's SIZING wearing the TEMPLATE's EXITS: concentrated risk with loose protection.
#
# In price terms at 10x, 1.0.0 armed the first lock at 2.50% instead of 1.50%, kept 20% of
# high-water instead of 40%, and set the stop at 2.00% instead of 1.20% — later, less, and
# wider, all at once. Measured on the live book 2026-10-13, arming at 1.5% and keeping 60% was
# worth +$755 over 245 trades. 1.1.0 ships the fork's ladder: 1.50/40, 2.80/45, 5.60/65,
# 10.00/80, 18.00/90, stop 1.20% of price.
#
# Two slots, not three. Measured on a live 45%/10x instance over 3 days and 7 opens, peak
# concurrent positions was 2 and never 3 — at 45% of withdrawable per open there is no room
# for a third, so a third slot only produces emits that cannot fill.
#
# Install/teardown via senpi-strategy-ops.
schema_version: 1

id: hornet-concentrated
version: "1.1.0"

catalog:
  name: "Hornet Concentrated — Supply-Chain Momentum, Two Bets at 10x"
  emoji: "🐝"
  varies: hornet          # a VARIANT of this template — never outrank it
  tagline: "Hornet's semiconductor supply-chain momentum, concentrated: TWO positions at 45% margin and 10x instead of three at 18% and 4x. Same breadth gate, same universe, same signal — and the exits of the live 45%/10x book this was built from: the first profit lock arms on a 1.5% move and keeps 40% of the peak, the stop sits 1.2% away, and no clock closes anything. The guard rails are widened to absorb a stop that costs 5.4% of the account instead of 1.4%."
  belief_plain: "The same strategy as Hornet — it trades the semiconductor supply chain on Hyperliquid XYZ and only acts when the whole chain is trending together — but it puts the money behind far fewer, bigger bets. Hornet spreads across up to three positions at 18% of your balance each. This version takes at most two, at 45% each, with 10x leverage instead of 4x. Because each position carries more, the exits are tighter rather than roomier: it starts protecting a gain after a 1.5% move and keeps 40% of the best price reached, and it cuts a loser 1.2% away. One stop-out costs about 5.4% of the account here against 1.4% on Hornet, and one good run pays correspondingly more."
  thesis: "Hornet's edge is the breadth gate, not its sizing — so the question concentration asks is whether the gate is good enough to back harder. This variant answers it with two levers moved together: margin per position 18% -> 45% and leverage 4x -> 10x, which raises gross notional rather than merely redistributing it. Everything that defines the edge is untouched: the same 16-name basket, the same sub-group gradient, the same 0.55/0.35 breadth thresholds, the same scanner bytes. What is NOT the parent's is the exit ladder, and that is deliberate as of 1.1.0: this package was built from a live 45%/10x fork that had its own measured exits, and 1.0.0 wrongly re-derived them onto the parent's price grid, arming the first lock a third later and keeping half as much. Concentrated money is protected harder, not given the same room — the first lock arms on a 1.5% move keeping 40% of the peak, rungs run 2.80/45, 5.60/65, 10.00/80, 18.00/90, and the stop sits 1.2% of price away. No clock closes anything; the ratchet and that stop are the only exits. Offer this only to someone who has asked for leverage AND concentration; it is among the most aggressive packages in the catalog."
  group: momentum
  archetype: breakout_momentum
  sub_style: sector_momentum
  asset_classes: [xyz_equities]
  asset_scope: basket
  direction: long_short
  risk_level: aggressive
  tier: advanced
  time_horizon: swing
  leverage_max: 10
  max_slots: 2
  min_budget_floor: 20      # computes to $10 unaided, because 45% x 10x clears the venue's
                            # notional floor on less capital than hornet's 18% x 4x. Pinned to
                            # the parent's $20: the MORE aggressive variant must never advertise
                            # a LOWER entry price than the strategy it varies — a user reads that
                            # as the safer thing to try first.
  assets: ["xyz:ASML", "xyz:AMAT", "xyz:MRVL", "xyz:NVDA", "xyz:AMD", "xyz:AVGO", "xyz:TSM", "xyz:QCOM", "xyz:ARM", "xyz:INTC", "xyz:SMH", "xyz:MU", "xyz:SNDK", "xyz:SMSN", "xyz:SKHX", "xyz:WDC"]
  # NO `concentrated` / `high-leverage` tags, deliberately. Those tags are already wrong on
  # several packages (penguin-x5 carries both at HALF penguin's leverage) and the doctrine is to
  # read the axis off `max_slots` / `leverage_max` instead — see variant-families.md. Adding them
  # here also made this package outrank puffin on puffin's own 'concentrated single position high
  # leverage' query, which is exactly the shortlist-crowding a variant must never do.
  tags: [semiconductors, ai-capex, supply-chain, sector-breadth, equities, xyz, nvda, asml, tsm, momentum, leader-momentum, basket, long-short, advanced, 23-5]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: HORNET_CONCENTRATED_WALLET
    funding_share: 1.0
