# ── VULTURE · single instance — Long-Tail Momentum Rider (Runtime 3.0 port of v2 vulture v4.2.0) ──
#
# 2.0.0 (2026-10-12) — the chart confirms the board. Measured on 553 live Vulture signals (21 Aug to
# 12 Oct 2026, public candles, this package's own exits, 0.18% fees): the board's pick alone was
# fee-neutral (+0.09% per trade); the 185 signals on the wrong side of the 50-day average lost 0.83%
# each (every short the fleet took was one of them); with the three chart gates below, the 203
# remaining signals made +0.85% per trade, profit factor 1.6, 56% winners — a September-heavy
# window, and the first twelve days of October were negative. The gates: the price on the trade's
# side of the 50-day simple average of closed daily candles; the 15-minute price already moving with
# the trade; the price in the favourable half of the trailing 24-hour range. The per-name
# funding-history read is gone (0 of 571 live emits ever carried a persistence value), so a tick is
# five reads plus one candle read per board-gated name, and the cadence returns to 60 seconds —
# every minute between the signal and the fill cost about 0.05% of the entry.
#
# 1.3.0 (2026-10-12), from the audit of live wallets (16 users, 60 days): 74% of closes were the
# exchange stop, and the book was net negative after fees. The stop moved from 10% ROE (1.43% of
# price at the old 7x) to 15% ROE at a 5x cap (3.0% of price, outside the measured 1.38% p75 adverse
# bounce of this universe); leverage is clamped to the venue's own cap per name (12 of 27 names are
# capped at 3x or 5x and used to be asked for more); the clock cuts are off (of 142 clock closes
# measured in one fleet week 110 were in profit); a volume floor keeps names that trade under a
# million dollars a day out of the book.
name: vulture-main
group: vulture
version: 3.0.0
description: >
  VULTURE — multi-asset small-cap momentum rider. Scans the venue's own liquid long tail — every
  listed perp over $1M/day minus BTC/ETH/SOL and the xyz book, derived each tick — of
  small/mid-cap Hyperliquid perps (BTC/ETH/SOL + XYZ banned) via leaderboard_get_markets:
  the board picks the name and the side (4h-leader concentration aligned with the 4h and
  1h price and an accelerating 15m contribution, LONG_TAIL_MOMENTUM score >= 10), and the
  chart confirms the timing (2.0.0): the price on the trade's side of its 50-day average,
  the 15-minute price already moving with the trade, and the price in the favourable half
  of the trailing 24-hour range. 5x on every entry, clamped to the venue's cap for that
  name; names under the daily-volume floor are skipped. DSL is the ONLY exit: no
  dead_weight_cut, no hard_timeout, no weak_peak_cut — a 15% ROE stop (3% of price at 5x)
  and a ratchet that locks 40% of the gain from +15% ROE. Two slots at 40% margin.
  Measured on the live signal stream: about one to two confirmed entries a day per
  wallet, none in the 00-04 UTC quiet window below the apex score.

strategy:
  wallet: "${VULTURE_WALLET}"
  slots: 2                                 # v2 ran 2 concurrent positions
  margin_pct: 40                           # per-slot margin %; 2 x 40% = 80% of the book, 64% effective
  default_leverage: 5                      # fallback; scan emits 5x clamped to the venue cap per name
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: vulture_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 60                    # 2.0.0: back to a minute — each minute between signal and fill cost
                                            # ~0.05% of the entry; the per-name funding read that made a minute expensive is gone
    timeout_seconds: 45                     # five reads + one candle read per board-gated name (none to three)
    default_signal_validity_seconds: 1800
    state_history_max_count: 100            # dedup map + per-tick scan-results history
    inputs:
      # 2.1.0 — THE UNIVERSE IS DERIVED, not listed. Every listed perp over the volume floor,
      # minus BTC/ETH/SOL and the xyz book, ranked by daily notional and capped at
      # maxUniverseNames. A screener reads the market; a fixed list is only right for an
      # identity basket, and this one had started to rot in both directions — measured
      # 2026-10-12, 4 of its 27 names (AIXBT, DYDX, HEMI, POLYX) had fallen under the $1M/day
      # floor while 87 listed perps cleared it, so the list carried 4 names the floor rejects
      # and missed 64 it accepts, among them XRP at $147M/day, PUMP at $152M and STRK at $108M.
      #
      # `whitelist` is now an OPTIONAL OVERRIDE and ships UNSET. Setting it pins the universe to
      # exactly those names (and is the documented fallback if the instrument read fails). The
      # historical 27 are kept in scoring.DEFAULT_WHITELIST for an operator who wants them.
      # whitelist: ["HYPE", "NEAR", ...]   # uncomment to pin an explicit basket
      maxUniverseNames: 60                  # 87 cleared the floor on 2026-10-12; the liquid part
      excludeAssets: ["USDC", "USDT", "DAI", "USDE", "FDUSD", "TUSD", "BUSD"]
      maxChartReads: 6                      # slots is 2, candidates are score-sorted, and
                                            # timeout_seconds is 45 against a 60s tick — the read
                                            # count must not grow with the universe. See
                                            # strategies/tests/test_scanner_timeout_headroom.py.
      xyzBanned: true
      minDayNtlVlmUsd: 1000000              # skip a name trading under $1M/day (read live from
                                            # market_list_instruments each tick). This is now the
                                            # universe's own floor, not just a per-name veto.
      maxLeverage: 5                        # package cap; the venue's own max per name clamps below it
      # MIN_SCORE 10 — the v4.2.0 PRODUCER floor (culled 9->10 after a 100-trade
      # analysis: every bucket >=10 net-positive, every bucket <=9 net-negative).
      minScore: 10
      minSmPct: 3.0                         # v2 MIN_SM_PCT
      minSmTraders: 15                      # v2 MIN_SM_TRADERS
      min4hAlignedPct: 1.0                  # v2 MIN_4H_ALIGNED_PCT
      min1hAlignedPct: 0.1                  # v2 MIN_1H_ALIGNED_PCT (the v2.4 false-breakout gate)
      min15mVelocity: 0.3                   # v2 MIN_15M_VELOCITY
      marginPct: 40                         # PERCENT of withdrawable (0,100] — runtime sizes (marginPct/100)*withdrawable
      # conviction tiers kept for the score bands; leverage is 5 on both since 1.3.0 (the 7x apex
      # put the 10% stop 1.43% from entry, inside the universe's p75 bounce). [min_score, leverage, label]
      leverageTiers:
        - { min_score: 11, leverage: 5, label: apex }
        - { min_score: 10, leverage: 5, label: conviction }
      # FP-001 quiet hours — 00:00-04:00 UTC; apex score >=11 bypasses. start==end disables.
      quietStartUtc: 0
      quietEndUtc: 4
      apexBypassScore: 11
      recentSignalTtlSeconds: 14400         # 240m — mirror the v2 per-asset cooldown
      # 2.0.0 — the chart confirms the board (scoring.confirm_candidate); unreadable candles fail closed
      trendSmaDays: 50                      # closed daily candles; LONG above the average, SHORT below (the 91-row 1d feed)
      minPriceChange15mPct: 0.5             # the 15m price must already move WITH the trade; measured 0.2-1.0 all clear fees
      minRangePosition: 0.5                 # favourable half of the trailing range (1 = at the day's extreme in trade direction)
      rangeLookbackHours: 24                # closed hourly candles in the range
    signal_data_schema:
      score: { type: number }
      tier: { type: string, required: false }
      leverage: { type: number }
      direction: { type: string }
      reasons: { type: array, required: false }
      smPct: { type: number, required: false }
      smTraders: { type: number, required: false }
      priceChange4hPct: { type: number, required: false }
      priceChange1hPct: { type: number, required: false }
      priceChange15mPct: { type: number, required: false }
      contribChange15m: { type: number, required: false }
      contribChange1h: { type: number, required: false }
      contribChange4h: { type: number, required: false }
      fundingRegime: { type: string, required: false }
      venueMaxLeverage: { type: number, required: false }
      dayVolumeUsd: { type: number, required: false }
      trendRegime: { type: string, required: false }
      trendSma: { type: number, required: false }
      rangePos24h: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: vulture_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                     # the scan already applied every filter (v2 LLM gate was pass-through)
    scanners: [vulture_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true     # 60s ALO then taker fallback (v2 setting)
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: vulture_main_signals

# EXIT — DSL only. Every threshold is ROE; price distance is ROE / leverage, and leverage is 5x
# (or the venue cap below it), so: stop 3.0% of price; rungs arm at +3% / 5% / 8% / 15% / 20%
# of price and lock 40 / 60 / 75 / 75 / 85% of the best ROE. The first rung arms AT the stop
# distance — risk 3% to make 3%, then keep 40% of it. Clock cuts are OFF (1.3.0): the 90-minute
# dead-weight cut and the 7-day timeout closed on elapsed time and read nothing about the trade.
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: false                        # 1.3.0: was 7 days — a winner is not cut for being old
      interval_in_minutes: 10080
    weak_peak_cut:
      # DISABLED - this cut closes at MARKET at whatever price is there, with no floor, so on a
      # longer-hold book it realises a small LOSS on a position that simply hadn't moved yet
      # (observed live on xyz:PLTR in cougar). Same defect we removed from phase1. weak_peak is
      # a CHOP tool only: it belongs where the strategy already intends to be out within hours.
      enabled: false
      interval_in_minutes: 180              # 3h
      min_value: 2.0
    dead_weight_cut:
      enabled: false                        # 1.3.0: was 90 minutes — a flat 90 minutes is not a failed thesis
      interval_in_minutes: 90
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a favourable move it
      # could sit BELOW entry and close a winner at a loss. max_loss_pct is the hard stop;
      # retrace_threshold below is inert while enabled: false.
      enabled: false
      max_loss_pct: 15.0   # 1.3.0: was 10.0 (1.43% of price at 7x, inside the 1.38% p75 bounce); 3.0% at 5x
      retrace_threshold: 15
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 15,  lock_hw_pct: 40 }   # +3.0% of price -> floor +1.2% (1.3.0: lock 35 -> 40)
        - { trigger_pct: 25,  lock_hw_pct: 60 }   # +5.0%          -> floor +3.0%
        - { trigger_pct: 40,  lock_hw_pct: 75 }   # +8.0%          -> floor +6.0%
        - { trigger_pct: 75,  lock_hw_pct: 75 }   # +15%           -> floor +11.3%
        - { trigger_pct: 100, lock_hw_pct: 85 }   # +20%           -> floor +17%

risk:
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 6                   # above the 2 slots: a re-entry after a stop-out is not blocked until midnight
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 1800                  # 30m (v2 cooldown_minutes: 30)
    drawdown_halt_pct: 25                   # the wallet-wide hard stop; never re-arms at midnight
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 14400       # 4h — preserves v2 sniper cadence (v2 per_asset_cooldown_minutes: 240)
