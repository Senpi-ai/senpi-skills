# Vulture — strategy package deploy manifest (single source of truth for deploy + attribution).
# A strategy is a PACKAGE: this manifest + one self-contained runtime.yaml + main/scanners/.
# The runtime SUPERVISES the scanner's scan(inputs, ctx) in-process — there is no separate
# scanner daemon. A faithful Runtime 3.0 port of the v2 Vulture producer (v4.2.0):
# LONG_TAIL_MOMENTUM scoring over a 27-coin small-cap whitelist, conviction-scaled leverage,
# DSL-only exits. Install/teardown via senpi-strategy-ops.
schema_version: 1

id: vulture                  # == package dir name; == the instance runtime.yaml `group`
version: "1.3.0"             # single source for catalog + MCP attribution (skillName/skillVersion)

catalog:                     # discovery surface. `group` here is the discovery TAXONOMY bucket.
  name: "Vulture — Small-Cap Momentum Rider"
  emoji: "🦅"
  tagline: "Scans a whitelist of 27 small/mid-cap Hyperliquid perps (majors and XYZ are banned) and rides the 4h leaders' side: enters when the 4h leaders' concentration (the traders winning the last four hours on the board) aligns with a fresh 4h trend, the 1h confirms it isn't a false breakout, and 15m velocity is accelerating — at 5x, never above the venue's own cap for the name, skipping anything trading under a million dollars a day, with a 3%-of-price stop and a trailing stop that only ever moves in your favour. Measured on live wallets: about five entries a week each."
  belief_plain: "Hunts the small coins most templates leave alone. It only buys (or shorts) one when the traders winning the last four hours are crowding in, the 4-hour trend agrees, the 1-hour isn't already rolling over, and short-term momentum is building — then trails a stop. Most trades end at the stop, about 3% of price away; the occasional big winner is what pays for them. It is quiet from midnight to 4am UTC unless a setup is exceptional."
  thesis: "The biggest blind spot on Hyperliquid is the small/mid-cap long tail — every other agent is locked to the majors or a single asset, so nobody is reading the 4h leaders' flow on HEMI, WLD, XPL, AIXBT and the rest. Small caps have a thicker trader-count signal-to-noise ratio than the majors: when the 4h leaders' concentration on one (a momentum read of who is winning right now, not a proven cohort) aligns with a fresh 4h trend and accelerating 15m velocity, that's a momentum entry with a long right tail. A low win rate is fine when the winners are several times the size of the losers."
  group: multi-asset-whitelist
  archetype: trend_following
  sub_style: basket
  asset_classes: [major_alts, universe_crypto]
  asset_scope: basket
  direction: long_short
  risk_level: aggressive
  tier: advanced
  time_horizon: swing
  leverage_max: 5
  max_slots: 2
  assets:
    ["HYPE", "HEMI", "WLD", "MON", "XPL", "AIXBT", "ARB", "ASTER",
     "POLYX", "LDO", "APT", "DYDX", "ONDO", "SUI", "kBONK", "kPEPE",
     "TAO", "GRASS", "ZEC", "LIT", "FARTCOIN", "MORPHO", "NEAR", "INJ",
     "AVAX", "LINK", "DOGE"]
  tags: [small-cap, momentum, leader-momentum, long-tail, whitelist, multi-asset, venue-cap, volume-floor, dsl-only]

requires:
  runtime: ">=3.0.0"

defaults:                    # env VAR NAMES only — never values. Rule-mode: no decision_model_env.
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml       # → runtime name vulture-main, group vulture
    wallet_env: VULTURE_WALLET        # bound as ${VULTURE_WALLET} in main/runtime.yaml
    funding_share: 1.0
