# Vulture — strategy package deploy manifest (single source of truth for deploy + attribution).
# A strategy is a PACKAGE: this manifest + one self-contained runtime.yaml + main/scanners/.
# The runtime SUPERVISES the scanner's scan(inputs, ctx) in-process — there is no separate
# scanner daemon. A faithful Runtime 3.0 port of the v2 Vulture producer (v4.2.0):
# LONG_TAIL_MOMENTUM scoring over a universe DERIVED live from the venue (2.1.0: every listed perp
# over $1M/day minus BTC/ETH/SOL and the xyz book, ranked by notional), chart confirmation (50-day
# trend, 15m direction, day range), 5x clamped to the venue, DSL-only exits. Install/teardown via
# senpi-strategy-ops.
schema_version: 1

id: vulture                  # == package dir name; == the instance runtime.yaml `group`
version: "2.1.0"             # single source for catalog + MCP attribution (skillName/skillVersion)

catalog:                     # discovery surface. `group` here is the discovery TAXONOMY bucket.
  name: "Vulture — Small-Cap Momentum Rider"
  emoji: "🦅"
  tagline: "Scans the venue's own liquid long tail — every listed Hyperliquid perp trading over a million dollars a day, minus BTC/ETH/SOL and the XYZ book, re-derived every tick rather than hand-listed. The board picks the name and the side — the traders winning the last four hours crowding into one name while its 4h and 1h prices agree and its 15m contribution accelerates — and the chart confirms the timing: the price on the trade's side of its 50-day average, the 15-minute price already moving with the trade, and the price in the favourable half of the day's range. 5x, never above the venue's own cap for the name, nothing under a million dollars a day, a 3%-of-price stop and a trailing stop that only ever moves in your favour. Measured on 553 live signals: the board alone was fee-neutral, the confirmed entries made 0.85% a trade with 56% winners."
  belief_plain: "Hunts the small coins most templates leave alone, and works out which ones those are by reading the exchange every minute rather than from a list someone typed. It only buys (or shorts) one when the traders winning the last four hours are crowding in and the chart agrees three ways: the coin is on the right side of its 50-day average, the last fifteen minutes already moved the way it wants to trade, and the price sits in the better half of the day's range. Then it trails a stop. Most losers end at the stop, about 3% of price away; the winners run further than the losers, which is what pays. In a down month the longs get stopped — the wallet-wide 25% halt is the backstop. It is quiet from midnight to 4am UTC unless a setup is exceptional."
  thesis: "The small/mid-cap long tail is where the 4h leaders' flow is loudest and least watched. The board's pick alone is not an edge after fees: measured on 553 live signals it was fee-neutral, and every entry taken against the 50-day trend lost. The edge is the board's pick WITH the chart's confirmation — trend side, 15-minute direction, position in the day's range — which turned the same signal stream into +0.85% a trade at a 1.6 profit factor. A long-right-tail momentum book: the exit is a ratchet, never a clock, so the occasional runner is allowed to pay for the stops. The universe is read, not chosen: a screener's universe is a market reading, and the 27-name list this replaced had begun to rot in both directions — on 2026-10-12 four of its names had fallen under the liquidity floor while 87 listed perps cleared it, including names trading over a hundred million dollars a day that the list had never heard of."
  group: multi-asset-screener
  archetype: trend_following
  sub_style: basket
  asset_classes: [major_alts, universe_crypto]
  asset_scope: universe
  direction: long_short
  risk_level: aggressive
  tier: advanced
  time_horizon: swing
  leverage_max: 5
  max_slots: 2
  # DERIVED live from market_list_instruments each tick — deliberately empty. The historical
  # 27-name basket is kept in scoring.DEFAULT_WHITELIST for an operator who wants to pin it
  # via the `whitelist` input.
  assets: []
  tags: [small-cap, momentum, leader-momentum, long-tail, screener, derived-universe, multi-asset,
         chart-confirmed, trend-filter, venue-cap, volume-floor, dsl-only]

requires:
  runtime: ">=3.0.0"

defaults:                    # env VAR NAMES only — never values. Rule-mode: no decision_model_env.
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml       # → runtime name vulture-main, group vulture
    wallet_env: VULTURE_WALLET        # bound as ${VULTURE_WALLET} in main/runtime.yaml
    funding_share: 1.0
