# ── MUSTANG · single instance — ride the Nasdaq 100 in an uptrend, buy only washouts in a downtrend ──
# One market, xyz:XYZ100, long only, 3x. The regime is the Nasdaq 100's own long-term trend: its
# latest daily close against the average of its last 40 closed WEEKLY closes (the 200-trading-day
# average; the daily feed carries only ~90 days, the weekly feed a year). At each UTC-midnight daily
# close, with nothing held:
#   uptrend   -> buy, unless the 10-day RSI closed at or over 79 (no entry into a blow-off)
#   downtrend -> buy only if the 10-day RSI closed under 30 (a washout); otherwise stay in USDC
# The DSL is the ONLY exit: a 30% ROE stop (10% of price at 3x) and a wide ladder that lets a trend
# run. No clocks. After an exit, the next daily close decides again.
#
# Why these numbers: replayed on 16.7 years of US daily bars (Mar 2010 - Nov 2026; QQQ for XYZ100,
# the regime from QQQ's 40-week average exactly as the scanner computes it — it disagrees with the
# daily 200-day average on 14 of 3,981 days), entry at the signal close, the stop on the wick, rungs
# arming on the close, charged Hyperliquid's own cost for xyz:XYZ100 (taker fee both sides, about
# 0.018% a round trip in growth mode, plus its measured spread): 61 trades, 77% winners, profit factor
# 2.81 (2.49 with rungs arming on the bar extreme), median hold 44 days; uptrend entries 2.96,
# washouts 2.24; worst drawdown 22.5% at 30% margin. All 1,458 neighbouring settings (average
# 30/40/50 weeks, RSI 8/10/12, overheat 75/79/83, washout 28/30/32, stop 21/30/40, three ladders,
# both arming bounds) cleared fees, the worst at 1.85. On the exchange's own candles (Oct 2025 - Nov
# 2026, the regime read off the US index because the exchange's weekly history is too short to seed
# it): 5 trades, profit factor 2.7. The downtrend SHORT of the original rule (below the 20-day
# average) lost at 13 of 15 settings tried and is not here. Measurement in the commit that added this.
name: mustang-main
group: mustang
version: 1.0.0
description: >
  MUSTANG — the Nasdaq 100 (xyz:XYZ100) trend rider, long only at 3x. Its regime is the
  index's own long-term trend: the latest daily close against the average of its last 40 weekly
  closes. At each UTC-midnight daily close, with nothing held, it buys in an uptrend unless the
  10-day RSI has run over 79, and in a downtrend only when that RSI has closed under 30; otherwise
  it waits in USDC. One position at 30% of withdrawable as margin. The DSL is the only exit — a 30%
  ROE stop (10% of price) and a wide ladder that first locks a share of the gain at +5% of price and
  lets a trend run; no clock closes anything. Expect a trade every three months or so, held for
  weeks to months.

strategy:
  wallet: "${MUSTANG_WALLET}"
  slots: 1                                # one market, one position
  margin_pct: 30                          # baseline %; scan emits marginPct per signal (same number)
  default_leverage: 3                     # fallback; scan emits the same 3x per signal
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: mustang_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300                  # the daily close is the only decision point; 5 min bounds the delay
    timeout_seconds: 120                   # one account read + one candle read (two when regime != trade market)
    default_signal_validity_seconds: 600   # 2x tick; rule action, a fresh re-score never re-emits a bar
    state_history_max_count: 50            # (market, bar) dedup map + per-tick result
    inputs:
      allowedAssets: ["xyz:XYZ100"]        # the market traded — the xyz: prefix is mandatory
      regimeAsset: "xyz:XYZ100"            # the market whose long-term trend sets the regime
      regimeWeeks: 40                      # average of the last 40 CLOSED weekly closes = the 200-trading-day average
      rsiPeriod: 10                        # Wilder RSI on CLOSED daily candles of the traded market
      overheatRsi: 79                      # uptrend: no entry when RSI closed at or over this
      dipRsi: 30                           # downtrend: entry only when RSI closed under this
      entryWindowSeconds: 3600             # buy within the hour after the UTC-midnight close, or wait a day
      leverage: 3
      stopRoePct: 30                       # MUST equal exit.dsl_preset.phase1.max_loss_pct (tests pin it)
      marginPct: 30                        # PERCENT of withdrawable (0,100]; one slot
      maxSlots: 1
      minNotionalUsd: 12                   # the venue's bumped minimum; the free-margin gate stops emitting below it
    signal_data_schema:
      leg: { type: string }
      direction: { type: string }
      rsi: { type: number }
      regimeUp: { type: boolean }
      regimeClose: { type: number }
      regimeAverage: { type: number }
      signalBarTime: { type: number }
      leverage: { type: number }
      stopPricePct: { type: number }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: mustang_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied the whole rule (regime + RSI + close)
    scanners: [mustang_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # the buy is AT the close — maker window first, taker fallback
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: mustang_main_signals

# ── EXIT (DSL only) ───────────────────────────────────────────────────────────────────────
# Every threshold is ROE (% of margin); at 3x its distance in PRICE is ROE / 3. Stop 10% of price;
# rungs arm at +5% / +8.3% / +13.3% / +20% / +33% and lock 30 / 45 / 60 / 75 / 85% of the best gain.
# The first lock is low on purpose: an uptrend entry is a long hold, and a ladder that locks hard
# early sells the trend at its first wobble (the tighter ladders replayed lower).
# Clock cuts are OFF: of 142 clock-driven closes measured in one fleet week, 110 were in profit.
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true        # closes MUST happen — taker fallback safety floor
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout: { enabled: false, interval_in_minutes: 4320 }
    weak_peak_cut: { enabled: false, interval_in_minutes: 360, min_value: 3.0 }
    dead_weight_cut: { enabled: false, interval_in_minutes: 60 }
    phase1:
      # Trailing DISABLED fleet-wide: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss. max_loss_pct is the hard
      # stop; retrace_threshold is inert while enabled is false.
      enabled: false
      max_loss_pct: 30.0   # 10% of price at 3x — mirrored by inputs.stopRoePct
      retrace_threshold: 30
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                               # trigger / lock, ROE; price at 3x in the comment
        - { trigger_pct: 15, lock_hw_pct: 30 }   # +5% of price    -> floor +1.5%
        - { trigger_pct: 25, lock_hw_pct: 45 }   # +8.3%           -> floor +3.75%
        - { trigger_pct: 40, lock_hw_pct: 60 }   # +13.3%          -> floor +8%
        - { trigger_pct: 60, lock_hw_pct: 75 }   # +20%            -> floor +15%
        - { trigger_pct: 100, lock_hw_pct: 85 }  # +33%            -> floor +28.3%

# ── RISK guard rails (one slow book: rare entries, a wide stop, no self-resetting breaker) ──
risk:
  data_retention_seconds: 604800           # 7d — a position can live for months
  guard_rails:
    daily_loss_limit_pct: 12               # one stop-out is 30% x 30% = 9% of the account
    max_entries_per_day: 2                 # one per daily close; the second covers a re-entry the next close
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 86400                # a day after three losses in a row
    drawdown_halt_pct: 30                  # the wallet-wide hard stop; above the replay's 23% worst drawdown
    drawdown_reset_on_day_rollover: false  # clearing it is a deliberate act (redeploy), not midnight
    per_asset_cooldown_seconds: 300        # the scanner already allows one entry per daily close

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
