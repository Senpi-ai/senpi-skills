# strategy.yaml — barracuda (the manifest: identity + catalog facets + instance)
schema_version: 1
id: barracuda
version: "1.1.0"                  # the ONE strategy semver (catalog + MCP attribution derive from it)

catalog:
  name: "Barracuda"
  emoji: "🦈"
  # Controlled vocabulary (discovery HARD-FILTERS on these — must come from the glossary).
  # NOTE: "breakout_momentum" is the honest closed-set archetype; the strategy's
  # dynamic-screener character is carried in sub_style + belief_plain, since
  # "dynamic-screener" is not a valid archetype value.
  archetype: breakout_momentum
  sub_style: dynamic_screener
  asset_classes: [universe_crypto, xyz_equities]   # scans the whole liquid crypto universe AND xyz equity perps
  asset_scope: universe
  direction: long_short
  risk_level: aggressive
  tier: advanced
  leverage_max: 6
  belief_plain: >
    Continuously scans every liquid crypto and xyz: equity perp for breakouts and
    breakdowns, opens with the strongest momentum in either direction (confirmed by
    smart-money positioning, funding squeeze and rising open interest, with a size
    bonus for the harder-pumping small caps), lets winners run on a trailing stop,
    and banks the whole book once total profit hits its target.
  thesis: >
    You want an always-on screener that hunts the hottest moves across the entire
    market — long the breakouts, short the breakdowns — instead of watching a fixed
    basket, and you accept the higher turnover and leverage that pump-chasing implies.
  tags: [breakout, breakdown, momentum, pump, dual-direction, long-short, screener, rotation, hot-movers, funding-squeeze, smart-money, universe, all-coins, xyz-equities]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: BARRACUDA_WALLET
    funding_share: 1.0
