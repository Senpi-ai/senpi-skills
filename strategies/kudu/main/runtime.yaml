# ── KUDU · single instance — a quality big-tech basket, timed by the Nasdaq ─────────────────────────
# Ten large quality companies held at 2x, equal clips: xyz:AAPL, MSFT, GOOGL, AMZN, META, NVDA, AVGO,
# ORCL, LLY, COST. At each UTC-midnight daily close any name not held is bought unless the Nasdaq 100's
# 10-day RSI closed at or over 79 (overheated: wait); when that RSI closes under 30 (washed out) the
# Nasdaq 100 itself (xyz:XYZ100) is bought at 3x on top. Every position has its own DSL; a stopped-out
# name is bought back at the next close that is not overheated. No clocks, no shorts.
#
# Why these numbers: replayed on US daily bars Jan 2010 - Nov 2026, entry at the signal close, the stop
# on the wick, rungs arming on the close, 0.18% round-trip fees: 810 trades across the book (about
# 0.4 a month per name), 77% winners, profit factor 2.59 (2.45 arming on the bar extreme); every name
# positive (ORCL and META weakest at 1.9, COST strongest at 6.4); washout entries 2.92; every four-year
# block positive (2.86 / 5.22 / 2.37 / 2.08); worst book drawdown 31% at these clips. All 486
# neighbouring settings (RSI 8/10/12, overheat 75/79/83, washout 28/30/32, stop 21/30/40, three
# ladders, both arming bounds) cleared fees, the worst at 1.76. CAVEAT: the ten names are today's
# winners, so a 2010-2026 replay of them is flattered by hindsight. The same rule with the Nasdaq 100
# itself as the "basket" (no stock picking) cleared too: profit factor 3.50, neighbourhood worst 2.18.
name: kudu-main
group: kudu
version: 1.0.0
description: >
  KUDU — a quality big-tech basket timed by the Nasdaq, long only. It holds ten large companies —
  xyz:AAPL, MSFT, GOOGL, AMZN, META, NVDA, AVGO, ORCL, LLY, COST — in equal clips of 5% of withdrawable
  at 2x. At each UTC-midnight daily close any name not held is bought unless the Nasdaq 100's 10-day
  RSI has run over 79; when that RSI closes under 30 it also buys the Nasdaq 100 (xyz:XYZ100) at 3x
  with 15%. Every position exits only by the DSL — a 30% ROE stop (15% of a name's price, 10% of the
  index's) and a wide ladder — and a name that stops out is bought back at the next close that is not
  overheated. No clock closes anything. Fully invested it carries about 65% of the account as margin.

strategy:
  wallet: "${KUDU_WALLET}"
  slots: 11                               # ten basket names + the washout leg
  margin_pct: 5                           # the basket clip; the washout clip is washoutMarginPct
  default_leverage: 2                     # fallback; every signal carries its leg's leverage (2 basket, 3 washout)
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: kudu_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300                  # the daily close is the only decision point; 5 min bounds the delay
    timeout_seconds: 120                   # one account read + one candle read (the Nasdaq 100)
    default_signal_validity_seconds: 600   # 2x tick; rule action, a fresh re-score never re-emits a bar
    state_history_max_count: 50            # (market, bar) dedup map + per-tick result
    inputs:
      allowedAssets: ["xyz:AAPL", "xyz:MSFT", "xyz:GOOGL", "xyz:AMZN", "xyz:META", "xyz:NVDA", "xyz:AVGO",
                      "xyz:ORCL", "xyz:LLY", "xyz:COST", "xyz:XYZ100"]   # every market traded
      basketAssets: ["xyz:AAPL", "xyz:MSFT", "xyz:GOOGL", "xyz:AMZN", "xyz:META", "xyz:NVDA", "xyz:AVGO",
                     "xyz:ORCL", "xyz:LLY", "xyz:COST"]
      timingAsset: "xyz:XYZ100"            # its RSI times every entry
      washoutAsset: "xyz:XYZ100"           # bought at 3x after a washout
      rsiPeriod: 10                        # Wilder RSI on CLOSED daily candles
      overheatRsi: 79                      # Nasdaq RSI at or over this: no basket entry at this close
      washoutRsi: 30                       # Nasdaq RSI under this: the washout leg
      entryWindowSeconds: 3600             # buy within the hour after the UTC-midnight close, or wait a day
      basketLeverage: 2
      washoutLeverage: 3
      stopRoePct: 30                       # MUST equal exit.dsl_preset.phase1.max_loss_pct (tests pin it)
      marginPct: 5                         # PERCENT of withdrawable per basket name (0,100]
      washoutMarginPct: 15                 # PERCENT of withdrawable for the washout leg
      maxSlots: 11
      minNotionalUsd: 12                   # the venue's bumped minimum; the free-margin gate stops emitting below it
    signal_data_schema:
      leg: { type: string }
      direction: { type: string }
      nasdaqRsi: { type: number }
      signalBarTime: { type: number }
      leverage: { type: number }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: kudu_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied the whole rule
    scanners: [kudu_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # the buy is AT the close — maker window first, taker fallback
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: kudu_main_signals

# ── EXIT (DSL only) ───────────────────────────────────────────────────────────────────────
# Every threshold is ROE (% of margin). On a basket name at 2x: stop 15% of price, rungs arm at
# +7.5% / +12.5% / +20% / +30% / +50%; on the Nasdaq washout at 3x: stop 10%, rungs at +5% ... +33%.
# They lock 30 / 45 / 60 / 75 / 85% of the best gain: a quality name is a long hold, and a stopped-out
# name is simply bought back at the next close that is not overheated.
# Clock cuts are OFF: of 142 clock-driven closes measured in one fleet week, 110 were in profit.
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true        # closes MUST happen — taker fallback safety floor
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout: { enabled: false, interval_in_minutes: 4320 }
    weak_peak_cut: { enabled: false, interval_in_minutes: 360, min_value: 3.0 }
    dead_weight_cut: { enabled: false, interval_in_minutes: 60 }
    phase1:
      # Trailing DISABLED fleet-wide: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss. max_loss_pct is the hard
      # stop; retrace_threshold is inert while enabled is false.
      enabled: false
      max_loss_pct: 30.0   # 15% of price on a name at 2x, 10% on the index at 3x — mirrored by inputs.stopRoePct
      retrace_threshold: 30
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                               # trigger / lock, ROE; price on the index at 3x in the comment
        - { trigger_pct: 15, lock_hw_pct: 30 }   # +5% of price    -> floor +1.5%
        - { trigger_pct: 25, lock_hw_pct: 45 }   # +8.3%           -> floor +3.75%
        - { trigger_pct: 40, lock_hw_pct: 60 }   # +13.3%          -> floor +8%
        - { trigger_pct: 60, lock_hw_pct: 75 }   # +20%            -> floor +15%
        - { trigger_pct: 100, lock_hw_pct: 85 }  # +33%            -> floor +28.3%

# ── RISK guard rails (a held book: many positions, wide stops, no self-resetting breaker) ──
risk:
  data_retention_seconds: 604800           # 7d — positions live for months
  guard_rails:
    daily_loss_limit_pct: 12               # one name's stop costs 30% x 5% = 1.5%; the washout's 4.5%
    max_entries_per_day: 12                # the first close fills the book (up to 11 entries)
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 6
    cooldown_seconds: 86400                # a day after six losses in a row
    drawdown_halt_pct: 35                  # the wallet-wide hard stop; above the replay's 31% worst drawdown
    drawdown_reset_on_day_rollover: false  # clearing it is a deliberate act (redeploy), not midnight
    per_asset_cooldown_seconds: 300        # the scanner already allows one entry per market per daily close

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
