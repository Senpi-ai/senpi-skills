# Pilotfish — Smart-Money Accumulation. Single-wallet PACKAGE: this manifest + one
# self-contained runtime.yaml + scanners/ (scan.py does the cohort orchestration and
# Pilotfish's sizing; scoring.py is Phalanx's smart-money engine, byte-identical —
# one-sidedness, the net-headcount delta, the hit-rate ledger; tests/test_engine_verbatim.py
# pins it). Follows the proven cohort and opens WITH it only while a name is one-sided
# AND still filling. NEVER closes — the DSL owns every exit.
schema_version: 1

id: pilotfish
version: "1.1.1"
catalog:
  name: "Pilotfish — Smart-Money Accumulation"
  emoji: "🐟"
  tagline: "Follows the wallets with a real track record — but only while they are still building a position, not after everyone can see it. It watches how hard that group is leaning on each coin and buys in when the leaning is actively getting stronger, which is the part of the move that has not been priced in yet."
  belief_plain: "Most copy strategies show you what good traders already hold, which is old news by the time you see it. Pilotfish watches the same group of proven wallets and measures whether their commitment to a coin is still growing. When they are actively piling in, it goes with them; when they have simply been sitting on a position for days, it leaves it alone. It never sells manually — a profit ratchet locks gains and a fixed stop caps the loss."
  thesis: "You want to be early to where proven money is going, not late to where it already is. A standing position is priced; the DERIVATIVE of that positioning is not. Pilotfish runs on Phalanx's smart-money engine: each read it counts, per name and direction, how many proven wallets (>= $1M all-time realized) hold it — one vote per wallet, so a whale's size buys no extra weight and a price move cannot fake a headcount — takes ONLY the side more of them are on, and fires while that side holds >= 65% of the positioned wallets (at least 10 of them) AND its net headcount has grown by two or more wallets since the last read — never a thin lean like 30-vs-26, never one wallet's move, and never on the first read, which only sets the baseline. A hit-rate ledger marks every signal right or wrong an hour later and raises the bar for an asset class that keeps missing. Size scales with how many wallets agree."
  group: multi-asset-universe
  archetype: copy_trading
  sub_style: sm_rotation
  asset_classes: [btc_eth, major_alts, universe_crypto]
  asset_scope: follows_traders
  direction: long_short
  risk_level: moderate
  tier: advanced
  time_horizon: swing
  leverage_max: 4
  max_slots: 5
  assets: []                 # DERIVED from where the proven cohort is accumulating
  tags: [smart-money, copy-trading, accumulation, early, cohort, conviction, follows-traders, derivative, universe, long-short, dsl-only, no-close]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml         # → runtime name pilotfish-main, group pilotfish
    wallet_env: PILOTFISH_WALLET
    funding_share: 1.0
