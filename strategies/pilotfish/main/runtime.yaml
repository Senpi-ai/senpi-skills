# ── PILOTFISH · Smart-Money Accumulation ────────────────────────────────────
# Every other copy strategy reads a STANDING position — who is long what, right now,
# which the market has already priced. PILOTFISH reads the DERIVATIVE: it follows the
# PROVEN COHORT (>= $1M lifetime realized PnL) and opens WITH it only when its headcount
# on a name is one-sided AND still growing: >= 65% of the positioned wallets (at least
# 10 of them) on one side, and that side's net headcount up by >= 2 since the last read.
# That is Phalanx's engine — scanners/scoring.py is byte-identical to phalanx's — with
# Pilotfish's own sizing and exits. The first tick only seeds the baseline. Dominant side
# only; a minority leg is unpickable by construction. NEVER closes — DSL owns every exit.
name: pilotfish-main
group: pilotfish
version: 1.0.0
description: >
  PILOTFISH — Smart-Money Accumulation. Tracks a cohort of proven Hyperliquid wallets
  (>= $1M all-time realized) and opens WITH them while their conviction in a name is
  still building — not once it has been standing for days: >= 65% of the positioned
  wallets on one side (at least 10 of them) and that side's net headcount up by >= 2
  since the last read — never a 54% split, never one wallet's move. One vote per
  wallet, dominant side only. A hit-rate ledger marks each signal right or wrong an
  hour later and raises the bar for an asset class that keeps missing. Size scales
  with how many wallets agree (base/good/apex). Up to 5 positions. DSL is the ONLY
  exit — a FIXED max-loss floor plus a gains-only profit ratchet that runs to +100%
  (no trailing stop, no breakeven exits).

strategy:
  wallet: "${PILOTFISH_WALLET}"
  slots: 5
  margin_pct: 10                          # baseline = the scanner's BASE conviction rung
  default_leverage: 3                    # = the scanner's BASE rung; scan emits per-signal
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10

  - name: pilotfish_scanner
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 900             # 15m — accumulation builds over hours, not seconds
    timeout_seconds: 300
    default_signal_validity_seconds: 3600
    state_history_max_count: 200
    inputs:
      # ── the proven cohort (SLOW clock) ──
      cohortRefreshHours: 12
      minRealizedUsd: 1000000         # "proven" = >= $1M all-time realized
      cohortCap: 80
      pageSize: 500
      maxPages: 4
      stateBatch: 40
      # ── the gate (Phalanx's engine — scan.fresh_picks over scoring.py) ──
      # A name qualifies on its dominant side only when >= tiltThreshold % of the positioned
      # wallets are on that side (scoring.one_sidedness: 0 below 10 wallets, so a thin name never
      # counts) AND that side's net headcount grew by >= deltaMin since the last tick
      # (scoring.directional_delta: one wallet is noise, two is an accumulation). The hit-rate
      # ledger moves the threshold per asset class: +4 under a 40% hit rate, -2 over 55%, floor 52.
      tiltThreshold: 65
      deltaMin: 2
      # ── sizing bands (dominant-side headcount) ──
      goodConsensus: 10               # 7 is the smallest side that can clear the gate (65% of 10) -> base
      apexConsensus: 15
      # ── slots + sizing ──
      maxSlots: 5
      recentSignalTtlSeconds: 21600
      leverageTiers: { apex: 4, good: 4, base: 3 }
      marginPctTiers: { apex: 12, good: 11, base: 10 }
      maxLeverage: 4
      maxMarginPct: 20
    signal_data_schema:
      consensusCount: { type: number }
      band: { type: string, required: false }
      direction: { type: string }
      leverage: { type: number }
      reasons: { type: array, required: false }
      oneSidedness: { type: number }
      delta: { type: number }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: pilotfish_open
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [pilotfish_scanner]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: pilotfish_scanner
  # NO CLOSE_POSITION action — DSL is the only exit.

# EXIT — the `let_winners_run` preset from
# senpi-strategy-author/references/dsl-presets.yaml, VERBATIM. Following a cohort into an
# accumulation is a trend bet, and the whole point is to still be there when it works.
# Trailing is OFF — the phase-1 floor trails high-water and can close a WINNER at a loss.
# The ratchet locks gains, or the position rides to the fixed stop.
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    phase1:
      enabled: false
      max_loss_pct: 8.0
      retrace_threshold: 8            # INERT while phase1.enabled is false
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 20,  lock_hw_pct: 25 }
        - { trigger_pct: 30,  lock_hw_pct: 40 }
        - { trigger_pct: 50,  lock_hw_pct: 60 }
        - { trigger_pct: 75,  lock_hw_pct: 75 }
        - { trigger_pct: 100, lock_hw_pct: 85 }

risk:
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 5
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_seconds: 900
    per_asset_cooldown_seconds: 21600
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
