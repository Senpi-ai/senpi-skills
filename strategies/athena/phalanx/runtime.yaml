# ── ATHENA · phalanx leg — the alpha sleeve ─────────────────────────────────
# Phalanx's engine (proven-cohort rotation: >=$1M lifetime realized PnL, headcount not
# notional, delta-gated, divergence-boosted) at Athena 2.0.0's sizing, plus two entry gates
# Phalanx does not have: a 1h momentum gate and a cohort regime gate. Athena 2.0.0 is the
# fork Jason runs live on his own account (edited 22 Oct and 5 Nov 2026), promoted to the
# default. Every difference from strategies/phalanx is declared in
# tests/test_legs_verbatim.py, so a phalanx fix that does not land here fails there.
# The sleeve weighting lives in ../strategy.yaml (funding_share).
name: athena-phalanx
group: athena
version: 3.0.0
description: >
  ATHENA · Phalanx leg (the alpha sleeve) — proven-cohort rotation. Reads the proven cohort (>=$1M lifetime
  realized PnL via discovery_get_top_traders ALL_TIME) and tracks where their
  headcount is shifting each tick. Goes LONG the assets the cohort is crowding
  into (one_sidedness >= 65%, delta >= +2) and SHORT the ones they're fleeing,
  with a divergence booster when the cohort is actively shifting against the 4h
  leaderboard and an overcrowding breakout gate at 85%. Skips any entry the last
  two 1h candles moved more than 1% against, and opens no LONG while 65% or more of
  the cohort's positions across all assets are short. 4x leverage, 2 slots,
  35-42% of the sleeve per position; a trailing floor 4.5% of price behind the
  best price until the first profit lock arms at +2.0% of price, and a 6.0%
  hard stop on the exchange. Per-class hit-rate tracking auto-tunes the tilt
  threshold so the strategy learns which crowd to trust.

strategy:
  wallet: "${ATHENA_PHALANX_WALLET}"
  # 2 slots at 4x. Each signal carries its own marginPct from the scanner: marginPctBase 35,
  # x1.25 at conviction >= 65, capped at marginPctMax 42 — so 35% or 42% of the sleeve per
  # position. marginPct is a percent of WITHDRAWABLE AT OPEN and the runtime opens one at a time,
  # so two positions deploy 1-(1-p)^2 of the sleeve: 57.8% at 35, 66.4% at 42.
  # tests/test_arm_sizing.py pins the range, the stop and the ladder.
  slots: 2
  margin_pct: 35
  default_leverage: 4
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: phalanx_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300
    timeout_seconds: 180
    default_signal_validity_seconds: 600
    state_history_max_count: 200
    inputs:
      tiltThreshold: 65
      deltaMin: 2
      sustainMinTicks: 12                 # 12 x 300s = 1h of UNBROKEN one-sidedness in the
                                          # same direction qualifies on its own. delta alone
                                          # only ever caught the moment a consensus FORMS;
                                          # a cohort that is already short and stays short
                                          # sits at delta~0 and locked the strategy out.
      overcrowdThreshold: 85
      marginPctBase: 35
      marginPctMax: 42
      leverageDefault: 4
      maxLong: 2
      maxShort: 2
      recentSignalTtlSeconds: 21600       # 6h. Was 240s against a 300s scan — the dedup
                                          # expired before the next tick could ever consult
                                          # it, so it suppressed nothing. Harmless only
                                          # while nothing emitted; with the standing-consensus
                                          # path a sustained name would re-signal every tick.
      leaderboardLimit: 100
      smartMinRealizedUsd: 1000000
      cohortCap: 100
      cohortMaxAgeHours: 72              # the membership list refreshes every 24h; at 72h
                                         # `discovery_get_top_traders` has failed for two
                                         # days straight and the strategy stops OPENING.
                                         # Closes are never gated — held positions keep
                                         # their DSL. 0 disables the ceiling.
      stateBatch: 50
      pageSize: 1000
      maxPages: 6
      # 1h momentum entry gate: no SHORT into a 1h bounce, no LONG into a 1h dump. The cohort
      # can be right about direction and early on timing.
      momBlockPct: 1.0                   # skip entry if the last momBars1h 1h closes moved > this % against it
      momBars1h: 2                       # 1h momentum lookback, in bars
      # Cohort regime gate: no LONG while the proven cohort is overwhelmingly net-short across
      # ALL assets (risk-off), even when it is long the one name. Added on Jason's live fork after
      # 5 Nov 2026, when phalanx opened a MU long into a semis selloff because 3 cohort members
      # were long MU while the same cohort was short BTC, ETH, SOL, XRP, LIT, PUMP and FARTCOIN.
      cohortShortBlockPct: 65            # block LONG entries when total cohort short% >= this across all assets
    signal_data_schema:
      score: { type: number }
      direction: { type: string }
      longRatio: { type: number, required: false }
      netTilt: { type: number, required: false }
      conviction: { type: number, required: false }
      delta: { type: number, required: false }
      divergence: { type: boolean, required: false }
      oneSidedness: { type: number, required: false }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: phalanx_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [phalanx_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      # Maker-first with taker fallback after 30s: gives a window for maker
      # fills (lower fees) but guarantees execution so signals don't miss.
      # (A pure maker-only entry — taker fallback off — passes validation and
      # then fails every order at the executor; keep the fallback on.)
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: phalanx_main_signals

# ── EXIT (DSL — a trailing floor until the ladder arms, no deadline on winners) ─
# Every ROE number below is a price distance x 4 (leverage). Until the first rung arms
# (+8% ROE = +2.0% of price) the floor trails the best price by 18% ROE (4.50% of price) and
# never sits below the 24% ROE hard stop (6.00% of price, placed on the exchange). From the
# first rung on, the ladder locks a share of the high-water ROE. No time-based cuts: Phalanx holds and follows the smart-money divergence, so a
# position exits on the hard stop (phase1.max_loss_pct) or the profit-lock ladder
# (phase2.tiers) — never because a clock ran out. The 12h weak-peak cut closed
# positions that were inside the stop and had hit no tier: the cohort not having
# moved yet is not the thesis being wrong. Removed 2026-09-15 (Phalanx 1.3.0,
# Athena 1.1.0). No hard_timeout either: it counts from entry and fires in either
# phase, so any fixed deadline closes a ratchet-armed winner mid-run.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: false
    weak_peak_cut:
      enabled: false
    phase1:
      enabled: true                   # trailing ON (Jason's live fork, 5 Nov 2026): the floor follows the
                                      # best price 4.50% behind it. Phase 1 ends at +2.0% of price, so this
                                      # floor stays 2.5-4.5% below entry: it cuts a loser sooner than the
                                      # hard stop, and never locks a profit (the ladder does that).
      max_loss_pct: 24.0              # 6.00% of price at 4x — the measured adverse p90 (5.96%); the exchange stop
      retrace_threshold: 18           # 4.50% of price at 4x
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                          # profit-lock ladder at 4x. Leverage, stop width and this ladder are one system: change together.
        - { trigger_pct: 8, lock_hw_pct: 40 }     #  2.00% of price at 4x — arms on 60% of trades (was 36%)
        - { trigger_pct: 24, lock_hw_pct: 55 }    #  6.00% of price
        - { trigger_pct: 49.4, lock_hw_pct: 70 }  # 12.35% of price — the measured peak p90
        - { trigger_pct: 66.4, lock_hw_pct: 88 }  # 16.60% of price — the measured peak max

# ── RISK guard rails ──────────────────────────────────────────────────────────
risk:
  data_retention_seconds: 259200      # 72h
  guard_rails:
    # NO daily_loss_limit_pct. A DAILY halt is a day-trading construct and this is a
    # conviction hold: its premise is staying positioned while the cohort is, including
    # through a day that goes against it. Every gate in this block halts ENTRIES and none
    # of them closes a position, so what the 5% limit actually did was stop the strategy
    # ADDING once it was underwater — the cohort still short, the book down, and the gate
    # CLOSED until UTC midnight. That is the failure that forced a manual close-and-
    # redeploy to clear it. The overall budget is drawdown_halt_pct below.
    max_entries_per_day: 999                # no daily entry cap (Jason's live setting); the brakes are the
                                            # 3-loss cooldown, the per-asset cooldown and the drawdown halt
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 43200            # 12h regime pause after 3 consecutive losses
    drawdown_halt_pct: 28                   # THE overall risk budget: 28% of PnL from peak,
                                            # carried across days (reset flag below is false).
                                            # It stops the strategy ADDING — it never flattens
                                            # the book; open positions run to their own DSL stop.
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 14400  # 4h per-asset re-entry cooldown

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
