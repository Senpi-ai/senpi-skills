# Athena — the smart-money hedge fund: Phalanx and Aegis as one two-wallet PACKAGE.
# Phalanx (the alpha sleeve) follows the proven cohort's rotation; Aegis (the hedge
# sleeve) reads the tape — funding regime, haven flows, OI velocity — and hedges the
# regime, opening nothing new when it is neutral. The two read different things by
# design, so the hedge is on before the cohort has rotated.
#
# 2.0.0 is the fork Jason runs live on his own account (edited 22 Oct and 5 Nov 2026),
# promoted to the default: athena-concentrated's sizing and ladder, a 50/50 split, a 1h
# momentum entry gate on both sleeves, a cohort regime gate and trailing on Phalanx, an
# active-shift-only divergence boost, and no daily entry cap. Each sleeve is its source
# template's engine plus those declared changes (tests/test_legs_verbatim.py lists every
# one). Install/teardown via senpi-strategy-ops.
schema_version: 1

id: athena
version: "2.0.0"

catalog:
  name: "Athena — Smart-Money Hedge Fund"
  emoji: "🏛️"
  tagline: "The smart-money hedge fund in one package: a Phalanx sleeve follows the proven cohort's rotation for alpha, an Aegis sleeve reads the tape to hedge the regime, and neither enters against a sharp move of the last two hours. 50/50 by default — you set the weighting."
  belief_plain: "One strategy is one bet. A fund is two that disagree on purpose. Athena runs Phalanx and Aegis side by side in two wallets. Phalanx follows where the proven cohort (traders with >=$1M lifetime realized PnL) is moving its headcount — the smart money — and opens no new longs while 65% or more of that cohort's positions are short. Aegis reads market structure itself (funding crowding, gold and yen haven flows, OI velocity) to short risk and buy defensives when the tape turns risk-off, go long risk when it turns risk-on, and open nothing new in between. Neither sleeve enters a trade that price moved more than 1% against over the last two hours. The two read different things, so when the cohort hasn't rotated yet but the tape has, the hedge is already on. You choose the weighting; 50/50 is the default."
  thesis: "A smart-money hedge fund needs an alpha engine and a hedge that doesn't share its blind spot. Phalanx is the alpha sleeve: it reads the proven cohort's positioning (headcount, not notional), requires conviction to be growing or to have held for an hour, raises conviction only when the cohort is actively shifting against the 4h crowd, and opens no long while 65% or more of the cohort's positions across all assets are short. It holds up to 2 positions at 4x, 35-42% of its wallet each, with a trailing floor 4.5% of price behind the best price until the first profit lock arms at +2%, and a 6% hard stop. Aegis is the hedge sleeve: a graduated regime score from funding regime, haven trends and OI velocity drives it short risk and long defensives in risk-off, long risk in risk-on, and nothing new in neutral. It holds up to 2 positions at 5x, 25-45% of its wallet each (more in a stronger regime), with a 3.33% stop and an early first lock at +2%, because regime calls reverse fast. Both sleeves skip any entry that price moved more than 1% against over the last two hourly bars. There is no daily limit on the number of entries; the brakes are a cooldown after three straight losses, a per-asset cooldown, and a drawdown halt at 28% (Phalanx) and 25% (Aegis) from the PnL peak, which stops new entries without closing what is open and stays on until you release it. The weighting is the user's lever: 50/50 by default, moved in the fork before funding."
  group: smart-money
  archetype: copy_trading
  sub_style: sm_hedge_fund
  asset_classes: [universe_crypto, btc_eth, major_alts, xyz_equities, commodities, indices, fx]
  asset_scope: follows_traders
  direction: long_short
  risk_level: moderate
  tier: advanced
  time_horizon: swing
  leverage_max: 5
  max_slots: 4
  assets: []
  tags: [smart-money, hedge-fund, smart-money-hedge-fund, alpha-plus-hedge, proven-cohort, rotation, regime-hedge, dynamic-hedge, cross-asset, long-short, phalanx, aegis]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

# ONE choice at install, and the agent must put it to the user before funding:
#
#   THE WEIGHTING. Move the two funding_share values together (they must total 1.0) in the
#   user's fork before funding — 0.5/0.5 is the default. Each wallet needs the $10 platform
#   floor and its sleeve's own sizing at the budget.
#
# Say the size out loud too, because it is the part a user cannot see from the name: each
# sleeve holds up to 2 positions (Phalanx at 4x with 35-42% of its wallet each, Aegis at 5x with
# 25-45%), there is no daily cap on entries, and a tripped drawdown halt stays on until the user
# releases it. athena-x and athena-concentrated are blocked
# in the catalog: athena-concentrated is this version's base, and athena-x was derived from
# Athena 1.7.0's numbers and has not been rebuilt on these.
instances:
  - name: phalanx
    runtime: phalanx/runtime.yaml        # → runtime name athena-phalanx, group athena
    wallet_env: ATHENA_PHALANX_WALLET    # bound as ${ATHENA_PHALANX_WALLET} in phalanx/runtime.yaml
    funding_share: 0.5
  - name: aegis
    runtime: aegis/runtime.yaml          # → runtime name athena-aegis, group athena
    wallet_env: ATHENA_AEGIS_WALLET
    funding_share: 0.5
