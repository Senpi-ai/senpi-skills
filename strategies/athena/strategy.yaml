# Athena — the smart-money hedge fund: Phalanx and Aegis as one two-wallet PACKAGE.
# Phalanx (the alpha sleeve) follows the proven cohort's rotation; Aegis (the hedge
# sleeve) reads the tape — funding regime, haven flows, OI velocity — and hedges the
# regime, sitting in cash when it is neutral. The two read different things by
# design, so the hedge is on before the cohort has rotated. Each sleeve is its
# source template verbatim (tests/test_legs_verbatim.py pins that); the ONE lever
# this package adds is the weighting below. Install/teardown via senpi-strategy-ops.
schema_version: 1

id: athena
version: "1.1.3"

catalog:
  name: "Athena — Smart-Money Hedge Fund"
  emoji: "🏛️"
  tagline: "The smart-money hedge fund in one package: a Phalanx sleeve follows the proven cohort's rotation for alpha, an Aegis sleeve reads the tape to hedge the regime. 65/35 by default — you set the weighting."
  belief_plain: "One strategy is one bet. A fund is two that disagree on purpose. Athena runs Phalanx and Aegis side by side in two wallets: Phalanx follows where the proven cohort (traders with >=$1M lifetime realized PnL) is moving its headcount — the smart money — and Aegis reads market structure itself (funding crowding, gold and yen haven flows, OI velocity) to short risk and buy defensives when the tape turns risk-off, go long risk when it turns risk-on, and sit in cash in between. The two read different things, so when the cohort hasn't rotated yet but the tape has, the hedge is already on. You choose the weighting; 65% alpha / 35% hedge is the default."
  thesis: "A smart-money hedge fund needs an alpha engine and a hedge that doesn't share its blind spot. Phalanx supplies the alpha: it reads the proven cohort's positioning (headcount, not notional), requires conviction to be growing, boosts on divergence from the 4h crowd, and lets winners run on 3x with wide stops. Aegis supplies the hedge: a graduated regime score from funding regime, haven trends and OI velocity drives it short risk and long defensives in risk-off, long risk in risk-on, and flat in neutral — with tighter stops and earlier profit locks because regime calls reverse fast. The signals are independent by construction (crowd vs tape), which is what makes the second sleeve a real hedge rather than a second alpha bet. Each sleeve carries its own DSL protection and guard rails. The weighting is the user's lever: 65/35 alpha/hedge by default, moved in the fork before funding; every other number is each sleeve's own template, unchanged."
  group: smart-money
  archetype: copy_trading
  sub_style: sm_hedge_fund
  asset_classes: [universe_crypto, btc_eth, major_alts, xyz_equities, commodities, indices, fx]
  asset_scope: follows_traders
  direction: long_short
  risk_level: moderate
  tier: advanced
  time_horizon: swing
  leverage_max: 5
  max_slots: 7
  assets: []
  tags: [smart-money, hedge-fund, smart-money-hedge-fund, alpha-plus-hedge, proven-cohort, rotation, regime-hedge, dynamic-hedge, cross-asset, long-short, phalanx, aegis]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

# THE lever: the weighting. Move the two funding_share values together (they must
# total 1.0) in the user's fork before funding — 0.65/0.35 is the default. Each
# wallet needs the $10 platform floor and its sleeve's own sizing at the budget.
instances:
  - name: phalanx
    runtime: phalanx/runtime.yaml        # → runtime name athena-phalanx, group athena
    wallet_env: ATHENA_PHALANX_WALLET    # bound as ${ATHENA_PHALANX_WALLET} in phalanx/runtime.yaml
    funding_share: 0.65
  - name: aegis
    runtime: aegis/runtime.yaml          # → runtime name athena-aegis, group athena
    wallet_env: ATHENA_AEGIS_WALLET
    funding_share: 0.35
