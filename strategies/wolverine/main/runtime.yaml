# ── WOLVERINE · single instance — HYPE alpha hunter (Runtime 3.0 port of v2 Wolverine v6.1.0) ──
name: wolverine-main
group: wolverine
version: 3.0.0
description: >
  WOLVERINE — single-asset HYPE alpha hunter with a MACRO/REGIME GATE. Six structural
  gates (4h structure >=0.65 & directional, 1h not opposing 4h, 15m momentum, base-tech
  floor, 4h trailing-window magnitude >=1.0%) PLUS a smart-money HARD BLOCK on opposing
  direction, RSI hard gates (72/28), and a market-wide funding-regime + funding-persistence
  macro layer. Multi-factor composite (~17 max) clears minScore 10; conviction-tiered
  leverage 3x standard / 5x apex (>=11). DSL is the ONLY exit. Faithful port of the v2
  producer thesis (build_hype_thesis) — gates + math copied verbatim.

strategy:
  wallet: "${WOLVERINE_WALLET}"
  slots: 1                                # single asset, single position
  default_leverage: 3                     # fallback; scan emits per-signal 3/5 by score
  trading_risk: aggressive
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: wolverine_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 180                  # v2 producer cadence (3 min)
    timeout_seconds: 160                   # up to 5 MCP reads/tick (HYPE + SM + regime + persistence + BTC)
    default_signal_validity_seconds: 1800
    state_history_max_count: 100           # dedup map + per-tick scan-results history (~5h @180s)
    inputs:
      asset: "HYPE"
      dex: ""
      macroAsset: "BTC"                    # "" disables the BTC-correlation factor
      minScore: 10                         # config "patient-conviction" floor (producer constant was 9)
      marginPct: 25                        # PERCENT of withdrawable (0,100] — runtime sizes (marginPct/100)*withdrawable
      min4hStructure: 0.65                 # v4.2 relaxed from 0.75 (3 of 5 4h candles)
      min4hMagnitudePct: 1.0               # v4.2 relaxed from 1.5, paired with trailing-window mom_4h
      minMom15mPct: 0.15
      rsiMaxLong: 72                       # v2-quirk: producer constant 72 (SKILL prose says 74)
      rsiMinShort: 28                      # v2-quirk: producer constant 28 (SKILL prose says 26)
      fundingCrowded: 0.005
      leverageTiers: [[11, 5, "apex"], [9, 3, "standard"]]
      recentSignalTtlSeconds: 14400        # 240m — mirror the per-asset cooldown
      quietHours:                          # FP-001: skip non-apex emission 00-04 UTC
        startUtc: 0
        endUtc: 4
        apexBypassScore: 11
    signal_data_schema:
      score: { type: number }
      tier: { type: string, required: false }
      leverage: { type: number }
      direction: { type: string }
      trend4h: { type: string, required: false }
      trendStrength4h: { type: number, required: false }
      trend1h: { type: string, required: false }
      mom5mPct: { type: number, required: false }
      mom15mPct: { type: number, required: false }
      mom1hPct: { type: number, required: false }
      mom4hPct: { type: number, required: false }
      fundingRate: { type: number, required: false }
      fundingRegime: { type: string, required: false }
      fundingPersistenceHours: { type: number, required: false }
      oiChange1h: { type: number, required: false }
      vol1h: { type: number, required: false }
      btcMom15m: { type: number, required: false }
      btcMom1h: { type: number, required: false }
      rsi: { type: number, required: false }
      smPct: { type: number, required: false }
      smTraders: { type: number, required: false }
      smCc15m: { type: number, required: false }
      smAligned: { type: boolean, required: false }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: wolverine_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied every gate + macro layer
    scanners: [wolverine_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # a conviction strike must fill — taker fallback at 60s
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: wolverine_main_signals

# EXIT — DSL, asymmetry-optimized. Time cuts OFF (v3.0.1/2/4 preserved): single-asset
# patience; Phase 1 max_loss + Phase 2 retrace own all exits.
exit:
  engine: dsl
  interval_seconds: 60                     # v6.0.0: REDUCE_ONLY spam mitigation
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss — churning fees.
      # The ratchet must only ever lock a GAIN, or the position rides to the stop.
      # max_loss_pct := the old retrace (8.0% ROE), which is what the trail was already
      # enforcing, so the per-trade risk cap is UNCHANGED. retrace_threshold is now inert.
      enabled: false
      max_loss_pct: 8.0   # was 20.0 — set to the old retrace so the risk cap is unchanged
      # REVIEW FIX: v2 description claimed retrace 15 (over-wide for a single-breach
      # trailing rule); the actual v2 CODE value was 8. Kept at 8 (<=10, as reviewed):
      # at 5x apex an 8-ROE retrace is a ~1.6% HYPE price leash — distinct from the 20%
      # max-loss hard stop, and below the over-wide 15 the description drifted to.
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        # REVIEW FIX: v2's first tier was {trigger 10, lock 0} (lock=0 is NOT a real,
        # reachable lock) with the first LOCKING tier at trigger 20/lock 25. First lock
        # made reachable at +10% ROE (locks 15% of the high-water) so a winner banks
        # something early; ladder still gives apex HYPE trends multi-day breathing room.
        - { trigger_pct: 10, lock_hw_pct: 15 }
        - { trigger_pct: 20, lock_hw_pct: 30 }
        - { trigger_pct: 30, lock_hw_pct: 45 }
        - { trigger_pct: 50, lock_hw_pct: 60 }
        - { trigger_pct: 75, lock_hw_pct: 75 }
        - { trigger_pct: 100, lock_hw_pct: 85 }

risk:
  guard_rails:
    daily_loss_limit_pct: 10
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false   # v2 wolverine: false
    max_consecutive_losses: 3
    cooldown_seconds: 3600                   # v2: cooldown_minutes 60
    per_asset_cooldown_seconds: 14400        # v2: per_asset_cooldown_minutes 240 (4h between HYPE attempts)
    max_entries_per_day: 2                   # v6.0.0: force selectivity
    bypass_max_entries_per_day_on_profit: false
