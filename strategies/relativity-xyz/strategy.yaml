# Relativity XYZ — cross-sectional dispersion + index regime flip on the xyz board.
# Single-wallet PACKAGE: this manifest + one runtime.yaml + scanners/ (scan.py does the
# read-only MCP orchestration; scoring.py is the pure engine, ported verbatim from the
# live fork it was promoted from). NEVER closes from the scanner — the DSL owns every exit.
schema_version: 1

id: relativity-xyz
version: "1.0.0"
catalog:
  name: "Relativity XYZ — Cross-Asset Dispersion"
  emoji: "🌌"
  tagline: "Ranks every liquid name on Senpi's stock, commodity and index board by how much it is beating or lagging the rest, then buys the leaders and sells the laggards — with the S&P's own trend deciding which side it is allowed to take. Four positions, leverage scaled to conviction up to 10x, closed only by a profit ratchet or a stop. Fast and aggressive."
  belief_plain: "On any given day some names run and others lag, and that spread is tradeable on its own — you do not need a view on the market's direction, only on who is winning relative to everyone else. Relativity XYZ measures that spread across stocks, commodities and indices every five minutes and takes the other side of it: long the strongest, short the weakest. What keeps it out of trouble is the index gate — when the S&P's last four-hour bar is falling it will only short, when it is rising it will only go long, and it only takes both sides when the index is quiet. The risk is real and worth saying plainly: this runs up to 10x leverage on four positions at once, its stop is tight (a 1.5–3% move against a position closes it), and it is built to trade often rather than to wait. It is an aggressive strategy, not a core holding. One number to know before funding it: trading this often at this leverage costs roughly 0.75% of the account per day in fees at 5x, and up to about 1.5% at 10x, if it uses its full daily allowance — so the positions have to beat that before anything is left over."
  thesis: "Promoted from a live fork rather than a backtest, and the window is short: four days on one wallet (15–19 October 2026), +17.3% on $800 funded, with roughly half of that arriving on the final day and most of it still open at the time of measurement. That is encouraging and it is not evidence of an edge — four days cannot distinguish a working rule from a good tape, and in that window the book was four correlated technology longs rather than the balanced long/short spread the design describes. Treat it as a strategy worth forward-testing at small size. The mechanism is sound and simple: dispersion plus a regime filter, pure price action, no leaderboard and no smart-money proxy. There is no per-template performance record and there cannot be one — every deployment becomes the user's own fork, with their own universe, sizing and exit ladder."
  group: multi-asset-universe
  archetype: structural_neutral
  sub_style: regime_aware_dispersion
  asset_classes: [xyz_equities, commodities, indices]
  asset_scope: universe
  direction: long_short
  risk_level: aggressive
  tier: advanced
  time_horizon: intraday
  leverage_max: 10
  max_slots: 4
  # The computed minimum is meaningless here. A clip is 25% of withdrawable at up to 10x,
  # so one clip clears the $12 venue minimum from about $10 — and a four-slot book at 10x
  # leverage funded with $10 is not this strategy, it is a rounding error with a stop.
  # The floor is set to what was actually RUN: the fork opened at $300 and was topped to
  # $800. Nothing below the tested size has any evidence behind it.
  min_budget_floor: 300
  assets: []                      # DERIVED each tick from the live xyz board
  tags: [xyz, equities, stocks, commodities, indices, non-crypto, cross-asset, dispersion,
         spread, relative-strength, leaders-laggards, winners-losers, cross-sectional,
         regime-aware, regime-gated, sp500, index-gated, long-short, momentum, aggressive,
         high-leverage, dsl-only, no-close]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml       # → runtime name relativity-xyz-main, group relativity-xyz
    wallet_env: RELATIVITY_XYZ_WALLET
    funding_share: 1.0
