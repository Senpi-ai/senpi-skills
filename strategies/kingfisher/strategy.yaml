# Kingfisher — Classic Indicators (RSI + MACD). A single-instance PACKAGE: this
# manifest + one self-contained runtime.yaml + scanners/. The most-recognised retail
# technical setup (MACD signal-line crossover, RSI confirmation) as a supervised
# Runtime 3.0 strategy on a liquid-majors basket. Install/teardown via senpi-strategy-ops.
schema_version: 1

id: kingfisher
version: "1.3.0"

catalog:
  name: "Kingfisher — Classic Indicators (RSI + MACD)"
  emoji: "🐦"
  tagline: "The textbook RSI + MACD setup, supervised: a MACD signal-line crossover (12/26/9) on 1h candles triggers the entry, RSI(14) confirms (above 50 for longs, below 50 for shorts; a true extreme at 78/22 costs the setup a point, it does not block the trade), 4h trend structure adds context. Trades a liquid-majors basket (BTC/ETH/SOL/BNB/XRP/AVAX/LINK/DOGE) long & short: 3 slots of 25% at 3x, a 12% ROE stop (4% of price) and a DSL ratchet that first locks profit at +15% ROE."
  belief_plain: "The two indicators everyone knows, run for you the way the textbook says. It waits for MACD to cross its signal line, checks that RSI agrees (an RSI already at an extreme counts against the setup but does not block it), prefers trades that line up with the 4-hour trend, risks 4% of price per position (12% ROE at 3x) and trails a stop that starts protecting profit once you're up 15% ROE. Classic technical analysis on the big, liquid coins — no black box."
  thesis: "RSI and MACD are the single most-requested retail build ('a strategy based on RSI and MACD'), yet no template was positioned as one. Kingfisher is that on-ramp: a faithful, well-labelled crossover-plus-confirmation strategy on names deep enough to size into, with the runtime owning execution, sizing, slots, and a disciplined trailing exit — so a familiar chart setup becomes a supervised, always-on strategy instead of a manual watch."
  group: momentum
  archetype: trend_following
  sub_style: indicator_crossover
  asset_classes: [major_alts]
  asset_scope: basket
  direction: long_short
  risk_level: moderate
  tier: starter
  leverage_max: 3
  max_slots: 3
  assets: ["BTC", "ETH", "SOL", "BNB", "XRP", "AVAX", "LINK", "DOGE"]
  tags: [rsi, macd, indicators, technical-analysis, crossover, oscillator, classic-ta, momentum, beginner, btc, eth, sol, multi-asset, long-short]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: KINGFISHER_WALLET
    funding_share: 1.0
