# ── KINGFISHER · single instance — Classic Indicators (RSI + MACD) ────────────
# A textbook indicator-crossover swing strategy on a liquid-majors basket. MACD
# signal-line crossover is the entry trigger, RSI(14) confirms (a true extreme docks
# a point, it does not veto), 4h trend structure is context. 3 slots of 25% at a
# constant 3x; exits are DSL-only: a 12% ROE stop (4.0% of price) and a ratchet whose
# first rung arms at +15% ROE. Retail-recognisable "RSI + MACD" — the highest-frequency
# organic build request.
name: kingfisher-main
group: kingfisher
version: 1.0.0
description: >
  KINGFISHER — Classic Indicators (RSI + MACD) on a liquid-majors basket
  (BTC/ETH/SOL/BNB/XRP/AVAX/LINK/DOGE). The entry TRIGGER is a MACD signal-line
  crossover (12/26/9) on 1h candles; RSI(14) CONFIRMS momentum (a long needs RSI
  above 50, a short below 50) — a true extreme (>=78 / <=22) costs a point, not a
  veto, since a strong MACD trend runs RSI hot; 4h trend structure adds context. Emits
  every name clearing the score floor (7), best-first, sized a flat 25%
  of the book per slot (3 slots) at a constant 3x. Exits are DSL-only: a 12% ROE stop
  (4.0% of price) and a ratchet that first locks profit at +15% ROE. Long & short.

strategy:
  wallet: "${KINGFISHER_WALLET}"
  slots: 3
  margin_pct: 25                          # per-slot %; 3 x 25% = 75% of the book at 3x (1.3.0: was 10 x1.25/x1.5 by score)
  default_leverage: 3                     # fallback; scan emits a constant 3x (1.3.0: was 4)
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: kingfisher_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 900                  # 15m: re-check the 1h MACD/RSI, catch fresh crossovers promptly
    timeout_seconds: 180                   # up to ~1 candle read per basket name + account
    default_signal_validity_seconds: 1800  # 2x tick; rule action, a fresh re-score arrives next tick
    state_history_max_count: 100           # crossover dedup map + per-tick scan-results history
    inputs:
      allowedAssets: ["BTC", "ETH", "SOL", "BNB", "XRP", "AVAX", "LINK", "DOGE"]  # liquid HL majors
      minScore: 7                          # one notch above the 6 that shipped. The candidate-fix replay has since
                                           # finished and no floor clears fees (see ../DESIGN.md). At 6 the replay lost:
                                           # profit factor 0.81 over 416 trades, 71% ended at the 2%-of-price
                                           # stop. At 7 a fresh cross (4) + RSI confirming (2) no longer enters
                                           # on its own — the zero line, histogram strength or the 4h trend
                                           # must also agree.
      marginPct: 25                        # PERCENT of the book per slot (0,100]; flat (1.3.0: the x1.25/x1.5 score tiers are gone)
      maxSlots: 3
      leverage: 3                          # constant; the ROE ladder below is authored for it (1.3.0: was 4, clamped to [3, 5])
      macdFast: 12
      macdSlow: 26
      macdSignal: 9
      rsiPeriod: 14
      rsiOverbought: 78                    # true-extreme caution for longs (not a mean-reversion fade)
      rsiOversold: 22                      # true-extreme caution for shorts
      histStrengthPct: 0.03                # |histogram|/price %% to count as a strong crossover
      recentSignalTtlSeconds: 3600         # one crossover per name per hour (race-window dedup)
    signal_data_schema:
      score: { type: number }
      leverage: { type: number }
      direction: { type: string }
      directionSource: { type: string, required: false }
      reasons: { type: array, required: false }
      rsi: { type: number, required: false }
      macd: { type: number, required: false }
      signal: { type: number, required: false }
      hist: { type: number, required: false }
      trend4h: { type: string, required: false }
      heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: kingfisher_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied every filter (crossover + RSI + trend)
    scanners: [kingfisher_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # taker fallback: a maker-only entry rests and silently misses
                                           # the fill on a fast crossover move (CREATE_ORDER_RESTING).
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: kingfisher_main_signals

# ── EXIT (DSL — the DSL decides every exit) ──────────────────────────────────
# A crossover swing takes profit on the move. phase1.max_loss_pct is the stop: 12% ROE =
# 4.0% of price at 3x (1.3.0: was 8% ROE = 2.0% of price, where 71% of replayed trades ended).
# The ratchet's first rung arms at +15% ROE (+5.0% of price) and keeps 40% of the high-water.
# Clock cuts (hard_timeout / weak_peak_cut / dead_weight_cut) are OFF: exits are price action,
# not elapsed time. Closes MUST happen — taker fallback on.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: false
      interval_in_minutes: 240
    weak_peak_cut:
      # DISABLED - this cut closes at MARKET at whatever price is there, with no floor, so on a
      # longer-hold book it realises a small LOSS on a position that simply hadn't moved yet
      # (observed live on xyz:PLTR in cougar). Same defect we removed from phase1. weak_peak is
      # a CHOP tool only: it belongs where the strategy already intends to be out within hours.
      enabled: false
      interval_in_minutes: 60
      min_value: 2.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 60
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss — churning fees.
      # The ratchet must only ever lock a GAIN, or the position rides to the stop.
      # max_loss_pct IS the stop; retrace_threshold is inert while enabled: false.
      enabled: false
      max_loss_pct: 12.0   # 12% ROE = 4.0% of price at 3x (1.3.0: was 8.0 = 2.0% of price; 71% of replayed trades ended there)
      retrace_threshold: 12
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                               # first lock at +15% ROE; tighten as it runs
        - { trigger_pct: 15, lock_hw_pct: 40 }   # +5.0% of price -> floor +2.0% (1.3.0: lock 25 -> 40)
        - { trigger_pct: 25, lock_hw_pct: 45 }   # +8.3%          -> floor +3.75%
        - { trigger_pct: 40, lock_hw_pct: 60 }   # +13.3%         -> floor +8.0%
        - { trigger_pct: 60, lock_hw_pct: 75 }   # +20%           -> floor +15%

# ── RISK guard rails (moderate) ──
risk:
  data_retention_seconds: 259200           # 72h
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 5                  # a basket scanner across 8 names; above the 3 slots
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 1800                  # post-loss cooldown 30m
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 3600        # 1h — matches the 1h signal timeframe

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
