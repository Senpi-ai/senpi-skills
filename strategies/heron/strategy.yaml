# Heron — ETH onboarding trend follower. A single-instance PACKAGE: this manifest
# + one self-contained runtime.yaml + scanners/. A faithful Runtime 3.0 port of the
# v2 Heron (SKILL.md v1.0.0): a SIMPLE single-asset (ETH) trend follower with a
# Smart-Money direction gate — 4h trend structure picks the side, SM must agree,
# 5-component score (max ~9), fixed 5x leverage, wide DSL-only exits. The onboarding
# strategy: deliberately simpler than kodiak/polar (no funding/OI/RSI/BTC/time-of-day,
# no conviction-tiered leverage). Install/teardown via senpi-strategy-ops.
schema_version: 1

id: heron
version: "1.0.0"

catalog:
  name: "Heron — ETH Trend Follower"
  emoji: "🐦"
  tagline: "An onboarding-tier single-asset ETH trend follower: enters only when the 4h candle structure is trending AND Senpi's Smart-Money leaderboard agrees with that direction — then holds one position at a fixed 5x and lets a wide DSL ladder ride the trend for multi-day moves."
  belief_plain: "Trades only ETH. It asks two simple questions — is ETH trending on the 4-hour chart, and do the best traders agree with that direction? If both say yes it opens one position and trails a stop instead of guessing the exit. Built for first-time users."
  thesis: "New users want one clean question answered well, not a scattergun across the market. ETH has the liquidity and the smart-money depth, and a simple agent that watches only ETH — checking 4h structure and the leaderboard's net lean — gives a beginner a clear directional position without funding-rate math or multi-asset tuning."
  group: single-asset
  archetype: single_market
  sub_style: basket
  asset_classes: [major_alts]
  asset_scope: single
  direction: long_short
  risk_level: moderate
  tier: starter
  leverage_max: 5
  max_slots: 1
  min_budget: 200
  assets: ["ETH"]
  tags: [eth, single-asset, trend-following, smart-money, onboarding, beginner]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: HERON_WALLET
    funding_share: 1.0
