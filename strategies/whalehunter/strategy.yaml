# WhaleHunter — smart-money rotation, sized up on crowd divergence. A two-instance PACKAGE:
# this manifest + two self-contained runtime.yaml sleeves (long / short on SEPARATE wallets)
# + scanners/ shared verbatim by both (scan.py does the MCP orchestration and Whalehunter's
# sizing; scoring.py is Phalanx's smart-money engine, byte-identical — one-sidedness, the
# net-headcount delta, the hit-rate ledger; tests/test_engine_verbatim.py pins it). Install/
# teardown via senpi-strategy-ops.
schema_version: 1

id: whalehunter
version: "1.3.1"

catalog:
  name: "WhaleHunter — Smart-Money Cohort Divergence"
  emoji: "🐋"
  tagline: "Buckets Hyperliquid traders by lifetime realized PnL into a smart-money cohort and a crowd, then positions WITH the smartest money the moment several of them freshly line up on the SAME coin in the SAME direction — one vote per wallet, never a position that merely grew in dollars — and bets a little more when the crowd is on the other side."
  belief_plain: "Looks at where the most profitable traders on Hyperliquid are putting their money as a group and copies that lean — going long what they're piling into and short what they're dumping — but only while the pile-on is still forming: it counts wallets, not dollars, so a coin only counts when most of the smart money agrees on it AND more of them just joined. It bets a little more when the average crowd is on the other side."
  thesis: "You trust the aggregate of proven winners over any single guru or your own read — but the edge is the CHANGE in their positioning, not its state, and a change is a headcount, not a dollar figure: a notional bias drifts with price (a long that merely rose reads as 'adding'), while a wallet either holds the position or it doesn't. So WhaleHunter runs Phalanx's smart-money engine: per coin and side it counts how many >$1M-realized wallets hold it (one vote per wallet), takes only the side more of them are on, and fires when that side holds >= 65% of the positioned wallets (at least 10 of them) AND its net headcount grew by two or more since the last read — never a thin lean, never one wallet's move, never on the first read, which only sets the baseline. A hit-rate ledger marks each signal right or wrong an hour later and raises the bar for an asset class that keeps missing. When the small accounts ($10k–100k) lean the other way, that divergence sizes the bet up. Long and short sleeves run on separate wallets; the DSL owns every exit."
  group: smart-money
  archetype: copy_trading
  sub_style: cohort_divergence
  asset_classes: [universe_crypto]
  asset_scope: follows_traders
  direction: long_short
  risk_level: moderate
  tier: advanced
  leverage_max: 5
  max_slots: 6
  assets: []
  tags: [smart-money, cohort, divergence, copy-trading, long-short, crowd-fade, hedged]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: long
    runtime: long/runtime.yaml
    wallet_env: WHALEHUNTER_LONG_WALLET
    funding_share: 0.5
  - name: short
    runtime: short/runtime.yaml
    wallet_env: WHALEHUNTER_SHORT_WALLET
    funding_share: 0.5
