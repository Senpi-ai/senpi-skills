# ── WHALEHUNTER · SHORT sleeve — opens WITH the proven cohort's freshly-forming shorts ──
# Phalanx's smart-money engine (scanners/scoring.py is byte-identical to phalanx's): a name
# qualifies when >= 65% of the smart wallets positioned in it (at least 10 of them) are short
# AND that side's net headcount is up by >= 2 since the last read. One vote per wallet — a
# headcount that price cannot drift, unlike the notional bias this replaces. The crowd
# ($10k–100k lifetime realized) is read only to size a pick UP when it leans the other way.
name: whalehunter-short
group: whalehunter
version: 3.0.0
description: >
  WHALEHUNTER SHORT — smart-money rotation, on Phalanx's engine. Buckets Hyperliquid traders
  by lifetime realized PnL into a SMART cohort (>= $1M) and a CROWD ($10k–100k), counts how
  many smart wallets are long vs short each coin (one vote per wallet), and goes SHORT the
  moment a coin is one-sided AND still filling: >= 65% of the positioned smart wallets short
  (at least 10 of them) and that side's net headcount up by >= 2 since the last read — never
  a thin lean, never one wallet's move, never a position that merely grew in dollars as price
  moved. Sizes up when the smart side is >= 85% one-sided and again when the crowd is buying
  what the winners are selling. A hit-rate ledger raises the bar for an asset class that
  keeps missing. The first read only seeds the baseline. Derived universe (coins come from
  the cohort's positions). Rides a WIDE conviction DSL. Pairs with the LONG sleeve on a
  separate wallet.

strategy:
  wallet: "${WHALEHUNTER_SHORT_WALLET}"
  slots: 6
  default_leverage: 3
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: whalehunter_short_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300
    timeout_seconds: 240                   # under the 300 s interval (a timeout >= the interval regenerates a wedge)
    default_signal_validity_seconds: 1800
    state_history_max_count: 12
    inputs:
      direction: "SHORT"
      # ── cohorts (SLOW clock — cached daily, built a few pages per tick) ──
      smartMinRealizedUsd: 1000000
      crowdMinRealizedUsd: 10000
      crowdMaxRealizedUsd: 100000
      cohortFetchLimit: 1000
      cohortMaxPages: 6
      cohortPagesPerTick: 2                # the refresh is chunked: 2 pages per tick, progress carried in the cache
      cohortSampleCap: 150                 # 3 state batches per cohort per tick
      cohortRefreshHours: 24
      cohortMinMembers: 5
      # ── the gate (Phalanx's engine — scan.fresh_picks over scoring.py) ──
      # A name qualifies on its dominant side only when >= tiltThreshold % of the positioned smart
      # wallets are on that side (scoring.one_sidedness: 0 below 10 wallets, so a thin name never
      # counts) AND that side's net headcount grew by >= deltaMin since the last tick
      # (scoring.directional_delta: one wallet is noise, two is a rotation). This sleeve keeps its
      # own direction only. The hit-rate ledger moves the threshold per asset class: +4 under a
      # 40% hit rate, -2 over 55%, floor 52.
      tiltThreshold: 65
      deltaMin: 2
      # ── sizing (Whalehunter's own): score 4 for a gated name, +1 at >= 85% one-sided, +1 when the
      # crowd's headcount leans the other way -> marginPct x1 / x1.25 / x1.5, capped at maxMarginPct ──
      marginPct: 12                        # PERCENT of withdrawable (0,100], not a fraction
      maxMarginPct: 25                     # conviction-scale cap, percent of withdrawable
      maxConvictionScale: 2.0
      stdLeverage: 3
      maxLeverage: 5
      recentSignalTtlSeconds: 3600
    signal_data_schema:
      score: { type: number }
      direction: { type: string }
      smartMembers: { type: number, required: false }
      oneSidedness: { type: number }
      delta: { type: number }
      divergence: { type: boolean, required: false }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: whalehunter_short_entry
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [whalehunter_short_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: whalehunter_short_signals

# EXIT — WIDE "ride the conviction" DSL (ported verbatim from v2). Time cuts OFF.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss — churning fees.
      # The ratchet must only ever lock a GAIN, or the position rides to the stop.
      # max_loss_pct := the old retrace (10.0% ROE), which is what the trail was already
      # enforcing, so the per-trade risk cap is UNCHANGED. retrace_threshold is now inert.
      enabled: false
      max_loss_pct: 10.0   # was 30.0 — set to the old retrace so the risk cap is unchanged
      retrace_threshold: 10
      consecutive_breaches_required: 2
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 15, lock_hw_pct: 40 }   # first lock reachable (was 60/0 — never armed)
        - { trigger_pct: 25, lock_hw_pct: 55 }
        - { trigger_pct: 45, lock_hw_pct: 65 }
        - { trigger_pct: 90, lock_hw_pct: 78 }
        - { trigger_pct: 180, lock_hw_pct: 88 }

risk:
  guard_rails:
    daily_loss_limit_pct: 15
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: true
    max_consecutive_losses: 5
    cooldown_seconds: 3600
    per_asset_cooldown_seconds: 21600
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: false
