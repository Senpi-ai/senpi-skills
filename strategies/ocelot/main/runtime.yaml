# ── OCELOT · single instance — tech when tech leads the trend basket, chips after a crash, else cash ──
# At each UTC-midnight daily close, with nothing held:
#   Nasdaq 100 (xyz:XYZ100) 10-day RSI under 30          -> buy the 3x chip fund (xyz:SOXL) at 1x
#   else that RSI under 79 AND above the trend basket's  -> buy the Nasdaq 100 at 3x
#     (the basket = the average 10-day RSI of xyz:GOLD, xyz:CL, xyz:EUR and xyz:JPY: the markets a
#     managed-futures fund trades; the venue has no managed-futures fund)
#   else                                                  -> USDC
# The DSL is the ONLY exit: a 30% ROE stop and a wide ladder. No clocks.
#
# Why long only: the original switch is always in, shorting tech when it lags the basket and shorting
# chips when the Nasdaq overheats. Replayed on US daily bars Jan 2010 - Nov 2026 (QQQ, SOXL; GLD, USO,
# FXE and 1/FXY for the basket), entry at the signal close, the stop on the wick, rungs arming on the
# close, each traded market charged its own Hyperliquid cost (taker fee both sides, about 0.018% a
# round trip on these growth-mode xyz markets, plus measured spread), the always-in switch cleared fees
# at only 529 of 648 neighbouring settings (worst 0.68; the Nasdaq short leg loses). Long only: 81
# trades, 75% winners, profit factor 2.59 (2.70 arming on the bar extreme); Nasdaq entries 2.95,
# chip-fund entries 2.13; every four-year block positive (4.22 / 5.09 / 3.09 / 1.56); worst drawdown
# 29% at 20% margin. All 648 neighbouring settings (RSI 8/10/12, crash 28/30/32, overheat 75/79/83,
# stop 21/30/40, four ladders, both arming bounds) cleared fees, the worst at 1.76. On the exchange's
# own candles (Jan - Nov 2026): 5 trades, profit factor 1.85. Measurement in the commit that added this.
name: ocelot-main
group: ocelot
version: 1.0.0
description: >
  OCELOT — tech against the trend basket, long only. At each UTC-midnight daily close, with nothing
  held: if the Nasdaq 100's 10-day RSI closed under 30 it buys the 3x chip fund (xyz:SOXL) at 1x;
  otherwise, if that RSI is under 79 and above the average 10-day RSI of gold, crude oil, the euro and
  the yen (xyz:GOLD, xyz:CL, xyz:EUR, xyz:JPY), it buys the Nasdaq 100 (xyz:XYZ100) at 3x; otherwise
  it waits in USDC. One position at 20% of withdrawable as margin. The DSL is the only exit — a 30%
  ROE stop (10% of price on the index, 30% on the chip fund) and a wide ladder; no clock closes
  anything. Expect about one trade every two or three months.

strategy:
  wallet: "${OCELOT_WALLET}"
  slots: 1                                # one position at a time
  margin_pct: 20                          # baseline %; scan emits marginPct per signal (same number)
  default_leverage: 1                     # fallback only — every signal carries its market's leverage; 1 is
                                          # the LOWEST the recipe uses (SOXL), which is what min_budget must size
  trading_risk: moderate
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: ocelot_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 300                  # the daily close is the only decision point; 5 min bounds the delay
    timeout_seconds: 200                   # one account read + at most five candle reads
    default_signal_validity_seconds: 600   # 2x tick; rule action, a fresh re-score never re-emits a bar
    state_history_max_count: 50            # (market, bar) dedup map + per-tick result
    inputs:
      allowedAssets: ["xyz:XYZ100", "xyz:SOXL"]                 # the markets traded — xyz: prefix mandatory
      techAsset: "xyz:XYZ100"              # the Nasdaq 100: its RSI decides, and it is bought when it leads
      crashAsset: "xyz:SOXL"               # bought after a Nasdaq crash
      basketAssets: ["xyz:GOLD", "xyz:CL", "xyz:EUR", "xyz:JPY"]   # read only: the trend yardstick
      rsiPeriod: 10                        # Wilder RSI on CLOSED daily candles
      crashRsi: 30                         # Nasdaq RSI under this -> the chip fund
      overheatRsi: 79                      # Nasdaq RSI at or over this -> no tech entry
      entryWindowSeconds: 3600             # buy within the hour after the UTC-midnight close, or wait a day
      leverageByAsset: {"xyz:XYZ100": 3, "xyz:SOXL": 1}
      leverageDefault: 1
      leverageMax: 3
      stopRoePct: 30                       # MUST equal exit.dsl_preset.phase1.max_loss_pct (tests pin it)
      marginPct: 20                        # PERCENT of withdrawable (0,100]; one slot
      maxSlots: 1
      minNotionalUsd: 12                   # the venue's bumped minimum; the free-margin gate stops emitting below it
    signal_data_schema:
      leg: { type: string }
      direction: { type: string }
      techRsi: { type: number }
      yardstick: { type: number, required: false }
      signalBarTime: { type: number }
      leverage: { type: number }
      stopPricePct: { type: number }
      reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: ocelot_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied the whole rule
    scanners: [ocelot_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # the buy is AT the close — maker window first, taker fallback
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: ocelot_main_signals

# ── EXIT (DSL only) ───────────────────────────────────────────────────────────────────────
# Every threshold is ROE (% of margin); at 3x its distance in PRICE is ROE / 3. Stop 10% of price;
# rungs arm at +5% / +8.3% / +13.3% / +20% / +33% and lock 30 / 45 / 60 / 75 / 85% of the best gain.
# At 1x on the chip fund every ROE number is the price move itself: stop 30%, rungs +15% ... +100%.
# Clock cuts are OFF: of 142 clock-driven closes measured in one fleet week, 110 were in profit.
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true        # closes MUST happen — taker fallback safety floor
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout: { enabled: false, interval_in_minutes: 4320 }
    weak_peak_cut: { enabled: false, interval_in_minutes: 360, min_value: 3.0 }
    dead_weight_cut: { enabled: false, interval_in_minutes: 60 }
    phase1:
      # Trailing DISABLED fleet-wide: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss. max_loss_pct is the hard
      # stop; retrace_threshold is inert while enabled is false.
      enabled: false
      max_loss_pct: 30.0   # 10% of price on the index at 3x, 30% on the chip fund at 1x — mirrored by inputs.stopRoePct
      retrace_threshold: 30
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:                               # trigger / lock, ROE; price at 3x in the comment
        - { trigger_pct: 15, lock_hw_pct: 30 }   # +5% of price    -> floor +1.5%
        - { trigger_pct: 25, lock_hw_pct: 45 }   # +8.3%           -> floor +3.75%
        - { trigger_pct: 40, lock_hw_pct: 60 }   # +13.3%          -> floor +8%
        - { trigger_pct: 60, lock_hw_pct: 75 }   # +20%            -> floor +15%
        - { trigger_pct: 100, lock_hw_pct: 85 }  # +33%            -> floor +28.3%

# ── RISK guard rails (one slow book: rare entries, a wide stop, no self-resetting breaker) ──
risk:
  data_retention_seconds: 604800           # 7d — a position can live for months
  guard_rails:
    daily_loss_limit_pct: 10               # one stop-out is 30% x 20% = 6% of the account
    max_entries_per_day: 2                 # one per daily close; the second covers a re-entry the next close
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 86400                # a day after three losses in a row
    drawdown_halt_pct: 35                  # the wallet-wide hard stop; above the replay's 29% worst drawdown
    drawdown_reset_on_day_rollover: false  # clearing it is a deliberate act (redeploy), not midnight
    per_asset_cooldown_seconds: 300        # the scanner already allows one entry per daily close

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
