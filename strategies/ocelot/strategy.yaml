# Ocelot — tech when tech leads the trend basket, chips after a Nasdaq crash, cash otherwise. A
# single-instance PACKAGE: this manifest + one self-contained runtime.yaml + scanners/. Long only:
# the short halves of the original always-in switch were replayed and lost. ADVANCED tier.
# Install/teardown via senpi-strategy-ops.
schema_version: 1

id: ocelot
version: "1.0.0"

catalog:
  name: "Ocelot — Tech vs Trend Switch"
  emoji: "🐆"
  tagline: "Buys tech only when tech is the stronger trend. At each daily close it compares the Nasdaq 100's 10-day RSI with the average RSI of gold, crude oil, the euro and the yen: if tech is ahead (and not overheated, under 79) it buys the Nasdaq 100 (xyz:XYZ100) at 3x; if the Nasdaq has just crashed (RSI under 30) it buys the 3x chip fund (xyz:SOXL) at 1x for the rebound; otherwise it sits in USDC. Long only, one position; a wide trailing stop that only moves in your favour decides every exit."
  belief_plain: "Money flows between tech stocks and the big macro trends — gold, oil, currencies. Once a day, while it holds nothing, it asks which is stronger right now: if tech's momentum beats the macro basket's and tech has not just run up too hard, it buys the Nasdaq; if tech has just crashed, it buys the chip fund for the bounce; otherwise it waits in cash. It never shorts. One position at a time, a stop on each, and a ratchet that locks in the gain as it grows."
  thesis: "You want to buy tech when tech is leading and stay out of it when the macro trades are leading, without having to call which is which yourself — and you want the crash-day rebound in chips on top. A position already open is closed by its stop or its profit lock, not by the lead changing. It trades every two or three months, holds for weeks, and accepts deep swings in the 3x positions it takes."
  group: multi-asset-whitelist
  archetype: trend_following
  sub_style: rotation
  asset_classes: [indices, xyz_equities]
  asset_scope: basket
  direction: long_only
  risk_level: aggressive
  tier: advanced
  time_horizon: position
  leverage_max: 3
  max_slots: 1
  assets: ["xyz:XYZ100", "xyz:SOXL"]
  tags: [tech, nasdaq, xyz100, chips, soxl, semiconductors, managed-futures, trend-basket, macro,
         gold, oil, fx, relative-strength, rsi, switch, risk-on-risk-off, buy-the-crash, long-only,
         one-position, cash-when-weak, xyz, slow, let-winners-run, dsl-only, rotation]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: OCELOT_WALLET
    funding_share: 1.0
