# ── KOALA · single instance — Trail HODL (Runtime 3.0 port of v2 KOALA; 2.0.0 measured) ──
# The simplest agent in the catalog. ONE asset (default BTC), LONG only, no scoring: the only
# decision the operator makes is "which asset?". The wide DSL is the entire exit logic.
#
# 2.0.0 (2026-10-12), measured on 2+ years of BTC/ETH/SOL 4h candles, 112 weekly starts each:
#   - the entry counts when it FILLS. 1.x recorded it when the signal was emitted, so a first
#     order the venue refused still spent the lifetime one-shot and the wallet sat idle until
#     redeployed. A pending marker now turns into the entry only when a tick sees the asset held.
#   - the stop is the card's 30% ROE (15% of price at 2x). The file carried 10% ROE = 5% of
#     price, an ordinary correction: half of all weekly-start holds ended at that stop inside
#     ~8 days with a negative median (BTC -3.6%). At 30% ROE the median hold is +2.5% over 23
#     days with 71% positive (ETH +2.6%/66%, SOL +2.8%/67%).
#   - the 90-day clock is off: 2 of 112 holds ever reached it; the stop and the ratchet end holds.
#   - re-entry is the default (a week after each exit): the ratchet's first rung closes most
#     holds within a few weeks, so fire-once left the wallet idle for the rest of the plan. A
#     7-day cooldown kept 60-80% time in market and beat fire-once on all three coins; the
#     alternative "re-enter when price reclaims the 50-day average" did worse on all three.
#   - sizing 40% of the wallet at 2x (80% exposure). 80% at 2x, as first proposed, ran peak
#     drawdowns of 58-74% of the book across the cycle — past the 35% wallet halt.
name: koala-main
group: koala
version: 3.0.0
description: >
  KOALA — single-asset Trail HODL. Pick one asset (default BTC), go LONG at 2x on 40% of
  the wallet, and hold behind the widest DSL in the catalog: a 30% ROE stop (15% of price)
  and a ratchet that only ever locks gains (first lock at +12% ROE). No scoring, no
  multi-timeframe analysis, no smart-money gates — the choice to deploy Koala IS the bet.
  An entry counts when it fills (2.0.0): a refused first order no longer spends the
  one-shot. Re-entry is the default — a week after the DSL closes a hold, Koala buys again;
  set fireOnceMode=true for a true one-shot that stays silent after its first exit. The
  DSL is the ONLY exit: no hard_timeout, no weak_peak_cut, no dead_weight_cut — the hold
  ends at the stop, at the ratchet, or when you redeploy.

strategy:
  wallet: "${KOALA_WALLET}"
  slots: 1                                # single asset, single position
  margin_pct: 40                          # baseline %; scan emits the per-signal marginPct (40%); 80% at 2x drew the book down 58-74%
  default_leverage: 2                     # fallback; scan emits 2x (clamped to MAX_LEVERAGE 3x)
  trading_risk: conservative
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: koala_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 1800                 # v2 producer cadence (30 min — Koala has no urgency)
    timeout_seconds: 120                   # v2 tick_timeout=120; 1 MCP read/tick (clearinghouse)
    default_signal_validity_seconds: 3600  # 2x tick; one-shot entry, state owns re-fire suppression
    state_history_max_count: 100           # koala state machine + dedup map + per-tick scan-results history
    inputs:
      asset: "BTC"                         # v2 config default (validated live on HL main DEX 2026-06-29)
      dex: ""                              # main DEX; an xyz:NAME asset would set dex="xyz"
      fireOnceMode: false                  # 2.0.0: re-entry a week after each exit (fire-once idled the wallet after ~3 weeks)
      reEntryCooldownHours: 168            # v2 DEFAULT_RE_ENTRY_COOLDOWN_HOURS (7d) — only used if fireOnceMode=false
      marginPct: 40                        # PERCENT of withdrawable; 2.0.0: was 50
      leverage: 2                          # v2 DEFAULT_LEVERAGE; clamped to maxLeverage in scan.py
      maxLeverage: 3                       # v2 MAX_LEVERAGE (hardcoded — Koala is HODL, not gambling)
      recentSignalTtlSeconds: 240          # v2 RECENT_SIGNAL_TTL_SEC — race-window dedup
      pendingEntryExpirySeconds: 5400      # 2.0.0: an emitted entry not seen held within three ticks never happened
    signal_data_schema:
      score: { type: number }
      leverage: { type: number }
      direction: { type: string }
      reasons: { type: array, required: false }
      heldAssets: { type: array, required: false }
      firstEntryAt: { type: number, required: false }
      totalEntries: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: koala_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # the scan already applied the state-machine decision (v2 LLM gate was pass-through)
    scanners: [koala_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # maker window first, then taker fallback — a maker-only entry (fallback off) passes validation and fails or phantom-fills at the executor
        execution_timeout_seconds: 60      # v2 entry execution_timeout_seconds
    context:
      - type: signal
        scanner: koala_main_signals

# ── EXIT — the widest DSL in the catalog, and the ONLY exit (2.0.0: no clock) ──
# 30% ROE stop = 15% of price at 2x: the catastrophic net the card promises. Ratchet locks gains
# only (first rung +12% ROE). No hard_timeout, no weak_peak_cut, no dead_weight_cut — the hold
# ends at the stop, at the ratchet, or when the user redeploys.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: false       # v2: patient maker exit, save fees
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: false                       # 2.0.0: was 90 days — 2 of 112 measured holds reached it; the DSL ends the hold
      interval_in_minutes: 129600
    weak_peak_cut:
      enabled: false                       # v2: DISABLED
      interval_in_minutes: 360
      min_value: 3.0
    dead_weight_cut:
      enabled: false                       # v2: DISABLED
      interval_in_minutes: 60
    phase1:
      # Trailing DISABLED (fleet-wide): a floor that trails high-water can sit below entry and
      # close a winner at a loss. The ratchet only ever locks a GAIN; otherwise the hold rides
      # to the absolute floor below. retrace_threshold is inert.
      enabled: false
      max_loss_pct: 30.0   # 2.0.0: back to the card's 30% ROE = 15% of price at 2x (10% ROE was 5% of price: half of all holds stopped inside ~8 days)
      retrace_threshold: 10                 # v2: trail into profit (was 25)
      consecutive_breaches_required: 3      # 3 confirmations before the catastrophic stop trips
    phase2:
      enabled: true
      tiers:                                # v2 ladder — first lock REACHABLE (+12% ROE)
        - { trigger_pct: 12,  lock_hw_pct: 35 }
        - { trigger_pct: 25,  lock_hw_pct: 55 }
        - { trigger_pct: 50,  lock_hw_pct: 68 }
        - { trigger_pct: 120, lock_hw_pct: 80 }
        - { trigger_pct: 300, lock_hw_pct: 88 }   # still rides a big runner

# ── RISK guard rails (from the v2 Koala runtime.yaml; minutes -> seconds) ──
risk:
  data_retention_seconds: 604800       # clamped to 3.0 max (7d); v2 intent 90d exceeds cap
  guard_rails:
    daily_loss_limit_pct: 20               # v2 — very permissive (Koala is meant to ride drawdowns)
    max_consecutive_losses: 2              # v2 max_consecutive_losses
    cooldown_seconds: 3600                 # v2 cooldown_minutes: 60
    drawdown_halt_pct: 35                  # v2 drawdown_halt_pct (tolerates a 35% margin drawdown)
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 3600       # v2 per_asset_cooldown_minutes: 60

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
