# Koala — Set-and-Forget Trail HODL. A single-instance PACKAGE: this manifest + one
# self-contained runtime.yaml + scanners/. A faithful Runtime 3.0 port of the v2 Koala
# (SKILL.md v1.0.0 / producer VERSION 1.0.1): the simplest agent in the catalog — pick
# one asset (default BTC), fire LONG once on deploy, hold with an ultra-wide DSL trail.
# No scoring, no multi-timeframe analysis, no SM gates. Install/teardown via
# senpi-strategy-ops.
schema_version: 1

id: koala
version: "2.0.0"

catalog:
  name: "Koala — Trail HODL"
  emoji: "🐨"
  tagline: "The simplest agent in the catalog: pick one asset (default BTC), go long at 2x on 40% of the wallet, and hold behind the widest stop in the catalog — 30% of margin, 15% of price — with a ratchet that only ever locks gains. No scoring, no scheduling; the choice to deploy Koala IS the bet. A week after a hold ends it buys again (set fireOnceMode for a true one-shot). Measured on two years of BTC, ETH and SOL: the median hold ran about three weeks and ended positive two times in three."
  belief_plain: "Trades only the one coin you pick (BTC by default). It buys when you turn it on and holds — never adding, never trading around it — behind a wide safety stop that only releases on a 15% fall from your entry, and a trailing lock that banks part of a big run. When a hold ends, it waits a week and buys again, so the wallet stays invested; turn that off if you want one shot and nothing more. An entry only counts once it has actually filled, so a refused first order never leaves the wallet silent."
  thesis: "Some users do not want a market-reading agent at all — they want to own one asset with a net under it. Koala is that in code: one asset, one entry at a time, one wide stop, one ratchet. Measured on 112 weekly starts over two years of BTC, ETH and SOL, the stop the file used to carry (5% of price) ended half of all holds at a loss inside about eight days; the card's 30%-of-margin stop turns the median hold positive. Re-entry a week after each exit is what keeps the wallet in the market, since the ratchet's first rung ends most holds within a few weeks. Sized at 80% exposure, not more: a full-wallet 2x cycle drew down more than half the book."
  group: single-asset
  archetype: single_market
  sub_style: hodl
  asset_classes: [major_alts]
  asset_scope: single
  direction: long_only
  risk_level: conservative
  tier: starter
  leverage_max: 3
  max_slots: 1
  assets: ["BTC"]
  tags: [btc, single-asset, hodl, buy-and-hold, set-and-forget, wide-dsl, re-entry, entry-on-fill, onboarding, long-only, dsl-only]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: KOALA_WALLET
    funding_share: 1.0
