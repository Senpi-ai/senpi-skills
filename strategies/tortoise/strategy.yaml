# Tortoise — scheduled buyer. A single-instance PACKAGE: this manifest + one
# self-contained runtime.yaml + scanners/. A Runtime 3.0 port of the v2 Tortoise
# (SKILL.md v1.0.0) clock: time-triggered buying on a small basket (BTC/ETH/SOL),
# no price prediction. 2.0.0: it holds ONE position per asset — bought on the
# schedule when flat, re-bought a full interval after that position has exited —
# and never adds to an open position; wide 30% ROE stop (15% of price at 2x), no
# clock cut. Install/teardown via senpi-strategy-ops.
schema_version: 1

id: tortoise
version: "2.0.0"

catalog:
  name: "Tortoise — Scheduled Buyer"
  emoji: "🐢"
  tagline: "A clock, not a chart: holds one long position each in BTC, ETH and SOL, buying a name on its schedule whenever it is flat — on deploy, and again a full interval (24 hours by default) after its position has exited. Not DCA: it never adds to an open position. Predicts nothing; each holding sits behind a wide stop — 30% of margin, 15% of price at 2x — with a ratchet that only locks gains, and nothing is closed for being old."
  belief_plain: "Buys one position each in BTC, ETH and SOL (25% of the wallet apiece at 2x) and holds them. It does not time the market and it does not add to a position: if a holding is stopped out, it waits a full day and then buys that coin again on its schedule. The stop is wide — a 15% fall in price — so an ordinary dip is held through rather than sold, and a ratchet banks part of a big run. Nothing is closed just for being old."
  thesis: "The most accessible trade in crypto is to own the majors and not fiddle. Tortoise does that on a clock: it predicts nothing, buys whichever eligible name has been flat the longest, and leaves the exit to the DSL. It is not dollar-cost averaging — the runtime has no way to add to an open position, so each coin is one position, re-bought only after it has exited and a full interval has passed. That re-buy clock is keyed to the exit, not the buy, so a stop-out is not bought straight back into the same move. The stop is 30% of margin, 15% of price at 2x: wide enough to hold the ordinary dips a buyer like this exists to hold through, which a tighter stop sold."
  group: dca
  archetype: structural_neutral
  sub_style: dca
  asset_classes: [btc_eth, major_alts]
  asset_scope: basket
  direction: long_only
  risk_level: conservative
  tier: starter
  leverage_max: 2
  max_slots: 3
  assets: ["BTC", "ETH", "SOL"]
  tags: [btc, eth, sol, multi-asset, scheduled-buyer, time-trigger, always-long, one-position-per-asset, re-entry, wide-stop, dsl-only, onboarding]

requires:
  runtime: ">=3.0.0"

defaults:
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: main/runtime.yaml
    wallet_env: TORTOISE_WALLET
    funding_share: 1.0
