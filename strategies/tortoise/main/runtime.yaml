# ── TORTOISE · single instance — scheduled buyer, one position per asset (2.0.0) ──
# A clock, not a chart. Small basket (BTC/ETH/SOL), NO price prediction, NO
# scoring, NO market-data read. Each tick: read account + held positions, note
# any name that was held at the last good read and is flat now (it EXITED — the
# time is recorded in ctx.state), pick the most-overdue eligible name whose
# clock has run a full interval since its last buy OR last exit (never-bought
# names are always due), emit ONE LONG signal at marginPct. A held name is
# never added to. DSL is the ONLY exit — no clock cut of any kind. The cadence
# math is the v2 producer's, verbatim — see scanners/scoring.py.
name: tortoise-main
group: tortoise
version: 3.0.0
description: >
  TORTOISE — scheduled buyer. "Slow and steady wins the race." Holds ONE long
  position per asset on a small basket (BTC/ETH/SOL): a name is bought on the
  schedule whenever it is flat — on deploy, and again a full interval (24h by
  default) after its position has exited. It never adds to an open position
  (the runtime has no supported way to), so this is not dollar-cost averaging.
  The re-buy clock is keyed to the EXIT, not the buy, so a stop-out is not bought
  straight back. No prediction, no scoring, no timing; the most-overdue eligible
  name wins each tick, everything else is silent. Sizing is fixed: 3 slots x 25%
  of the wallet at 2x (the package cap). DSL is the ONLY exit — a wide 30% ROE
  stop (15% of price at 2x), a ratchet that only locks gains, no hard_timeout.
  THE most beginner-accessible trade in crypto. Onboarding tier.

strategy:
  wallet: "${TORTOISE_WALLET}"
  slots: 3                                # one position per asset: BTC, ETH, SOL
  margin_pct: 25                          # PERCENT of the wallet per position; 3 x 25% = 75%
  default_leverage: 2                     # the package cap; scan.py clamps to 2x (_MAX_LEVERAGE)
  trading_risk: conservative
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: tortoise_main_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 1800                 # v2 producer cadence (30min) — a slow clock by design
    timeout_seconds: 120                   # v2 tick_timeout=120; one clearinghouse read per tick (no market data)
    default_signal_validity_seconds: 3600  # 2x tick; rule action, a fresh schedule re-check arrives next tick
    state_history_max_count: 100           # buy/exit history + last-good held set + race-window dedup + per-tick results
    inputs:
      assets: ["BTC", "ETH", "SOL"]        # v2 DEFAULT_ASSETS (validated live on HL main DEX 2026-06-29)
      intervalHours: 24                    # a name is re-bought no sooner than this after its last buy or exit
      marginPct: 25                        # PERCENT of the wallet (0,100] per position; must equal strategy.margin_pct
      leverage: 2                          # the package cap; clamped to _MAX_LEVERAGE=2 in scan.py
      recentSignalTtlSeconds: 240          # v2 RECENT_SIGNAL_TTL_SEC (race-window dedup; ALO fill window + next-tick refresh)
    signal_data_schema:
      score: { type: number }
      leverage: { type: number }
      direction: { type: string }
      reasons: { type: array, required: false }
      anchor: { type: string, required: false }     # never_bought | last_exit | last_buy — which event the clock ran from
      intervalSec: { type: number, required: false }
      elapsedSec: { type: number, required: false }
      heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: tortoise_main_entry
    action_type: OPEN_POSITION
    decision_mode: rule                    # v2 LLM gate was pure pass-through (always confidence 7, no price scoring)
    scanners: [tortoise_main_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # maker window first, then taker fallback — a maker-only entry (fallback off) passes validation and fails or phantom-fills at the executor
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: tortoise_main_signals

# ── EXIT (DSL — the ONLY exit; no clock cut of any kind) ──
# A buyer that predicts nothing must be able to hold through an ordinary dip:
# the stop is 30% ROE = 15% of price at 2x. The ratchet (phase2) only ever locks
# a GAIN, first at +25% ROE; a position is never cut for being old, flat or
# slow — hard_timeout, weak_peak_cut and dead_weight_cut are all off.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: false
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: false                       # no clock: the DSL decides every exit
      interval_in_minutes: 43200
    weak_peak_cut:
      enabled: false
      interval_in_minutes: 360
      min_value: 3.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 60
    phase1:
      # Trailing DISABLED: the phase-1 floor trails HIGH-WATER, so after a small favourable
      # move it can still sit BELOW entry and close a WINNER at a loss — churning fees.
      # The ratchet must only ever lock a GAIN, or the position rides to the stop.
      enabled: false
      max_loss_pct: 30.0   # 30% ROE = 15% of price at 2x — wide enough to hold an ordinary dip
      retrace_threshold: 10
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 25, lock_hw_pct: 50 }
        - { trigger_pct: 50, lock_hw_pct: 70 }
        - { trigger_pct: 100, lock_hw_pct: 85 }
        - { trigger_pct: 200, lock_hw_pct: 92 }

# ── RISK guard rails (from v2 runtime.yaml; minutes -> seconds) ──
risk:
  data_retention_seconds: 604800       # the 3.0 maximum (7d); v2 asked for a longer retention than the cap allows
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 6                  # above the 3 slots: a day with three exits and three re-buys is not capped
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 5
    cooldown_seconds: 1800                  # v2 cooldown_minutes: 30
    drawdown_halt_pct: 25                   # above one correlated stop-out of all three (3 x 25% x 30% ROE = 22.5%);
                                            # with no day-rollover reset an 18% halt latched for good on the first crash
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 3600        # v2 per_asset_cooldown_minutes: 60

notifications:
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
