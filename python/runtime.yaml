name: python-tracker
version: 1.2.0
description: >
  PYTHON v1.2 — disable weak_peak_cut (completes patience thesis fix).
  v1.1 loosened Phase 1 retrace 10→30 and extended time cuts after
  Python's self-diagnostic showed trades averaging <4h despite a 2-4
  day thesis target. v1.2 removes weak_peak_cut entirely — a
  multi-day patience thesis cannot tolerate ANY time-based cut. A
  position peaking at 2% ROE on day 1 of a 3-day thesis can still
  develop into a monster over day 3. Phase 1 retrace (30%) + max_loss
  (20%) + Phase 2 tiers own all exits. dead_weight_cut + hard_timeout
  (96h) preserved — 96h matches thesis target as an outer bound.
  Scanner unchanged. v1.1 retrace/dead_weight loosening preserved.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 250
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ─── EXIT (DSL) — Patience profile (v1.1 aligned with thesis) ──
# Python's thesis: 2-4 day holds, high-conviction signals, let winners
# run 100%+. v1.0's DSL was a scalper's leash.
# v1.1 loosens the trailing-retrace floor 3x so normal intraday noise
# doesn't trigger exits, and extends time cuts to match multi-day hold
# expectations. Phase 1 max_loss preserved as the absolute backstop.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 5760       # 96h = 4 days (matches thesis target)
    weak_peak_cut:
      enabled: false                   # v1.2: DISABLED. Multi-day patience thesis cannot tolerate ANY time-based cut. Phase 1 retrace (30%) + max_loss (20%) + Phase 2 tiers own exits.
      interval_in_minutes: 2880
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 1440        # v1.1: 360 → 1440 (24h no movement)
    phase1:
      enabled: true
      max_loss_pct: 20.0               # absolute hard stop (unchanged)
      retrace_threshold: 30            # v1.1: 10 → 30 (core thesis-alignment fix)
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,   lock_hw_pct: 15 }   # LOOSE initial lock — let winners breathe
        - { trigger_pct: 12,  lock_hw_pct: 35 }
        - { trigger_pct: 25,  lock_hw_pct: 60 }
        - { trigger_pct: 50,  lock_hw_pct: 80 }   # pr0br000's MON/WLD-tier
        - { trigger_pct: 100, lock_hw_pct: 94 }   # v1.1: was 90; bumped to final tier

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
