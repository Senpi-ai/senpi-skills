name: piranha-tracker
# Top-level `version` is the SCHEMA version expected by the
# senpi-trading-runtime plugin (major=1). Skill version is "Piranha
# v1.0.0" and lives in description + SKILL.md + _piranha_producer_version.
version: 1.0.0
description: >
  PIRANHA v1.0.0 — Liquidation-Cascade / Forced-Flow Hunter.

  When open interest is UNWINDING fast (positions being force-closed) AND
  price is moving violently, that's forced flow — liquidations begetting
  liquidations. Piranha rides it: OI down + price spiking UP = shorts
  squeezed → LONG; OI down + price dropping = longs liquidated → SHORT.
  A thin order book on the side price runs into confirms little resistance.
  Universe: BTC/ETH/SOL/HYPE.

  Architecture (helpers-native): producer ticks every 180s, scores a
  forced-flow thesis (max ~9), emits PIRANHA_FORCED_FLOW via
  SenpiClient.push_signal() when score >= 5. LLM gate is pass-through.

  DSL: wide "let winners run" ladder (a squeeze can extend far) + a 24h
  hard_timeout (forced-flow theses are short-horizon — if it hasn't
  resolved in a day, the cascade is over). Phase 1 max_loss 18%.

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 1
  margin_per_slot: 200
  trading_risk: balanced
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 15
    max_entries_per_day: 4
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 60
    drawdown_halt_pct: 22
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 180

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: piranha_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        oiChangePct: { type: number, required: false }
        oiSource: { type: string, required: false }
        move1hPct: { type: number, required: false }
        move5mPct: { type: number, required: false }
        bidDepth: { type: number, required: false }
        askDepth: { type: number, required: false }
        volumeTrendPct: { type: number, required: false }
        smDirection: { type: string, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: piranha_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${PIRANHA_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [piranha_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true         # forced-flow entries must fill NOW — a maker order would rest and miss the move (CREATE_ORDER_RESTING)
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: piranha_signals
    decision_prompt: |
      You are Piranha's pass-through gate. Piranha rides FORCED FLOW: the
      producer found open interest unwinding fast (positions being
      liquidated/force-closed) alongside a violent price move and ongoing
      5m acceleration. The emitted direction is the direction of the flow.
      The producer applied every filter (OI unwind >= 3%, |1h move| >= 2%,
      5m still moving the same way, minScore 5). Honor the signal.

      SIGNAL:
      {{signal_piranha_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve case).
      2. direction MUST be copied from signal.direction (LONG or SHORT).
      3. leverage MUST be copied from signal.data.leverage (1-5x).
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR marginUsd <= 0
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 8 AND |move1hPct| >= 4 AND oiChangePct <= -6
      - 7-8:  score 6-7
      - 7:    score 5 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      Return JSON:

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 8 SOL LONG, oi_unwind -7.1%, move_1h +3.4%, book thin into move — short squeeze forced flow')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "PIRANHA_FORCED_FLOW ${direction} — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — wide ladder + short-horizon outer bound) ──────
#
# A squeeze can extend far, so let it run; but forced flow is short-horizon,
# so a 24h hard_timeout is the outer bound. Phase 1 max_loss 18% cuts a
# cascade that reverses on you (V-shaped). Time-cuts otherwise off.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 1440                   # 24h — forced flow resolves fast; outer bound
    weak_peak_cut:
      enabled: false
      interval_in_minutes: 120
      min_value: 3.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 60
    phase1:
      enabled: true
      max_loss_pct: 18.0
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10,  lock_hw_pct: 0  }
        - { trigger_pct: 20,  lock_hw_pct: 25 }
        - { trigger_pct: 30,  lock_hw_pct: 40 }
        - { trigger_pct: 50,  lock_hw_pct: 60 }
        - { trigger_pct: 75,  lock_hw_pct: 75 }
        - { trigger_pct: 100, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
