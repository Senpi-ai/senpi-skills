name: cheetah-tracker
version: 5.2.0
description: >
  CHEETAH v5.2 — Multi-signal confluence sniper (over-trading fix).
  v5.1 shipped with 80% margin + 5% max_loss + 25-min dead_weight_cut, which
  produced 406 fills / -28% ROI / $1,600+ in fees. The "sniper" framing
  was contradicted by the actual trade frequency. v5.2 pulls every knob
  toward Kodiak-family discipline:
    entry.marginPct 80% → 30% (kill the all-in concentration)
    MIN_SCORE 10 → 11 (stricter bar)
    phase1.max_loss_pct 5% → 15% (give room for volatility)
    phase1.retrace_threshold 5 → 8
    dead_weight_cut 25 → 60 min (let positions develop)
    weak_peak_cut 35 → 90 min (patience before cutting)
    hard_timeout 360 → 480 min
  The sniper can still win asymmetric Arena ROE with 30% margin and tighter
  score — it just won't nuke the account with one wrong call at 80%/10x.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 648
  slots: 1
  margin_per_slot: 200
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# v5.2 DSL — loosened across every dimension. Tight 5% max_loss at 10x
# leverage means a 0.5% adverse price move = full stop. That's noise,
# not thesis invalidation.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480       # v5.2: 360 → 480 (8h)
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90        # v5.2: 35 → 90
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60        # v5.2: 25 → 60
    phase1:
      enabled: true
      max_loss_pct: 15.0             # v5.2: 5 → 15
      retrace_threshold: 8           # v5.2: 5 → 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 6,  lock_hw_pct: 30 }
        - { trigger_pct: 12, lock_hw_pct: 55 }
        - { trigger_pct: 20, lock_hw_pct: 70 }
        - { trigger_pct: 35, lock_hw_pct: 85 }
        - { trigger_pct: 60, lock_hw_pct: 92 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
