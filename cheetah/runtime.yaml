name: cheetah-tracker
version: 1.0.0
description: >
  CHEETAH v4.0 — HYPE Funding Rate + Crowding Fader. Enters opposite to
  extreme HYPE funding rates, collecting funding while waiting for crowded
  positions to mean-revert. Different thesis from Wolverine (SM consensus).

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 400
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# Wide DSL — funding mean-reversion takes hours.
# The edge includes collecting funding every 8h, so patience pays.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 120
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 45
    phase1:
      enabled: true
      max_loss_pct: 20.0
      retrace_threshold: 10
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 3,  lock_hw_pct: 15 }
        - { trigger_pct: 7,  lock_hw_pct: 30 }
        - { trigger_pct: 12, lock_hw_pct: 50 }
        - { trigger_pct: 20, lock_hw_pct: 70 }
        - { trigger_pct: 30, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
