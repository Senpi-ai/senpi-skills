name: cheetah-tracker
# `version` below is the runtime-schema version (must stay at major 1).
# It is NOT the skill version — the skill's own version lives in
# `description:` and SKILL.md. Don't bump this when you bump the skill.
version: 1.0.0
description: >
  CHEETAH v6.1 — Phase 2 T0 ladder calibration (2026-05-05).
  First v6.0 trade post-deploy (ZEC LONG 2026-05-04 23:19 UTC, score
  10, SM 22.85%/210t) peaked at +3.05% margin ROE — never reached
  old T0 trigger 5%. Closed via Phase 1 retrace at -4.09% / -$9.68.
  Same Pangolin v2.2 pattern. v6.1 lowers T0 to 3 (lock 40), T1 to 7
  (lock 55), T2 to 15 (lock 70). Captures small winners that the
  old ladder gave back. No producer code changes.

  CHEETAH v6.0 — Multi-signal confluence sniper, v2-runtime-native rewrite.

  v5.x was a v1 full-agency Python scanner: scored signals, called
  create_position directly, maintained Python-side counters /
  cooldowns / resting-order guards. v6.0 flips to producer + v2
  runtime (Polar v4.0 / Pangolin v2.1 / Vulture v3.0 pattern).

  WHAT v6.0 ENABLES:
    - Producer (cheetah-producer.py) emits signals via
      `SenpiClient.push_signal()` (direct HTTP POST). NO execution code.
    - Runtime LLM gate is pass-through (Roach pattern) — producer has
      applied every filter; LLM only catches malformed signals.
    - risk.guard_rails ENFORCES daily caps, drawdown halt, consecutive-
      loss halt, per-asset cooldown — no Python state to drift.
    - DSL uses FEE_OPTIMIZED_LIMIT on entries AND exits — saves
      ~0.020-0.030% per maker-filled close vs v5.x MARKET orders.
      Cheetah's HYPE-era trades burned ~$206 in fees on 44 trades;
      maker exits would have recovered $90-140 of that.
    - Trade chain DB emits LIFECYCLE / DECISION_EXECUTED / ACTION_RESULT
      / DSL_CREATED / DSL_CLOSED for every trade — telemetry restored.

  WHAT'S PRESERVED FROM v5.2:
    - Multi-signal confluence scoring (max 15 points, 7 components)
    - Top-100 SM leaderboard universe (leaderboard_get_markets)
    - Quality-trader cache (15 min, ELITE/RELIABLE)
    - Rank-climb tracking (20-scan history)
    - Score-scaled leverage tiers (3x at score 10, up to 8x at score 14+)
    - get_safe_leverage() — clamps requested leverage to HL asset max
    - XYZ banned, max 1 position, 30% margin per slot

  v6.0 CHANGES vs v5.2:
    - MIN_SCORE 11 → 10 (restore trade flow that worked in v5.0/v5.1
      era — produced +$182 net before v5.2 over-tightened to 11
      and caused 8 days of zero trades).
    - Architecture v1 → v2 (producer + runtime, not full-agency scanner).
    - FEE_OPTIMIZED_LIMIT on EXITS too (v5.2 only had it on entries).
    - Held-asset dedup (3-layer: producer + LLM gate + runtime cooldown).
    - Post-close cooldown (Pangolin v2.1.2 pattern; backstop for
      runtime per_asset_cooldown_minutes silent enforcement bug).
    - Reentrancy lockfile (fcntl).
    - Wallet from config/cheetah-config.json (canonical source).

  FLEET PATCHES NOT YET APPLIED:
    - FP-001 quiet hours — deferred until fleet telemetry confirms
      time-of-day P&L correlation (per Jason 2026-05-04).

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 1
  margin_pct: 25        # % of account budget per slot (scales with any budget)
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 25
    max_entries_per_day: 8                # v5.2 dynamic cap upper bound
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 30
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false # avoid the next-day reset
                                          # leak observed on Roach
                                          # 2026-05-03 Sat-Sun bleed.
    per_asset_cooldown_minutes: 240       # 4h — known to silently
                                          # not-enforce on some v2
                                          # agents; producer-side
                                          # post-close cooldown is
                                          # the backstop.

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: cheetah_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        reasons: { type: string, required: false }
        smPct: { type: number, required: true }
        smTraders: { type: number, required: true }
        rank: { type: number, required: false }
        contrib15m: { type: number, required: false }
        contrib1h: { type: number, required: false }
        priceChg4hPct: { type: number, required: false }
        priceChg1hPct: { type: number, required: false }
        volRatio: { type: number, required: false }
        qualityAlign: { type: number, required: false }
        rankClimb: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: cheetah_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${CHEETAH_DECISION_MODEL}"  # REQUIRED. BARE model name only — NO provider prefix.
    scanners: [cheetah_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: cheetah_signals
    decision_prompt: |
      You are Cheetah's pass-through gate. The producer has already
      applied EVERY filter (top-100 SM leaderboard, hard SM consensus
      gate, hard velocity gate, multi-signal confluence scoring with
      MIN_SCORE 10, per-asset cooldown, post-close cooldown, XYZ ban,
      held-asset dedup, leverage clamp to HL asset max).
      Your job is to honor the signal unless something is structurally
      broken.

      SIGNAL:
      {{signal_cheetah_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. The `asset` MUST be copied EXACTLY from the signal's `asset`
         field. If signal says "BTC", output "BTC", not "btc".
      2. The `direction` MUST match the signal's `direction` field exactly.
      3. The `leverage` MUST be copied from signal.data.leverage (already
         clamped to HL asset max by producer's get_safe_leverage()).
      4. Every claim in `reasoning` MUST cite values from the signal —
         score, smPct, smTraders, contrib15m/1h, priceChg, volRatio, etc.
         Do not fabricate.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 10 (producer floor; defensive only)
      - leverage <= 0 OR marginUsd <= 0 (malformed signal)
      - reasons string empty (malformed signal)
      - heldAssets contains this signal's asset (any direction) —
        dedup defense layer 2; producer should pre-filter, but this
        is the LLM-side hard skip. NEVER add to an existing position.

      ## CHEETAH'S THESIS

      Multi-signal confluence sniper. Refuses to trade unless ALL major
      signals align: SM consensus (>=10% of top traders, >=25 traders),
      velocity (15m or 1h contribution rising), accelerating (15m > 1h),
      dual price confirmation (4h >= 2% and 1h aligned), volume spike
      (>=2x 6h avg), quality trader alignment (ELITE/RELIABLE positioned
      same direction), and rank climb. Score 10/15 is the floor —
      higher scores get higher leverage tiers (3x/5x/7x/8x).

      Patience is the edge. Long stretches of silence are EXPECTED and
      correct. When a signal does fire, every confluence factor has
      lined up — be permissive with confidence.

      ## CONFIDENCE SCORING

      - 9-10: score >= 13 AND quality_align >= 1 AND volume confirmed
      - 7-8: score >= 11 AND smPct >= 12 AND dual price confirmed
      - 7: score 10 (floor) AND smPct >= 10 AND velocity > 0
      - <7: structurally broken (hard skip applies)

      Minimum confidence to execute is 7. Cheetah's producer is strict
      enough that any signal reaching you should clear 7. Be permissive
      unless something is structurally broken.

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values — e.g. 'score 12 LONG ETH, SM 15.2%/57t, contrib15m 3.4 accel, 4h +3.1%/1h +1.2%, vol 2.8x, quality_align 2_traders'",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "score N CHEETAH ASSET DIR — top reason"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 30
  # v6.0: maker-preferred exits via FEE_OPTIMIZED_LIMIT.
  # HL taker is 0.045%, maker is 0.015% — saves ~0.020-0.030% per
  # maker-filled close. Cheetah's pre-pivot HYPE-era burned ~$206 in
  # fees on 44 trades; maker exits would have saved $90-140 of that.
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  # DSL preset — Cheetah is high-conviction sniper with multi-hour holds.
  # Time cuts kept (multi-asset rotation has opportunity cost — unlike
  # single-asset patience agents Polar/Wolverine where time cuts are
  # disabled). Phase 2 ladder uses fleet-standard T0/T1 patch (commit
  # 6cad383 pattern: T0 trigger 5%, lock 35%; T1 trigger 10%, lock 50%).
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 720          # 12h fail-safe
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60           # rotation cost: cut dead weight
    phase1:
      enabled: true
      max_loss_pct: 15.0
      # 2026-05-14 HYPE +12.8% post-mortem: retrace_threshold 6 was firing
      # on normal 2-3% pullbacks within strong trends, exiting at break-even
      # before T0 ratchet engaged. Raised to 10 to allow more breathing room
      # on volatile assets while preserving the catastrophic-loss protection
      # of max_loss_pct.
      retrace_threshold: 10
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        # 2026-05-21 HYPE 40→60 (+47% price / ~+140% margin ROE at 3x)
        # post-mortem: the v6.1 "capture the typical small winner" ladder
        # (T0 +3% margin / lock 40) locked a profit floor after a ~1% price
        # move, so the first pullback chopped Cheetah out. Across the 5-day
        # HYPE run Cheetah churned 177 fills for a best single HYPE trade of
        # +$9 and net -$23 — the tight ladder optimized the median trade and
        # capped the right-tail move that pays for everything. Migrated to
        # the Bison "let winners run" ladder (validated: Bison +93% SOL ROE,
        # Condor +$190 held HYPE leg, Vulture +$99/+$86 held HYPE longs).
        # T0 lock=0 lets a +10% mover retrace fully before any profit lock;
        # the rare +50-100% move makes the book. Median gives back a bit;
        # right tail is uncapped.
        - { trigger_pct: 10, lock_hw_pct: 0 }
        - { trigger_pct: 20, lock_hw_pct: 25 }
        - { trigger_pct: 30, lock_hw_pct: 40 }
        - { trigger_pct: 50, lock_hw_pct: 60 }
        - { trigger_pct: 75, lock_hw_pct: 75 }
        - { trigger_pct: 100, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
