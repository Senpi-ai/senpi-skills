#
# Named DSL presets by strategy class. Copy the chosen preset's `dsl_preset`
# block into your strategy's runtime.yaml `exit:` config, or hand-author your
# own. `default: balanced`.
#
# NOTE: `max_loss_pct` and `retrace_threshold` are ROE % (margin), NOT price %.
# The engine converts to a price floor by dividing by leverage. See
# dsl-configuration.md.

default: balanced

presets:

  let_winners_run:
    use_for: Trend / breakout / momentum / trader-follower (most directional strategies)
    character: >-
      Widest. No profit lock until +10% ROE, lock ramps slowly to a +100%
      tier, time-cuts off. Captures fat-tail trends; gives back more on a
      reversal. Validated on the 2026-05 HYPE run (held winners +40% to +93%).
    dsl_preset:
      phase1:
        enabled: true
        max_loss_pct: 20.0
        retrace_threshold: 8
        consecutive_breaches_required: 1
      phase2:
        enabled: true
        tiers:
          - { trigger_pct: 10,  lock_hw_pct: 0 }
          - { trigger_pct: 20,  lock_hw_pct: 25 }
          - { trigger_pct: 30,  lock_hw_pct: 40 }
          - { trigger_pct: 50,  lock_hw_pct: 60 }
          - { trigger_pct: 75,  lock_hw_pct: 75 }
          - { trigger_pct: 100, lock_hw_pct: 85 }

  balanced:
    use_for: General-purpose / unsure (the default)
    character: >-
      Breathes early (no lock until +10%), locks gradually, runner tier to
      +100%, 15% margin floor. Smart auto-close: weak_peak_cut frees a
      position that is BOTH flat (never reached +3% ROE in 6h) AND fading — it
      never touches a winner or a position still near its high — and a 72h
      hard_timeout is a true outer bound that won't cap a multi-day trend.
    dsl_preset:
      hard_timeout:
        enabled: true
        interval_in_minutes: 4320       # 72h — outer bound only; long enough not to cut a multi-day winner
      weak_peak_cut:
        enabled: true
        interval_in_minutes: 360        # 6h — gives a slow developer real room; only fires if peak ROE never cleared +3% AND price is declining (Phase 1 only; never cuts a position past T0)
        min_value: 3.0
      phase1:
        enabled: true
        max_loss_pct: 15.0
        retrace_threshold: 10
        consecutive_breaches_required: 1
      phase2:
        enabled: true
        tiers:
          - { trigger_pct: 10,  lock_hw_pct: 0 }
          - { trigger_pct: 20,  lock_hw_pct: 30 }
          - { trigger_pct: 35,  lock_hw_pct: 50 }
          - { trigger_pct: 60,  lock_hw_pct: 70 }
          - { trigger_pct: 100, lock_hw_pct: 85 }

  mean_reversion:
    use_for: Faders / contrarian / range unwinds
    character: >-
      Tight. Banks the bounded snapback fast (lock 30% at +5%), time-cuts ON
      (48h hard_timeout + weak_peak_cut) — a fade resolves quickly or the
      thesis failed. Matches the live faders (Owl / Pangolin / Bald-eagle / Egret).
    dsl_preset:
      hard_timeout:
        enabled: true
        interval_in_minutes: 2880
      weak_peak_cut:
        enabled: true
        interval_in_minutes: 120
        min_value: 2.0
      phase1:
        enabled: true
        max_loss_pct: 15.0
        retrace_threshold: 6
        consecutive_breaches_required: 1
      phase2:
        enabled: true
        tiers:
          - { trigger_pct: 5,  lock_hw_pct: 30 }
          - { trigger_pct: 10, lock_hw_pct: 50 }
          - { trigger_pct: 15, lock_hw_pct: 65 }
          - { trigger_pct: 25, lock_hw_pct: 80 }
          - { trigger_pct: 40, lock_hw_pct: 90 }

  scalp:
    use_for: High-frequency, fee-sensitive, fast in/out
    character: >-
      Tightest. Fast profit locks, tight max-loss, short hard_timeout +
      dead_weight_cut to recycle stagnant capital.
    dsl_preset:
      hard_timeout:
        enabled: true
        interval_in_minutes: 90
      dead_weight_cut:
        enabled: true
        interval_in_minutes: 45
      phase1:
        enabled: true
        max_loss_pct: 8.0
        retrace_threshold: 5
        consecutive_breaches_required: 1
      phase2:
        enabled: true
        tiers:
          - { trigger_pct: 5,  lock_hw_pct: 50 }
          - { trigger_pct: 10, lock_hw_pct: 70 }
          - { trigger_pct: 15, lock_hw_pct: 85 }
