name: orca-tracker
version: 1.0.0
description: >
  ORCA v4.0.0 — Gen-1 Vanilla Striker, helpers-native rewrite.
  Plumbing-only migration from v3.0. NO thesis change. FIRST_JUMP /
  IMMEDIATE_MOVER + base Striker scoring + volume confirmation
  preserved verbatim. Producer (orca-producer.py) emits signals via
  push_signal() to runtime /signals; runtime opens via LLM-gated
  orca_entry action with FEE_OPTIMIZED_LIMIT. risk.guard_rails
  enforces daily caps + per-asset cooldown + drawdown halt.

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 3
  margin_pct: 18        # % of account budget per slot (scales with any budget)
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 15
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 30
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 120

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: orca_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        mode: { type: string, required: false }
        currentRank: { type: number, required: false }
        rankJump: { type: number, required: false }
        isFirstJump: { type: boolean, required: false }
        isContribExplosion: { type: boolean, required: false }
        contribVelocity: { type: number, required: false }
        volRatio: { type: number, required: false }
        contribution: { type: number, required: false }
        traders: { type: number, required: false }
        priceChg4h: { type: number, required: false }
        reasons: { type: string, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: orca_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${ORCA_DECISION_MODEL}"
    scanners: [orca_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: orca_signals
    decision_prompt: |
      You are Orca's pass-through gate. The producer has already applied
      every filter (FIRST_JUMP / IMMEDIATE_MOVER detection, 4h trend
      alignment, 15m velocity freshness, rank jump >= 15, score >= 9
      with 4+ reasons, volume >= 1.5x). Your job is to honor the signal
      unless something is structurally broken.

      SIGNAL:
      {{signal_orca_signals}}

      ## STRICT OUTPUT RULES

      1. `asset` MUST be copied EXACTLY from signal.asset.
      2. `direction` MUST match signal.direction exactly.
      3. `leverage` MUST be copied from signal.data.leverage exactly (typically 7).
      4. `marginUsd` MUST be copied from signal.data.marginUsd exactly.

      ## HARD SKIPS (output execute: false)

      - score < 9 (defensive — producer filters)
      - leverage <= 0 OR marginUsd <= 0 (malformed)
      - mode != "STRIKER" (only Striker mode is valid)

      Minimum confidence to execute is 7. Honor unless structurally broken.

      ## OUTPUT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": 7,
        "reasoning": "one-liner citing score + rankJump + 4h_alignment",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "orca striker entry"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 45
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 25
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 15
    phase1:
      enabled: true
      max_loss_pct: 20.0
      # 2026-05-21 HYPE post-mortem: retrace_threshold 3 fired on any 3%
      # retrace from peak in Phase 1, exiting before T0 even armed. Raised
      # to 8 to give trends room while max_loss_pct holds catastrophic risk.
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        # Migrated to Bison "let winners run" ladder (was T0 +5% / lock 30,
        # 4 tiers ending at +20%). Orca traded 18 coins / 191 fills during
        # the HYPE run and never held a winner; the tight 4-tier ladder
        # capped every move. T0 lock=0 + a tier out to +100% margin ROE
        # lets the rare trend trade run.
        - { trigger_pct: 10,  lock_hw_pct: 0 }
        - { trigger_pct: 20,  lock_hw_pct: 25 }
        - { trigger_pct: 30,  lock_hw_pct: 40 }
        - { trigger_pct: 50,  lock_hw_pct: 60 }
        - { trigger_pct: 75,  lock_hw_pct: 75 }
        - { trigger_pct: 100, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
