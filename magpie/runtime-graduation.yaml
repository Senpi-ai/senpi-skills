name: magpie-graduation-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Magpie v1.0" — lives in
# description + SKILL.md + _magpie_producer_version.
version: 1.0.0
description: >
  MAGPIE v1.0 (GRADUATION book) — IPOP→equity conversion momentum.

  One of two books. This book classifies every xyz instrument IPOP vs STANDARD
  each tick, detects the IPOP→STANDARD CONVERSION flip (funding jumps ~100x, the
  leverage cap lifts, the trade.xyz price throttle comes off — opening free price
  discovery), stamps it into a conversion-eligibility window, and rides the
  explosive post-conversion momentum in its direction — the SpaceX $1.4B-day-1
  pattern. BOTH directions. Pairs with the PRE-LISTING book
  (runtime-pre_listing.yaml) on a separate wallet. The edge is EVENT momentum
  around new listings; price discovery can trend hard → WIDE let-winners-run DSL.

  Scoring (producer-side): conversion-window eligibility, post-conversion
  momentum direction + magnitude, SM confirmation bonus, rising-volume bonus.

  Execution envelope:
    - slots 3, margin_pct 15
    - strict 5x leverage clamp (post-conversion the venue cap lifts), then venue max
    - WIDE let-winners-run DSL (price discovery trends hard), 5d hard_timeout,
      taker-true entry

  Producer scores its window and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${MAGPIE_GRADUATION_WALLET}"
  # ── FUNDING SPLIT DEFAULT: PRE-LISTING 50% / GRADUATION 50% of the combined pool ──
  # The graduation book holds dry powder for the conversion pop. FUNDING guideline
  # for the operator, NOT a runtime-enforced field. Per-position sizing is
  # governed by margin_pct + slots.
  slots: 3
  margin_pct: 15
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # limit off the perpDay base, which reads ~$0 for these wallets -> a "$0.00" limit that
    # ANY real loss trips, permanently halting the book (Wolf/Hydra/Mongoose 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 4        # conversions are rare events
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 90
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 360

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: magpie_graduation_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        conversionEvent: { type: boolean, required: false }
        momentumPct: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: magpie_graduation_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${MAGPIE_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [magpie_graduation_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: magpie_graduation_signals
    decision_prompt: |
      You are Magpie's GRADUATION-book pass-through gate. The producer detected
      an IPOP→equity CONVERSION (within the eligibility window) and scored the
      post-conversion price-discovery momentum (direction + magnitude, SM +
      volume bonuses). It applied the 5x leverage clamp and held-asset dedup.
      This book trades BOTH directions. Honor the signal unless it is malformed.

      SIGNAL:
      {{signal_magpie_graduation_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix).
      2. direction MUST be copied from signal.direction (LONG or SHORT).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction not in [LONG, SHORT]
      - signal.data.conversionEvent != true
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 (strong momentum + SM) AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:SPCX LONG 5x, just converted, +9.1% momentum, SM confirms — graduation discovery')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "MAGPIE_GRADUATION_MOMENTUM ${direction} — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — wide let-the-discovery-run) ─────────────────────────
#
# Post-conversion price discovery can trend hard for days (the throttle is off),
# so ride it: wide phase1, ALL time cuts OFF, 5d hard_timeout staleness backstop.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 7200           # 5d
    weak_peak_cut:
      enabled: false
      interval_in_minutes: 720
      min_value: 3.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 1440
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 9
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 12, lock_hw_pct: 0 }
        - { trigger_pct: 28, lock_hw_pct: 45 }
        - { trigger_pct: 55, lock_hw_pct: 65 }
        - { trigger_pct: 100, lock_hw_pct: 80 }
        - { trigger_pct: 160, lock_hw_pct: 90 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
