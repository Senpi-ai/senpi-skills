name: magpie-pre-listing-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Magpie v1.0" — lives in
# description + SKILL.md + _magpie_producer_version.
version: 1.0.0
description: >
  MAGPIE v1.0 (PRE-LISTING book) — pre-IPO accumulation.

  One of two books. This book auto-discovers IPOPs (pre-IPO perpetuals) on
  Hyperliquid XYZ by their funding signature (|funding| <= ipopFundingMaxAbs,
  max_leverage <= cap, min daily volume — the trade.xyz pre-listing structure)
  and rides the pre-listing trend into the IPO: the 4h structure sets direction,
  1h + Smart-Money confirm. BOTH directions. Pairs with the GRADUATION book
  (runtime-graduation.yaml) on a separate wallet, which trades the conversion
  event. The edge is EVENT alpha on the pre-IPO ramp. IPOPs are price-throttled
  by Discovery Bounds, so the DSL is moderate (not catastrophic).

  Scoring (producer-side): IPOP funding-signature discovery, 4h trend backbone,
  1h confirm, SM alignment (sparse pre-listing → trend-only fallback).

  Execution envelope:
    - slots 3 (the IPOP basket — today just SPCX; auto-expands), margin_pct 12
    - LOW leverage clamp (3x — IPOP discovery-bounds regime), then venue max
    - moderate-wide DSL for multi-day directional discovery, 7d hard_timeout

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${MAGPIE_PRE_LISTING_WALLET}"
  # ── FUNDING SPLIT DEFAULT: PRE-LISTING 50% / GRADUATION 50% of the combined pool ──
  # The pre-listing book accumulates into the IPO; the graduation book holds dry
  # powder for the conversion pop. FUNDING guideline for the operator, NOT a
  # runtime-enforced field. Per-position sizing is governed by margin_pct + slots.
  slots: 3
  margin_pct: 12
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # limit off the perpDay base, which reads ~$0 for these wallets -> a "$0.00" limit that
    # ANY real loss trips, permanently halting the book (Wolf/Hydra/Mongoose 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 4        # few IPOPs exist; this turns over slowly
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 90
    drawdown_halt_pct: 18
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 360

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: magpie_pre_listing_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        ipopFlag: { type: boolean, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: magpie_pre_listing_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${MAGPIE_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [magpie_pre_listing_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: magpie_pre_listing_signals
    decision_prompt: |
      You are Magpie's PRE-LISTING-book pass-through gate. The producer
      discovered an IPOP (pre-IPO perpetual) by its funding signature and scored
      the pre-listing trend (4h structure + 1h + Smart-Money). It applied the 3x
      leverage clamp (IPOP discovery-bounds regime) and held-asset dedup. This
      book trades BOTH directions. Honor the signal unless it is malformed.

      SIGNAL:
      {{signal_magpie_pre_listing_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix).
      2. direction MUST be copied from signal.direction (LONG or SHORT).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 3 (clamp breach) OR marginUsd <= 0
      - direction not in [LONG, SHORT]
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:SPCX LONG 3x, IPOP, 4h BULLISH, SM aligned — pre-listing ramp')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "MAGPIE_PRE_IPO ${direction} — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — moderate, multi-day pre-listing discovery) ──────────
#
# Discovery Bounds throttle IPOP velocity, so moves are multi-day and not
# catastrophic: moderate phase1, wide profit ladder, all time-cuts OFF, 7d
# hard_timeout.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080          # 7d
    weak_peak_cut:
      enabled: false
      interval_in_minutes: 720
      min_value: 3.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 1440
    phase1:
      enabled: true
      max_loss_pct: 10.0
      retrace_threshold: 7
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10, lock_hw_pct: 0 }
        - { trigger_pct: 22, lock_hw_pct: 45 }
        - { trigger_pct: 45, lock_hw_pct: 65 }
        - { trigger_pct: 80, lock_hw_pct: 80 }
        - { trigger_pct: 130, lock_hw_pct: 90 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
