name: lemon-tracker
version: 1.3.0
description: >
  Lemon v1.3 — Degen Fader (macro gate + XYZ unban).
  v1.2 (10x cap / 30% margin / MIN_SCORE 9) eliminated catastrophic
  blow-ups but didn't fix signal quality: -$246 lifetime / 37% win rate /
  -$2 per trade avg / asymmetric win-loss size ($2 win vs $6 loss).
  v1.3 targets the underlying signal:
    1. MACRO_TREND_GATE (crypto only): block fades when |BTC 4h| > 3%.
       Fade thesis structurally fails in trending regimes — pattern
       documented across Wolverine HYPE (-$160), Cobra (-60%), and
       Condor v3.0's MACRO_TREND_GATE precedent. XYZ bypasses the
       gate (oil/gold/spx trade on their own macro).
    2. XYZ unban: prior XYZ_BANNED=True was a lazy scaffold default;
       fade thesis applies to news-driven XYZ moves (Apr 17 Iranian
       ship seizure on oil = textbook crowd-pile fade setup). Erik's
       XYZ DSL prefix fix (2026-05-05) wires exit protection
       correctly. Adds xyz:BRENTOIL/CL/GOLD/SPX. ISOLATED margin set
       automatically on XYZ orders per HIP-3.
  DSL config unchanged from v1.2.

  Lemon v1.2 — Degen Fader (leverage + margin normalization).
  v1.1 shipped with MAX_LEVERAGE=20x tiers and MARGIN_PCT=0.50 — catastrophic
  when a fade fails. Result: 215 fills / -20% ROI. v1.2 caps leverage at
  fleet-standard 10x, reduces margin to 0.30, raises MIN_SCORE 8→9, and
  loosens dead_weight_cut 20→45 min to let fades develop. Scanner logic
  unchanged — same CHOPPY/DEGEN contrarian signal.

strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# Fade trades need time — mean reversion can take 8+ hours.
# Hard timeout raised to 480 min to let winners run.
# Dead weight tightened to cut losers faster.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 60
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 45       # v1.2: 20 → 45 (let fades develop)
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 20 }
        - { trigger_pct: 10, lock_hw_pct: 40 }
        - { trigger_pct: 15, lock_hw_pct: 60 }
        - { trigger_pct: 20, lock_hw_pct: 75 }
        - { trigger_pct: 30, lock_hw_pct: 85 }
        - { trigger_pct: 50, lock_hw_pct: 92 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
