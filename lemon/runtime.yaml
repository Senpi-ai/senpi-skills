name: lemon-tracker
version: 1.1.0
description: >
  Lemon v1.1 — Degen Fader. Counter-trades CHOPPY/DEGEN traders when their
  consensus is fading. Fleet-hardened, scanner handles execution internally.

strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# Fade trades need time — mean reversion can take hours.
# Wide DSL, long timeout, generous Phase 1.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 240
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 30
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 20 }
        - { trigger_pct: 10, lock_hw_pct: 40 }
        - { trigger_pct: 15, lock_hw_pct: 60 }
        - { trigger_pct: 20, lock_hw_pct: 75 }
        - { trigger_pct: 30, lock_hw_pct: 85 }
        - { trigger_pct: 50, lock_hw_pct: 92 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
