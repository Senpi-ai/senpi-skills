name: wolverine-tracker
version: 3.0.3
description: >
  Wolverine v3.0.3 — 4h magnitude gate (entry discipline fix).
  Wolverine self-diagnosed 2026-04-23: all 6 Week 5 HYPE LONG trades
  died in consolidation because trend_strength_4h is a structural
  metric (lower-highs count) that passes even when 4H price magnitude
  is nearly flat. HYPE at -0.26% net / 24h was still scoring 9+ as
  "structurally bearish" and firing trades that never breached +3%
  ROE. Wolverine's own conclusion: "the time cuts aren't the core
  problem — the entry gate is."
  v3.0.3 adds GATE 6 after base-tech floor: require
  abs(mom_4h) >= 1.5%. Rejects entries into dead-flat 4H chop
  regardless of structural signal. Scanner-only change; DSL
  unchanged. Previous v3.0.2 hard_timeout disable preserved.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 250
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ─── EXIT (DSL) — HYPE-tuned, tighter than Kodiak SOL ──────────
# HYPE reverses faster than SOL. Triggers and locks compressed to catch
# profit earlier. Hard_timeout 6h — HYPE moves are typically hours, not
# days (unlike BTC which needs 24h).
#
# Phase 2 matches scanner's _DSL_TIERS_DEFAULT via config.json dslTiers
# (scanner attaches via ratchet_stop_add; runtime.yaml is operator
# reference and for backup DSL engine behavior).
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: false                 # v3.0.2: DISABLED. v1 DSL fires this in Phase 2 incorrectly. Phase 1 + Phase 2 own all exits.
      interval_in_minutes: 360
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90
      min_value: 3.0
    dead_weight_cut:
      enabled: false                 # v3.0.1: DISABLED. Single-asset agent has no rotation opportunity cost.
      interval_in_minutes: 45
    phase1:
      enabled: true
      max_loss_pct: 20.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10, lock_hw_pct: 15 }
        - { trigger_pct: 20, lock_hw_pct: 35 }
        - { trigger_pct: 35, lock_hw_pct: 55 }
        - { trigger_pct: 55, lock_hw_pct: 70 }
        - { trigger_pct: 80, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
