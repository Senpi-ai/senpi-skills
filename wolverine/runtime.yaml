name: wolverine-tracker
version: 2.3.0
description: >
  WOLVERINE v2.3 — HYPE Alpha Hunter (chop-hardened). SM conviction +
  15m/1h momentum on HYPE. Conviction-scaled leverage 7x/10x. DSL time
  cuts tuned for HYPE volatility — winners need 2-4 hours to play out.
  v2.3 adds chop-detection lockout, direction-flip hard gate, and
  persistent entry log that survives session clears.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# HYPE-specific DSL — wide for volatility, patient for trends.
# Wolverine's two biggest winners held for 251 min (+$146) and 268 min (+$88).
# Winners need 2-4 hours. Losers get cut fast by weak_peak_cut and dead_weight_cut.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 240
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 25
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 35
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
