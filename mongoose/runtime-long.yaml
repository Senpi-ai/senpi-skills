name: mongoose-long-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Mongoose v1.0" — lives in
# description + SKILL.md + _mongoose_producer_version.
version: 1.0.0
description: >
  MONGOOSE v1.0 (ON-CHAIN book) — On-Chain Finance vs Legacy thesis fund.

  The LONG leg. This book LONGS the on-chain financial rails — HYPE (the venue),
  CRCL (Circle/stablecoins), COIN (Coinbase), HOOD (Robinhood), MSTR + PURRDAT
  (crypto treasuries) — the disruptors eating legacy finance, but only when
  ABSOLUTE trend confirms (4h structure bullish + positive momentum), with a
  blow-off guard. Cross-sectional relative strength tilts size/ranking but never
  benches a genuinely-trending name. Per-name size scales with account value and
  a conviction weight (HYPE 1.3x, CRCL 1.2x; MSTR/PURRDAT sized down). Pairs with
  the SHORT legacy book (runtime-short.yaml) on a separate wallet; the P&L is the
  disruptor-vs-incumbent spread.

  Scoring (producer-side): curated on-chain-finance universe, 4h + 1h
  absolute-trend confirmation (hard gate), own-momentum sign, relative-strength
  tiebreaker, RSI blow-off guard. LONG only.

  Execution envelope:
    - slots 5 (the on-chain-finance basket), margin_pct 18 (× conviction weight)
    - strict 5x leverage clamp, then each asset's HL venue max
    - moderate DSL: cut reversers, lock profit on extension, stall-cuts ON,
      7d hard_timeout (let the disruptors run)

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${MONGOOSE_LONG_WALLET}"
  # ── FUNDING DEFAULT: net-long tilt (the thesis is bullish the disruptors) ──
  # The split is an OPERATOR decision (see config _hedge_note), set by the wallet
  # funding + per-leg knobs — NOT a runtime-enforced field. This on-chain book
  # defaults larger (slots 5, margin_pct 18) than the legacy book (slots 2,
  # margin_pct 15). Fund 50/50 for a tighter (but still cross-sector) hedge.
  slots: 5
  margin_pct: 18
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # limit off the perpDay base, which reads ~$0 for these wallets -> a "$0.00" limit that
    # ANY real loss trips, permanently halting the book (Wolf/Hydra/Mongoose 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 6        # basket rotation as leadership shifts
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 60
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: mongoose_long_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        excess: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: mongoose_long_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${MONGOOSE_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [mongoose_long_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: mongoose_long_signals
    decision_prompt: |
      You are Mongoose's ON-CHAIN book pass-through gate. The producer longs the
      on-chain financial rails — crypto exchanges, stablecoin issuers, BTC
      treasuries, HYPE — trend-confirmed (a SHORT legacy book runs the incumbents
      on a separate wallet). The producer already applied the curated universe,
      the 4h/1h absolute-trend gate, the relative-strength tiebreaker, the
      conviction-weighted size, the 5x leverage clamp, and held-asset dedup.
      Honor the signal unless it is malformed.

      SIGNAL:
      {{signal_mongoose_long_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix
         on equities; crypto names like HYPE/SOL have NO prefix).
      2. direction MUST be "LONG" (this is the long book).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction != "LONG"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:CRCL LONG 5x, 4h BULLISH, abs +5.2%, conviction-weighted — on-chain rail')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "LONG",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "MONGOOSE_ONCHAIN_LONG — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — moderate; let the disruptors run, cut reversers) ──────
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080          # 7d — the AI trend persists; let winners run
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 480            # 8h — cut a winner that peaked then stalled
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 960            # 16h — recycle a position going nowhere
    phase1:
      enabled: true
      max_loss_pct: 16.0                  # slightly wider than equity-only (HYPE vol in basket)
      retrace_threshold: 10
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10, lock_hw_pct: 0 }
        - { trigger_pct: 20, lock_hw_pct: 40 }
        - { trigger_pct: 35, lock_hw_pct: 60 }
        - { trigger_pct: 60, lock_hw_pct: 78 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
