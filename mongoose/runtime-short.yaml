name: mongoose-short-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Mongoose v1.0" — lives in
# description + SKILL.md + _mongoose_producer_version.
version: 1.0.0
description: >
  MONGOOSE v1.0 (LEGACY book) — On-Chain Finance vs Legacy thesis fund.

  The SHORT leg (the hedge). This book SHORTS legacy finance + broad
  financial-beta — BX (Blackstone) + SP500 — the incumbents being disrupted by
  on-chain finance, but only when ABSOLUTE trend confirms (4h structure bearish +
  negative momentum), with a CAPITULATION guard so it never shorts an exhausted
  bottom. Pairs with the LONG on-chain book (runtime-long.yaml) on a separate
  wallet; the P&L is the disruptor-vs-incumbent spread. NOTE: this is a
  CROSS-SECTOR hedge with a thin short universe (few pure legacy-finance names
  list on the venue), so it leans on the broad index — looser than a same-sector
  pair, nets down market beta.

  Scoring (producer-side): curated legacy universe, 4h + 1h absolute-trend
  confirmation (hard gate), own-momentum sign, relative-weakness tiebreaker,
  RSI capitulation guard. SHORT only.

  Execution envelope:
    - slots 2, margin_pct 15 (× conviction weight) — the hedge leg
    - strict 4x leverage clamp (short squeezes are violent), then venue max
    - tighter DSL than the long book: faster stall-cuts, quicker profit lock

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${MONGOOSE_SHORT_WALLET}"
  # ── FUNDING DEFAULT: net-long tilt (the thesis is bullish the disruptors) ──
  # The split is an OPERATOR decision (see config _hedge_note), set by the wallet
  # funding + per-leg knobs — NOT a runtime-enforced field. This legacy book
  # defaults smaller (slots 2, margin_pct 15, 4x cap) than the on-chain book.
  slots: 2
  margin_pct: 15
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    daily_loss_limit_pct: 10        # tighter than long book — short squeezes
    max_entries_per_day: 5
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 90
    drawdown_halt_pct: 18
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 300

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: mongoose_short_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        excess: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: mongoose_short_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${MONGOOSE_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [mongoose_short_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: mongoose_short_signals
    decision_prompt: |
      You are Mongoose's LEGACY book pass-through gate. The producer shorts
      legacy finance + broad financial-beta — Blackstone (BX) + SP500 — the
      incumbents being disrupted by on-chain finance, trend-confirmed (a LONG
      on-chain book runs the disruptors on a separate wallet). The producer
      already applied the curated universe, the 4h/1h absolute-downtrend gate, the
      capitulation guard, the conviction-weighted size, the 4x leverage clamp, and
      held-asset dedup. Honor the signal unless malformed.

      SIGNAL:
      {{signal_mongoose_short_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix
         on the index; crypto names like ETH/XRP have NO prefix).
      2. direction MUST be "SHORT" (this is the short book).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 4 (clamp breach) OR marginUsd <= 0
      - direction != "SHORT"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:SP500 SHORT 4x, 4h BEARISH, abs -2.1% — broad-market laggard')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "SHORT",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "MONGOOSE_LEGACY_SHORT — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — tighter; short theses decay faster, squeezes are violent) ──
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 7200           # 5d — shorter than the long book
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 360            # 6h — cut a short that bottomed then stalled
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 720            # 12h — recycle a short going nowhere
    phase1:
      enabled: true
      max_loss_pct: 12.0                  # tighter than long book — squeeze protection
      retrace_threshold: 7
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 0 }
        - { trigger_pct: 18, lock_hw_pct: 45 }
        - { trigger_pct: 35, lock_hw_pct: 65 }
        - { trigger_pct: 60, lock_hw_pct: 80 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
