name: scorpion-tracker
version: 2.1.0
description: >
  SCORPION v2.1 — Altcoin Swarm Hunter. Fleet audit: full bash→Python rewrite
  with 10 gates enforced, move-exhaustion, same-dir cooldown, reduceOnly filter,
  leverage-aware Phase 2 tiers for volatile alts.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 350
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# DSL: Extra-wide for altcoin volatility
# Altcoins move 3-10% in 4 hours — need room to breathe
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 240
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 45
    phase1:
      enabled: true
      max_loss_pct: 20.0
      retrace_threshold: 10
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # Phase 2 tiers — altcoin-tuned (fleet audit April 2026)
        # Alts are more volatile than majors — wider triggers
        # But Scorpion's +$103 gross on 13 positions shows the thesis works
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 45 }
        - { trigger_pct: 25, lock_hw_pct: 60 }
        - { trigger_pct: 35, lock_hw_pct: 75 }
        - { trigger_pct: 50, lock_hw_pct: 85 }
        - { trigger_pct: 75, lock_hw_pct: 90 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
