name: scorpion-tracker
version: 3.2.0
description: >
  SCORPION v3.2 — Multi-Market Active Trader (over-trading fix).
  v3.1 targeted pr0br000's 369-fills-in-3-weeks scalp-re-entry pattern.
  Result: 413 fills, -17.9% ROI. pr0br000 subsequently got wiped out
  week 4 — the pattern doesn't work at sample. v3.2 pulls discipline:
    MIN_SCORE 6 → 9 (kill coin-flip entries)
    MAX_POSITIONS 3 → 2 (reduce concurrent fee exposure)
    MAX_DAILY_ENTRIES 6 → 3
    SCALP_COOLDOWN 15 → 60 min (no more 15-min re-entries)
    MAX_REENTRIES_PER_ASSET 10 → 3 (cap per-asset fee-churn)
    MARGIN_PCT 30% → 25%
  Scanner logic unchanged — same multi-market SM + 4H trend gating,
  just stricter thresholds and less re-entry aggression.

# -- STRATEGY --
strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 250
  enabled: true

# -- SCANNERS --
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

# -- ACTIONS --
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# -- EXIT (DSL) --
# Short-hold profile for active multi-market trading.
# Dead weight cut at 30 min — kill losers fast, free up slots.
# Weak peak cut at 60 min — don't let small winners decay.
# Hard timeout at 720 min (12h) — forced rotation, not a buy-and-hold.
# Phase 1 max loss 15% — standard fleet tightness.
# Phase 2 starts at +5% with standard tier progression.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 720
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 60
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 30
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 20 }
        - { trigger_pct: 10, lock_hw_pct: 40 }
        - { trigger_pct: 15, lock_hw_pct: 60 }
        - { trigger_pct: 20, lock_hw_pct: 75 }
        - { trigger_pct: 30, lock_hw_pct: 85 }
        - { trigger_pct: 50, lock_hw_pct: 90 }

# -- NOTIFICATIONS --
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
