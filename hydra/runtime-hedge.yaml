name: hydra-hedge-tracker
# Top-level `version` is the SCHEMA version (major=1). Skill version "Hydra v1.0"
# lives in description + SKILL.md + _hydra_producer_version.
version: 1.0.0
description: >
  HYDRA v1.0 (HEDGE head) — the hedge of a single-coin portfolio fund.

  Single-coin, SHORT-only on HYDRA_COIN: fires ONLY when a confirmed 4h downtrend
  AND a fast-drawdown signal agree, with a capitulation guard (never short an
  exhausted bottom). Idle (tiny bleed) in uptrends; cushions the CORE + DIP long
  heads while a break is still unfolding — leading their slower trend-flip. One
  position. Pairs with the CORE and DIP heads on separate wallets (same coin).
  Episodic by design: most ticks it does nothing — that's the cost of insurance.

  Scoring (producer-side): 4h downtrend (hard gate) + fast drawdown over
  stressLookback OR 1h breaking down (arm), capitulation guard (rsiOversold floor).

  Execution envelope: 1 slot, margin_pct 15, strict 3x clamp (lowest of the
  three — short squeezes are violent). Single-asset DSL — tight, quick profit-lock;
  time-cuts OFF, weak_peak self-limiting ON.

strategy:
  wallet: "${HYDRA_WALLET}"
  # ── FUND SIZING: hedge ~25% of the coin's combined budget (operator funding split).
  slots: 1
  margin_pct: 15
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    daily_loss_limit_pct: 10        # tighter — short squeezes are violent
    max_entries_per_day: 3
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 180
    drawdown_halt_pct: 18
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 300

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s
  - name: hydra_hedge_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        rsi: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: hydra_hedge_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${HYDRA_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [hydra_hedge_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: hydra_hedge_signals
    decision_prompt: |
      You are Hydra's HEDGE head pass-through gate — the short-only stress hedge.
      The producer only fires this head when the 4h is in a confirmed downtrend
      AND a fast drawdown (or a 1h breakdown) has armed it, and never below the
      capitulation floor. Honor the signal unless malformed.

      SIGNAL:
      {{signal_hydra_hedge_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE
      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
      2. direction MUST be "SHORT" (this is the short hedge).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)
      - score < 4 (producer floor; defensive)
      - leverage <= 0 OR leverage > 3 (clamp breach) OR marginUsd <= 0
      - direction != "SHORT"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING
      - 9-10: score >= 6 AND no malformed fields
      - 7-8:  score 4.5-5.9
      - 7:    score 4-4.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT
      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 6 ETH SHORT 3x, 4h BEARISH, drawdown 9.4% — stress hedge armed')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "SHORT",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "HYDRA_HEDGE — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — tight, quick profit-lock; short, time-cuts off) ────
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: false
      interval_in_minutes: 7200
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 360
      min_value: 2.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 720
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 7
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 0 }
        - { trigger_pct: 18, lock_hw_pct: 45 }
        - { trigger_pct: 35, lock_hw_pct: 65 }
        - { trigger_pct: 60, lock_hw_pct: 80 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
