name: hydra-hedge-tracker
# Top-level `version` is the SCHEMA version (major=1). Skill version "Hydra v2.0"
# lives in description + SKILL.md + _hydra_producer_version.
version: 1.0.0
description: >
  HYDRA v2.0 (HEDGE head) — the CROSS-ASSET hedge of a single-coin conviction fund.

  v2.0 change: the hedge is no longer a same-asset short on the thesis coin. It now
  shorts a diversified BLEND of OTHER assets (hedgeUniverse minus the thesis coin) —
  but only the ones in a confirmed 4h downtrend (per-asset drawdown / 1h breakdown),
  capitulation-guarded. Vol-parity sized (inverse-ATR) and sized UP by a thesis-
  stress multiplier when the thesis coin itself is breaking down. It cushions the
  market risk that would also hurt the thesis WITHOUT ever betting against the
  thesis. Auto-scales: light when little is breaking, heavy in a broad selloff.
  A basket (multiple shorts). Pairs with the CORE + DIP thesis-long heads on
  separate wallets.

  Scoring (producer-side, per blend asset): 4h downtrend (hard gate) + fast
  drawdown OR 1h breaking down (arm), capitulation guard; vol-parity margin;
  thesis-stress multiplier; total hedge margin capped at hedgeMaxTotalPct.

  Execution envelope: up to 5 slots (the blend basket), vol-parity margin (producer
  sets marginUsd per signal), strict 3x clamp then venue max (short squeezes are
  violent). Taker-fallback entries. Tight-ish DSL — bank the cushion, but let it
  run in a sustained downtrend; time-cuts OFF.

strategy:
  wallet: "${HYDRA_WALLET}"
  # Producer sets per-signal marginUsd via vol-parity; margin_pct is advisory only.
  # FUND SIZING: hedge ~25% of the coin's combined budget (operator funding split).
  slots: 5
  margin_pct: 6
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # base off perp value (=$0 for an idle leg) and cross-charges a sibling leg's PnL, so an
    # idle leg gets a "$0.00" limit and is permanently halted (Mongoose long book 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 8          # the hedge opens a basket across the blend
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 5
    cooldown_minutes: 90
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s
  - name: hydra_hedge_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        rsi: { type: number, required: false }
        hedgeFor: { type: string, required: false }
        stressMult: { type: number, required: false }
        volPct: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: hydra_hedge_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${HYDRA_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [hydra_hedge_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: hydra_hedge_signals
    decision_prompt: |
      You are Hydra's HEDGE head pass-through gate — the CROSS-ASSET cushion. The
      producer shorts a diversified blend of OTHER assets (never the thesis coin)
      that are in a confirmed downtrend, vol-parity sized and scaled by thesis
      stress. The signal's asset is whichever blend name is breaking down. Honor
      the signal unless malformed.

      SIGNAL:
      {{signal_hydra_hedge_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE
      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
         It may be ANY blend asset (BTC, SOL, an xyz index, etc.) — NOT necessarily
         the fund's thesis coin.
      2. direction MUST be "SHORT" (this is the short hedge).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)
      - score < 4 (producer floor; defensive)
      - leverage <= 0 OR leverage > 3 (clamp breach) OR marginUsd <= 0
      - direction != "SHORT"
      - signal.asset == signal.data.hedgeFor (never short the thesis coin — defensive)
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING
      - 9-10: score >= 6 AND no malformed fields
      - 7-8:  score 4.5-5.9
      - 7:    score 4-4.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT
      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 6 SOL SHORT 3x (hedge for ETH), 4h downtrend, drawdown 9.4%, stressMult 1.6 — cross-asset cushion')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "SHORT",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "HYDRA_HEDGE — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — bank the cushion, but let it run in a sustained selloff) ──────
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: false
      interval_in_minutes: 7200
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 360
      min_value: 2.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 720
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 7
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 0 }
        - { trigger_pct: 18, lock_hw_pct: 45 }
        - { trigger_pct: 35, lock_hw_pct: 65 }
        - { trigger_pct: 60, lock_hw_pct: 80 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
