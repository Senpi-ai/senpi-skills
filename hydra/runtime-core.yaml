name: hydra-core-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime plugin
# expects (major=1). Skill version is "Hydra v1.0" — lives in description +
# SKILL.md + _hydra_producer_version.
version: 1.0.0
description: >
  HYDRA v2.0 (CORE head) — the long-term thesis of a single-coin conviction fund.

  Single-coin trend-momentum on HYDRA_COIN (set per deployment): LONG when 4h
  structure is bullish, SHORT when bearish, sit out a neutral tape. Conviction-
  tiered leverage. One position. Pairs with the DIP (tactical add) and HEDGE
  (cross-asset cushion) heads on separate wallets.

  v2.0: the core is a LONG-TERM HOLD ridden on a CATASTROPHIC-ONLY DSL — a wide
  disaster stop, weak_peak OFF (hold through consolidation), time-cuts OFF, and a
  Phase 2 that does nothing until a moonshot. You ride normal volatility instead of
  being shaken out; the cross-asset HEDGE sleeve cushions the interim drawdown.

  Scoring (producer-side): 4h trend (hard gate), 1h confirmation, RSI blow-off /
  capitulation guard, funding tailwind, conviction → leverage tier.

  Execution envelope: 1 slot, margin_pct 20, strict 5x clamp (then venue max).
  Catastrophic-only DSL (see exit) — let the thesis run.

strategy:
  wallet: "${HYDRA_WALLET}"
  # ── FUND SIZING: core ~50% of the coin's combined budget (operator funding
  # split across the three head wallets). dip ~25%, hedge ~25%. Not enforced here.
  slots: 1
  margin_pct: 20
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    daily_loss_limit_pct: 12
    max_entries_per_day: 3
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 120
    drawdown_halt_pct: 22
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s
  - name: hydra_core_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        rsi: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: hydra_core_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${HYDRA_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [hydra_core_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: hydra_core_signals
    decision_prompt: |
      You are Hydra's CORE head pass-through gate — the thesis bet on one coin.
      The producer scored the coin's 4h trend (long the uptrend / short the
      downtrend), 1h confirmation, RSI guard, funding, and set a conviction-tiered
      leverage. Honor the signal unless malformed.

      SIGNAL:
      {{signal_hydra_core_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE
      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
      2. direction MUST equal signal.data.direction (LONG or SHORT).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)
      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING
      - 9-10: score >= 7 (apex) AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT
      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 8 ETH LONG 5x, 4h BULLISH, 1h confirms — apex thesis')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.data.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "HYDRA_CORE — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — v2.0 CATASTROPHIC-ONLY: this is a LONG-TERM thesis HOLD) ──────
# The core is a multi-month conviction position — you do NOT want to be shaken out
# on normal volatility, and the cross-asset hedge sleeve (separate wallet) cushions
# the interim drawdown. So: a WIDE disaster stop only, weak_peak OFF (hold through
# consolidation), time-cuts OFF, and Phase 2 that does NOTHING until a moonshot
# (+80%), then only locks a fraction so a huge run isn't fully round-tripped.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: false
      interval_in_minutes: 43200
    weak_peak_cut:
      enabled: false              # HOLD through flat periods — a long-term thesis consolidates
      interval_in_minutes: 1440
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 2880
    phase1:
      enabled: true
      max_loss_pct: 32.0          # catastrophic-only disaster stop (thesis-breaking)
      retrace_threshold: 20       # wide — normal volatility never trail-stops the hold
      consecutive_breaches_required: 2
    phase2:
      enabled: true
      tiers:                      # ride it; only bank a fraction of a genuine moonshot
        - { trigger_pct: 80, lock_hw_pct: 0 }
        - { trigger_pct: 150, lock_hw_pct: 50 }
        - { trigger_pct: 250, lock_hw_pct: 70 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
