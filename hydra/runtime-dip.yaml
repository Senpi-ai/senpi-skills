name: hydra-dip-tracker
# Top-level `version` is the SCHEMA version (major=1). Skill version "Hydra v1.0"
# lives in description + SKILL.md + _hydra_producer_version.
version: 1.0.0
description: >
  HYDRA v1.0 (DIP head) — the complement of a single-coin portfolio fund.

  Single-coin, LONG-only on HYDRA_COIN: buys a PULLBACK within a confirmed 4h
  uptrend (1h dipped / 1h RSI low), then rides the resumed move. Stands down
  whenever the 4h isn't bullish — so it never knife-catches against the HEDGE
  head. One position. Pairs with the CORE and HEDGE heads on separate wallets
  (same coin); it presses the thesis on the pullbacks the breakout-core misses.

  Scoring (producer-side): 4h uptrend (hard gate), a pullback signal (1h not
  bullish OR 1h RSI <= dipRsiMax), uptrend strength.

  Execution envelope: 1 slot, margin_pct 18, strict 4x clamp. Single-asset DSL —
  tighter entry-stop than core (the dip can keep falling), then let the bounce
  run; time-cuts OFF, weak_peak self-limiting ON.

strategy:
  wallet: "${HYDRA_WALLET}"
  # ── FUND SIZING: dip ~25% of the coin's combined budget (operator funding split).
  slots: 1
  margin_pct: 18
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # limit off the perpDay base, which reads ~$0 for these wallets -> a "$0.00" limit that
    # ANY real loss trips, permanently halting the book (Wolf/Hydra/Mongoose 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 3
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 120
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s
  - name: hydra_dip_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        rsi: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: hydra_dip_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${HYDRA_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [hydra_dip_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: hydra_dip_signals
    decision_prompt: |
      You are Hydra's DIP head pass-through gate — the long-only complement. The
      producer only fires this head when the 4h is in a confirmed uptrend AND the
      coin has pulled back (a dip to buy). Honor the signal unless malformed.

      SIGNAL:
      {{signal_hydra_dip_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE
      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
      2. direction MUST be "LONG" (this is a long-only dip-buyer).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)
      - score < 4 (producer floor; defensive)
      - leverage <= 0 OR leverage > 4 (clamp breach) OR marginUsd <= 0
      - direction != "LONG"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING
      - 9-10: score >= 6 AND no malformed fields
      - 7-8:  score 4.5-5.9
      - 7:    score 4-4.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT
      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 5 SOL LONG 3x, 4h uptrend, 1h RSI 41 — buy the dip')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "LONG",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "HYDRA_DIP — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — tighter entry-stop, then ride the bounce; time-cuts off) ────
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: false
      interval_in_minutes: 10080
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 360
      min_value: 2.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 720
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8, lock_hw_pct: 0 }
        - { trigger_pct: 18, lock_hw_pct: 40 }
        - { trigger_pct: 35, lock_hw_pct: 60 }
        - { trigger_pct: 60, lock_hw_pct: 78 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
