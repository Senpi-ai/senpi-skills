name: eel-long-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Eel v1.0" — lives in
# description + SKILL.md + _eel_producer_version.
version: 1.0.0
description: >
  EEL v1.0 (POWER book) — Electrons vs Hydrocarbons energy-pair thesis fund.

  The LONG leg of an energy-sector-neutral pair. This book LONGS the AI-power
  complex on Hyperliquid XYZ — uranium (URNM), gas-fired power (NATGAS), the grid
  metal (COPPER), on-site fuel cells (BE), and rare-earth (USAR) — the electrons
  AI datacenters need — but only when ABSOLUTE trend confirms (4h structure
  bullish + positive momentum), with a blow-off guard. Cross-sectional relative
  strength tilts size/ranking but never benches a genuinely-trending name.
  Per-name size scales with account value and a conviction weight (URNM 1.2x,
  COPPER 1.1x, BE 0.6x). Pairs with the SHORT crude-oil book (runtime-short.yaml)
  on a separate wallet; both legs are energy, so an energy-wide move washes out
  and the P&L is the electrons-vs-hydrocarbons spread. Commodities trade ~24/7.

  Scoring (producer-side): curated power universe, 4h + 1h absolute-trend
  confirmation (hard gate), own-momentum sign, relative-strength tiebreaker,
  RSI blow-off guard. LONG only.

  Execution envelope:
    - slots 4 (the power basket), margin_pct 18 (× conviction weight)
    - strict 5x leverage clamp, then each asset's HL venue max
    - moderate DSL: cut reversers, lock profit on extension, stall-cuts ON,
      7d hard_timeout (energy trends persist; let winners run)

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${EEL_LONG_WALLET}"
  # ── FUNDING DEFAULT: slight long-power tilt (~55/45 long:short) ──
  # The split is an OPERATOR decision (see config _hedge_note), set by the
  # power/oil wallet funding + per-leg knobs — NOT a runtime-enforced field. This
  # power book defaults a touch larger (slots 4, margin_pct 18) than the oil book
  # (slots 2, margin_pct 15) since the thesis is directionally pro-power. Fund
  # 50/50 for a cleaner market-neutral spread.
  slots: 4
  margin_pct: 18
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # base off perp value (=$0 for an idle leg) and cross-charges a sibling leg's PnL, so an
    # idle leg gets a "$0.00" limit and is permanently halted (Mongoose long book 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 6        # basket rotation as power-complex leadership shifts
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 60
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: eel_long_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        excess: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: eel_long_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${EEL_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [eel_long_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 45
    context:
      - type: signal
        scanner: eel_long_signals
    decision_prompt: |
      You are Eel's POWER book pass-through gate. The producer longs the AI-power
      complex — uranium, gas-fired power, grid copper, fuel cells, rare-earth —
      trend-confirmed (a SHORT crude-oil book hedges it on a separate wallet, so
      the fund is paid on power outperforming oil). The producer already applied
      the power universe, the 4h/1h absolute-trend gate, the relative-strength
      tiebreaker, the conviction-weighted size, the 5x leverage clamp, and
      held-asset dedup. Honor the signal unless it is malformed.

      SIGNAL:
      {{signal_eel_long_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve the xyz: prefix).
      2. direction MUST be "LONG" (this is the long power book).
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction != "LONG"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 xyz:URNM LONG 5x, 4h BULLISH, abs +4.8%, conviction-weighted — AI-power leg')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "LONG",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "EEL_POWER_LONG — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — moderate; let energy winners run, cut reversers) ──────
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 45
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080          # 7d — energy/power trends persist; let winners run
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 480            # 8h — cut a name that peaked then stalled
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 960            # 16h — recycle a position going nowhere
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 10
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10, lock_hw_pct: 0 }
        - { trigger_pct: 20, lock_hw_pct: 40 }
        - { trigger_pct: 35, lock_hw_pct: 60 }
        - { trigger_pct: 60, lock_hw_pct: 78 }
        - { trigger_pct: 100, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
