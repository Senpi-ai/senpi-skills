name: raptor-strategy
version: 3.3.0
description: >
  RAPTOR v3.3 — Hot Streak Follower (entry-price discipline tightened).
  v3.2 introduced whale-entry-price gate at 20% threshold. Raptor
  self-diagnosed 2026-04-23: the gate was still too loose. Scanner was
  re-firing on whales already deep in profit, taking all downside risk
  with none of their PnL cushion. v3.3 tightens
  MAX_PRICE_RUN_PCT_FROM_WHALE_ENTRY from 20% to 5% — 4x tighter, still
  leaves room for "whale in early profit" piggyback. Raptor's proposed
  1-2% would likely zero the scanner; 5% is the first tightening with
  room for further per data. Scanner-only change. DSL unchanged.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 250
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# Raptor-tuned DSL: follow-the-streak trades need time to play out because
# they're backed by a quality trader's active run. Wide phase 1, patient
# phase 2 tiers to let winners compound.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 360
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 60
      min_value: 2.5
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 40
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 10
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 40, lock_hw_pct: 80 }
        - { trigger_pct: 60, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
