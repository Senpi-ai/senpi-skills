name: mantis-tracker
# Runtime SCHEMA version must be major=1 per the senpi-trading-runtime
# plugin. Strategy/skill is "Mantis v6.0.0 — Slipstream" — lives in
# description + SKILL.md + _mantis_producer_version. Do not set this
# to 6.x.x.
version: 1.0.0
description: >
  MANTIS v6.0.0 — Slipstream, helpers-native rewrite. Plumbing-only
  migration from v5.0. NO thesis change.

  v5.0 was a full-agency scanner: scored cross-asset flows, called
  create_position directly, tracked daily entries + asset cooldowns
  in Python (state files), and emitted VETO_CLOSE stdout JSON that
  no runtime action ever consumed (silent no-op).

  v6.0 flips to producer + senpi-trading-runtime:
    - Producer (mantis-producer.py) emits MANTIS_SLIPSTREAM signals via
      SenpiClient.push_signal() to runtime /signals. NO direct
      create_position. NO Python state files for daily caps or
      per-asset cooldowns.
    - LLM gate is pass-through — producer has applied every filter
      (follow_rate >= 0.85, confidence >= 0.75, |gap| >= 1.5%, SM
      rotation, lag_stddev <= 90, no-double-up). LLM passes leverage
      and marginUsd through from signal.data for conviction-tier sizing.
    - risk.guard_rails ENFORCES max_entries_per_day=6 + per_asset_
      cooldown_minutes=240 + daily_loss_limit + drawdown_halt natively.
    - DSL exits via FEE_OPTIMIZED_LIMIT — saves ~0.020-0.030% per
      maker-filled close vs v5.x MARKET orders.
    - Leader-reversal veto NOW WORKS: producer calls close_position
      directly via mcp_call when leader (BTC) reverses >1% from
      entry value. v5.0 emitted VETO_CLOSE stdout that nothing
      consumed; v6.0 wires it as a direct producer-authoritative
      action. The runtime cannot express "close this position if
      a separate asset's 4h move reverses" — that thesis lives in
      the producer.

  Thesis preserved verbatim from v5.0:
    - Cross-asset catchup hunter on market_get_cross_asset_flows
    - Leader universe: BTC (only one with pre-computed lag data)
    - Entry filters: follow_rate >= 0.85, confidence >= 0.75,
      |gap| >= 1.5%, SM rotation true, lag_stddev <= 90
    - Sizing tiers: confidence 0.92+ → 75% margin / 8x lev,
      0.85+ → 50% / 7x, 0.75+ → 25% / 5x
    - Direction: follow the leader (+leader → LONG laggard)
    - Dynamic hard_timeout: avg_lag × 1.5, clamped [30, 240]min
    - Leader-reversal veto: 1.0% threshold

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 2
  margin_pct: 25        # baseline % of account budget; producer/LLM passes the tier marginUsd via signal
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 60
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 240     # 4h — replaces v5's asset-cooldowns.json

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: mantis_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }            # 0..1 confidence
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        notionalUsd: { type: number, required: false }
        hardTimeoutMinutes: { type: number, required: false }
        gapPct: { type: number, required: true }
        followRate: { type: number, required: true }
        avgLagMinutes: { type: number, required: true }
        lagStddevMinutes: { type: number, required: false }
        smStartingToRotate: { type: boolean, required: false }
        leaderAsset: { type: string, required: true }
        leaderMovePct: { type: number, required: true }
        heldAssets: { type: array, required: false }
        reasons: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: mantis_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${MANTIS_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix. INVALID: "<provider>/<model>" (e.g. "google/...", "anthropic/...", "openai/...") — OpenClaw double-prefixes → 500 Unknown model. The LLM gate is a pass-through rubber-stamp (producer already applied every filter); any reliable structured-JSON model works. No default by design — operators pick their own.
    scanners: [mantis_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: mantis_signals
    decision_prompt: |
      You are Mantis's pass-through gate. Mantis hunts CROSS-ASSET
      CATCHUPS — when a leader (BTC) moves significantly in 4h and a
      historically-correlated alt hasn't responded yet, Mantis strikes
      the alt to ride the statistical catchup. The producer has already
      applied EVERY filter (follow_rate >= 0.85, confidence >= 0.75,
      |gap| >= 1.5%, SM rotation true, lag_stddev <= 90, no-double-up).
      Your job is to honor the signal and pass the conviction-tier
      sizing through to the runtime.

      SIGNAL:
      {{signal_mantis_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. The `asset` in your output payload MUST be the exact value
         from the signal's `asset` field. Preserve case.
      2. The `direction` MUST match the signal's `direction` field
         exactly (this is the LAGGARD's direction, set by the leader's
         move sign — never invert it).
      3. The `leverage` MUST be copied from the signal's `data.leverage`
         field exactly (5/7/8 by confidence tier).
      4. The `marginUsd` MUST be copied from the signal's `data.marginUsd`
         field exactly. This is the conviction-tier sizing
         (25%/50%/75% of account at confidence 0.75/0.85/0.92).
         Do NOT substitute the runtime default.
      5. Every claim in `reasoning` MUST cite values from the signal
         payload — score (confidence), gapPct, followRate, avgLagMinutes,
         leaderAsset, leaderMovePct. Do not fabricate.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 0.75 (producer floor; defensive)
      - leverage <= 0 OR marginUsd <= 0 OR signal data missing (malformed)
      - heldAssets already contains this asset (duplicate position)
      - reasons array empty (malformed signal)
      - leaderMovePct sign disagrees with direction
        (leader +, direction SHORT — or leader -, direction LONG)

      ## MANTIS'S THESIS

      Pure statistical edge: alts with follow_rate >= 85% historically
      catch up to leader moves within their typical lag window. Sizing
      scales with confidence — high confidence + tight lag stddev =
      bigger position. Reversion-safe via the producer-side leader-
      reversal veto (closes immediately if leader walks back >1% from
      entry). DSL handles the in-window trail.

      ## CONFIDENCE SCORING (output 1-10)

      - 9-10: signal score >= 0.92 (apex tier, 8x leverage, 75% margin)
        AND followRate >= 0.95 AND lagStddevMinutes <= 45
      - 8: signal score >= 0.85 (mid tier, 7x, 50% margin) AND
        followRate >= 0.90
      - 7: signal score >= 0.75 (base tier, 5x, 25% margin) — producer
        floor cleared; honor unless a hard-skip applies.
      - <7: producer floor not cleared — should never reach you.

      Minimum confidence to execute is 7. Be permissive unless
      structurally broken — the producer has already validated the
      statistical edge.

      ## OUTPUT FORMAT

      Return JSON. `leverage` and `marginUsd` MUST come from the signal
      payload — these enforce Mantis's conviction-tier sizing instead of
      letting the runtime fall back to defaults.

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values — e.g. 'BTC +3.2% in 4h, ARB historically follows in 45±20min at 92% follow_rate, currently -1.8% behind, SM rotating; confidence 0.88 (mid tier, 50% margin, 7x lev)'",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "MANTIS_SLIPSTREAM ASSET DIR — top reason"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 30
  # v6.0 KEY WIN — maker-preferred exits via FEE_OPTIMIZED_LIMIT.
  # HL taker is 0.045%, maker is 0.015% — saves ~0.020-0.030% per
  # exit when ALO crosses the book within timeout.
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  # DSL preset preserved VERBATIM from v5.0. The catchup thesis has TWO
  # producer-side exit conditions (dynamic hard_timeout per trade via
  # signal data + leader-reversal veto). The DSL preset below is the
  # safety net: 240min hard_timeout is the absolute ceiling — the
  # producer's veto + dynamic timeout will typically fire much sooner.
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 240
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 20
      min_value: 1.5
    phase1:
      enabled: true
      max_loss_pct: 12.0
      retrace_threshold: 5
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 30 }
        - { trigger_pct: 10, lock_hw_pct: 60 }
        - { trigger_pct: 15, lock_hw_pct: 75 }
        - { trigger_pct: 25, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
