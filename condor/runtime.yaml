name: condor-tracker
version: 3.3.0
description: >
  CONDOR v3.3 — disable weak_peak_cut (apex-patience alignment).
  Condor runs 1 trade/day (1 slot effectively) on apex-confluence
  setups that develop over 4-8h. 2h weak_peak_cut at 3% ROE was
  pre-empting the thesis the same way Polar's hard_timeout did on
  2026-04-23 overnight — a structural mismatch between "I haven't
  hit 3% ROE in 2 hours" and "this apex setup hasn't had time to
  develop yet." MIN_SCORE=13 means every entry is high-conviction;
  treat it like a single-asset patience agent. Phase 1 max_loss
  (20%) + retrace (8%) + Phase 2 tiers own exits. hard_timeout
  (24h) preserved as outer bound. v3.2 signal tightening preserved.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ─── EXIT (DSL) — v3.0 mid-beta default profile ──────────────
# Condor v3.0 scans 50 assets; most are mid-beta (SOL/ETH/LINK/AAVE class).
# DSL profile calibrated off Kodiak's SOL empirical wins:
#   - Phase 2 first lock at +8% ROE / 30% of HW (lets winners breathe)
#   - Subsequent tiers escalate lock-in as ROE climbs
#   - Tier 4 at +40% locks 85% of HW (Kodiak's best exit tier)
#   - Hard timeout 1440 min = 24h "one trade per day" discipline
#
# Single-breach DSL is enforced onchain (RatchetStop backend). Floors are
# wider than pre-RatchetStop era to survive normal wicks within apex moves.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 1440       # 24h — one trade per day
    weak_peak_cut:
      enabled: false                   # v3.3: DISABLED. Apex thesis needs 4-8h to develop; 2h @ 3% was pre-empting. 1 slot + high MIN_SCORE = single-asset-like. Phase 1 + Phase 2 own exits.
      interval_in_minutes: 120
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60          # 60 min no movement = dead
    phase1:
      enabled: true
      max_loss_pct: 20.0               # Wolverine's HYPE SHORT died at -20%. Keep this.
      retrace_threshold: 8
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8,   lock_hw_pct: 30 }   # Kodiak mid-beta Tier 1
        - { trigger_pct: 15,  lock_hw_pct: 50 }   # Tier 2
        - { trigger_pct: 25,  lock_hw_pct: 70 }   # Tier 3 — Kodiak's #3 exit
        - { trigger_pct: 40,  lock_hw_pct: 85 }   # Tier 4 — Kodiak's #1/#2 exit tier
        - { trigger_pct: 60,  lock_hw_pct: 90 }   # Tier 5 — infinite trail
        - { trigger_pct: 100, lock_hw_pct: 94 }   # Tier 6 — monster winners

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
