name: condor-tracker
version: 3.2.0
description: >
  CONDOR v3.2 — signal-quality tightening. v3.1 was firing at too
  broad a confluence threshold (MIN_SCORE=11, SM=65%) — 246 fills /
  -16.4% says borderline setups were mostly losers. v3.2 raises
  MIN_SCORE 11→13 (Kodiak's winner-median score) and SM consensus
  65→75%. Same 3TF alignment + macro-gate architecture, just demands
  higher conviction before firing. Expected: ~50% fewer entries with
  higher hit rate. Also fixes version drift (scanner was v3.1 but
  runtime still pinned v3.0).

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ─── EXIT (DSL) — v3.0 mid-beta default profile ──────────────
# Condor v3.0 scans 50 assets; most are mid-beta (SOL/ETH/LINK/AAVE class).
# DSL profile calibrated off Kodiak's SOL empirical wins:
#   - Phase 2 first lock at +8% ROE / 30% of HW (lets winners breathe)
#   - Subsequent tiers escalate lock-in as ROE climbs
#   - Tier 4 at +40% locks 85% of HW (Kodiak's best exit tier)
#   - Hard timeout 1440 min = 24h "one trade per day" discipline
#
# Single-breach DSL is enforced onchain (RatchetStop backend). Floors are
# wider than pre-RatchetStop era to survive normal wicks within apex moves.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 1440       # 24h — one trade per day
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 120         # 2h peak stale = position isn't developing
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60          # 60 min no movement = dead
    phase1:
      enabled: true
      max_loss_pct: 20.0               # Wolverine's HYPE SHORT died at -20%. Keep this.
      retrace_threshold: 8
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 8,   lock_hw_pct: 30 }   # Kodiak mid-beta Tier 1
        - { trigger_pct: 15,  lock_hw_pct: 50 }   # Tier 2
        - { trigger_pct: 25,  lock_hw_pct: 70 }   # Tier 3 — Kodiak's #3 exit
        - { trigger_pct: 40,  lock_hw_pct: 85 }   # Tier 4 — Kodiak's #1/#2 exit tier
        - { trigger_pct: 60,  lock_hw_pct: 90 }   # Tier 5 — infinite trail
        - { trigger_pct: 100, lock_hw_pct: 94 }   # Tier 6 — monster winners

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
