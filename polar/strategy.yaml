# Polar — strategy package deploy declaration (single source of truth).
schema_version: 1

id: polar
version: "5.0.0"

catalog:
  name: "Polar — ETH Alpha Hunter"
  emoji: "🐻‍❄️"
  tagline: "Single-asset alpha hunter for ETH. Combines Hyperfeed Smart Money acceleration with multi-timeframe structural alignment for high-conviction entries."
  group: single-asset-alpha-hunter
  risk_level: moderate
  min_budget: 100

requires:
  runtime: ">=1.1.0"

defaults:
  decision_model_env: POLAR_DECISION_MODEL
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  auth_token_env: SENPI_AUTH_TOKEN

instances:
  - name: main
    runtime: runtime.yaml
    scanner:
      entrypoint: scanner.py
      name: polar_signals                  # == external_scanner.name in runtime.yaml
      signal_type: POLAR_ETH_HYBRID
    wallet_env: POLAR_WALLET_ADDRESS    # the var polar/scripts/scanner.py reads (anti-contamination: strategy-specific)
    env: {}
    tick_seconds: 300
    funding_share: 1.0
    params:                                # was polar-config.json
      asset: ETH
      minScore: 14
      quietHours:
        startUtc: 0
        endUtc: 4
        apexBypassScore: 17
