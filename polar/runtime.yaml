name: polar-tracker
version: 3.0.4
description: >
  Polar v3.0.4 — disable dead_weight_cut (architectural fix).
  dead_weight_cut is a time-based proxy for opportunity cost —
  "free the slot so another signal can fire." But Polar is
  single-asset (ETH only, 1 slot) — there's nowhere to rotate.
  Cutting early just books a fee loss on a consolidation that DSL
  Phase 1/2 would handle correctly via price action. v3.0.3 already
  loosened weak_peak→120 min and hard_timeout=480 min; those still
  catch stalled positions. dead_weight_cut now disabled.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 120     # v3.0.3: 60 → 120 (ETH apex-trend consolidates 30-60 min between legs)
      min_value: 2.0
    dead_weight_cut:
      enabled: false                # v3.0.4: DISABLED. Single-asset agent has no rotation opportunity cost.
      interval_in_minutes: 90
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # Phase 2 tiers — leverage-aware for ETH (fleet audit April 2026)
        # At 20x, old Tier 1 (5%/30%) created a $1.19 lock — normal ETH wick is $5-8
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
