name: polar-tracker
version: 3.0.6
description: >
  Polar v3.0.5 — disable hard_timeout (fixes Phase-2 wrongful-close bug).
  2026-04-23 overnight: Polar entered Phase 2 on an ETH Short at 4:09 AM
  (Tier 1 locked, peak +11.79% ROE), then hard_timeout fired at 5:28 AM
  and closed the position at +12.33% — while still in Phase 2 trailing.
  Per the v2 runtime spec hard_timeout is Phase-1-only, but v1 DSL fires
  it regardless of phase. The exit was lucky (+$71.15 booked) but
  unprincipled — Phase 2 trailing should own that decision, not a clock.
  v3.0.5 disables hard_timeout entirely. Phase 1 max_loss_pct=25 caps
  downside; Phase 1 retrace (8% ROE from peak) catches stuck positions;
  weak_peak_cut catches minor-peak faders; Phase 2 trailing owns winner
  exits. Pairs with v3.0.4's dead_weight_cut disable — no time-based
  cuts remain on this single-asset patience thesis.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: false                # v3.0.5: DISABLED. v1 DSL fires this in Phase 2 incorrectly (per v2 spec it's Phase-1-only). Phase 1 max_loss + Phase 2 trailing own exits.
      interval_in_minutes: 480
    weak_peak_cut:
      enabled: false                # v3.0.6: DISABLED. Completes the "no time-based cuts on single-asset patience agents" architectural sweep (after v3.0.4 dead_weight + v3.0.5 hard_timeout). Exits now 100% price-action (Phase 1 max_loss + retrace + Phase 2 trailing).
      interval_in_minutes: 120
      min_value: 2.0
    dead_weight_cut:
      enabled: false                # v3.0.4: DISABLED. Single-asset agent has no rotation opportunity cost.
      interval_in_minutes: 90
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # Phase 2 tiers — leverage-aware for ETH (fleet audit April 2026)
        # At 20x, old Tier 1 (5%/30%) created a $1.19 lock — normal ETH wick is $5-8
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
