name: polar-tracker
version: 3.0.0
description: >
  ETH alpha hunter v3.0 — hybrid hyperfeed + structural-veto architecture.
  Complete rewrite. v2.4 used leaderboard_get_markets alone (no candle
  confirmation) and produced 32% gross win rate on 81 positions. v3.0 keeps
  hyperfeed (SM positioning) as primary direction signal but adds structural
  candle gates as vetos: trend_4h must match SM direction with strength ≥
  0.75; 1h must match 4h; 15m momentum confirms; RSI gate; base-tech floor
  requires strong 15m OR 5m alignment. Fixes silent-None OI velocity bug
  (flat path). MIN_SCORE raised 10 → 14. Conviction-scaled leverage (5x
  standard, 7x conviction, 10x apex at score ≥ 17). DSL tiers unchanged.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 60
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 30
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # Phase 2 tiers — leverage-aware for ETH (fleet audit April 2026)
        # At 20x, old Tier 1 (5%/30%) created a $1.19 lock — normal ETH wick is $5-8
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
