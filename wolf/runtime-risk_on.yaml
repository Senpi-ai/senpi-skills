name: wolf-risk-on-tracker
# Top-level `version` is the SCHEMA version the senpi-trading-runtime
# plugin expects (major=1). Skill version is "Wolf v1.0" — lives in
# description + SKILL.md + _wolf_producer_version.
version: 1.0.0
description: >
  WOLF v1.0 (RISK-ON book) — regime-rotation long-beta.

  One of two rotation books. This book trades ONLY when Wolf's shared
  cross-asset regime detector confirms RISK-ON (equities up + oil down + gold
  soft + BTC up + dollar soft, net votes over threshold). It then goes LONG
  beaten-down beta that is turning up — crypto majors / high-beta alts + growth
  indices — riding the relief-rally rotation. When the regime is RISK-OFF or
  NEUTRAL this book STANDS DOWN (emits no signals) and the RISK-OFF book
  (runtime-risk_off.yaml) carries. The edge is trading the macro TURN, not a
  fixed view and not per-asset trend.

  Scoring (producer-side): regime gate (RISK-ON required), then 4h trend
  backbone + 1h confirmation + 24h momentum + RSI room. LONG only.

  Execution envelope:
    - slots 3, margin_pct 20
    - strict 5x leverage clamp, then each asset's HL venue max
    - WIDE let-it-run DSL: a relief rally can run, all time-cuts OFF, 5d
      hard_timeout staleness backstop

  Producer scores its universe and pushes signals via
  SenpiClient.push_signal(); runtime LLM gate is pass-through; runtime owns
  execution + DSL.

strategy:
  wallet: "${WOLF_RISK_ON_WALLET}"
  # ── FUNDING SPLIT DEFAULT: RISK_ON 50% / RISK_OFF 50% of the combined pool ──
  # Wolf rotates — usually only ONE book is active at a time (the one the regime
  # favors). A 50/50 split gives each regime equal firepower since you can't know
  # which will dominate the period. This is a FUNDING guideline for the operator,
  # NOT a runtime-enforced field. Per-position sizing is governed by margin_pct + slots.
  slots: 3
  margin_pct: 20
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 168
  guard_rails:
    # daily_loss_limit_pct DISABLED on multi-wallet funds: the runtime computes this gate's
    # limit off the perpDay base, which reads ~$0 for these wallets -> a "$0.00" limit that
    # ANY real loss trips, permanently halting the book (Wolf/Hydra/Mongoose 2026-06-22).
    # drawdown_halt (PnL-based) + DSL + cooldowns protect instead; re-enable once the engine fixes the base.
    max_entries_per_day: 5        # regime rotations are infrequent → few entries/day
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 90
    drawdown_halt_pct: 22
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 240

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: wolf_risk_on_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        direction: { type: string, required: true }
        reasons: { type: array, required: false }
        trend4h: { type: string, required: false }
        regime: { type: string, required: false }
        regimeNet: { type: number, required: false }
        own24h: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: wolf_risk_on_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${WOLF_DECISION_MODEL}"   # REQUIRED. Bare model name only — NO provider prefix.
    scanners: [wolf_risk_on_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: wolf_risk_on_signals
    decision_prompt: |
      You are Wolf's RISK-ON-book pass-through gate. The producer ALREADY
      confirmed the cross-asset regime is RISK-ON before emitting (no signal is
      sent in any other regime), then scored a long-beta name (crypto majors /
      high-beta alts / growth indices) turning up. It applied the 5x leverage
      clamp and held-asset dedup. This book is LONG only. Honor the signal
      unless it is malformed.

      SIGNAL:
      {{signal_wolf_risk_on_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. asset MUST be copied from signal.asset EXACTLY (preserve any xyz: prefix).
      2. direction MUST be LONG (this book is long-only). If signal.direction is not LONG, execute: false.
      3. leverage MUST be copied from signal.data.leverage.
      4. marginUsd MUST be copied from signal.data.marginUsd.
      5. Every claim in reasoning MUST cite signal values.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 5 (producer floor; defensive)
      - leverage <= 0 OR leverage > 5 (clamp breach) OR marginUsd <= 0
      - direction != LONG
      - signal.data.regime != "RISK_ON"
      - signal.asset already in signal.data.heldAssets (duplicate)
      - reasons array empty

      ## CONFIDENCE SCORING

      - 9-10: score >= 7 AND regime net strong AND no malformed fields
      - 7-8:  score 5.5-6.9
      - 7:    score 5-5.4 (producer floor) — the signal IS the validation
      - <7:   producer floor not cleared (should never reach you)

      ## OUTPUT FORMAT

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values (e.g. 'score 7 ETH LONG 5x, RISK_ON regime net +3, 4h BULLISH, +2.1% 24h — relief-rally rotation')",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "LONG",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "WOLF_RISK_ON_ROTATION LONG — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL — wide let-the-rotation-run) ──────────────────────────
#
# A confirmed risk-on rotation can run for days, so ride it: wide phase1, ALL
# time cuts OFF, and only a 5d hard_timeout staleness backstop. A regime flip
# is handled on the ENTRY side (the book stops adding); open winners trail out
# via the phase2 ladder.
exit:
  engine: dsl
  interval_seconds: 60
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 7200           # 5d staleness cap
    weak_peak_cut:
      enabled: false
      interval_in_minutes: 720
      min_value: 3.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 1440
    phase1:
      enabled: true
      max_loss_pct: 14.0
      retrace_threshold: 9
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 12, lock_hw_pct: 0 }
        - { trigger_pct: 25, lock_hw_pct: 45 }
        - { trigger_pct: 45, lock_hw_pct: 65 }
        - { trigger_pct: 80, lock_hw_pct: 80 }
        - { trigger_pct: 130, lock_hw_pct: 90 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
