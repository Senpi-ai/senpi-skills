name: dog-tracker
version: 2.5.0
description: >
  Dog v2.5 — exhaustion gate calibration (2026-05-05). v2.2's
  MIN_EXHAUSTION_PCT 4.5 produced ZERO trades in ~3 weeks because
  4.5% 4h moves on BTC/ETH/SOL/HYPE majors are rare (BTC's biggest
  4h move in past 44h was only +2.27%). Lowered to 3.0 — captures
  legitimate overextension while rejecting trend-continuation noise.
  Sweet spot between v2.1's permissive 2.5% (which lost -$53 on 10
  trades) and v2.2's never-fires 4.5%. DEEP_EXHAUSTION_BONUS
  unchanged — bigger moves still get the +2 score boost.

  Dog v2.4 — Contrarian Pup (parser fix + DSL loosen). Fixes the same
  funding_history parser bug as Pangolin (MCP returns data.data=[{...}],
  not data.<field>) that silently disabled v2.3's persistence+trend
  bonus scoring. Also loosens dead_weight_cut 30→60 min because fades
  need time to develop. Signal gates unchanged — Arena W4 +12.9%
  recovery says the thesis is still working.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 300
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    # Dog v2.0 — WIDE DSL for contrarian fades.
    # Reversals take time to develop. Let winners run.
    hard_timeout:
      enabled: true
      interval_in_minutes: 360
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60       # v2.4: 30 → 60 (let fades develop before cutting)
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 20 }
        - { trigger_pct: 10, lock_hw_pct: 40 }
        - { trigger_pct: 15, lock_hw_pct: 60 }
        - { trigger_pct: 20, lock_hw_pct: 75 }
        - { trigger_pct: 30, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
