name: dog-tracker
# Runtime SCHEMA version must be major=1 per the senpi-trading-runtime
# plugin. Strategy/skill is "Dog v3.0.0" — lives in description +
# SKILL.md + _dog_producer_version. Do not set this to 3.x.x.
version: 1.0.0
description: >
  DOG v3.0.0 — Contrarian Pup, helpers-native rewrite. Plumbing-only
  migration from v2.5. NO thesis change.

  v2.x was a full-agency scanner: scored signals, called create_position
  directly, tracked daily entries + cooldowns in Python (state files).
  v3.0 flips to producer + senpi-trading-runtime:
    - Producer (dog-producer.py) emits DOG_CONTRARIAN_FADE signals via
      SenpiClient.push_signal() (direct HTTP POST). NO execution code.
      NO trade counters. NO Python cooldowns.
    - LLM gate is pass-through — producer has applied every filter
      (3.0% exhaustion gate, regime hard-gate, 15m velocity freshness,
      MIN_SCORE 8, contrarian flip). LLM only catches malformed signals.
    - risk.guard_rails ENFORCES max_entries_per_day, per_asset_cooldown,
      daily_loss_limit, max_consecutive_losses, drawdown_halt.
      No Python state to crash.
    - DSL exits via FEE_OPTIMIZED_LIMIT — saves ~0.020-0.030% per
      maker-filled close vs v2.x MARKET orders. At Dog's 2-3 trades/day
      target this is modest absolute dollars but compounds with the
      defensive sizing.
    - Trade chain DB emits LIFECYCLE / DECISION_EXECUTED / ACTION_RESULT /
      DSL_CREATED / DSL_CLOSED for every trade — telemetry restored.

  Thesis preserved verbatim from v2.5 (2026-05-05 calibration):
    - Multi-asset (BTC, ETH, SOL, HYPE) contrarian fader
    - 3.0% exhaustion gate (v2.5 sweet spot between v2.1's 2.5% loose
      and v2.2's 4.5% never-fires)
    - Score weights: SM concentration tier + trader depth + 4H price
      alignment + move-exhaustion BONUS (inverted vs trend-followers)
      + 15m freshness + 1h acceleration + funding-pays + regime
      confirmation + persistence + US session
    - CONTRARIAN FLIP: producer scores SM direction, emits OPPOSITE
    - Regime hard-gate: skip if regime contradicts the fade
    - 15m velocity must be > 0 (SM must still be actively building
      the position we're about to fade)

  v2.5 dynamic daily-cap circuit breaker replaced by runtime
  guard_rails: max_entries_per_day=3 + daily_loss_limit_pct=15 +
  drawdown_halt_pct=25 covers the conservative + hard-stop tiers
  of the dynamic cap. Intermediate tiers (12/8/5 entries depending
  on session PnL) dropped — fleet-standard runtime gates are more
  reliable than Python state files (Roach lesson).

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 1
  margin_per_slot: 300
  trading_risk: conservative
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 15
    max_entries_per_day: 3
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 60
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 120        # 2h — replaces v2.5's COOLDOWN_MINUTES=180 general + SAME_DIR_COOLDOWN=90

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: dog_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        smDirection: { type: string, required: true }
        leverage: { type: number, required: true }
        reasons: { type: array, required: true }
        smPct: { type: number, required: true }
        smTraders: { type: number, required: true }
        priceChange4hPct: { type: number, required: true }
        priceChange1hPct: { type: number, required: false }
        contribChange15m: { type: number, required: false }
        contribChange1h: { type: number, required: false }
        contribChange4h: { type: number, required: false }
        fundingRegime: { type: string, required: false }
        persistenceHours: { type: number, required: false }
        crowdingTrend: { type: string, required: false }
        assetFunding: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: dog_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${DOG_DECISION_MODEL}"   # REQUIRED. Pass BARE model name only — NO provider prefix. Valid: "gemini-2.5-pro", "claude-sonnet-4-20250514". INVALID: "google/gemini-2.5-pro" (OpenClaw double-prefixes → 500 Unknown model). No default by design.
    scanners: [dog_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: dog_signals
    decision_prompt: |
      You are Dog's pass-through gate. Dog is a CONTRARIAN FADER —
      it trades AGAINST exhausted Smart Money consensus. The producer
      has already applied EVERY filter (3.0% exhaustion gate, regime
      hard-gate, 15m velocity freshness, MIN_SCORE 8, contrarian flip).
      The signal's `direction` is the FADE direction (opposite of SM).
      Your job is to honor the signal unless something is structurally
      broken.

      SIGNAL:
      {{signal_dog_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. The `asset` in your output payload MUST be the exact value
         from the signal's `asset` field (one of BTC, ETH, SOL, HYPE).
      2. The `direction` MUST match the signal's `direction` field
         exactly — this is already the FADE direction.
         smDirection in the signal data is the SM direction Dog is
         fading; do NOT confuse the two.
      3. The `leverage` MUST be copied from the signal's `data.leverage`
         field exactly (7 base, 10 at score 12+).
      4. Every claim in `reasoning` MUST cite values from the signal
         payload — score, smPct, priceChange4hPct, fundingRegime, etc.
         Do not fabricate.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 8 (producer floor; defensive)
      - leverage <= 0 OR signal data missing (malformed)
      - heldAssets already contains this exact asset (duplicate)
      - reasons array empty (malformed signal)
      - fundingRegime contradicts the fade direction (producer
        should have hard-gated; defensive only)

      ## DOG'S THESIS

      Hyperliquid is dominated by leverage traders chasing momentum.
      When a major moves 3%+ in 4 hours and SM consensus piles in
      heavily, the crowd is maximum exposed. The unwind is the alpha.
      Dog targets 2-3 trades per day with conservative leverage
      (7x base, 10x apex). Reversals take time — DSL is wide to let
      them develop. Don't add subjective second-guessing.

      ## CONFIDENCE SCORING

      - 9-10: score >= 12 (apex tier, 10x leverage) AND DOMINANT_SM
        (smPct >= 15) AND DEEP_EXHAUSTION (|priceChange4hPct| >= 4.0)
        AND REGIME_CONFIRMS
      - 7-8: score >= 10 (mid tier) AND STRONG_SM or DOMINANT_SM
        AND EXHAUSTION clear AND regime supports
      - 7: score 8-9 (base tier) — producer floor cleared; the signal
        IS the validation. Honor it unless a hard-skip applies.
      - <7: producer floor not cleared — should never reach you.

      Minimum confidence to execute is 7. Be permissive unless
      structurally broken — Dog's edge requires the volume of attempts.

      ## OUTPUT FORMAT

      Return JSON. `leverage` must come from the signal payload to
      preserve Dog's conviction-tier sizing.

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values — e.g. 'score 11 SHORT_FADE on HYPE, SM was LONG 18.3% (DOMINANT) with 124 traders, 4h +4.5% DEEP_EXHAUSTION, regime LONG_CROWDED confirms fade'",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY (the FADE direction)",
              "leverage": "copy signal.data.leverage EXACTLY",
              "reason": "score N CONTRARIAN_FADE ASSET DIR — top reason"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 30
  # v3.0 KEY WIN — maker-preferred exits via FEE_OPTIMIZED_LIMIT.
  # HL taker is 0.045%, maker is 0.015% — saves ~0.020-0.030% per
  # exit when ALO crosses the book within timeout.
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  # DSL preset preserved VERBATIM from v2.5. Wide for contrarian fades.
  # Reversals take time to develop. Let winners run.
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 360
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60          # v2.4: 30 → 60 (let fades develop before cutting)
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 20 }
        - { trigger_pct: 10, lock_hw_pct: 40 }
        - { trigger_pct: 15, lock_hw_pct: 60 }
        - { trigger_pct: 20, lock_hw_pct: 75 }
        - { trigger_pct: 30, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
