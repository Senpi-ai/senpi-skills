name: dog-tracker
version: 1.1.0
description: >
  The Loyal Consistent Performer v1.1. Multi-asset SM consensus scanner.
  v1.1 fixes: Phase 1 25% (was 15%), retrace 8 (was 6), dead_weight 60min
  (was 45), hard_timeout 180min (was 120), weak_peak 3.0 (was 1.0).

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 300
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    # v1.1: All timings widened. v1.0's tight DSL was stopping Dog out
    # before trades could develop. Phase 1 at 15% was a 1.5% price stop
    # at 10x — BTC wicks that in 30 minutes regularly.
    hard_timeout:
      enabled: true
      interval_in_minutes: 180
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 60
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        # Quick-profit tiers — same thesis as v1.0 but with fleet-standard
        # first trigger at 5% ROE. The tight Phase 1 was the real problem,
        # not the profit-taking tiers.
        - { trigger_pct: 5,  lock_hw_pct: 50 }
        - { trigger_pct: 8,  lock_hw_pct: 65 }
        - { trigger_pct: 12, lock_hw_pct: 75 }
        - { trigger_pct: 20, lock_hw_pct: 85 }
        - { trigger_pct: 30, lock_hw_pct: 90 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
