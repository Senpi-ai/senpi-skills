name: pangolin-tracker
version: 1.7.0
description: >
  PANGOLIN v1.7 — DSL-thesis alignment (agent self-diagnosed).
  v1.6 preserved weak_peak disable but left Phase 2 tiers + max_loss +
  dead_weight tuned for short-hold theses, which is wrong for a
  funding-fade mean-reversion that collects every 8h and needs 24-48h
  to complete. Agent diagnostic 2026-04-24: "using a scalper DSL for
  a swing-trade macro thesis." Three changes:
    - phase1.max_loss_pct 20 → 30 (at 3x lev = 10% price buffer,
      lets MAVIA's 5-8% funding-induced spikes play out)
    - dead_weight_cut 60min → 480min (8h = one full funding cycle;
      current 60min was cutting trades before even one funding
      payment landed)
    - phase2 first tier: 3%/15% removed. New ladder starts at
      12% trigger. At 3x leverage that's a 4% price move before
      Phase 2 trailing arms — above MAVIA's normal wick noise.
  Scanner (v1.5 parser + persistence gate) unchanged.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 250
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# Very wide DSL — funding mean-reversion takes hours to days.
# The edge comes from collecting funding every 8 hours, so patience pays.
# Dead weight cut catches entries where funding normalizes without price move.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 720
    weak_peak_cut:
      enabled: false                 # v1.6: DISABLED. Funding-rate fade thesis takes 24-48h to develop; time cut pre-empts it. Phase 1 retrace + max_loss + Phase 2 tiers own exits.
      interval_in_minutes: 180
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 480          # v1.7: 60 → 480 (8h = one full funding cycle; was cutting before any funding payment)
    phase1:
      enabled: true
      max_loss_pct: 30.0                # v1.7: 20 → 30 (10% price buffer at 3x for MAVIA funding-induced spikes)
      retrace_threshold: 10
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      # v1.7: removed 3%/15% and 7%/30% first tiers. At 3x leverage,
      # 3% ROE = 1% price move = within MAVIA's normal wick noise.
      # Phase 2 was arming on chop + locking breakeven + stopping
      # trades before funding payment landed.
      tiers:
        - { trigger_pct: 12, lock_hw_pct: 50 }   # 4% price move at 3x before Phase 2 trailing
        - { trigger_pct: 20, lock_hw_pct: 70 }
        - { trigger_pct: 30, lock_hw_pct: 85 }
        - { trigger_pct: 50, lock_hw_pct: 92 }   # monster funding unwind trail

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
