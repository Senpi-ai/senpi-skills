name: pangolin-tracker
version: 1.6.0
description: >
  PANGOLIN v1.6 — disable weak_peak_cut (patience-thesis alignment).
  Funding-rate fades are mean-reversion plays that take 24-48h to
  develop; a position peaking at 1.5% ROE in 3h can still run into its
  funding-cycle target over the next day. Time-based weak_peak cut
  was pre-empting the thesis. Phase 1 retrace + max_loss + Phase 2
  tiers own all exits.
  Previous versions: v1.5 fixed data.data[{asset}] parser bug; v1.4
  integrated persistence + regime gates.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 250
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# Very wide DSL — funding mean-reversion takes hours to days.
# The edge comes from collecting funding every 8 hours, so patience pays.
# Dead weight cut catches entries where funding normalizes without price move.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 720
    weak_peak_cut:
      enabled: false                 # v1.6: DISABLED. Funding-rate fade thesis takes 24-48h to develop; time cut pre-empts it. Phase 1 retrace + max_loss + Phase 2 tiers own exits.
      interval_in_minutes: 180
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 60
    phase1:
      enabled: true
      max_loss_pct: 20.0
      retrace_threshold: 10
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 3,  lock_hw_pct: 15 }
        - { trigger_pct: 7,  lock_hw_pct: 30 }
        - { trigger_pct: 12, lock_hw_pct: 50 }
        - { trigger_pct: 20, lock_hw_pct: 70 }
        - { trigger_pct: 30, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
