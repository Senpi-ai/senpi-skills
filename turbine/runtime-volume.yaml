name: turbine-volume-tracker
version: 1.0.0
description: >
  TURBINE v3.0 — VOLUME runtime (volume engine, 7 slots, 10-min rotation).
  One of TWO runtimes Turbine v3.0 attaches to the strategy wallet
  (sibling: turbine-hunt-tracker). Mission: high notional rotation at
  the absolute minimum fee cost. Profit = Senpi builder-fee recycling
  (~3.5 bps RT) minus HL maker fees (~1.2-1.4 bps RT main, ~0.6 bps XYZ).
  Trading P&L target: pure breakeven.

strategy:
  wallet: "${TURBINE_WALLET}"
  budget: 6000
  slots: 7
  margin_per_slot: 500
  trading_risk: aggressive
  default_leverage: 5
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 50
    max_entries_per_day: 1500
    bypass_max_entries_per_day_on_profit: true
    max_consecutive_losses: 30
    cooldown_minutes: 1
    drawdown_halt_pct: 50
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 0

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: turbine_volume_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        # asset + direction are SignalItem TOP-LEVEL fields (passed via
        # client.push_signal(asset=..., direction=...)). NEVER declared
        # here in `data` — would cause double-store + INVALID_REQUEST
        # rejection (Pangolin TST 2026-05-05 footgun).
        mode: { type: string, required: true }                 # "VOLUME"
        thesis: { type: string, required: true }               # funding_fade_long | funding_fade_short | alternate_neutral
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        slotIndex: { type: number, required: false }
        spreadBps: { type: number, required: false }
        fundingRegime: { type: string, required: false }
        fundingAnnualizedPct: { type: number, required: false }
        cycleMin: { type: number, required: false }
        isXyz: { type: boolean, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: turbine_volume_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${TURBINE_VOLUME_DECISION_MODEL}"
    scanners: [turbine_volume_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: false
        execution_timeout_seconds: 180
    context:
      - type: signal
        scanner: turbine_volume_signals
    decision_prompt: |
      You are Turbine VOLUME's pass-through gate. The producer applied every
      filter (funding regime, spread gate, held-asset dedup, post-close
      cooldown, slot accounting). Honor the signal, convert to OPEN_POSITION.

      SIGNAL:
      {{signal_turbine_volume_signals}}

      Output execute: true UNLESS:
        - mode != "VOLUME"
        - leverage <= 0 OR marginUsd <= 0
        - thesis not in {funding_fade_long, funding_fade_short, alternate_neutral}

      asset/direction copied EXACTLY from signal. Confidence always 7.

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": 7,
        "reasoning": "asset + direction + thesis + spreadBps",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "turbine volume rotation"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: false
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10
    weak_peak_cut:
      enabled: false
      interval_in_minutes: 60
      min_value: 1.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 60
    phase1:
      enabled: true
      max_loss_pct: 50.0
      retrace_threshold: 30
      consecutive_breaches_required: 3
    phase2:
      enabled: false
      tiers: []

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: false
  dsl_notify_sl_updates: false
  action_lifecycle: false
