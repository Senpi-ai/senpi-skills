name: turbine-hunt-tracker
version: 1.0.0
description: >
  TURBINE v3.0 — HUNT runtime (HYPE 4H momentum, 2 slots, ratchet exit).
  One of TWO runtimes Turbine v3.0 attaches to the strategy wallet
  (sibling: turbine-volume-tracker). Mission: ride HYPE 4H breakouts
  with score-gated entries (>=10 floor on multi-axis confluence).
  Distinct asset (HYPE only) + distinct timescale (4h holds) from
  VOLUME mode → clean per-mode P&L attribution.

  Sentinel sunset: this runtime takes over Sentinel's role with
  explicit slot accounting in the producer.

strategy:
  wallet: "${TURBINE_HUNT_WALLET}"
  budget: 2400
  slots: 2
  margin_per_slot: 1200
  trading_risk: balanced
  default_leverage: 5
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 25
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: true
    max_consecutive_losses: 3
    cooldown_minutes: 30
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 60

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: turbine_hunt_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        mode: { type: string, required: true }                 # "HUNT"
        thesis: { type: string, required: true }               # "hype_4h_momentum"
        score: { type: number, required: true }                # >=10 floor
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: true }
        spreadBps: { type: number, required: false }
        fundingRegime: { type: string, required: false }
        reasons: { type: string, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: turbine_hunt_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${TURBINE_HUNT_DECISION_MODEL}"
    scanners: [turbine_hunt_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: false
        execution_timeout_seconds: 60
    context:
      - type: signal
        scanner: turbine_hunt_signals
    decision_prompt: |
      You are Turbine HUNT's pass-through gate. The producer applied every
      filter (HYPE-only, score >= 10 floor, spread gate, held-asset check,
      hunt-cooldown, account-equity floor). Honor the signal, convert to
      OPEN_POSITION.

      SIGNAL:
      {{signal_turbine_hunt_signals}}

      Output execute: true UNLESS:
        - mode != "HUNT"
        - asset != "HYPE"
        - score < 10
        - leverage <= 0 OR marginUsd <= 0

      Confidence always 7.

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": 7,
        "reasoning": "HYPE + direction + score + reasons",
        "payload": {
          "signals": [
            {
              "asset": "HYPE",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "turbine hunt — hype 4h momentum"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 240
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 90
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 120
    phase1:
      enabled: true
      max_loss_pct: 30.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 0  }
        - { trigger_pct: 10, lock_hw_pct: 35 }
        - { trigger_pct: 20, lock_hw_pct: 55 }
        - { trigger_pct: 35, lock_hw_pct: 75 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
