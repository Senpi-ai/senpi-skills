name: horribilis-tracker
version: 2.1.0
description: >
  BTC Contrarian Sniper v2.1 — sniper recalibration. Fades exhausted SM
  consensus moves on BTC. v2.1: MIN_SCORE raised 8→10 (Cheetah v5.1 APEX
  pattern), MIN_EXHAUSTION_PCT raised 2.5→4.5 (Dog v2.2 fix — stops
  fighting fresh trends), pyramid scale-up bar raised 9→12 (apex only).
  7x at score 10-11, 10x at score 12+. 50% margin per trade.

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 1
  margin_per_slot: 500
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 360
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 120
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 90
    phase1:
      enabled: true
      max_loss_pct: 25.0
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        # Phase 2 tiers — leverage-aware for BTC (fleet audit April 2026)
        - { trigger_pct: 8,  lock_hw_pct: 25 }
        - { trigger_pct: 15, lock_hw_pct: 50 }
        - { trigger_pct: 25, lock_hw_pct: 65 }
        - { trigger_pct: 35, lock_hw_pct: 80 }
        - { trigger_pct: 50, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
