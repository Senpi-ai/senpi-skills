name: jaguar-tracker
# Runtime SCHEMA version must be major=1 per the senpi-trading-runtime
# plugin. Strategy/skill is "Jaguar v4.0.0" — lives in description +
# SKILL.md + _jaguar_producer_version. Do not set this to 4.x.x.
version: 1.0.1
description: >
  JAGUAR v4.0.0 — Striker (rank-jump detector), senpi_runtime_helpers
  migration. Plumbing-only flip from openclaw-CLI subprocess + mcporter
  subprocess + cron-driven self-executing scanner to in-process
  SenpiClient + long-lived producer_daemon + helpers-native push_signal.
  Thesis preserved verbatim from v3.7: violent FIRST_JUMP signals,
  STRIKER_MIN_RANK_JUMP=10, MIN_SCORE=9, conviction-scaled leverage
  (10x apex / 7x conviction), 15m velocity hard gate, $3M day-notional
  liquidity floor, XYZ ban, one-amazing-trade-per-day discipline.
  Producer no longer calls create_position — runtime owns execution
  via LLM-pass-through gate + risk.guard_rails + DSL.

  Jaguar v3.7 — runtime risk.guard_rails: cap losers, ride winners
  (preserved verbatim in v4.0.0). v3.4 + v3.5 + v3.6 opened the
  floodgates (7 entries in 90 min on 2026-05-06 vs original "1
  amazing trade per day" striker thesis). v3.7 moved entry-cap
  policy to the RUNTIME via risk.guard_rails:
    - max_entries_per_day: 3 (hard cap when day is RED)
    - bypass_max_entries_per_day_on_profit: true (no cap when GREEN)
    - daily_loss_limit_pct: 10 (catastrophic intraday halt)
    - drawdown_halt_pct: 25 (lifetime circuit breaker)
    - max_consecutive_losses: 3 + cooldown_minutes: 60
    - per_asset_cooldown_minutes: 120 (matches Jaguar's existing cooldown)
  Discipline: top 3 by score per day when losing. When winning today,
  no cap — let the hot hand ride.

  Jaguar v3.6 / v3.5 / v3.4 plumbing notes (resolved in v4.0.0):
    - Producer-Python dedup (held ∪ pending) no longer needed — runtime
      per_asset_cooldown_minutes + the runtime's own held-position
      check own duplicate prevention.
    - Per-asset leverage clamp still applied inside the producer
      (get_safe_leverage) before signal emission, so the LLM gate's
      leverage echo is venue-safe.
    - $3M day-notional liquidity floor (silent-None fix) preserved
      verbatim.

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 2
  margin_pct: 50        # % of account budget per slot (scales with any budget)
  trading_risk: aggressive
  enabled: true

# ── RISK GUARD RAILS (v3.7 — preserved verbatim) ──
# Authoritative entry-cap layer. Producer's old Python
# get_dynamic_daily_cap is fully removed in v4.0.0; runtime owns gate.
#
# Policy: cap losers, ride winners.
#   - When today's PnL > 0 → bypass max_entries_per_day → unlimited entries
#   - When today's PnL ≤ 0 → enforce max 3/day → top 3 by score, then stop
#
# Per-asset cooldown 120min preserves Jaguar's existing same-coin throttle.
# drawdown_reset_on_day_rollover: false avoids cross-day-reset leak.
risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 3
    bypass_max_entries_per_day_on_profit: true
    max_consecutive_losses: 3
    cooldown_minutes: 60
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 120

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: jaguar_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        tier: { type: string, required: true }
        leverage: { type: number, required: true }
        marginUsd: { type: number, required: false }
        marginPct: { type: number, required: false }
        reasons: { type: array, required: true }
        mode: { type: string, required: false }
        currentRank: { type: number, required: false }
        rankJump: { type: number, required: true }
        isFirstJump: { type: boolean, required: false }
        contribVelocity: { type: number, required: false }
        contrib15m: { type: number, required: false }
        contrib1h: { type: number, required: false }
        volRatio: { type: number, required: false }
        smPct: { type: number, required: false }
        smTraders: { type: number, required: false }
        priceChange4hPct: { type: number, required: false }
        dayNotionalUsd: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: jaguar_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${JAGUAR_DECISION_MODEL}"  # REQUIRED. Bare model name only — NO provider prefix. INVALID: "<provider>/<model>" (e.g. "google/...", "anthropic/...", "openai/...") — OpenClaw double-prefixes → 500 Unknown model. The LLM gate is a pass-through rubber-stamp (producer already applied every filter); any reliable structured-JSON model works. No default by design — operators pick their own.
    scanners: [jaguar_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true    # 2026-05-21: comment said "fall through to taker on timeout" but false does NOT do that — it leaves the order resting (CREATE_ORDER_RESTING) and the position never opens. Striker NEEDS the violent-jump entry; true delivers the intended taker fallback.
        execution_timeout_seconds: 30
    context:
      - type: signal
        scanner: jaguar_signals
    decision_prompt: |
      You are Jaguar's pass-through gate. The producer has already
      applied EVERY filter (rank-jump ≥ 10, prev-rank ≥ 20, 4h
      direction alignment, 15m velocity > 0, reason-count ≥ 3,
      MIN_SCORE 9, $3M day-notional liquidity floor, XYZ ban, per-
      asset leverage clamp). Your job is to honor the signal unless
      something is structurally broken.

      SIGNAL:
      {{signal_jaguar_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. The `asset` in your output payload MUST be the exact value from
         the signal's `asset` field. Preserve case (kBONK, kPEPE).
      2. The `direction` MUST match the signal's `direction` field exactly.
      3. The `leverage` MUST be copied from the signal's `data.leverage`
         field exactly (typically 7 or 10 by conviction tier; pre-clamped
         to per-asset HL max by the producer).
      4. The `marginUsd` MUST be copied from the signal's `data.marginUsd`
         field exactly (producer sized as 50% of account value).
      5. Every claim in `reasoning` MUST cite values from the signal
         payload — score, rankJump, contrib15m, etc. Do not fabricate.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 9 (producer should filter; defensive only)
      - rankJump < 10 (producer should filter; defensive only)
      - leverage <= 0 OR marginUsd <= 0 (malformed)
      - heldAssets already contains this exact asset (duplicate position)
      - reasons array empty (malformed signal)

      ## JAGUAR'S THESIS

      Striker = "one amazing trade per day." Rank-jump detector catches
      violent FIRST_JUMP signals — asset rocketing from rank 20+ into
      the top 10 with ≥10 rank jump. Rare but high-conviction. The
      producer is the filter; the LLM is a sanity check, not a
      second-guessing layer. Be permissive unless something is
      structurally broken.

      ## CONFIDENCE SCORING

      - 9-10: score ≥ 11 AND FIRST_JUMP AND (15M_STRONG_SPIKE or
        HIGH_VELOCITY) — apex setup
      - 8: score 10 AND FIRST_JUMP AND 15M_SPIKE+ — conviction setup
      - 7: score 9 — cautious setup; producer's MIN_SCORE floor.
        Honor it unless a hard-skip applies.
      - <7: producer floor not cleared — should never reach you.

      Minimum confidence to execute is 7.

      ## OUTPUT FORMAT

      Return JSON. The `leverage` and `marginUsd` fields must come from
      the signal payload — this enforces Jaguar's conviction-tier sizing
      instead of letting the runtime fall back to defaults.

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values — e.g. 'score 11 LONG on HEMI, FIRST_JUMP #28->#7, rankJump 21, 15m velocity +2.4 STRONG_SPIKE, deep SM 38 traders'",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY (preserve case)",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "marginUsd": "copy signal.data.marginUsd EXACTLY",
              "reason": "score N STRIKER ASSET DIR — top reason"
            }
          ]
        }
      }

# ── EXIT (DSL) ──
# Striker trades are violent short-term explosions. Tight DSL: 45min
# hard timeout, 12min dead weight, wide Phase 1 for volatility.
# Preset preserved verbatim from v3.7.
exit:
  engine: dsl
  interval_seconds: 30
  # v3.0+ KEY WIN — maker-preferred exits via FEE_OPTIMIZED_LIMIT.
  # HL taker is 0.045%, maker is 0.015% — saves ~0.020-0.030% per
  # exit when ALO crosses the book within timeout.
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 45
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 25
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 12
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 7,  lock_hw_pct: 40 }
        - { trigger_pct: 12, lock_hw_pct: 55 }
        - { trigger_pct: 15, lock_hw_pct: 75 }
        - { trigger_pct: 20, lock_hw_pct: 85 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
