name: jaguar-tracker
version: 3.1.0
description: >
  Jaguar v3.1 — Striker-only. Fleet-hardened. Scanner handles execution
  internally. DSL managed by plugin runtime.

# ── STRATEGY ──
strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

# ── SCANNERS ──
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

# ── ACTIONS ──
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ── EXIT (DSL) ──
# Striker trades are violent short-term explosions.
# Tight DSL: 45min hard timeout, 12min dead weight, wide Phase 1 for volatility.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 45
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 25
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 12
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 7,  lock_hw_pct: 40 }
        - { trigger_pct: 12, lock_hw_pct: 55 }
        - { trigger_pct: 15, lock_hw_pct: 75 }
        - { trigger_pct: 20, lock_hw_pct: 85 }

# ── NOTIFICATIONS ──
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
