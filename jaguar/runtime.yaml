name: jaguar-tracker
version: 3.4.0
description: >
  Jaguar v3.5 — per-asset leverage clamp fix.
  Live failure 2026-05-06: XMR LONG at score 10 tried 10x; HL rejected
  with "Max leverage for XMR is 5, got 10." Producer was picking
  leverage from conviction tier without clamping to per-asset HL max.
  Other fleet agents (Wolverine, Grizzly, Cheetah) all use the same
  get_safe_leverage() pattern that queries strategy_get_asset_trading_limits
  and clamps to min(desired, asset_max, MAX_LEVERAGE). v3.5 ports that
  pattern to Jaguar. Affected assets: XMR, kBONK, kPEPE-class small
  caps, and any HIP-3 instrument with HL caps below the fleet 10x
  ceiling. Without this fix ~5-10% of striker signals silently fail
  at execute_entry without retry. Other striker logic unchanged.

  Jaguar v3.4 — Striker-only (ACTUAL dormancy root cause found).
  v3.3 widened striker gates but live diag revealed CHIP SHORT (score 11)
  and XMR SHORT (score 9) both got valid signals through — only to be
  100% rejected by `vol_ratio < 1.5`. The API doesn't emit `vol_ratio` /
  `avg_volume` fields, so the scanner silently defaulted to 0 → rejected
  every candidate. Silent-None bug family (same as Pangolin v1.5 +
  Dog v2.4 funding_history). v3.4 replaces the hard ratio gate with an
  absolute day_notional_volume ≥ $3M floor + soft vol_ratio bonus when
  data is genuinely present. Preserves intent; doesn't fail-closed.

# ── STRATEGY ──
strategy:
  wallet: "${WALLET_ADDRESS}"
  enabled: true

# ── SCANNERS ──
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

# ── ACTIONS ──
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ── EXIT (DSL) ──
# Striker trades are violent short-term explosions.
# Tight DSL: 45min hard timeout, 12min dead weight, wide Phase 1 for volatility.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 45
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 25
      min_value: 3.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 12
    phase1:
      enabled: true
      max_loss_pct: 15.0
      retrace_threshold: 8
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 7,  lock_hw_pct: 40 }
        - { trigger_pct: 12, lock_hw_pct: 55 }
        - { trigger_pct: 15, lock_hw_pct: 75 }
        - { trigger_pct: 20, lock_hw_pct: 85 }

# ── NOTIFICATIONS ──
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
