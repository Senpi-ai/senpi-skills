name: owl-tracker
# Note: top-level `version` is the SCHEMA version the
# senpi-trading-runtime plugin expects (must be major=1). The
# STRATEGY/skill is "Owl v7.0" — that lives in description, SKILL.md,
# and _owl_producer_version. Using version: 7.x at runtime level is
# rejected by the plugin as "Unsupported version: 7.x". Keep this at
# 1.x.x forever.
version: 1.7.0
description: >
  OWL v7.0 — Pure Contrarian (v2-runtime-native rewrite).

  Mission: enter AGAINST the crowd when crowding persists 1+ hour AND
  exhaustion signals fire (volume declining, price stalling, RSI
  divergence). Crowded trades unwind violently; Owl's edge is timing
  the unwind by waiting for both the crowd state AND the exhaustion
  trigger.

  v7.0 architectural changes (no thesis change from v6.2):
    - Producer (owl-producer.py) emits contrarian-fade signals via
      `openclaw senpi external-scanner ingest`. NO execution code.
    - Runtime LLM (configured via decision_model env var) is a
      pass-through gate — producer has already applied every filter
      (crowding score >= 6 with persistence >= 1h, exhaustion score
      >= 5 with >= 2 distinct signals, combined score >= 12, asset
      cooldown, post-loss cooldown, dynamic daily cap based on PnL).
    - Maker entries via FEE_OPTIMIZED_LIMIT with ensure_execution_as_taker=false:
      contrarian unwinds aren't urgent at the moment of detection
      (they take hours to develop). If maker can't fill in 60s, skip.
    - Maker exits via FEE_OPTIMIZED_LIMIT with ensure_execution_as_taker=true:
      taker fallback as safety floor — contrarian entries retrace
      hard before working, so when DSL fires Phase 1 stops the exit
      MUST happen.
    - Risk gates declarative — runtime.guard_rails owns enforcement,
      producer is signal-only.
    - DSL exit preserved verbatim from v6.2: hard_timeout 480min,
      weak_peak_cut 120min @ 2.0, dead_weight_cut 30min, Phase 1
      max_loss 35% / 3-breach (wide tolerance for retrace), Phase 2
      6-tier ladder starting at 5% trigger (Lemon-pattern first leg
      capture).

  v6.x changes preserved:
    - v6.0: minPersistHours 4 → 1, entry.minScore 14 → 12
    - v6.0: Phase 2 first tier 10% → 5% trigger (Lemon-pattern)
    - v6.0: dead_weight_cut 45 → 30 min
    - v6.1: universe expansion — ALL assets with OI > $3M (was top 30)
    - v6.2: minCrowdingScore 8 → 6 (persistence-gate unblocking)

# ── STRATEGY ──
strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 250
  trading_risk: moderate
  default_leverage: 8                            # conviction-scaled in producer (7/8/10 by score)
  enabled: true

# ── RISK GUARDRAILS ──
# Declarative — runtime enforces. Producer ALSO enforces a dynamic
# PnL-aware daily cap (v6.x dynamicSlots: 2 base, 3 at +$150, 4 at +$400)
# and post-loss 6h asset cooldown.
risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 10                     # contrarian thesis tolerates short-term losses
    max_entries_per_day: 4                       # upper bound of v6 dynamicSlots (4 at +$400 PnL)
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 4
    cooldown_minutes: 0                          # producer manages cooldowns
    drawdown_halt_pct: 25                        # v6.2 explicit -25% HARD STOP
    drawdown_reset_on_day_rollover: true
    per_asset_cooldown_minutes: 360              # 6h post-loss (v6 spec)

# ── SCANNERS ──
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: owl_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        # Required identity
        score: { type: number, required: true }                       # composite crowding + exhaustion (>= 12 floor)
        leverage: { type: number, required: true }                    # producer-asserted (7/8/10 by score)
        marginUsd: { type: number, required: true }                   # producer-asserted
        crowdDirection: { type: string, required: true }              # what the crowd is positioned (LONG / SHORT)
        crowdingScore: { type: number, required: true }               # sub-score
        exhaustionScore: { type: number, required: true }             # sub-score
        persistenceHours: { type: number, required: true }            # how long crowding has persisted
        # Optional enrichment
        fundingAnnualizedPct: { type: number, required: false }
        smTilt: { type: number, required: false }                     # % deviation from 50
        smLongPct: { type: number, required: false }
        oiUsd: { type: number, required: false }
        priceChg4hPct: { type: number, required: false }
        rsi4h: { type: number, required: false }
        peakCrowdingScore: { type: number, required: false }
        exhaustionSignals: { type: string, required: false }          # joined " | "
        reasons: { type: string, required: false }                    # joined " | "

# ── ACTIONS ──
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: owl_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${OWL_DECISION_MODEL}"  # REQUIRED. Pass BARE model name only — NO provider prefix. INVALID: "google/gemini-3.1-pro-preview" (OpenClaw double-prefixes → 500 Unknown model). The LLM gate here is a pass-through rubber-stamp (producer already applied every filter); the cheapest model that reliably returns structured JSON wins. No default by design.
    scanners: [owl_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: false         # ENTRIES: cancel-and-skip if maker can't fill in 60s. Contrarian unwinds aren't urgent at detection time.
        execution_timeout_seconds: 60            # Jackal v2.0.6 / Roach v2.0 standard
    context:
      - type: signal
        scanner: owl_signals
    decision_prompt: |
      You are Owl's pass-through gate. The producer has already applied
      every filter (crowding score >= 6 with persistence >= 1h,
      exhaustion score >= 5 with >= 2 distinct signals, combined score
      >= 12, asset not in cooldown, dynamic daily cap not exceeded,
      direction is opposite of the crowd). Your job is simply to honor
      the signal and convert it to an OPEN_POSITION.

      SIGNAL:
      {{signal_owl_signals}}

      ## RULES

      1. Output execute: true UNLESS one of these hard skips applies:
         - score < 12 (signal failed producer floor — should never reach you, defensive only)
         - leverage <= 0 OR marginUsd <= 0 (malformed signal)
         - leverage > 10 (defensive — Owl caps at 10x)
         - persistenceHours < 1 (defensive — producer should never emit)
         - direction equals crowdDirection (CRITICAL: Owl is contrarian.
           If the signal direction matches the crowd direction, the
           producer made a mistake and we should NOT execute)

      2. The `asset` field MUST be copied EXACTLY from the signal.

      3. The `direction` MUST match the signal's `direction` field.
         The direction is the OPPOSITE of `crowdDirection` — Owl fades
         the crowd. Producer sets this; LLM just copies.

      4. Confidence should always be 7 unless a hard skip fires, in
         which case output execute: false with a reason. Owl's thesis
         IS quantitative — no confidence gradation.

      ## OUTPUT FORMAT

      Return JSON with this exact shape. The `leverage` and `marginUsd`
      fields MUST be copied from the signal's `data` block (the producer
      asserts them there) — this enforces Owl's spec sizing instead of
      letting the runtime fall back to HL's per-asset defaults.

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": 7,
        "reasoning": "one-liner citing asset + fade direction + crowding score + persistence hours + exhaustion signals",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY",
              "direction": "copy signal.direction EXACTLY (opposite of crowdDirection)",
              "leverage": "copy signal.data.leverage EXACTLY (7, 8, or 10 by score)",
              "marginUsd": "copy signal.data.marginUsd EXACTLY (~25% of account value)",
              "reason": "owl contrarian unwind"
            }
          ]
        }
      }

# ── EXIT (DSL with maker-exit recovery) ──
#
# Owl is patient on entries (1h persistence required) but contrarian
# entries retrace hard before working. DSL phase 1 max_loss 35% gives
# the thesis room to develop. Phase 2 starts at 5% (Lemon-pattern
# first-leg capture) because the unwind's first leg is reliable but
# extensions to 50%+ are rare — lock early, trail aggressively.
#
# v6.x DSL preserved verbatim (proven in production):
#   hard_timeout 480min — 8h max hold; if no unwind by then, thesis dead
#   weak_peak_cut 120min @ 2.0 — if peak ROE < 2% in first 2h, cut
#   dead_weight_cut 30min — Lemon-pattern faster loser cut
#   phase1: max_loss 35%, retrace 15, 3 breaches — wide for contrarian retrace
#   phase2: 5/20, 10/35, 20/50, 35/65, 50/78, 75/88 (six-tier ladder)
exit:
  engine: dsl
  interval_seconds: 30
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true              # EXITS: taker fallback as safety. Phase 1 stops at 35% ROE = real trouble; exits MUST happen.
    execution_timeout_seconds: 60                # Jackal v2.0.6 / Roach v2.0 standard
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480                   # 8h max — contrarian thesis unwind window
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 120
      min_value: 2.0                             # peak ROE floor; below this in 2h = thesis failed
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 30                    # v6.0 Lemon-pattern fast loser cut
    phase1:
      enabled: true
      max_loss_pct: 35.0                         # wide — contrarian entries retrace hard before working
      retrace_threshold: 15
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 20 }   # v6.0 first-leg capture (Lemon-pattern)
        - { trigger_pct: 10, lock_hw_pct: 35 }
        - { trigger_pct: 20, lock_hw_pct: 50 }
        - { trigger_pct: 35, lock_hw_pct: 65 }
        - { trigger_pct: 50, lock_hw_pct: 78 }
        - { trigger_pct: 75, lock_hw_pct: 88 }   # rare but happens — full unwind cascade

# ── NOTIFICATIONS ──
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
