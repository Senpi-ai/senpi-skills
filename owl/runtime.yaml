name: owl-strategy
version: 6.2.0
description: >
  OWL v6.2 — Persistence-gate unblocking (2026-04-24). v6.1 was still
  dormant: scanner evaluated 103 assets correctly but persistence timer
  never started because minCrowdingScore=8 was structurally unreachable
  without extreme funding >60%. Peak observed scores were 6-8 with rare
  8s, dropping to 7 immediately, which cleared the timer. Fix: drop
  minCrowdingScore 8 → 6 so assets can START the 1h persistence timer.
  entry.minScore=12 kept as the unchanged execution gate — when an
  asset eventually DOES crowd into 12+, it'll already have persistence
  banked. Diagnostic from Owl agent on 2026-04-24 confirmed: without
  this fix, entry was mathematically impossible.

  OWL v6.1 — Pure Contrarian (universe expansion). Monitors crowding across
  ALL assets with OI > $3M (v6.1 — was top 30 only in v6.0). Funding
  extremity + SM tilt + OI concentration signals. When crowding persists
  1+ hour AND exhaustion signals fire (volume declining, price stalling,
  RSI divergence), enters AGAINST the crowd to ride the liquidation unwind.
  v6.1 removes the top-30 OI truncation that was blinding Owl to mid-cap
  extreme-funding setups (ZEC/MON/LIT hit >1000% annualized at probe time
  but were filtered out). v6.0 fixed the over-gated Owl: minPersistHours
  reduced 4→1 and entry.minScore reduced 14→12. DSL Phase 2 locks first
  leg at 5% ROE (Lemon-pattern learning).

strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 250
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# DSL High Water Mode — mandatory per Owl's contrarian thesis.
# Contrarian entries retrace hard before working. Wide early phases,
# tighter late to protect unwind profits.
# Spec: dsl-dynamic-stop-loss/dsl-high-water-spec 1.0.md
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 480
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 120
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 30    # v6.0: 45 → 30 (faster loser cut, Lemon-pattern inspired)
    phase1:
      enabled: true
      max_loss_pct: 35.0          # Kept wide — contrarian entries retrace hard before working
      retrace_threshold: 15
      consecutive_breaches_required: 3
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 20 }   # v6.0: 10 → 5 (capture first leg of unwind like Lemon)
        - { trigger_pct: 10, lock_hw_pct: 35 }   # v6.0: new intermediate tier
        - { trigger_pct: 20, lock_hw_pct: 50 }
        - { trigger_pct: 35, lock_hw_pct: 65 }
        - { trigger_pct: 50, lock_hw_pct: 78 }
        - { trigger_pct: 75, lock_hw_pct: 88 }

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
