name: vulture-tracker
# Runtime SCHEMA version must be major=1 per the senpi-trading-runtime
# plugin. Strategy/skill is "Vulture v3.0.0" — lives in description +
# SKILL.md + _vulture_producer_version. Do not set this to 3.x.x.
version: 1.0.0
description: >
  VULTURE v3.0.0 — Long-Tail Momentum Rider, v2-runtime-native rewrite.

  v2.x was a full-agency scanner: scored signals, tracked entries, managed
  asset cooldowns + dynamic slots, called create_position directly. The
  cfg.set_cooldown silent crash blew out telemetry on 27 trades — couldn't
  diagnose which scoring components produced winners vs losers.

  v3.0 flips to producer + v2 runtime (Scorpion v4.x / Roach v2.x pattern):
    - Producer (vulture-producer.py) emits LONG_TAIL_MOMENTUM signals via
      `openclaw senpi external-scanner ingest`. NO execution code. NO
      counters. NO cooldowns. NO dynamic-slot bookkeeping.
    - LLM gate is pass-through (Roach pattern) — producer has applied
      every filter (SM/4h/1h/15m hard gates, 1h-alignment fix, regime
      alignment, persistence). LLM only catches malformed signals.
    - risk.guard_rails ENFORCES max_entries_per_day, daily_loss_limit,
      max_consecutive_losses, drawdown_halt, per_asset_cooldown, cooldown.
      No Python state to crash.
    - DSL uses FEE_OPTIMIZED_LIMIT on entries AND exits — saves ~0.020%
      per maker-filled close vs v2.x MARKET orders. At ~3 trades/day
      this is ~$10-15/week in recovered fees.
    - Trade chain DB emits LIFECYCLE / DECISION_EXECUTED / ACTION_RESULT /
      DSL_CREATED / DSL_CLOSED for every trade. Telemetry restored —
      can finally see per-trade scores, peak ROE, close reasons.

  v2.4 architectural fixes preserved:
    - 1h-alignment hard gate (catches "4h up + 1h rejecting + 15m spike"
      false breakouts; diagnosed Apr 27 from the dead_weight_cut pattern)
    - FP-001 quiet hours (00-04 UTC unless apex score 11+)
    - FP-002 hard rule in SKILL.md (user-conversation Claude sessions
      are read-only — only producer cron + DSL engine are write paths)

  v2.3 DSL preset preserved (proved correct on the live ZEC LONG —
  +22.8% margin ROE, T0 lock fired venue stop at $347.17). DSL phase 2
  ladder unchanged.

  Thesis preserved: 25+ small/mid-cap Hyperliquid perps that no other
  predator scans. SM direction + confluence (4h trend + 1h alignment +
  15m velocity + regime + persistence) as entry signal. Hold winners
  for days via 7-day hard_timeout, cut losers fast via 90-min
  dead_weight_cut. 38% WR target with 6.15x profit factor.

strategy:
  wallet: "${WALLET_ADDRESS}"
  slots: 2
  margin_per_slot: 400
  trading_risk: moderate
  enabled: true

risk:
  data_retention_hours: 72
  guard_rails:
    daily_loss_limit_pct: 10
    max_entries_per_day: 6
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_minutes: 30
    drawdown_halt_pct: 25
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_minutes: 240   # 4h — preserves v2.x sniper cadence

scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

  - name: vulture_signals
    type: external_scanner
    outputs:
      signals: true
      context: false
    config:
      fields:
        score: { type: number, required: true }
        tier: { type: string, required: true }
        leverage: { type: number, required: true }
        reasons: { type: array, required: true }
        smPct: { type: number, required: true }
        smTraders: { type: number, required: true }
        priceChange4hPct: { type: number, required: true }
        priceChange1hPct: { type: number, required: true }
        priceChange15mPct: { type: number, required: false }
        contribChange15m: { type: number, required: false }
        contribChange1h: { type: number, required: false }
        contribChange4h: { type: number, required: false }
        fundingRegime: { type: string, required: false }
        persistenceHours: { type: number, required: false }
        heldAssets: { type: array, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

  - name: vulture_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: "${VULTURE_DECISION_MODEL}"  # REQUIRED. Pass BARE model name only — NO provider prefix. Valid: "gemini-2.5-pro", "claude-sonnet-4-20250514". INVALID: "google/gemini-2.5-pro" (OpenClaw double-prefixes → 500 Unknown model). No default by design.
    scanners: [vulture_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60      # Match Scorpion v4.0.2 fix — 60s lets ALO catch a mild retracement before falling to taker
    context:
      - type: signal
        scanner: vulture_signals
    decision_prompt: |
      You are Vulture's pass-through gate. The producer has already
      applied EVERY filter (SM concentration ≥3%/15 traders, 4h price
      alignment ≥1%, 1h alignment ≥0.1%, 15m velocity ≥0.3, banned-
      assets check, XYZ ban, regime-alignment scoring, persistence
      lookup). Your job is to honor the signal unless something is
      structurally broken.

      SIGNAL:
      {{signal_vulture_signals}}

      ## STRICT OUTPUT RULES — DO NOT VIOLATE

      1. The `asset` in your output payload MUST be the exact value from
         the signal's `asset` field. Preserve case (kBONK, kPEPE).
      2. The `direction` MUST match the signal's `direction` field exactly.
      3. The `leverage` MUST be copied from the signal's `data.leverage`
         field exactly (typically 3, 5, or 7 by conviction tier).
      4. Every claim in `reasoning` MUST cite values from the signal
         payload — score, smPct, p4h, p1h, c15m, regime, etc. Do not
         fabricate.

      ## HARD SKIP CONDITIONS (output execute: false)

      - score < 7 (producer should filter; defensive only)
      - leverage <= 0 OR signal data missing (malformed)
      - heldAssets already contains this exact asset (duplicate position)
      - reasons array empty (malformed signal)

      ## VULTURE'S THESIS

      Long-tail momentum on small/mid-cap Hyperliquid perps. 38% WR
      target with 6.15x profit factor — most trades are small losses
      cut fast via 90-min dead_weight_cut, occasional right-tail winners
      pay for everything. The producer is calibrated for THIS expectancy
      profile. Don't add subjective second-guessing.

      ## CONFIDENCE SCORING

      - 9-10: score >= 11 (apex tier, 7x leverage) AND HEAVY_FLOW or
        STRONG_FLOW AND TREND_RUNNING/STRONG AND ACCELERATING
      - 7-8: score >= 9 (conviction tier, 5x leverage) AND at least
        STRONG_FLOW AND TREND_BUILDING+ AND 15M_BUILDING+
      - 7: score 7-8 (cautious tier, 3x leverage) — producer has
        gated this; the signal IS the validation. Honor it unless
        a hard-skip applies.
      - <7: producer floor not cleared — should never reach you.

      Minimum confidence to execute is 7. The strategy needs the volume
      of attempts to hit the right tail. Be permissive unless something
      is structurally broken.

      ## OUTPUT FORMAT

      Return JSON. The `leverage` and `marginUsd` fields must come from
      the signal payload — this enforces Vulture's conviction-tier sizing
      instead of letting the runtime fall back to defaults.

      {
        "execute": true OR false,
        "actionType": "OPEN_POSITION",
        "confidence": integer 1-10,
        "reasoning": "concrete sentence citing signal values — e.g. 'score 9 LONG on HYPE, 4h +5.2%, SM 14.3% with 67 traders, 15m velocity +1.8 ACCELERATING, regime LONG_CROWDED aligned'",
        "payload": {
          "signals": [
            {
              "asset": "copy signal.asset EXACTLY (preserve case)",
              "direction": "copy signal.direction EXACTLY",
              "leverage": "copy signal.data.leverage EXACTLY",
              "reason": "score N LONG_TAIL_MOMENTUM ASSET DIR — top reason"
            }
          ]
        }
      }

exit:
  engine: dsl
  interval_seconds: 30
  # v2.x KEY WIN — maker-preferred exits via FEE_OPTIMIZED_LIMIT.
  # HL taker is 0.045%, maker is 0.015% — saves ~0.020-0.030% per
  # exit when ALO crosses the book within timeout.
  order_type: FEE_OPTIMIZED_LIMIT
  fee_optimized_limit_options:
    ensure_execution_as_taker: true
    execution_timeout_seconds: 60
  # DSL preset preserved from v2.3 — proved correct on the live ZEC
  # LONG (+22.8% margin ROE; T0 lock fired venue stop at $347.17).
  # Tier ladder is a 38%-WR-strategy compromise: tight T0 catches
  # tiny winners early, T1/T2/T3 ramp protection on actual runners.
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080         # 7 days — small-cap winners hold for days
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 180            # 3h
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 90             # 90min — fast cut on no-movement
    phase1:
      enabled: true
      max_loss_pct: 25.0                  # 25% margin loss = ~5% price at 5x; small-cap volatility
      retrace_threshold: 15
      consecutive_breaches_required: 2
    phase2:
      enabled: true
      tiers:
        # v2.3 ladder — proved correct on live ZEC. T0 wide for small-cap
        # early-wick tolerance; T2 pre-arm at 40% peak (was 50% in v2.2).
        # v3.0.1: dropped v2.x's T5 (trigger_pct 150) — v2 runtime
        # validator enforces 0 < trigger_pct <= 100, so the >100 tier is
        # rejected. T4 (100/85) becomes the apex; monster-winner scenario
        # (peak >>100% margin ROE) still gets the same 85% × peak lock.
        - { trigger_pct: 15,  lock_hw_pct: 20 }   # Tier 0 — small-cap early lock
        - { trigger_pct: 30,  lock_hw_pct: 60 }   # Tier 1 — winner forming
        - { trigger_pct: 40,  lock_hw_pct: 75 }   # Tier 2 — pre-armed (v2.3)
        - { trigger_pct: 75,  lock_hw_pct: 75 }   # Tier 3 — runner protection
        - { trigger_pct: 100, lock_hw_pct: 85 }   # Tier 4 — apex (v3.0.1: now the final tier)

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dsl_lifecycle: true
  dsl_notify_sl_updates: false
  action_lifecycle: true
