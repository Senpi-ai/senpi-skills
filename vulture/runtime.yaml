name: vulture-tracker
version: 2.3.0
description: >
  VULTURE v2.3 — Long-Tail Momentum Rider (tier 2 pre-arm for winners).
  v2.3 drops tier 2's trigger from 50% → 40% peak ROE. Once a winning
  position climbs past 40% peak, it immediately graduates to tier 2's
  75% lockHwPct (from tier 1's 60%) — 30% floor instead of 24% at a
  40% peak, or 37.5% floor at 50% peak. This compresses the "tier 1
  upper band" (30-40% peak) that previously let strong winners give
  back too much as they ratcheted through. Tier 0 stays wide (15/20 →
  +3% floor) for small-cap early-wick tolerance.
  v2.2 established 60% / 75% lockHwPct on tiers 1 / 2. v2.3 preserves
  those lock values; only tier 2's trigger threshold moves.
  Hard_timeout (7 days), dead_weight_cut (90 min), and weak_peak_cut
  (180 min @ 2%) are unchanged from v2.1 by design — those belong to
  the "let winners breathe" experiment. Phase 1 also unchanged.
  Scans 25+ small/mid-cap Hyperliquid perps (HEMI, WLD, MON, XPL,
  AIXBT, ARB, ASTER, ZEC, LIT, TAO, etc.). Built from the #1 Arena
  winner's playbook. Max 2 positions, 5-7x leverage.

# ── STRATEGY ──
strategy:
  wallet: "${WALLET_ADDRESS}"
  budget: 1000
  slots: 2
  margin_per_slot: 400
  enabled: true

# ── SCANNERS ──
scanners:
  - name: position_tracker
    type: position_tracker
    interval: 10s

# ── ACTIONS ──
actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]

# ── EXIT (DSL) — v2.3 tier 2 pre-arm for winners ──────────────────
# v2.2 established the mid-tier tightening (60% / 75% lockHwPct on
# tier 1 / tier 2). v2.3 adjusts tier 2's trigger threshold: 50% → 40%
# peak ROE. This compresses the "tier 1 upper band" (previously 30-50%
# peak) down to 30-40% peak. Once a position climbs past 40% peak, it
# immediately graduates to tier 2's 75% lock instead of staying in
# tier 1's 60% lock until 50%.
#
# Math impact on a winning position:
#   At 40% peak: floor was 24% ROE (60% × 40%), now 30% ROE (75% × 40%)
#   At 45% peak: floor was 27% ROE (tier 1 band), now 33.75% ROE (tier 2)
#   At 50% peak: floor was 37.5% ROE (tier 2 arming), unchanged
#
# Zero fee delta — tier lockHwPct changes only move where Phase 2 exits
# fire on retracing winners, not entry/exit frequency.
#
# Tier 0 (15/20) preserved for small-cap early-wick tolerance. Timeouts,
# cuts, and Phase 1 retrace are unchanged from v2.1 — those belong to
# the "let winners breathe" experiment.
exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080    # 7 days — UNCHANGED from v2.1 (experiment)
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 180       # UNCHANGED from v2.1 (experiment)
      min_value: 2.0
    dead_weight_cut:
      enabled: true
      interval_in_minutes: 90        # UNCHANGED from v2.1 (experiment)
    phase1:
      enabled: true
      max_loss_pct: 25.0             # UNCHANGED from v2.1
      retrace_threshold: 15          # UNCHANGED from v2.1 (tighter = more fee churn on wicks)
    phase2:
      enabled: true
      tiers:
        # v2.3 tier 2 pre-arm: trigger 50 → 40. Winning positions past
        # 40% peak now jump from tier 1's 60% lock to tier 2's 75% lock
        # immediately instead of waiting until 50% peak.
        #
        #   Peak 30% → floor 18% (tier 1, unchanged)
        #   Peak 40% → floor 30% (tier 2 armed, was 24% in tier 1)
        #   Peak 45% → floor 33.75% (tier 2, was 27% in tier 1)
        #   Peak 50% → floor 37.5% (tier 2, unchanged)
        - { trigger_pct: 15, lock_hw_pct: 20 }   # UNCHANGED
        - { trigger_pct: 30, lock_hw_pct: 60 }   # UNCHANGED from v2.2
        - { trigger_pct: 40, lock_hw_pct: 75 }   # v2.3: trigger 50 → 40
        - { trigger_pct: 75, lock_hw_pct: 75 }   # UNCHANGED
        - { trigger_pct: 100, lock_hw_pct: 85 }  # UNCHANGED
        - { trigger_pct: 150, lock_hw_pct: 92 }  # UNCHANGED

# ── NOTIFICATIONS ──
notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
